einem modernen Bürogebäude umfunktioniert.", "is_phrase": false, "pos": "Verb"}, "unfähige": {"def": "Eine Person, die ihre Arbeit nicht gut macht und viele Fehler macht. Sie kann die Aufgaben nicht richtig erledigen.", "example": "Der unfähige Mitarbeiter hat schon wieder wichtige Dokumente verloren.", "is_phrase": false, "pos": "Adjektiv"}, "ungesunden": {"def": "Das bedeutet hier: in einer Art, die nicht normal oder nicht gut aussieht, sondern beunruhigend oder krankhaft wirkt. Es beschreibt eine Farbe, die Sorge macht.", "example": "Sein Gesicht bekam eine ungesunde blasse Farbe, als er die schlechte Nachricht hörte.", "is_phrase": false, "pos": "Adjektiv"}, "unten": {"def": "in einem niedrigeren Stockwerk oder Bereich eines Gebäudes; auf einer tieferen Ebene als dort, wo man sich gerade befindet", "example": "Die Cafeteria ist unten im Erdgeschoss, wir sind hier im zweiten Stock.", "is_phrase": false, "pos": "Adverb"}, "unterricht": {"def": "Das Lehren und Lernen zwischen einer Lehrperson und Schülern. Hier wird das Wort in einem erotischen Sinn verwendet und meint eine intime Begegnung.", "example": "Die erfahrene Frau bot dem jungen Mann besonderen Unterricht an.", "is_phrase": false, "pos": "Substantiv"}, "unterwegs": {"def": "auf dem Weg zu einem Ziel; gerade dabei, irgendwohin zu gehen oder zu fahren", "example": "Ich bin schon unterwegs zum Bahnhof und komme in zehn Minuten an.", "is_phrase": false, "pos": "Adverb"}, "vater": {"def": "Der männliche Elternteil einer Person. Er ist der Mann, der zusammen mit der Mutter ein Kind bekommen hat.", "example": "Mein Vater arbeitet als Lehrer und hilft mir oft bei den Hausaufgaben.", "is_phrase": false, "pos": "Substantiv"}, "verfärbt": {"def": "Das Gesicht wird rot oder blass, weil man sich schämt, Angst hat oder wütend ist. Die Hautfarbe ändert sich durch starke Gefühle.", "example": "Als der Chef ihn kritisierte, verfärbte sich Thomas und wurde ganz rot im Gesicht.", "is_phrase": false, "pos": "Verb"}, "verschränkt": {"def": "Die Arme vor der Brust verschränken bedeutet, dass man beide Arme übereinander legt und sie vor dem Körper hält. Diese Körperhaltung zeigt oft, dass jemand nicht offen oder nicht freundlich ist.", "example": "Als der Chef die schlechten Nachrichten erzählte, verschränkte sie die Arme vor der Brust und sagte nichts.", "is_phrase": true, "pos": "Redewendung"}, "verschusselt": {"def": "Etwas aus Unachtsamkeit oder Vergesslichkeit durcheinanderbringen oder falsch machen. Man vergisst wichtige Dinge oder macht Fehler, weil man nicht aufmerksam genug ist.", "example": "Die neue Sekretärin hat schon wieder drei Kundentermine verschusselt und alle zur gleichen Zeit eingetragen.", "is_phrase": false, "pos": "Verb"}, "versprochen": {"def": "Ein Ausruf, mit dem man betont, dass man sein Wort halten wird. Man sagt es, um zu zeigen, dass die andere Person einem vertrauen kann.", "example": "Ich komme morgen pünktlich! Versprochen!", "is_phrase": false, "pos": "Ausruf"}, "verstärkung": {"def": "Zusätzliche Personen, die kommen, um eine Gruppe stärker zu machen oder zu unterstützen. Hier bedeutet es ironisch, dass mehr Polizisten oder Sicherheitskräfte dazukommen.", "example": "Als die Demonstration größer wurde, rief die Polizei Verstärkung.", "is_phrase": false, "pos": "Substantiv"}, "versucht": {"def": "Eine Handlung beginnen oder machen wollen, aber vielleicht nicht erfolgreich sein. Man macht einen Versuch, etwas zu tun.", "example": "Ich habe versucht, das schwere Problem zu lösen, aber es war zu kompliziert.", "is_phrase": false, "pos": "Verb"}, "verwandeln": {"def": "zu etwas anderem werden; sich in etwas anderes ändern (hier: die Knie werden weich und schwach vor Angst oder Nervosität)", "example": "Als er die schlechte Note sah, verwandelten sich seine Hoffnungen in Enttäuschung.", "is_phrase": false, "pos": "Verb"}, "verzögert": {"def": "Später fertig werden als geplant. Nicht rechtzeitig abgeschlossen werden können.", "example": "Der Bau der neuen Schule verzögert sich um drei Monate.", "is_phrase": false, "pos": "Verb"}, "viele": {"def": "Eine große Anzahl von etwas. Man benutzt es, wenn die genaue Zahl nicht wichtig ist, aber es mehr ist als normal oder erwartet.", "example": "In der Bibliothek stehen viele Bücher über Geschichte.", "is_phrase": false, "pos": "Indefinitpronomen"}, "vielleicht": {"def": "Drückt eine unsichere Vermutung oder einen Zweifel aus. Man ist sich nicht sicher, ob etwas richtig oder falsch war.", "example": "Vielleicht war es ein Fehler, so früh zu gehen.", "is_phrase": false, "pos": "Adverb"}, "vier": {"def": "Die Zahl 4. Man benutzt sie, um zu sagen, wie viele Personen oder Dinge es gibt.", "example": "In der Gruppe waren vier Studenten aus verschiedenen Ländern.", "is_phrase": false, "pos": "Zahlwort"}, "vierte": {"def": "Eine Person in einer Gruppe, die als vierte Person gezählt wird. Man benutzt das Wort so, wenn man nicht den Namen der Person sagt, sondern sie nur nummeriert.", "example": "Am Tisch saßen drei Freunde, dann kam noch der Vierte dazu.", "is_phrase": false, "pos": "Substantiv"}, "vorbei": {"def": "Diese Phrase bedeutet: sich an jemandem vorbeibewegen, neben jemandem entlanggehen. Man geht einen Weg und muss dabei an anderen Personen vorbei.", "example": "Um zum Ausgang zu kommen, musste ich an vielen wartenden Menschen vorbei.", "is_phrase": true, "pos": "Redewendung"}, "wahrscheinlich": {"def": "Drückt aus, dass etwas sehr möglich ist oder dass man glaubt, dass etwas passieren wird. Man ist sich nicht ganz sicher, aber es ist sehr gut möglich.", "example": "Es regnet schon den ganzen Tag, deshalb fällt das Picknick wahrscheinlich aus.", "is_phrase": false, "pos": "Adverb"}, "wand": {"def": "Die senkrechte Fläche in einem Raum, die den Raum begrenzt. Man kann Gegenstände daran lehnen oder aufhängen.", "example": "Er stellte das Regal an die Wand im Wohnzimmer.", "is_phrase": false, "pos": "Substantiv"}, "wandert": {"def": "sich langsam von einem Ort zum anderen bewegen oder ausbreiten. Hier: Das Kichern geht von einem Schüler zum nächsten über.", "example": "Ein Gerücht wandert durch die ganze Schule, bis es jeder gehört hat.", "is_phrase": false, "pos": "Verb"}, "warum": {"def": "Ein Fragewort, mit dem man nach dem Grund oder der Ursache für etwas fragt. Man will wissen, aus welchem Grund etwas passiert oder nicht passiert.", "example": "Warum kommst du heute so spät nach Hause?", "is_phrase": false, "pos": "Adverb"}, "was": {"def": "Ein Wort, mit dem man eine Frage stellt. Man möchte damit etwas wissen oder zeigt Überraschung.", "example": "Was machst du heute Abend?", "is_phrase": false, "pos": "Fragewort"}, "wenigen": {"def": "Eine sehr kleine Anzahl oder Menge von etwas. Es bedeutet, dass nur sehr wenig da ist.", "example": "Nach wenigen Minuten begann es zu regnen.", "is_phrase": false, "pos": "Adjektiv"}, "wirst": {"def": "Hilfsverb für die Zukunft (Futur I). Man benutzt es mit einem anderen Verb, um zu sagen, dass etwas später passieren wird.", "example": "Morgen wirst du bestimmt eine gute Note bekommen.", "is_phrase": false, "pos": "Verb"}, "wissen": {"def": "Informationen über etwas haben wollen oder brauchen. Man möchte erfahren, wie eine Situation ist.", "example": "Ich muss wissen, wann der Zug abfährt, sonst verpasse ich ihn.", "is_phrase": false, "pos": "Verb"}, "wohlfühlen": {"def": "Es bedeutet, dass man sich an einem Ort oder in einer Situation gut und entspannt fühlt. Man ist zufrieden und hat keine Probleme oder Sorgen.", "example": "In der neuen Wohnung fühle ich mich sehr wohl, weil sie hell und ruhig ist.", "is_phrase": false, "pos": "Verb"}, "wollte": {"def": "Vergangenheitsform von 'wollen'. Hier bedeutet es: hatte die Absicht, plante etwas zu tun.", "example": "Maria wollte heute ihre Freundin anrufen, aber sie hatte keine Zeit.", "is_phrase": false, "pos": "Verb"}, "wortlos": {"def": "ohne etwas zu sagen, schweigend. Die Person spricht nicht und macht keinen Laut.", "example": "Nach dem Streit verließ er wortlos das Zimmer.", "is_phrase": false, "pos": "Adverb"}, "während": {"def": "zeigt an, dass zwei Dinge zur gleichen Zeit passieren. Es bedeutet: in der Zeit, in der etwas anderes geschieht.", "example": "Während ich koche, deckt mein Mann den Tisch.", "is_phrase": false, "pos": "Konjunktion"}, "wärst": {"def": "Konjunktiv II von 'sein' in der 2. Person Singular. Wird für höfliche Fragen verwendet, um freundlicher und weniger direkt zu klingen.", "example": "Wärst du so nett und hilfst mir beim Tragen?", "is_phrase": false, "pos": "Verb"}, "würde": {"def": "Ein Wort, das man für höfliche Wünsche oder irreale Situationen benutzt. Es macht Sätze weniger direkt und freundlicher.", "example": "Ich würde gern einen Kaffee trinken, wenn das möglich ist.", "is_phrase": false, "pos": "Hilfsverb"}, "würdest": {"def": "Höfliche Form von 'würdest du': wird benutzt, um jemanden freundlich um etwas zu bitten. Es ist höflicher als ein direkter Befehl.", "example": "Würdest du mir bitte dabei helfen, die Taschen zu tragen?", "is_phrase": false, "pos": "Verb"}, "wütend": {"def": "sehr ärgerlich und schlecht gelaunt, mit starken negativen Gefühlen. Man ist böse und unzufrieden mit einer Situation.", "example": "Wütend knallte er die Tür zu, weil sein Bruder sein Fahrrad genommen hatte.", "is_phrase": false, "pos": "Adverb"}, "zeit": {"def": "Zeit haben bedeutet: nicht beschäftigt sein und etwas anderes machen können. Man hat keine Termine oder Pflichten in diesem Moment.", "example": "Am Wochenende habe ich endlich Zeit, ein Buch zu lesen.", "is_phrase": false, "pos": "Substantiv"}, "zentimetern": {"def": "Eine sehr kleine Entfernung oder Strecke. Das Wort zeigt hier, dass sich die Tür nur ganz wenig öffnen lässt.", "example": "Das Auto fuhr nur wenige Zentimeter vor, dann stoppte es wieder.", "is_phrase": false, "pos": "Substantiv"}, "zimmer": {"def": "Ein Raum in einer Wohnung oder einem Haus, in dem eine Person schläft, wohnt oder arbeitet. Es ist der private Bereich einer Person.", "example": "Lisa geht in ihr Zimmer, um Hausaufgaben zu machen.", "is_phrase": false, "pos": "Substantiv"}, "zischt": {"def": "Etwas leise und scharf sagen, oft weil man wütend oder aufgeregt ist. Man spricht dabei zwischen den Zähnen durch.", "example": "\"Das war mein Platz!\", zischte sie ihrem Kollegen zu.", "is_phrase": false, "pos": "Verb"}, "zurück": {"def": "An den ursprünglichen Ort oder in die ursprüngliche Position. Bedeutet, dass etwas wieder dorthin kommt oder gestellt wird, wo es vorher war.", "example": "Nach dem Telefonat legt er den Hörer zurück auf die Station.", "is_phrase": false, "pos": "Adverb"}, "zusammen": {"def": "Eine technische Verbindung (wie Telefon oder Internet) funktioniert plötzlich nicht mehr. Das Gespräch oder die Verbindung ist unterbrochen.", "example": "Mitten im wichtigen Telefonat brach die Leitung zusammen und wir konnten nicht mehr sprechen.", "is_phrase": false, "pos": "Verb"}, "zwei": {"def": "Die Zahl 2. Zeigt an, dass etwas genau zweimal da ist oder vorkommt.", "example": "Im Park sehe ich zwei Hunde, die miteinander spielen.", "is_phrase": false, "pos": "Zahlwort"}, "zögert": {"def": "Eine kurze Zeit warten, bevor man etwas macht, weil man unsicher ist oder nachdenkt. Man macht eine kleine Pause, bevor man handelt.", "example": "Tom zögert einen Moment, bevor er an die Tür klopft.", "is_phrase": false, "pos": "Verb"}, "ärgerlich": {"def": "etwas ist unangenehm und macht einen unzufrieden, weil es stört oder Probleme macht", "example": "Es ist ärgerlich, dass der Zug Verspätung hat, denn jetzt kommen wir zu spät zum Termin.", "is_phrase": false, "pos": "Adjektiv"}, "über": {"def": "zeigt an, worüber oder über wen man spricht oder sich ärgert", "example": "Die Nachbarn reden über den lauten Hund von nebenan.", "is_phrase": false, "pos": "Präposition"}, "übernommen": {"def": "Die Verantwortung für etwas bekommen und ab diesem Zeitpunkt dafür zuständig sein. Meistens bedeutet es, dass man ein Geschäft, eine Firma oder eine wichtige Aufgabe von einer anderen Person bekommt.", "example": "Nach dem Tod seines Vaters hat er das Familienunternehmen übernommen.", "is_phrase": false, "pos": "Verb"}, "übertreibst": {"def": "Du machst etwas größer oder dramatischer, als es wirklich ist. Du sagst nicht die Wahrheit, sondern machst alles viel schlimmer oder besser, als es ist.", "example": "Du übertreibst schon wieder - das Restaurant war nicht das schlechteste der Welt, nur das Essen war kalt.", "is_phrase": false, "pos": "Verb"}};
const META = {textId:"011_SL",condition:"standard",start:new Date().toISOString()};
const counts = {};
const log = [];
let activeEl = null;

function render() {
  const tb = document.getElementById('tb');
  const raw = "Montag,\n20.April\nNADJA\n\u201eEntschuldige. Jetzt habe ich Zeit. Ich bringe dich schnell in deine Klasse.\u201c Die Sekret\u00e4rin kommt um den Tresen herum. Sie ist einen halben Kopf kleiner als Nadja und d\u00fcnn wie eine Stabheuschrecke. Mit M\u00e4useschritten eilt sie vor ihr her durch das Schulhaus, trippelt die Stufen ins Kellergeschoss hinunter, bleibt dort vor einer T\u00fcr stehen. \u201eDieses Jahr ist es so schlimm wie noch nie\u201c kl\u00e4rt sie. \u201eWir haben so viele Sch\u00fcler, dass wir sogar hier unten R\u00e4ume umfunktionieren mussten. Aber ich bin sicher, du wirst dich trotzdem wohlf\u00fchlen. Wir haben ein tolles Schulklima.\u201c\nSchon beim Betreten der Klasse begreift Nadja, dass dies keine allgemeing\u00fcltige Aussage ist. \n\u201eSchei\u00dfe\u201c, zischt eine der beiden Blondinen in der ersten Reihe, \u201eVerst\u00e4rkung f\u00fcrs Rollkommando.\u201c\nIhre Nachbarin beginnt zu kichern.\nW\u00e4hrend Nadja der Sekret\u00e4rin zum Lehrerpult folgt, wandert das Kichern von Platz zu Platz, endet erst wie abgeschnitten in der letzten Reihe bei einer Elfe mit Schneewittchenteint.\n\u201eGuten Morgen. Du bist also Nadja\u201c sagt die Lehrerin und reicht ihr die Hand. \u201eThiel. Mathematik, Physik und Sport. Du siehst ja, dass dieser Raum aus allen N\u00e4hten platzt ...\u201c\nDie Blondinen in der ersten Reihe geben erstickte Laute von sich.\n\u201e... und nur noch neben Jennifer etwas frei ist. Wenn du dich also bitte dorthin setzen w\u00fcrdest.\u201c\nFrau Thiel deutet auf den leeren Platz neben Schneewittchen.\nAuf dem Weg dorthin muss Nadja an vier Typen vorbei, die sie fast mit den Augen ausziehen. Das hei\u00dft, eigentlich sind es nur drei, die sie anglotzen. Zwei Muskelmacker und ein rothaariges Mondgesicht. Der Vierte hat die studiogest\u00e4hlten Arme vor der Brust verschr\u00e4nkt und seinen Stuhl nach hinten gekippt. Er sieht aus, als w\u00fcrde er schlafen.\nDas Mondgesicht neben ihm jedoch ist hellwach, rammt ihm den Ellbogen in die Seite und zischt: \u201eEy, was f\u00fcr Titten!\u201c\nSie sp\u00fcrt ihr Herz bis in den Hals schlagen, f\u00fchlt, wie ihre Knie sich in Pudding verwandeln wollen und schafft es trotzdem stehen zu bleiben. Das Mondgesicht sieht aus, als w\u00fcrde es gleich anfangen zu geifern. \nWortlos starrt sie zur\u00fcck. Einen Herzschlag lang. Zwei.\nDas Mondgesicht nimmt einen ungesunden Rotton an.\nDrei. Vier.\nDie T\u00fcr des Klassenzimmers f\u00e4llt hinter der Sekret\u00e4rin ins Schloss.\nF\u00fcnf. Sechs.\nJetzt verf\u00e4rbt sich auch der Typ neben dem Mondgesicht.\n\u201eW\u00e4rst du wohl so freundlich, deinen Platz einzunehmen?\u201c, ert\u00f6nt da die Stimme der Lehrerin in ihrem R\u00fccken. \u201eIch w\u00fcrde gerne mit dem Unterricht anfangen.\u201c\nLangsam, mit schwingenden H\u00fcften setzt sie ihren Weg fort. Ihre Nackenmuskeln f\u00fchlen sich an wie Stahlseile, als sie sich neben Schneewittchen niederl\u00e4sst.\n\nSie dreht den Schl\u00fcssel im Schloss und will die Haust\u00fcr aufschieben, doch die blockiert schon nach wenigen Zentimetern.\nMist! Sie quetscht sich durch den schmalen Spalt. Als sie die T\u00fcr schlie\u00dft, poltert ein Karton zu Boden und streift ihr Schienbein. Tr\u00e4nen schie\u00dfen ihr in die Augen. W\u00fctend blinzelt sie, schiebt den Karton zur\u00fcck an die Wand, l\u00e4sst Rucksack und Jacke darauf fallen.\n\u201eMam?\u201c\nKeine Antwort.\nSicher hat diese unf\u00e4hige Helferin, \u00fcber die ihre Mutter schimpft, seit sie die Praxis \u00fcbernommen hat, wieder ein paar Termine verschusselt.\nDas Licht am Anrufbeantworter blinkt und sie dr\u00fcckt zwei Kn\u00f6pfe, um das Band abzuh\u00f6ren.\n\u201eNadja? \u2013 Bist du schon da? \u2013 Ich schaff\u2019s heute Mittag nicht. \u2013 Aber heute Abend bin ich auf jeden Fall p\u00fcnktlich. Dann machen wir endlich dein Zimmer fertig. Versprochen!\u201c\n\u201eEsther?\u201c Knack. \u201e... hab versucht ... Praxis ... \u201e Rauschen. \u201eKomme erst ...\u201c Die Leitung bricht zusammen.\nSie seufzt. Sicher wollte ihr Vater Bescheid geben, dass das aktuelle Projekt sich verz\u00f6gert. Das passiert bei fast jedem seiner Auslandseins\u00e4tze, doch diesmal ist es besonders \u00e4rgerlich, weil sie dringend ein paar kr\u00e4ftige Arme br\u00e4uchten, um Kartons zu schleppen und M\u00f6bel zu r\u00fccken.\nNoch immer blinkt das rote Licht und dann ert\u00f6nt Ellies Stimme: \u201eHe, wie war\u2019s? Ruf mich an, ja? \u2013 Ich platze vor Neugier!\u201c\nSie greift nach dem Telefon, stellt es aber sofort wieder zur\u00fcck. Wenn sie Ellie jetzt anruft, wird sie wahrscheinlich losheulen, und sie ist nicht sicher, ob sie dann jemals wieder aufh\u00f6ren kann. Erst einmal braucht sie eine St\u00e4rkung.\nAuch in der K\u00fcche herrscht Chaos, scheinen Kisten und Kartons ein Eigenleben zu entwickeln. Doch auf dem Tisch steht bereits eine Schale mit frischem Obst und Nadja nimmt sich eine Banane und einen Apfel, bevor sie in ihrem Zimmer den Computer hochf\u00e4hrt.\nEllie ist bereits online.\nWo steckst du? Warum rufst du nicht an?? Ich\nmuss doch wissen, wie es dir geht!!!\nNadja z\u00f6gert kurz, dann tippt sie: Beschissen.\nEcht?? Was ist los???\n...\nSag schon!!\nLauter Magermilch-Models ...\nJetzt \u00fcbertreibst du mal wieder!\nTu ich gar nicht! Ich sitze neben einer Elfe, die mich\naussehen l\u00e4sst wie eine Elefantenkuh!\nQuatsch!\nKein Quatsch!\nVielleicht h\u00e4ttest du doch bei uns bleiben sollen?\nSieht fast so aus.\nRufst du mich an, oder soll ich?\nBin schon unterwegs ...\n\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t]+$/.test(tok)) { html += tok; return; }
    if (/^[\n\r]+$/.test(tok)) { html += '<br>'; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'')
                   .toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" data-orig="' + tok + '" onclick="show(event,\'' + key + '\',this)">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

function show(e, k, el) {
  const d = DICT[k]; if (!d) return;

  // Aktives Wort hervorheben
  if (activeEl) activeEl.classList.remove('active');
  activeEl = el || e.currentTarget;
  activeEl.classList.add('active', 'seen');

  // Originalschreibweise aus data-orig holen
  const orig = activeEl.getAttribute('data-orig') || k;

  // Panel befüllen
  document.getElementById('pWord').textContent = orig;
  document.getElementById('pPos').textContent  = d.pos || '';
  document.getElementById('pDef').textContent  = d.def || '';

  const pEx = document.getElementById('pEx');
  if (d.example) {
    pEx.textContent = '\u201e' + d.example + '\u201c';
    pEx.style.display = 'block';
  } else {
    pEx.style.display = 'none';
  }

  const pBadge = document.getElementById('pBadge');
  pBadge.style.display = d.is_phrase ? 'inline-block' : 'none';

  document.getElementById('panelEmpty').style.display   = 'none';
  document.getElementById('panelContent').classList.add('visible');

  // Tracking
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(ex) {}
}

document.addEventListener('DOMContentLoaded', render);
</script>
