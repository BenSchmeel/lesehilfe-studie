<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --panel-bg:#2c2420;--panel-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
    --panel-width:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}

  /* ── Layout: Text links, Panel rechts ── */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1060px;
    margin:0 auto;
    padding:24px 16px 60px;
    gap:20px;
  }
  .main{flex:1;min-width:0;}

  /* ── Erklärungsleiste rechts ── */
  .panel{
    width:var(--panel-width);
    flex-shrink:0;
    position:sticky;
    top:20px;
    background:var(--panel-bg);
    border-radius:8px;
    padding:18px 16px;
    color:var(--panel-text);
    font-size:.88rem;
    line-height:1.65;
    min-height:180px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    transition:opacity .2s;
  }
  .panel-empty{
    opacity:.45;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.82rem;
    color:#9e8a78;
    min-height:120px;
  }
  .panel-content{display:none;}
  .panel-content.visible{display:block;}
  .p-badge{
    display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
    border-radius:3px;padding:1px 7px;margin-bottom:8px;letter-spacing:.04em;
  }
  .p-word{
    font-family:'Lora',serif;font-weight:600;font-size:1.05rem;
    color:#f0d9b8;display:block;margin-bottom:3px;
  }
  .p-pos{
    font-size:.72rem;color:#9e8a78;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:8px;
  }
  .p-def{color:#d4c9be;display:block;}
  .p-ex{
    margin-top:10px;font-style:italic;font-size:.82rem;color:#8a7a6e;
    border-top:1px solid rgba(255,255,255,.08);padding-top:9px;display:block;
  }

  /* ── Hinweis oben ── */
  .hint{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;
    padding:9px 14px;background:var(--accent-light);
    border-radius:4px;border-left:3px solid var(--accent);
  }

  /* ── Textbox ── */
  .text-box{
    background:white;border:1px solid var(--border);border-radius:4px;
    padding:32px 36px;line-height:2.05;font-family:'Lora',serif;
    font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04);
  }

  /* ── Anklickbare Wörter ── */
  .w{
    cursor:pointer;border-bottom:1px dotted var(--accent);
    border-radius:2px;padding:0 1px;transition:background .15s;display:inline;
  }
  .w:hover{background:var(--accent-light);}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent);}
  .w.active{background:var(--accent);color:white;border-bottom-color:transparent;}
  .w.phrase{border-bottom:2px dashed #b07d50;}
  .w.phrase.seen{border-bottom-color:#c9956a;}
  .w.phrase.active{background:var(--accent);color:white;}

  /* ── Legende ── */
  .legend{
    margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-size:.76rem;color:var(--ink-soft);
  }
  .leg-item{display:flex;align-items:center;gap:5px;}

  @media(max-width:700px){
    .layout{flex-direction:column;}
    .panel{width:100%;position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Linke Spalte: Text -->
  <div class="main">
    <div class="hint">
      Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> – die Erklärung erscheint rechts.
      &nbsp;<span style="border-bottom:2px dashed #b07d50;padding:0 2px">Gestrichelt</span> = Redewendung.
    </div>
    <div class="text-box" id="tb"></div>
    <div class="legend">
      <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 3px">Wort</span>&nbsp;erklärtes Wort</span>
      <span class="leg-item"><span style="border-bottom:2px dashed #b07d50;padding:0 3px">Phrase</span>&nbsp;Redewendung</span>
      <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 3px">farbig</span>&nbsp;bereits nachgeschlagen</span>
    </div>
  </div>

  <!-- Rechte Spalte: Erklärungsleiste -->
  <div class="panel" id="panel">
    <div class="panel-empty" id="panelEmpty">
      ← Klicken Sie auf ein unterstrichenes Wort
    </div>
    <div class="panel-content" id="panelContent">
      <span class="p-badge" id="pBadge" style="display:none">Redewendung</span>
      <span class="p-word" id="pWord"></span>
      <span class="p-pos"  id="pPos"></span>
      <span class="p-def"  id="pDef"></span>
      <span class="p-ex"   id="pEx" style="display:none"></span>
    </div>
  </div>

</div>
<script>
const DICT = {"abend": {"def": "Die Zeit am Ende des Tages, wenn es dunkel wird. Meist zwischen 18 und 22 Uhr.", "example": "Am Abend schauen wir oft zusammen fern.", "is_phrase": false, "pos": "Substantiv"}, "abgeschnitten": {"def": "Wenn etwas plötzlich und komplett aufhört. Es bedeutet, dass etwas sofort zu Ende ist, ohne langsam leiser zu werden.", "example": "Die Musik hörte wie abgeschnitten auf, als der Strom ausfiel.", "is_phrase": true, "pos": "Redewendung"}, "abzuhören": {"def": "Eine Nachricht oder Aufnahme anhören, die auf einem Gerät gespeichert ist. Man hört sich an, was jemand aufgenommen hat.", "example": "Nach dem Urlaub hörte sie alle Nachrichten auf dem Anrufbeantworter ab.", "is_phrase": false, "pos": "Verb"}, "aktuelle": {"def": "das Projekt, an dem gerade jetzt gearbeitet wird; das gegenwärtige Projekt", "example": "Die aktuelle Aufgabe ist schwieriger als die letzte.", "is_phrase": false, "pos": "Adjektiv"}, "allgemeingültige": {"def": "Das bedeutet: für alle Menschen oder Situationen gültig und richtig. Etwas, was immer und überall zutrifft.", "example": "Seine Behauptung, dass alle Teenager faul sind, ist nicht allgemeingültig - viele sind sehr fleißig.", "is_phrase": false, "pos": "Adjektiv"}, "anfangen": {"def": "Mit etwas beginnen oder starten. Man macht den ersten Schritt bei einer Tätigkeit.", "example": "Wir können jetzt mit dem Essen anfangen.", "is_phrase": false, "pos": "Verb"}, "anglotzen": {"def": "Jemanden lange und neugierig anstarren, oft auf eine unhöfliche oder aufdringliche Art. Es ist stärker als nur schauen oder blicken.", "example": "Die Kinder glotzten den Mann mit dem bunten Hut an.", "is_phrase": false, "pos": "Verb"}, "anrufbeantworter": {"def": "Ein Gerät, das Telefonanrufe aufnimmt, wenn niemand da ist. Man kann später die Nachrichten anhören.", "example": "Ich war nicht zu Hause, aber auf dem Anrufbeantworter waren drei Nachrichten.", "is_phrase": false, "pos": "Substantiv"}, "anruft": {"def": "Mit dem Telefon oder Handy Kontakt zu einer Person aufnehmen. Man wählt die Nummer und spricht dann mit der Person.", "example": "Maria ruft ihre Mutter an, um ihr von ihrem neuen Job zu erzählen.", "is_phrase": false, "pos": "Verb"}, "antwort": {"def": "Das, was jemand sagt, wenn man ihn etwas fragt oder anspricht. Wenn keine Antwort kommt, reagiert die Person nicht.", "example": "Ich habe meinen Bruder gerufen, aber er gab keine Antwort.", "is_phrase": false, "pos": "Substantiv"}, "apfel": {"def": "Eine runde Frucht, die an Bäumen wächst und meist rot, grün oder gelb ist. Man kann sie roh essen oder zum Kochen verwenden.", "example": "Zum Frühstück esse ich gerne einen Apfel mit Joghurt.", "is_phrase": false, "pos": "Substantiv"}, "april": {"def": "Der vierte Monat des Jahres, zwischen März und Mai. In diesem Monat wird es Frühling und die Natur erwacht.", "example": "Im April beginnen die Bäume zu blühen und es wird wärmer.", "is_phrase": false, "pos": "Substantiv"}, "arme": {"def": "Die beiden Körperteile zwischen Schulter und Hand, mit denen man Dinge greifen und tragen kann. Oft verwendet man das Wort auch für Personen, die körperlich arbeiten können.", "example": "Nach dem Umzug taten mir die Arme weh, weil ich so viele schwere Kisten getragen hatte.", "is_phrase": false, "pos": "Substantiv"}, "aufhören": {"def": "etwas beenden oder damit aufhören, etwas zu tun. Hier bedeutet es: mit dem Weinen aufhören können.", "example": "Nach dem traurigen Film hat sie angefangen zu weinen und konnte gar nicht mehr aufhören.", "is_phrase": false, "pos": "Verb"}, "aufschieben": {"def": "Eine Tür durch Schieben oder Drücken öffnen. Man bewegt die Tür zur Seite oder nach außen, um hindurchzugehen.", "example": "Er schiebt die schwere Glastür auf und betritt das Geschäft.", "is_phrase": false, "pos": "Verb"}, "augen": {"def": "Die Körperteile im Gesicht, mit denen man sehen kann. Sie können auch Gefühle und Gedanken zeigen.", "example": "Als er die traurige Nachricht hörte, füllten sich seine Augen mit Tränen.", "is_phrase": false, "pos": "Substantiv"}, "auslandseinsätze": {"def": "Arbeiten oder Aufträge, die jemand in einem anderen Land macht. Die Person reist für ihren Beruf ins Ausland und arbeitet dort für eine bestimmte Zeit.", "example": "Der Ingenieur war drei Monate in Afrika für einen Auslandseinsatz seiner Firma.", "is_phrase": false, "pos": "Substantiv"}, "aussage": {"def": "Eine Behauptung oder Meinung, die jemand äußert. Es ist etwas, was gesagt wird, aber nicht unbedingt für alle Menschen oder Situationen wahr sein muss.", "example": "Seine Aussage, dass alle Jugendlichen faul sind, stimmt nicht für jeden.", "is_phrase": false, "pos": "Substantiv"}, "aussehen": {"def": "Diese Phrase bedeutet: durch den Vergleich mit jemandem wirken oder erscheinen. Wenn man neben einer sehr schönen Person steht, kann man sich weniger schön fühlen.", "example": "Neben dem großen Sportler lässt mich meine kleine Größe wie ein Kind aussehen.", "is_phrase": true, "pos": "Redewendung"}, "ausziehen": {"def": "Diese Redewendung bedeutet: jemanden sehr intensiv und auf eine sexuelle Art anschauen. Die Männer schauen Nadja so an, als würden sie sich vorstellen, wie sie ohne Kleidung aussieht.", "example": "Der Mann an der Bar zog die junge Frau mit seinen Blicken aus, was sie sehr unangenehm fand.", "is_phrase": true, "pos": "Redewendung"}, "banane": {"def": "Eine gelbe, längliche Frucht, die süß schmeckt und oft roh gegessen wird. Sie wächst in warmen Ländern und ist ein beliebtes Obst.", "example": "Zum Frühstück esse ich gerne eine Banane mit Joghurt.", "is_phrase": false, "pos": "Substantiv"}, "band": {"def": "Eine Kassette oder ein anderer Tonträger, auf dem Nachrichten vom Anrufbeantworter gespeichert sind. Man kann die aufgenommenen Nachrichten anhören.", "example": "Nach dem Urlaub hörte er das Band seines Anrufbeantworters ab und fand drei wichtige Nachrichten.", "is_phrase": false, "pos": "Substantiv"}, "beginnt": {"def": "Diese Phrase bedeutet: anfangen zu kichern. Man verwendet sie, wenn jemand plötzlich leise zu lachen anfängt.", "example": "Als der Lehrer den lustigen Fehler an der Tafel bemerkte, begann Maria zu kichern.", "is_phrase": true, "pos": "Redewendung"}, "begreift": {"def": "schnell verstehen oder erkennen, wie eine Situation wirklich ist. Man merkt sofort, dass etwas anders ist, als man gedacht hat.", "example": "Als Maria das Büro betrat, begriff sie sofort, dass alle schlecht gelaunt waren.", "is_phrase": false, "pos": "Verb"}, "beiden": {"def": "Zeigt an, dass es genau zwei Personen oder Dinge gibt, die man meint. Man benutzt es, wenn man über zwei bestimmte Personen oder Sachen spricht.", "example": "Die beiden Schwestern gehen jeden Tag zusammen zur Schule.", "is_phrase": false, "pos": "Pronomen"}, "beim": {"def": "bedeutet 'während' oder 'im Moment von'. Es drückt aus, dass etwas zu dem Zeitpunkt passiert, wenn man eine Handlung macht.", "example": "Beim Kochen hört sie immer Musik.", "is_phrase": false, "pos": "Präposition"}, "bescheid": {"def": "Jemandem Bescheid geben bedeutet: jemandem eine Information mitteilen oder jemanden über etwas informieren. Man sagt einer Person, was passiert ist oder was passieren wird.", "example": "Ich gebe dir morgen Bescheid, ob ich Zeit für das Treffen habe.", "is_phrase": true, "pos": "Redewendung"}, "beschissen": {"def": "Ein vulgäres Wort, das bedeutet: sehr schlecht, schlimm oder unschön. Man benutzt es in der Umgangssprache, wenn man sehr unzufrieden oder enttäuscht ist.", "example": "Nach der schlechten Note sagte er: Das ist echt beschissen gelaufen.", "is_phrase": false, "pos": "Adjektiv"}, "besonders": {"def": "mehr als normal; in einem höheren Grad als sonst. Es macht die Aussage stärker.", "example": "Heute ist es besonders kalt, deshalb ziehe ich einen warmen Mantel an.", "is_phrase": false, "pos": "Adverb"}, "betreten": {"def": "Das Hineingehen in einen Raum oder an einen Ort. Man verwendet es, wenn man beschreibt, dass jemand einen Ort zum ersten Mal betritt oder hineingeht.", "example": "Beim Betreten des Museums muss man seine Jacke abgeben.", "is_phrase": false, "pos": "Substantiv"}, "bevor": {"def": "Bevor zeigt an, dass eine Handlung zeitlich vor einer anderen stattfindet. Es verbindet zwei Sätze und bedeutet 'früher als' oder 'vor dem Zeitpunkt, an dem'.", "example": "Maria trinkt noch einen Kaffee, bevor sie zur Arbeit geht.", "is_phrase": false, "pos": "Konjunktion"}, "bitte": {"def": "Ein Höflichkeitswort, das eine Bitte oder Aufforderung freundlicher macht. Man verwendet es, wenn man jemanden um etwas bittet oder höflich auffordert.", "example": "Könnten Sie bitte das Fenster öffnen?", "is_phrase": false, "pos": "Partikel"}, "bleiben": {"def": "sich nicht wegbewegen, an dem Ort sein, wo man gerade ist", "example": "Obwohl sie Angst hatte, blieb sie ruhig stehen und lief nicht weg.", "is_phrase": false, "pos": "Verb"}, "bleibt": {"def": "sich nicht mehr bewegen; an einem Ort anhalten und dort stehen", "example": "Der Bus bleibt an der Haltestelle stehen und die Fahrgäste steigen aus.", "is_phrase": false, "pos": "Verb"}, "blinkt": {"def": "Ein Licht geht schnell an und aus, immer wieder. Das macht eine Lampe, wenn sie zeigen will, dass etwas wichtig ist.", "example": "Die rote Lampe am Telefon blinkt, weil jemand eine Nachricht hinterlassen hat.", "is_phrase": false, "pos": "Verb"}, "blinzelt": {"def": "Die Augen schnell schließen und wieder öffnen, oft weil man wütend oder nervös ist oder weil das Licht zu hell ist.", "example": "Er blinzelt in der hellen Sonne und sucht seine Sonnenbrille.", "is_phrase": false, "pos": "Verb"}, "blockiert": {"def": "Etwas kann nicht weiterbewegt werden, weil ein Hindernis im Weg ist. Die Bewegung wird gestoppt oder verhindert.", "example": "Das Fenster blockiert, weil sich ein Ast davor geschoben hat.", "is_phrase": false, "pos": "Verb"}, "blondinen": {"def": "Frauen mit blonden Haaren. Das Wort wird hier verwendet, um zwei bestimmte Frauen zu beschreiben, die blonde Haare haben.", "example": "Die beiden Blondinen saßen nebeneinander und unterhielten sich leise.", "is_phrase": false, "pos": "Substantiv"}, "boden": {"def": "Bedeutet, dass etwas nach unten fällt und auf dem Fußboden landet. Man sagt das, wenn Gegenstände herunterfallen.", "example": "Das Glas fiel zu Boden und zerbrach in viele Stücke.", "is_phrase": true, "pos": "Redewendung"}, "braucht": {"def": "Wenn man etwas braucht, dann ist es nötig oder wichtig für eine Person. Man muss es haben oder bekommen.", "example": "Nach dem langen Spaziergang braucht er ein Glas Wasser.", "is_phrase": false, "pos": "Verb"}, "bricht": {"def": "Die Verbindung funktioniert plötzlich nicht mehr. Man kann nicht mehr telefonieren, weil das Telefon kaputt ist oder die Leitung unterbrochen ist.", "example": "Mitten im wichtigen Gespräch mit dem Chef bricht die Leitung zusammen.", "is_phrase": true, "pos": "Redewendung"}, "bringe": {"def": "jemanden zu einem Ort führen oder begleiten, damit die Person dorthin kommt", "example": "Der Vater bringt sein Kind jeden Morgen zum Kindergarten.", "is_phrase": false, "pos": "Verb"}, "brust": {"def": "Der obere vordere Teil des Körpers zwischen dem Hals und dem Bauch. Hier sind das Herz und die Lunge.", "example": "Sie legte die Hand auf die Brust und spürte ihr Herz schlagen.", "is_phrase": false, "pos": "Substantiv"}, "bräuchten": {"def": "Eine Form von 'brauchen' im Konjunktiv II. Man verwendet es, um höflich oder indirekt zu sagen, dass man etwas nötig hat oder benötigt.", "example": "Wir bräuchten noch zwei Stühle für die Gäste.", "is_phrase": false, "pos": "Verb"}, "chaos": {"def": "Eine Situation, in der alles sehr unordentlich und durcheinander ist. Nichts ist an seinem richtigen Platz und alles sieht wild gemischt aus.", "example": "Nach dem Umzug herrschte in der ganzen Wohnung Chaos - überall lagen Sachen herum.", "is_phrase": false, "pos": "Substantiv"}, "computer": {"def": "Eine elektronische Maschine, mit der man arbeiten, schreiben, im Internet surfen oder Spiele spielen kann. Man schaltet ihn an und benutzt ihn über eine Tastatur und einen Bildschirm.", "example": "Ich setze mich an meinen Computer und schreibe eine E-Mail an meine Freundin.", "is_phrase": false, "pos": "Substantiv"}, "deutet": {"def": "Mit dem Finger oder der Hand in eine bestimmte Richtung zeigen, um jemandem zu zeigen, wo etwas ist oder wohin er gehen soll.", "example": "Der Lehrer deutet auf die Tafel und erklärt die Aufgabe.", "is_phrase": true, "pos": "Redewendung"}, "diesmal": {"def": "Bei dieser Gelegenheit, in dieser Situation (im Unterschied zu anderen Malen). Es zeigt, dass etwas schon öfter passiert ist, aber jetzt anders oder besonders ist.", "example": "Normalerweise regnet es nur wenig, aber diesmal war der Sturm sehr stark.", "is_phrase": false, "pos": "Adverb"}, "dorthin": {"def": "bedeutet 'zu diesem Ort' oder 'an diesen Platz'. Man benutzt es, wenn man zeigt, wohin sich jemand bewegen soll.", "example": "Der Lehrer zeigt auf einen Stuhl und sagt: 'Bitte geh dorthin und setz dich.'", "is_phrase": false, "pos": "Adverb"}, "dreht": {"def": "Den Schlüssel im Schloss umdrehen, um die Tür zu öffnen oder zu schließen. Man bewegt den Schlüssel mit der Hand nach links oder rechts.", "example": "Er dreht den Schlüssel zweimal nach rechts und hört, wie sich das Schloss öffnet.", "is_phrase": false, "pos": "Verb"}, "drei": {"def": "Die Zahl 3. Hier wird die Anzahl von Personen genannt, die jemanden anstarren.", "example": "In der Gruppe waren fünf Leute, aber nur drei haben zugehört.", "is_phrase": false, "pos": "Zahlwort"}, "dringend": {"def": "sehr nötig, unbedingt erforderlich. Es bedeutet, dass man etwas sofort oder sehr bald braucht.", "example": "Wir müssen dringend einkaufen gehen, weil der Kühlschrank fast leer ist.", "is_phrase": false, "pos": "Adverb"}, "drückt": {"def": "Mit dem Finger auf etwas draufdrücken, um es zu bedienen. Man macht das bei Knöpfen, Tasten oder Schaltern.", "example": "Sie drückt den roten Knopf, um den Fernseher einzuschalten.", "is_phrase": false, "pos": "Verb"}, "dünn": {"def": "Sehr schlank und mager, mit wenig Körperfett. Eine Person, die dünn ist, hat einen schmalen Körper.", "example": "Nach der langen Krankheit war er sehr dünn geworden.", "is_phrase": false, "pos": "Adjektiv"}, "echt": {"def": "Ausdruck der Überraschung oder des Zweifelns. Man sagt das, wenn man nicht glauben kann, dass etwas wahr ist.", "example": "Echt? Du hast im Lotto gewonnen?", "is_phrase": false, "pos": "Adverb"}, "eigenleben": {"def": "Wenn Dinge chaotisch werden und sich zu bewegen oder zu vermehren scheinen, ohne dass jemand sie kontrolliert. Es wirkt so, als würden die Gegenstände von selbst handeln.", "example": "Nach dem Umzug entwickelten die Bücher ein Eigenleben - überall lagen welche herum, obwohl ich sie weggeräumt hatte.", "is_phrase": true, "pos": "Redewendung"}, "eigentlich": {"def": "Wird verwendet, um eine Korrektur oder Präzisierung zu machen. Man sagt damit, dass die erste Information nicht ganz richtig war und korrigiert sie.", "example": "Ich habe fünf Bücher gekauft - eigentlich waren es nur vier.", "is_phrase": false, "pos": "Adverb"}, "eilt": {"def": "sich schnell bewegen, schnell gehen oder laufen. Hier ist es ironisch gemeint, weil sie gleichzeitig mit 'Mäuseschritten' geht, also eigentlich sehr langsam.", "example": "Der alte Mann eilt mit seinem Stock so schnell er kann zum Bus.", "is_phrase": false, "pos": "Verb"}, "einmal": {"def": "Diese Phrase bedeutet 'als erstes' oder 'zuerst'. Man verwendet sie, um zu sagen, dass etwas der erste Schritt ist, bevor andere Dinge passieren.", "example": "Erst einmal muss ich meine Hausaufgaben machen, dann können wir spielen.", "is_phrase": true, "pos": "Redewendung"}, "einzunehmen": {"def": "sich auf einen bestimmten Platz setzen oder stellen, wo man hingehört oder wo man sein soll", "example": "Die Schüler sollen schnell ihre Plätze einnehmen, damit der Unterricht beginnen kann.", "is_phrase": false, "pos": "Verb"}, "elefantenkuh": {"def": "Eine sehr große und dicke Frau (abwertend). Das Wort vergleicht eine Frau mit einem weiblichen Elefanten wegen ihrer Größe.", "example": "Sie fühlte sich neben der schlanken Freundin wie eine Elefantenkuh.", "is_phrase": false, "pos": "Substantiv"}, "elfe": {"def": "Ein sehr schönes, zartes Mädchen oder eine junge Frau, die wie ein Märchenwesen aussieht. Man verwendet das Wort, um jemanden zu beschreiben, der besonders hübsch und anmutig ist.", "example": "Lisa sieht aus wie eine Elfe mit ihren langen blonden Haaren und dem zarten Gesicht.", "is_phrase": false, "pos": "Substantiv"}, "ellbogen": {"def": "Das Gelenk in der Mitte des Arms, wo der Arm gebogen werden kann. Hier wird der Ellbogen als Körperteil benutzt, um jemanden zu stoßen oder anzustoßen.", "example": "Er stieß mich mit dem Ellbogen an, um meine Aufmerksamkeit zu bekommen.", "is_phrase": false, "pos": "Substantiv"}, "ellie": {"def": "Ein weiblicher Vorname. In diesem Text ist Ellie eine Person, die angerufen werden kann und online ist.", "example": "Ellie ist meine beste Freundin und wohnt in Hamburg.", "is_phrase": false, "pos": "Eigenname"}, "ellies": {"def": "Ellies ist ein Vorname für eine Frau oder ein Mädchen. Es ist die Kurzform von Namen wie Ellen oder Elisabeth.", "example": "Ellies rief ihre Freundin an und fragte, ob sie Lust auf Kino hat.", "is_phrase": false, "pos": "Eigenname"}, "endet": {"def": "aufhören oder zu Ende gehen. Etwas hört plötzlich auf zu existieren oder passiert nicht mehr weiter.", "example": "Die Musik endet abrupt, als der Strom ausfällt.", "is_phrase": false, "pos": "Verb"}, "endlich": {"def": "drückt aus, dass etwas nach langer Zeit oder langem Warten jetzt passiert; zeigt Ungeduld oder Erleichterung", "example": "Nach drei Stunden Verspätung kam der Zug endlich an.", "is_phrase": false, "pos": "Adverb"}, "entschuldige": {"def": "Das sagt man, wenn man sich für einen Fehler oder etwas Unangenehmes entschuldigen möchte. Es ist eine höfliche Art, um Verzeihung zu bitten.", "example": "Entschuldige, dass ich zu spät gekommen bin!", "is_phrase": false, "pos": "Interjektion"}, "entwickeln": {"def": "Diese Phrase bedeutet: etwas wird selbstständig aktiv oder bewegt sich von alleine. Man sagt das, wenn Gegenstände so aussehen, als würden sie ohne menschliches Zutun handeln.", "example": "Die Bücher auf meinem Schreibtisch scheinen ein Eigenleben zu entwickeln - jeden Tag liegen sie woanders.", "is_phrase": true, "pos": "Redewendung"}, "erst": {"def": "zeigt an, dass etwas nur dann oder nur an einer bestimmten Stelle aufhört oder zu Ende geht", "example": "Der Regen hörte erst am Abend auf.", "is_phrase": false, "pos": "Adverb"}, "ersten": {"def": "Die Reihe, die ganz vorne ist, am nächsten zum Sprecher oder zur Bühne. In einem Raum mit mehreren Reihen von Sitzen ist das die vorderste Reihe.", "example": "Im Theater sitzen die Zuschauer in der ersten Reihe direkt vor der Bühne.", "is_phrase": false, "pos": "Adjektiv"}, "erstickte": {"def": "So leise und unterdrückt, dass man es kaum hören kann. Die Person hält den Laut zurück oder macht ihn sehr leise.", "example": "Als der Lehrer den peinlichen Fehler machte, gaben die Schüler erstickte Lacher von sich.", "is_phrase": false, "pos": "Adjektiv"}, "ertönt": {"def": "Ein Geräusch oder eine Stimme ist plötzlich zu hören. Das Wort wird oft in literarischen Texten verwendet, wenn ein Ton oder eine Stimme erscheint.", "example": "Plötzlich ertönt das Telefon und alle schauen auf.", "is_phrase": false, "pos": "Verb"}, "esther": {"def": "Ein weiblicher Vorname. Hier ruft jemand eine Person namens Esther an oder spricht mit ihr am Telefon.", "example": "\"Hallo, ist da Esther?\" fragte er ins Telefon.", "is_phrase": false, "pos": "Substantiv"}, "fall": {"def": "Diese Phrase bedeutet 'sicher' oder 'bestimmt'. Man verwendet sie, um zu zeigen, dass etwas ganz sicher passieren wird.", "example": "Ich werde auf jeden Fall zum Geburtstag kommen, auch wenn es regnet.", "is_phrase": true, "pos": "Redewendung"}, "fallen": {"def": "etwas nicht vorsichtig hinlegen, sondern einfach nach unten sinken oder tropfen lassen", "example": "Er war müde und ließ seine Tasche einfach auf den Boden fallen.", "is_phrase": false, "pos": "Verb"}, "fast": {"def": "bedeutet 'beinahe' oder 'sehr nahe daran, aber nicht ganz'. Es drückt aus, dass etwas sehr wahrscheinlich ist oder dass etwas einem bestimmten Zustand sehr nahe kommt.", "example": "Der Bus war fast leer, nur drei Personen saßen noch drin.", "is_phrase": false, "pos": "Adverb"}, "fertig": {"def": "Etwas komplett machen oder in Ordnung bringen. Alle Arbeiten beenden, damit etwas vollständig und bereit ist.", "example": "Wir müssen noch die Küche fertig machen, bevor die Gäste kommen.", "is_phrase": true, "pos": "Redewendung"}, "folgt": {"def": "sich hinter einer Person her bewegen; mit jemandem mitgehen", "example": "Der kleine Hund folgt seinem Besitzer überall hin.", "is_phrase": false, "pos": "Verb"}, "fort": {"def": "Bedeutet: weitergehen oder weitermachen mit etwas, das man schon begonnen hat. Man hört nicht auf, sondern macht weiter.", "example": "Nach der Pause setzte der Lehrer den Vortrag fort.", "is_phrase": true, "pos": "Redewendung"}, "frau": {"def": "Höfliche Anrede für eine erwachsene weibliche Person, die man mit Nachnamen anspricht. Man verwendet es vor dem Familiennamen.", "example": "Frau Müller arbeitet in unserem Büro und ist sehr freundlich.", "is_phrase": false, "pos": "Substantiv"}, "frei": {"def": "nicht besetzt oder belegt; verfügbar und noch nicht von jemandem eingenommen. Wenn ein Platz frei ist, kann sich dort noch jemand hinsetzen oder hinstellen.", "example": "Neben Maria war noch ein Stuhl frei, deshalb setzte ich mich dorthin.", "is_phrase": false, "pos": "Adjektiv"}, "freundlich": {"def": "Eine höfliche Art zu fragen, ob jemand etwas tun kann oder will. Man sagt das, wenn man jemanden um etwas bittet, aber es nett klingen lassen möchte.", "example": "Wären Sie so freundlich, mir bei dem schweren Koffer zu helfen?", "is_phrase": true, "pos": "Redewendung"}, "frischem": {"def": "Das Obst ist noch gut und nicht alt oder schlecht. Es ist vor kurzer Zeit gekauft worden oder gepflückt worden.", "example": "Im Kühlschrank haben wir noch frisches Gemüse vom Markt.", "is_phrase": false, "pos": "Adjektiv"}, "fällt": {"def": "Wenn eine Tür ins Schloss fällt, bedeutet das: Die Tür schließt sich von selbst und macht dabei ein Geräusch. Das passiert meist schnell und manchmal laut.", "example": "Als der Wind kam, fiel die Haustür laut ins Schloss.", "is_phrase": true, "pos": "Redewendung"}, "fühlen": {"def": "Diese Phrase beschreibt, wie sich etwas anfühlt, wenn man es berührt oder körperlich spürt. Man benutzt sie, um zu sagen, dass etwas sehr hart und fest ist.", "example": "Nach dem langen Training fühlten sich seine Armmuskeln an wie Stein.", "is_phrase": true, "pos": "Redewendung"}, "fühlt": {"def": "körperlich spüren oder wahrnehmen, wie sich etwas im eigenen Körper verändert oder anfühlt", "example": "Sie fühlte, wie ihr Gesicht rot wurde, als alle sie anstarrten.", "is_phrase": false, "pos": "Verb"}, "fünf": {"def": "Die Zahl 5, die Anzahl von fünf Dingen oder Personen.", "example": "In unserer Familie sind wir fünf Personen.", "is_phrase": false, "pos": "Zahlwort"}, "für": {"def": "Wird in Ausrufen verwendet, um Überraschung oder starke Gefühle auszudrücken. Bedeutet so viel wie 'was für welche' oder 'wie'.", "example": "Was für ein schönes Auto! Was für große Augen du hast!", "is_phrase": true, "pos": "Pronomen"}, "fürs": {"def": "Kurze Form für 'für das'. Man verwendet es, wenn man sagen will, dass etwas für eine bestimmte Sache oder einen bestimmten Zweck ist.", "example": "Die neuen Polizisten sind Verstärkung fürs Rollkommando.", "is_phrase": false, "pos": "Kontraktion"}, "gar": {"def": "Verstärkt eine Verneinung und bedeutet 'überhaupt nicht' oder 'absolut nicht'. Macht die Ablehnung sehr deutlich und energisch.", "example": "Das glaube ich gar nicht!", "is_phrase": false, "pos": "Adverb"}, "geifern": {"def": "Speichel aus dem Mund fließen lassen, sabbern. Wird oft bei Tieren oder Menschen verwendet, die nicht kontrolieren können, was aus ihrem Mund kommt.", "example": "Der alte Hund lag in der Sonne und begann zu geifern.", "is_phrase": false, "pos": "Verb"}, "gekippt": {"def": "Nach hinten geneigt oder gelehnt. Der Stuhl steht nicht gerade, sondern ist schräg nach hinten gestellt.", "example": "Sie saß entspannt auf ihrem nach hinten gekippten Stuhl und hörte der Musik zu.", "is_phrase": false, "pos": "Partizip/Adjektiv"}, "gerne": {"def": "Drückt aus, dass man etwas möchte oder wünscht. Man benutzt es oft mit 'würde', um höflich zu fragen oder zu sagen, was man will.", "example": "Ich würde gerne einen Kaffee trinken.", "is_phrase": false, "pos": "Adverb"}, "gleich": {"def": "sehr bald, in wenigen Sekunden oder Minuten. Es zeigt, dass etwas jeden Moment passieren wird.", "example": "Er sieht müde aus, als würde er gleich einschlafen.", "is_phrase": false, "pos": "Adverb"}, "greift": {"def": "Die Hand schnell ausstrecken, um etwas zu nehmen oder zu berühren. Man macht eine schnelle Bewegung mit der Hand zu einem Gegenstand hin.", "example": "Als das Kind das Spielzeug sah, griff es sofort danach.", "is_phrase": false, "pos": "Verb"}, "guten": {"def": "Eine höfliche Begrüßung, die man am Morgen sagt. Man verwendet diese Phrase, um freundlich 'Hallo' zu sagen, wenn man sich am Vormittag trifft.", "example": "Als ich ins Büro kam, sagte ich zu meinen Kollegen: 'Guten Morgen!'", "is_phrase": true, "pos": "Redewendung"}, "habe": {"def": "Eine Form von 'haben' in der ersten Person Singular Präsens. Es bedeutet, dass man etwas besitzt oder zur Verfügung hat.", "example": "Ich habe einen neuen Laptop für die Arbeit.", "is_phrase": false, "pos": "Verb"}, "halben": {"def": "Um die Hälfte einer Kopfgröße kleiner als jemand anderes. Man benutzt das, um einen Größenunterschied zwischen zwei Personen zu beschreiben.", "example": "Mein kleiner Bruder ist einen halben Kopf kleiner als ich.", "is_phrase": true, "pos": "Redewendung"}, "hals": {"def": "Wenn man sagt, dass das Herz bis in den Hals schlägt, bedeutet das: Man hat sehr starke Angst oder ist sehr nervös. Man spürt den Herzschlag sehr deutlich im oberen Körperbereich.", "example": "Als sie vor der Prüfung stand, spürte sie ihr Herz bis in den Hals schlagen.", "is_phrase": true, "pos": "Redewendung"}, "hand": {"def": "Eine höfliche Begrüßung, bei der man die rechte Hand der anderen Person kurz fasst und schüttelt. Das macht man, wenn man sich zum ersten Mal trifft oder jemanden begrüßt.", "example": "Der neue Kollege stellte sich vor und reichte mir die Hand.", "is_phrase": true, "pos": "Redewendung"}, "haustür": {"def": "Die Tür am Eingang eines Hauses, durch die man von draußen ins Haus hineingeht. Sie ist meist die wichtigste Tür des Hauses und führt direkt zur Straße oder zum Garten.", "example": "Als es klingelte, ging Maria zur Haustür und öffnete sie.", "is_phrase": false, "pos": "Substantiv"}, "heißt": {"def": "Diese Phrase benutzt man, um etwas zu korrigieren oder genauer zu erklären. Man sagt es, wenn man seine erste Aussage präziser machen möchte.", "example": "Es waren viele Leute da. Das heißt, etwa zwanzig Personen.", "is_phrase": true, "pos": "Redewendung"}, "helferin": {"def": "Eine weibliche Person, die in einer Arztpraxis arbeitet und dem Arzt bei seiner Arbeit hilft. Sie macht zum Beispiel Termine mit Patienten oder hilft bei Untersuchungen.", "example": "Die Helferin in der Zahnarztpraxis war sehr freundlich und hat mir erklärt, was ich nach der Behandlung beachten muss.", "is_phrase": false, "pos": "Substantiv"}, "hellwach": {"def": "Völlig wach und aufmerksam. Die Person schläft nicht und bemerkt alles, was um sie herum passiert.", "example": "Obwohl es schon sehr spät war, war Maria noch hellwach und hörte jedes Geräusch im Haus.", "is_phrase": false, "pos": "Adjektiv"}, "herrscht": {"def": "Es gibt viel Chaos oder Unordnung an diesem Ort. Man benutzt das Wort, wenn ein Zustand oder eine Situation sehr stark vorhanden ist.", "example": "Im Wohnzimmer herrscht völlige Stille, weil alle schlafen.", "is_phrase": false, "pos": "Verb"}, "herum": {"def": "Man bewegt sich um etwas herum, um auf die andere Seite zu kommen. Die Person geht nicht über oder durch den Tresen, sondern außen um ihn herum.", "example": "Der Verkäufer kommt um die Theke herum, um mir zu helfen.", "is_phrase": true, "pos": "Redewendung"}, "herz": {"def": "Wenn man das Herz bis in den Hals schlagen spürt, bedeutet das, dass man sehr aufgeregt, nervös oder erschrocken ist. Das Herz schlägt dann so stark und schnell, dass man es deutlich merkt.", "example": "Als sie ihren Namen für den Preis hörte, spürte sie ihr Herz bis in den Hals schlagen.", "is_phrase": true, "pos": "Redewendung"}, "herzschlag": {"def": "Für einen sehr kurzen Moment, für eine sehr kurze Zeit. Man benutzt diese Phrase, um zu zeigen, dass etwas nur ganz kurz dauert.", "example": "Einen Herzschlag lang dachte sie, sie hätte ihren Schlüssel verloren.", "is_phrase": true, "pos": "Redewendung"}, "heute": {"def": "An diesem Tag, an dem wir gerade sind. Es bedeutet nicht gestern oder morgen, sondern genau jetzt am aktuellen Tag.", "example": "Heute regnet es sehr stark, deshalb bleibe ich zu Hause.", "is_phrase": false, "pos": "Adverb"}, "hinten": {"def": "In Richtung des Rückens oder der Rückenlehne des Stuhls. Der Stuhl wird so geneigt, dass die Vorderbeine vom Boden abheben.", "example": "Er lehnte sich entspannt zurück und kippte seinen Bürostuhl nach hinten.", "is_phrase": false, "pos": "Adverb"}, "hinunter": {"def": "nach unten, in Richtung eines tieferen Ortes. Man benutzt es, wenn sich jemand oder etwas von oben nach unten bewegt.", "example": "Die Kinder liefen die Treppe hinunter in den Garten.", "is_phrase": false, "pos": "Adverb"}, "hochfährt": {"def": "Den Computer anschalten und starten, so dass man ihn benutzen kann. Das System wird geladen und ist dann bereit für die Arbeit.", "example": "Morgens fahre ich zuerst meinen Laptop hoch, bevor ich mit der Arbeit beginne.", "is_phrase": false, "pos": "Verb"}, "hättest": {"def": "Form von 'haben' im Konjunktiv II. Man benutzt es, um über etwas zu sprechen, was nicht passiert ist, aber möglich gewesen wäre.", "example": "Du hättest mehr lernen sollen, dann wäre die Prüfung leichter gewesen.", "is_phrase": false, "pos": "Verb"}, "hüften": {"def": "Der Körperteil zwischen der Taille und den Oberschenkeln, links und rechts am Becken. Wenn jemand mit schwingenden Hüften geht, bewegt er sich sehr weiblich und anziehend.", "example": "Die Tänzerin bewegte ihre Hüften rhythmisch zur Musik.", "is_phrase": false, "pos": "Substantiv"}, "ins": {"def": "Eine Präposition, die eine Bewegung oder Richtung zu einem Ort zeigt. Man benutzt 'ins' für 'in das' bei männlichen und sächlichen Wörtern.", "example": "Die Kinder gehen ins Museum und schauen sich die Ausstellung an.", "is_phrase": false, "pos": "Präposition"}, "jacke": {"def": "Ein Kleidungsstück, das man über andere Kleidung anzieht, um sich warm zu halten oder vor Wetter zu schützen. Man kann es vorne öffnen und schließen.", "example": "Vor dem Spaziergang zog er seine warme Jacke an, weil es draußen kalt war.", "is_phrase": false, "pos": "Substantiv"}, "jahr": {"def": "Ein Zeitraum von zwölf Monaten, meist von Januar bis Dezember. Hier meint die Person das aktuelle Jahr 2024 oder das Jahr, in dem sie gerade lebt.", "example": "Dieses Jahr war der Winter besonders kalt und lang.", "is_phrase": false, "pos": "Substantiv"}, "jemals": {"def": "zu irgendeinem Zeitpunkt in der Zukunft oder Vergangenheit; wird oft in verneinenden oder zweifelnden Sätzen verwendet. Es drückt aus, dass etwas vielleicht nie passieren wird.", "example": "Ich frage mich, ob ich jemals wieder so glücklich sein werde wie damals.", "is_phrase": false, "pos": "Adverb"}, "jennifer": {"def": "Ein weiblicher Vorname. Hier ist Jennifer der Name einer Person.", "example": "Jennifer sitzt in der ersten Reihe, und ich setze mich neben sie.", "is_phrase": false, "pos": "Eigenname"}, "karton": {"def": "Eine Box aus dickem Papier, in der man Dinge aufbewahrt oder transportiert. Meist rechteckig und kann schwer sein, wenn sie voll ist.", "example": "Nach dem Umzug standen noch drei Kartons mit Büchern im Flur.", "is_phrase": false, "pos": "Substantiv"}, "kartons": {"def": "Große Schachteln aus Pappe, die man zum Verpacken und Transportieren von Gegenständen verwendet. Man braucht sie besonders beim Umziehen, um Sachen hineinzupacken.", "example": "Beim Umzug haben wir zwanzig Kartons gepackt und ins neue Haus getragen.", "is_phrase": false, "pos": "Substantiv"}, "kellergeschoss": {"def": "Das Stockwerk eines Gebäudes, das unter der Erde liegt. Hier befinden sich oft Räume wie Lagerräume, Technikräume oder Keller.", "example": "Im Kellergeschoss der Schule befinden sich die Umkleideräume für den Sportunterricht.", "is_phrase": false, "pos": "Substantiv"}, "kichern": {"def": "Leise und heimlich lachen, oft wenn man sich über jemanden lustig macht oder etwas peinlich findet. Man macht dabei kleine, hohe Laute.", "example": "Die Schüler begannen zu kichern, als der Lehrer über seine eigenen Wörter stolperte.", "is_phrase": false, "pos": "Verb"}, "kisten": {"def": "Behälter aus Holz oder anderem Material, meist rechteckig mit Deckel, in denen man Dinge transportiert oder aufbewahrt. Sie werden oft beim Umziehen oder zur Lagerung verwendet.", "example": "Nach dem Umzug standen überall Kisten herum, die noch ausgepackt werden mussten.", "is_phrase": false, "pos": "Substantiv"}, "klasse": {"def": "Ein Raum in der Schule, in dem die Schüler zusammen lernen und Unterricht haben. Hier sitzen normalerweise etwa 20-30 Schüler mit einem Lehrer.", "example": "Nach der Pause gehen alle Schüler zurück in ihre Klasse.", "is_phrase": false, "pos": "Substantiv"}, "klassenzimmers": {"def": "Ein Raum in der Schule, in dem der Unterricht stattfindet. Dort sitzen die Schüler an Tischen und der Lehrer unterrichtet sie.", "example": "Nach der Pause gehen alle Schüler zurück in ihr Klassenzimmer.", "is_phrase": false, "pos": "Substantiv"}, "kleiner": {"def": "nicht so groß oder hoch wie eine andere Person. Wenn jemand einen halben Kopf kleiner ist, ist die Person um etwa 10-15 cm weniger groß.", "example": "Mein Bruder ist zwei Jahre älter als ich, aber ich bin schon größer als er - er ist nur noch einen Kopf kleiner.", "is_phrase": false, "pos": "Adjektiv"}, "klärt": {"def": "jemanden über etwas informieren oder jemandem etwas erklären. Man teilt einer anderen Person Informationen mit.", "example": "Der Arzt klärt den Patienten über die Behandlung auf.", "is_phrase": false, "pos": "Verb"}, "knack": {"def": "Ein Wort, das das Geräusch beschreibt, wenn etwas hart bricht oder wenn man etwas Hartes schließt. Hier zeigt es, dass jemand das Telefon beendet hat.", "example": "Sie legte auf und man hörte nur noch: Knack.", "is_phrase": false, "pos": "Interjektion"}, "knie": {"def": "Wenn die Knie weich wie Pudding werden, bedeutet das, dass man vor Angst oder Schreck sehr schwache Beine bekommt. Man fühlt sich unsicher und kann kaum noch stehen.", "example": "Als er die schlechte Nachricht hörte, wurden seine Knie zu Pudding und er musste sich setzen.", "is_phrase": true, "pos": "Redewendung"}, "knöpfe": {"def": "Kleine runde Teile an einem Gerät, die man drücken kann, um das Gerät zu bedienen. Sie sind oft aus Plastik oder Metall und haben verschiedene Funktionen.", "example": "Um das Radio lauter zu machen, muss ich diesen Knopf hier drehen.", "is_phrase": false, "pos": "Substantiv"}, "komme": {"def": "Ich werde kommen oder ich bin auf dem Weg. Man sagt das am Telefon, wenn man jemandem mitteilen will, dass man bald da sein wird.", "example": "Maria rief an und sagte nur: 'Komme gleich!' bevor das Gespräch unterbrochen wurde.", "is_phrase": false, "pos": "Verb"}, "kopf": {"def": "Diese Phrase bedeutet: um die Länge eines halben Kopfes kleiner sein. Man benutzt sie, um einen Größenunterschied zwischen zwei Personen zu beschreiben.", "example": "Mein kleiner Bruder ist einen ganzen Kopf kleiner als ich.", "is_phrase": true, "pos": "Redewendung"}, "kräftige": {"def": "stark und muskulös, mit viel körperlicher Kraft. Beschreibt Menschen, die schwere Arbeit machen können.", "example": "Für den Umzug brauchen wir kräftige Helfer, die die schweren Schränke tragen können.", "is_phrase": false, "pos": "Adjektiv"}, "kurz": {"def": "für eine sehr kleine Zeit. Es bedeutet, dass etwas nur einen Moment dauert.", "example": "Er dachte kurz nach und gab dann seine Antwort.", "is_phrase": false, "pos": "Adverb"}, "küche": {"def": "Ein Raum in der Wohnung oder im Haus, wo man kocht und Essen zubereitet. Dort stehen normalerweise der Herd, der Kühlschrank und andere Geräte zum Kochen.", "example": "In unserer neuen Wohnung ist die Küche sehr groß und hat viel Platz für alle Küchengeräte.", "is_phrase": false, "pos": "Substantiv"}, "lang": {"def": "drückt aus, wie lange etwas dauert; für die Zeit von", "example": "Er schwieg einen Moment lang und dachte nach.", "is_phrase": false, "pos": "Adverb"}, "langsam": {"def": "nicht schnell, mit wenig Tempo. Hier beschreibt es, wie sich die Person bewegt - ruhig und ohne Eile.", "example": "Der alte Mann ging langsam über die Straße.", "is_phrase": false, "pos": "Adverb"}, "laute": {"def": "Geräusche oder Töne, die Menschen mit dem Mund machen, aber keine richtigen Wörter sind. Zum Beispiel wenn man überrascht, erschrocken oder aufgeregt ist.", "example": "Als sie den Unfall sah, gab sie erschrockene Laute von sich.", "is_phrase": false, "pos": "Substantiv"}, "lauter": {"def": "bedeutet hier: nur, ausschließlich, nichts als. Es drückt aus, dass es sich um sehr viele oder alle von einer bestimmten Art handelt.", "example": "Auf der Party waren lauter junge Leute aus der Universität.", "is_phrase": false, "pos": "Adjektiv"}, "leeren": {"def": "Ein Platz ist leer, wenn niemand darauf sitzt. Es bedeutet, dass der Platz frei ist und jemand sich hinsetzen kann.", "example": "Der leere Stuhl am Tisch wartet auf den letzten Gast.", "is_phrase": false, "pos": "Adjektiv"}, "lehrerin": {"def": "Eine Frau, die in der Schule arbeitet und Schülern Wissen vermittelt. Sie unterrichtet Kinder oder Jugendliche in verschiedenen Fächern.", "example": "Die Lehrerin erklärt den Schülern die Mathematikaufgabe an der Tafel.", "is_phrase": false, "pos": "Substantiv"}, "lehrerpult": {"def": "Ein großer Tisch im Klassenzimmer, an dem der Lehrer oder die Lehrerin steht und unterrichtet. Es steht meist vorne vor den Schülertischen.", "example": "Die Lehrerin legte ihre Bücher auf das Lehrerpult und begann mit dem Unterricht.", "is_phrase": false, "pos": "Substantiv"}, "leitung": {"def": "Die Verbindung beim Telefonieren. Wenn die Leitung zusammenbricht, kann man nicht mehr sprechen, weil das Telefon nicht mehr funktioniert.", "example": "Während des wichtigen Gesprächs brach plötzlich die Leitung zusammen und wir konnten uns nicht mehr hören.", "is_phrase": false, "pos": "Substantiv"}, "letzten": {"def": "Das Adjektiv beschreibt etwas, das ganz hinten oder am Ende steht. Es bedeutet hier: die Reihe, die am weitesten vom Lehrerpult entfernt ist.", "example": "Die Schüler in der letzten Reihe können die Tafel manchmal schlecht sehen.", "is_phrase": false, "pos": "Adjektiv"}, "licht": {"def": "Eine kleine Lampe an einem Gerät, die zeigt, dass etwas passiert ist oder dass das Gerät arbeitet. Das Licht leuchtet oder blinkt in verschiedenen Farben.", "example": "Das grüne Licht an meinem Computer zeigt mir, dass er eingeschaltet ist.", "is_phrase": false, "pos": "Substantiv"}, "los": {"def": "Eine Frage, die man stellt, wenn etwas Ungewöhnliches oder Problematisches passiert. Man möchte wissen, was das Problem ist oder warum sich jemand seltsam verhält.", "example": "Als ich die vielen Leute vor dem Haus sah, fragte ich meinen Nachbarn: 'Was ist denn hier los?'", "is_phrase": true, "pos": "Redewendung"}, "losheulen": {"def": "Plötzlich anfangen zu weinen und dabei laut zu schluchzen. Man kann nicht kontrollieren, dass man weint.", "example": "Als sie die schlechte Nachricht hörte, fing sie sofort an loszuheulen.", "is_phrase": false, "pos": "Verb"}, "lässt": {"def": "In Beleg 1: etwas fallen lassen oder hinlegen, ohne es vorsichtig abzusetzen. In Beleg 2: bewirken, dass jemand auf eine bestimmte Weise wirkt oder erscheint.", "example": "Er lässt seine Tasche auf den Boden fallen und geht ins Bett.", "is_phrase": false, "pos": "Verb"}, "magermilch-models": {"def": "Sehr dünne Models, die so dünn sind wie Magermilch (die fast kein Fett hat). Der Ausdruck kritisiert, dass diese Models zu dünn sind.", "example": "In der Modewelt gibt es viele Magermilch-Models, die ungesund dünn aussehen.", "is_phrase": false, "pos": "Substantiv"}, "mal": {"def": "Ein kleines Wort, das den Ton der Aussage verstärkt und zeigt, dass der Sprecher etwas typisch oder erwartbar findet. Es macht die Kritik weniger hart.", "example": "Du kommst mal wieder zu spät zur Arbeit!", "is_phrase": false, "pos": "Modalpartikel"}, "mam": {"def": "Informelle Anrede für die Mutter, ähnlich wie 'Mama'. Wird oft von Kindern oder Jugendlichen verwendet.", "example": "Das Kind rief: 'Mam, wo bist du?'", "is_phrase": false, "pos": "Substantiv"}, "mathematik": {"def": "Ein Schulfach, in dem man mit Zahlen rechnet und Aufgaben löst. Man lernt dort zum Beispiel plus, minus, mal und geteilt rechnen.", "example": "In der Mathematikstunde haben wir heute Bruchrechnung gelernt.", "is_phrase": false, "pos": "Substantiv"}, "mist": {"def": "Ein Wort, das man sagt, wenn man ärgerlich oder wütend ist. Man benutzt es, wenn etwas nicht so läuft, wie man es wollte.", "example": "Mist! Ich habe meinen Schlüssel vergessen.", "is_phrase": false, "pos": "Ausruf"}, "mittag": {"def": "Die Zeit um 12 Uhr, wenn normalerweise Mittagspause ist oder gegessen wird. Hier bedeutet es: am heutigen Tag zur Mittagszeit.", "example": "Wir treffen uns heute Mittag um 13 Uhr zum Essen.", "is_phrase": false, "pos": "Substantiv"}, "mondgesicht": {"def": "Ein abwertender Ausdruck für eine Person mit einem runden, dicken Gesicht. Das Wort wird als Beleidigung verwendet, um jemanden zu beschreiben, der unattraktiv oder abstoßend aussieht.", "example": "Der aggressive Mann mit dem Mondgesicht machte allen anderen Angst.", "is_phrase": false, "pos": "Substantiv"}, "montag": {"def": "Der erste Tag der Woche. Hier steht es als Datumsangabe am Anfang eines Tagebucheintrags oder Briefes.", "example": "Montag, 15. März - Heute war ein anstrengender Tag in der Schule.", "is_phrase": false, "pos": "Substantiv"}, "morgen": {"def": "Das ist ein freundlicher Gruß, den man am Vormittag bis etwa 12 Uhr sagt. Man wünscht der anderen Person damit einen schönen Start in den Tag.", "example": "Als ich um 9 Uhr ins Büro kam, sagte mein Kollege: 'Guten Morgen, wie geht es dir heute?'", "is_phrase": true, "pos": "Redewendung"}, "muskelmacker": {"def": "Ein Mann mit sehr vielen Muskeln, der oft im Fitnessstudio trainiert. Das Wort wird meist abwertend verwendet für jemanden, der seine Muskeln gerne zeigt.", "example": "Am Strand posierte ein Muskelmacker vor den anderen Leuten.", "is_phrase": false, "pos": "Substantiv"}, "mussten": {"def": "Vergangene Form von 'müssen' - zeigt an, dass etwas in der Vergangenheit nötig war oder man keine andere Wahl hatte. Es war nicht freiwillig, sondern notwendig.", "example": "Wegen des Regens mussten wir das Picknick absagen.", "is_phrase": false, "pos": "Verb"}, "mutter": {"def": "Die weibliche Person, die ein Kind geboren hat und es großgezogen hat. In diesem Fall ist es die Mutter der Person, die eine Arztpraxis übernommen hat.", "example": "Seine Mutter arbeitet als Ärztin und hat vor kurzem die Praxis von ihrem Kollegen übernommen.", "is_phrase": false, "pos": "Substantiv"}, "mäuseschritten": {"def": "Sehr kleine, schnelle Schritte, wie sie eine Maus macht. Man geht dabei leise und vorsichtig.", "example": "Die alte Dame ging mit Mäuseschritten durch den Flur, um niemanden zu wecken.", "is_phrase": false, "pos": "Substantiv"}, "möbel": {"def": "Große Gegenstände in der Wohnung wie Schränke, Tische, Betten oder Sofas. Sie sind schwer und man braucht oft mehrere Personen, um sie zu bewegen.", "example": "Beim Umzug mussten wir alle Möbel aus der alten Wohnung in die neue bringen.", "is_phrase": false, "pos": "Substantiv"}, "nachbarin": {"def": "Eine Person, die direkt neben einer anderen Person sitzt oder steht. Hier: die andere blonde Frau, die neben der ersten sitzt.", "example": "Im Kino flüsterte ich meiner Nachbarin zu, dass der Film langweilig sei.", "is_phrase": false, "pos": "Substantiv"}, "nackenmuskeln": {"def": "Die Muskeln im Nacken, also im hinteren Teil des Halses zwischen Kopf und Schultern. Wenn sie sehr angespannt oder hart sind, fühlen sie sich steif an.", "example": "Nach dem langen Arbeiten am Computer waren seine Nackenmuskeln völlig verspannt.", "is_phrase": false, "pos": "Substantiv"}, "nadja": {"def": "Nadja ist der Vorname einer Person. Es ist ein weiblicher Name für Mädchen oder Frauen.", "example": "Nadja geht in die neunte Klasse und lernt ihre neue Schule kennen.", "is_phrase": false, "pos": "Eigenname"}, "neben": {"def": "Das Wort zeigt an, dass sich etwas oder jemand direkt links oder rechts von einer Person oder Sache befindet. Es beschreibt eine Position sehr nah bei jemandem oder etwas.", "example": "Lisa setzt sich neben ihren Freund auf die Bank im Park.", "is_phrase": false, "pos": "Präposition"}, "neugier": {"def": "Das bedeutet: Ich bin sehr gespannt und will unbedingt wissen, was passiert ist. Man sagt das, wenn man so neugierig ist, dass man es kaum aushalten kann.", "example": "Als meine Freundin sagte, sie hat große Neuigkeiten, platzte ich vor Neugier und wollte sofort alles erfahren.", "is_phrase": true, "pos": "Redewendung"}, "nie": {"def": "Diese Wendung bedeutet: so schlimm war es noch zu keiner Zeit vorher. Man benutzt sie, um zu sagen, dass etwas jetzt am schlimmsten ist.", "example": "Der Winter war so kalt wie noch nie in den letzten zwanzig Jahren.", "is_phrase": true, "pos": "Redewendung"}, "niederlässt": {"def": "sich hinsetzen oder sich an einen Platz setzen. Man nimmt eine sitzende Position ein.", "example": "Nach der langen Wanderung lässt sie sich müde auf die Bank nieder.", "is_phrase": false, "pos": "Verb"}, "nimmt": {"def": "Das Verb hat hier zwei Bedeutungen: 1) eine bestimmte Farbe oder ein Aussehen bekommen 2) etwas für sich selbst aus einem Angebot auswählen und wegnehmen", "example": "Der Himmel nimmt eine dunkle Farbe an, bevor es regnet.", "is_phrase": false, "pos": "Verb"}, "nähten": {"def": "Wenn etwas aus allen Nähten platzt, ist es völlig überfüllt oder zu voll. Es bedeutet, dass ein Raum oder Ort viel zu viele Menschen oder Dinge enthält.", "example": "Das kleine Restaurant platzte aus allen Nähten, weil so viele Gäste kommen wollten.", "is_phrase": true, "pos": "Redewendung"}, "obst": {"def": "Früchte, die man essen kann, wie Äpfel, Bananen oder Orangen. Sie wachsen an Bäumen oder Sträuchern und sind gesund.", "example": "Im Supermarkt kaufe ich gerne frisches Obst für das Frühstück.", "is_phrase": false, "pos": "Substantiv"}, "online": {"def": "Mit dem Internet verbunden und bereit, digitale Nachrichten zu empfangen oder zu senden. Die Person ist gerade am Computer oder Handy aktiv.", "example": "Mein Bruder ist schon online und wartet auf unseren Video-Anruf.", "is_phrase": false, "pos": "Adjektiv"}, "paar": {"def": "Eine kleine, unbestimmte Anzahl von etwas. Man verwendet es, wenn man nicht genau sagen will oder kann, wie viele es sind.", "example": "Ich brauche noch ein paar Minuten, dann bin ich fertig.", "is_phrase": true, "pos": "Artikel + Substantiv"}, "passiert": {"def": "etwas geschieht oder findet statt, ohne dass man es plant oder erwartet", "example": "Bei jeder Reise passiert es, dass ich etwas Wichtiges vergesse.", "is_phrase": false, "pos": "Verb"}, "physik": {"def": "Ein Schulfach, in dem man lernt, wie die Natur funktioniert, zum Beispiel warum Dinge fallen oder wie Licht und Strom wirken.", "example": "In Physik haben wir heute gelernt, warum ein Ball schneller fällt als eine Feder.", "is_phrase": false, "pos": "Substantiv"}, "platz": {"def": "Ein Stuhl oder eine Stelle im Klassenzimmer, wo ein Schüler sitzt. Jeder Schüler hat seinen eigenen Platz zum Lernen.", "example": "Maria sucht ihren Platz in der ersten Reihe und setzt sich hin.", "is_phrase": false, "pos": "Substantiv"}, "platze": {"def": "Diese Redewendung bedeutet: sehr neugierig sein und unbedingt etwas wissen wollen. Man kann es kaum aushalten, weil man so gespannt ist.", "example": "Erzähl mir endlich, was passiert ist - ich platze vor Neugier!", "is_phrase": true, "pos": "Redewendung"}, "platzt": {"def": "Wenn ein Raum aus allen Nähten platzt, ist er völlig überfüllt mit Menschen oder Dingen. Es bedeutet, dass viel zu wenig Platz für alles da ist.", "example": "Das kleine Café platzte aus allen Nähten, weil so viele Gäste gekommen waren.", "is_phrase": true, "pos": "Redewendung"}, "poltert": {"def": "mit lautem Geräusch fallen oder stürzen. Man hört ein dumpfes, lautes Geräusch, wenn etwas Schweres herunterfällt.", "example": "Die schweren Bücher polterten vom Regal und machten einen großen Lärm.", "is_phrase": false, "pos": "Verb"}, "praxis": {"def": "Eine Arztpraxis ist der Ort, wo ein Arzt oder eine Ärztin arbeitet und Patienten behandelt. Dort gibt es Sprechstunden und man kann Termine vereinbaren.", "example": "Der Zahnarzt hat seine Praxis in der Innenstadt und ist dort jeden Vormittag für seine Patienten da.", "is_phrase": false, "pos": "Substantiv"}, "projekt": {"def": "Eine geplante Arbeit oder Aufgabe, die über längere Zeit gemacht wird und ein bestimmtes Ziel hat. Es kann beruflich oder privat sein.", "example": "Unser Projekt für den neuen Spielplatz wird drei Monate dauern.", "is_phrase": false, "pos": "Substantiv"}, "pudding": {"def": "Diese Redewendung bedeutet, dass die Beine sehr weich und schwach werden, weil man große Angst hat oder sehr nervös ist. Man kann dann nicht mehr richtig stehen oder gehen.", "example": "Als er vor so vielen Menschen sprechen sollte, verwandelten sich seine Knie in Pudding.", "is_phrase": true, "pos": "Redewendung"}, "pünktlich": {"def": "zur richtigen Zeit, nicht zu früh und nicht zu spät", "example": "Der Zug kam pünktlich um 15:30 Uhr am Bahnhof an.", "is_phrase": false, "pos": "Adjektiv"}, "quatsch": {"def": "Ein Ausruf, der bedeutet, dass etwas Unsinn ist oder nicht stimmt. Man sagt es, wenn man eine Aussage für falsch oder dumm hält.", "example": "Als er sagte, er könne in einer Stunde nach Paris fahren, rief sie: 'Quatsch!'", "is_phrase": false, "pos": "Substantiv"}, "quetscht": {"def": "sich mit Mühe und Kraft durch eine sehr enge Stelle bewegen, obwohl man eigentlich zu groß dafür ist", "example": "Der dicke Mann quetscht sich durch die kleine Tür.", "is_phrase": false, "pos": "Verb"}, "rammt": {"def": "Jemanden schnell und kräftig mit dem Körper stoßen oder schlagen. Man macht das oft plötzlich und mit Kraft.", "example": "Der Junge rammte seinem Bruder den Finger in den Rücken, um ihn zu ärgern.", "is_phrase": false, "pos": "Verb"}, "raum": {"def": "Ein Zimmer oder eine Halle, in der sich Menschen aufhalten. Hier ist gemeint, dass zu viele Leute in diesem Zimmer sind.", "example": "Der kleine Raum war so voll mit Gästen, dass man sich kaum bewegen konnte.", "is_phrase": false, "pos": "Substantiv"}, "rauschen": {"def": "Ein kontinuierliches Geräusch, das durch fließendes Wasser, Wind oder ähnliche Bewegungen entsteht. Es klingt wie ein gleichmäßiges, sanftes Brausen.", "example": "Das Rauschen des Baches war in der stillen Nacht deutlich zu hören.", "is_phrase": false, "pos": "Substantiv"}, "reicht": {"def": "Diese Phrase bedeutet: eine Hand ausstrecken, um jemanden zu begrüßen und ihm die Hand zu geben. Das ist eine höfliche Art, jemanden zu begrüßen.", "example": "Als der neue Kollege sich vorstellte, reichte ihm der Chef die Hand.", "is_phrase": true, "pos": "Redewendung"}, "reihe": {"def": "Eine Linie von Sitzplätzen nebeneinander, zum Beispiel im Klassenzimmer, Theater oder Kino. Die erste Reihe ist ganz vorne, die letzte Reihe ganz hinten.", "example": "In der dritten Reihe saßen die Schüler, die schlecht sehen konnten.", "is_phrase": false, "pos": "Substantiv"}, "rollkommando": {"def": "Spöttische Bezeichnung für eine Gruppe von Menschen im Rollstuhl. Das Wort wird hier abwertend und verletzend verwendet.", "example": "Die Jugendlichen machten sich über die Rollstuhlfahrer lustig und nannten sie ein Rollkommando.", "is_phrase": false, "pos": "Substantiv"}, "rote": {"def": "Eine Farbe wie Blut oder reife Tomaten. Hier beschreibt es die Farbe eines Lichts, das blinkt.", "example": "An der Ampel müssen wir warten, wenn das rote Licht leuchtet.", "is_phrase": false, "pos": "Adjektiv"}, "rothaariges": {"def": "Mit roten Haaren. Das Adjektiv beschreibt die Haarfarbe einer Person.", "example": "Die rothaarige Frau trug einen grünen Mantel.", "is_phrase": false, "pos": "Adjektiv"}, "rotton": {"def": "Ein rötlicher Farbton, der krank oder unnatürlich wirkt. Diese Farbe zeigt oft, dass etwas nicht gesund ist.", "example": "Nach dem Fieber hatte sein Gesicht einen besorgniserregenden Rotton.", "is_phrase": false, "pos": "Substantiv"}, "rucksack": {"def": "Eine Tasche, die man auf dem Rücken trägt. Sie hat Träger für die Schultern und wird oft für Reisen oder Wanderungen benutzt.", "example": "Lisa packt ihre Bücher in den Rucksack und geht zur Schule.", "is_phrase": false, "pos": "Substantiv"}, "ruf": {"def": "Jemanden anrufen bedeutet, dass man mit dem Telefon Kontakt zu einer Person aufnimmt. Man wählt die Telefonnummer und spricht dann mit der Person.", "example": "Kannst du mich heute Abend anrufen?", "is_phrase": true, "pos": "Verb"}, "rufst": {"def": "Du machst einen Telefonanruf. Du wählst die Nummer von jemandem und sprichst mit dieser Person am Telefon.", "example": "Rufst du heute deine Mutter an oder machst du es morgen?", "is_phrase": true, "pos": "Verb"}, "räume": {"def": "Zimmer in einem Gebäude, die man für bestimmte Zwecke nutzt. In Schulen sind das zum Beispiel Klassenzimmer, Büros oder andere Zimmer für den Unterricht.", "example": "Die Schule hat neue Räume für den Computerunterricht eingerichtet.", "is_phrase": false, "pos": "Substantiv"}, "rücken": {"def": "Beleg 1: der Rücken = der hintere Teil des Körpers zwischen Nacken und Po. Beleg 2: rücken = etwas schweres von einem Ort zu einem anderen Ort bewegen oder schieben.", "example": "Sie hörte Schritte hinter ihrem Rücken. / Kannst du mir helfen, den Schrank zu rücken?", "is_phrase": false, "pos": "Substantiv / Verb"}, "sag": {"def": "Eine Aufforderung, endlich zu sprechen oder etwas zu erzählen, wenn jemand zögert oder schweigt. Man verwendet es, wenn man ungeduldig auf eine Antwort wartet.", "example": "Du wolltest mir etwas Wichtiges erzählen - sag schon, was ist passiert?", "is_phrase": true, "pos": "Redewendung"}, "schaff": {"def": "Umgangssprachlich für 'schaffen': etwas erfolgreich machen oder zu Ende bringen können. Wird oft verwendet, wenn man ausdrücken will, dass man keine Zeit hat oder etwas nicht möglich ist.", "example": "Ich schaff's nicht, vor 18 Uhr da zu sein.", "is_phrase": false, "pos": "Verb"}, "schafft": {"def": "Etwas mit großer Anstrengung oder Mühe erreichen oder tun, obwohl es schwer ist. Man kämpft gegen ein Problem und gewinnt.", "example": "Obwohl sie sehr müde war, schaffte sie es, die Prüfung zu bestehen.", "is_phrase": false, "pos": "Verb"}, "schale": {"def": "Ein rundes, offenes Gefäß, in das man Obst oder andere Lebensmittel hineinlegt. Sie ist meist aus Glas, Keramik oder Holz und steht oft auf dem Tisch.", "example": "Meine Mutter stellt jeden Morgen eine Schale mit frischen Äpfeln auf den Küchentisch.", "is_phrase": false, "pos": "Substantiv"}, "scheinen": {"def": "Es sieht so aus, als ob etwas passiert. Man hat den Eindruck, dass etwas der Fall ist.", "example": "Die Katzen scheinen müde zu sein, denn sie schlafen den ganzen Tag.", "is_phrase": false, "pos": "Verb"}, "scheiße": {"def": "Ein derbes Schimpfwort, das man sagt, wenn man ärgerlich oder unzufrieden ist. Man benutzt es, um Frust oder Wut auszudrücken.", "example": "Als er sah, dass der Bus schon weg war, rief er: 'Scheiße!'", "is_phrase": false, "pos": "Interjektion"}, "schiebt": {"def": "etwas mit Kraft von einem Ort zu einem anderen Ort bewegen, ohne es zu tragen oder zu heben. Man drückt oder stößt den Gegenstand über den Boden oder eine Fläche.", "example": "Er schiebt den schweren Tisch zur Seite, um mehr Platz zu schaffen.", "is_phrase": false, "pos": "Verb"}, "schienbein": {"def": "Der vordere Teil des Beins zwischen Knie und Fuß. Wenn man sich dort stößt, tut es sehr weh.", "example": "Er stieß sich das Schienbein an der Tischkante und humpelte vor Schmerz.", "is_phrase": false, "pos": "Substantiv"}, "schießen": {"def": "Wenn jemandem Tränen in die Augen schießen, kommen die Tränen sehr schnell und plötzlich. Die Person wird sehr emotional und muss weinen.", "example": "Als sie die traurige Nachricht hörte, schossen ihr sofort Tränen in die Augen.", "is_phrase": true, "pos": "Redewendung"}, "schimpft": {"def": "Sich über jemanden ärgern und schlecht über diese Person sprechen. Man kritisiert jemanden mit unfreundlichen Worten.", "example": "Der Chef schimpft über seinen Mitarbeiter, weil er schon wieder zu spät gekommen ist.", "is_phrase": false, "pos": "Verb"}, "schlafen": {"def": "Die Augen geschlossen haben und sich ausruhen, wie man es in der Nacht macht. Der Körper ist entspannt und man bewegt sich nicht.", "example": "Das Baby liegt ruhig im Bett und schläft tief.", "is_phrase": false, "pos": "Verb"}, "schlagen": {"def": "Das Herz schlägt bedeutet: Das Herz klopft sehr stark und schnell, weil man aufgeregt, nervös oder verängstigt ist. Man kann das Herzklopfen deutlich spüren.", "example": "Als sie auf der Bühne stand, konnte sie ihr Herz bis in den Hals schlagen spüren.", "is_phrase": true, "pos": "Redewendung"}, "schleppen": {"def": "etwas Schweres mit viel Kraft von einem Ort zum anderen tragen oder ziehen. Man benutzt das Wort, wenn das Tragen anstrengend ist.", "example": "Nach dem Umzug mussten wir stundenlang schwere Kisten die Treppe hinauf schleppen.", "is_phrase": false, "pos": "Verb"}, "schließt": {"def": "Eine Tür zumachen, sodass sie nicht mehr offen ist. Das Gegenteil von öffnen.", "example": "Er schließt das Fenster, weil es draußen kalt wird.", "is_phrase": false, "pos": "Verb"}, "schlimm": {"def": "sehr schlecht, sehr unangenehm oder problematisch. Man verwendet es, wenn eine Situation besonders schwierig oder belastend ist.", "example": "Die Verkehrssituation in der Stadt ist diesen Monat besonders schlimm.", "is_phrase": false, "pos": "Adjektiv"}, "schloss": {"def": "Der Teil an einer Tür, in den man den Schlüssel steckt, um die Tür zu öffnen oder zu schließen. Wenn eine Tür 'ins Schloss fällt', schließt sie sich automatisch.", "example": "Er steckte den Schlüssel ins Schloss und drehte ihn zweimal um.", "is_phrase": false, "pos": "Substantiv"}, "schlüssel": {"def": "Ein kleiner Gegenstand aus Metall, mit dem man Türen und Schlösser öffnen und schließen kann. Man steckt ihn ins Schloss und dreht ihn.", "example": "Ich habe meinen Schlüssel vergessen und kann nicht in die Wohnung.", "is_phrase": false, "pos": "Substantiv"}, "schmalen": {"def": "Nicht breit; mit wenig Breite. Etwas ist schmal, wenn es nur wenig Platz von einer Seite zur anderen hat.", "example": "Der schmale Weg zwischen den Häusern ist nur für Fußgänger geeignet.", "is_phrase": false, "pos": "Adjektiv"}, "schneewittchen": {"def": "Ein Spitzname oder Kosename für eine Person mit sehr heller, weißer Haut. Der Name kommt von der Märchenfigur Schneewittchen, die für ihre weiße Haut bekannt ist.", "example": "Die neue Schülerin war so blass, dass ihre Mitschüler sie scherzhaft Schneewittchen nannten.", "is_phrase": false, "pos": "Substantiv"}, "schneewittchenteint": {"def": "Eine sehr helle, blasse Hautfarbe, die so weiß ist wie bei der Märchenfigur Schneewittchen. Diese Beschreibung wird oft für Menschen mit sehr zarter, weißer Haut verwendet.", "example": "Das Mädchen hatte einen wunderschönen Schneewittchenteint und wirkte dadurch sehr zerbrechlich.", "is_phrase": false, "pos": "Substantiv"}, "schnell": {"def": "in kurzer Zeit, ohne lange zu warten oder zu brauchen", "example": "Die Lehrerin bringt den neuen Schüler schnell zu seinem Platz.", "is_phrase": false, "pos": "Adverb"}, "schulhaus": {"def": "Das Gebäude einer Schule, in dem der Unterricht stattfindet. Es hat normalerweise mehrere Stockwerke mit Klassenräumen, Fluren und anderen Räumen.", "example": "Die Schüler versammelten sich vor dem Schulhaus, bevor der Unterricht begann.", "is_phrase": false, "pos": "Substantiv"}, "schulklima": {"def": "Die Atmosphäre und Stimmung in einer Schule, wie sich Schüler und Lehrer dort fühlen und miteinander umgehen. Es beschreibt, ob die Schule ein angenehmer Ort zum Lernen ist.", "example": "Das Schulklima an unserer neuen Schule ist sehr freundlich - alle helfen sich gegenseitig.", "is_phrase": false, "pos": "Substantiv"}, "schwingenden": {"def": "Die Hüften bewegen sich rhythmisch von einer Seite zur anderen, während die Person geht. Das wirkt elegant und verführerisch.", "example": "Die Tänzerin ging mit schwingenden Hüften über die Bühne.", "is_phrase": false, "pos": "Adjektiv"}, "schüler": {"def": "Junge Menschen, die in die Schule gehen und dort lernen. Sie besuchen den Unterricht und werden von Lehrern unterrichtet.", "example": "In unserer Klasse sind 25 Schüler, die alle Deutsch lernen.", "is_phrase": false, "pos": "Substantiv"}, "sechs": {"def": "Die Zahl 6. Hier wahrscheinlich als kurze Antwort auf eine Frage nach einer Anzahl oder Nummer.", "example": "Wie viele Bücher hast du gelesen? Sechs.", "is_phrase": false, "pos": "Zahlwort"}, "seit": {"def": "zeigt an, ab welchem Zeitpunkt in der Vergangenheit etwas begonnen hat und bis jetzt noch andauert", "example": "Seit er in München wohnt, fährt er jeden Tag mit der U-Bahn zur Arbeit.", "is_phrase": false, "pos": "Konjunktion"}, "seite": {"def": "Der Teil des Körpers zwischen Arm und Hüfte, seitlich am Bauch. Man kann dort jemanden mit dem Ellbogen stoßen.", "example": "Der Mann stieß seine Frau in die Seite, um sie auf etwas aufmerksam zu machen.", "is_phrase": false, "pos": "Substantiv"}, "sekretärin": {"def": "Eine Frau, die in einer Schule im Büro arbeitet und administrative Aufgaben erledigt. Sie hilft Schülern, Lehrern und Eltern bei organisatorischen Fragen.", "example": "Die Sekretärin der Schule half mir dabei, mich für das neue Schuljahr anzumelden.", "is_phrase": false, "pos": "Substantiv"}, "setzen": {"def": "seinen Körper auf einen Stuhl, eine Bank oder einen anderen Platz bringen, um dort zu sitzen", "example": "Bitte setzen Sie sich auf diesen Stuhl hier am Fenster.", "is_phrase": false, "pos": "Verb"}, "setzt": {"def": "fortsetzen bedeutet: mit etwas weitermachen, das man schon angefangen hat. Hier geht die Person weiter, nachdem sie kurz gestoppt hat.", "example": "Nach einer kurzen Pause setzte der Wanderer seinen Weg zum Gipfel fort.", "is_phrase": true, "pos": "Verb"}, "seufzt": {"def": "Tief und hörbar ausatmen, um Trauer, Müdigkeit oder Enttäuschung zu zeigen.", "example": "Er seufzt laut, weil er so viel arbeiten muss.", "is_phrase": false, "pos": "Verb"}, "sicher": {"def": "Das Wort drückt aus, dass man ziemlich überzeugt ist, dass etwas wahr ist oder passieren wird. Es bedeutet 'wahrscheinlich' oder 'bestimmt'.", "example": "Sicher kommt Maria heute später, sie hatte einen wichtigen Termin.", "is_phrase": false, "pos": "Adverb"}, "siehst": {"def": "Du bemerkst oder erkennst etwas. Es bedeutet hier: Du kannst mit eigenen Augen feststellen, dass etwas so ist.", "example": "Du siehst doch, dass es draußen regnet - nimm einen Regenschirm mit!", "is_phrase": false, "pos": "Verb"}, "sitze": {"def": "Eine Position haben, bei der man auf einem Stuhl, einer Bank oder ähnlichem Platz genommen hat. Man befindet sich an einem bestimmten Ort in sitzender Haltung.", "example": "Im Restaurant sitze ich am Fenster und schaue den Leuten auf der Straße zu.", "is_phrase": false, "pos": "Verb"}, "sofort": {"def": "bedeutet: direkt danach, ohne zu warten. Es passiert in demselben Moment oder sehr schnell nach einer anderen Handlung.", "example": "Er öffnete die Tür, aber schloss sie sofort wieder, als er den Lärm hörte.", "is_phrase": false, "pos": "Adverb"}, "sogar": {"def": "Wird benutzt, um zu zeigen, dass etwas überraschend oder besonders stark ist. Es bedeutet 'auch noch' oder 'selbst'.", "example": "Das Restaurant war so voll, dass die Gäste sogar auf der Terrasse sitzen mussten.", "is_phrase": false, "pos": "Adverb"}, "soll": {"def": "Drückt aus, dass man fragt, ob es besser oder richtig wäre, wenn man selbst etwas macht. Man bietet an, etwas zu tun.", "example": "Wir haben kein Brot mehr. Soll ich einkaufen gehen?", "is_phrase": false, "pos": "Modalverb"}, "sollen": {"def": "Drückt aus, dass etwas in der Vergangenheit richtig oder besser gewesen wäre. Man bedauert, dass man es nicht gemacht hat.", "example": "Du hättest früher mit dem Lernen anfangen sollen, dann wäre die Prüfung leichter gewesen.", "is_phrase": false, "pos": "Modalverb"}, "spalt": {"def": "Eine sehr schmale Öffnung zwischen zwei Dingen, durch die man sich hindurchzwängen kann. Es ist ein enger Raum, der gerade breit genug ist, um hindurchzugehen.", "example": "Durch den kleinen Spalt in der Mauer konnte das Kind in den Garten schlüpfen.", "is_phrase": false, "pos": "Substantiv"}, "sport": {"def": "körperliche Bewegung und Übungen, die man macht, um fit zu bleiben oder um sich zu messen. Sport ist ein Schulfach, in dem man verschiedene Sportarten lernt.", "example": "In der Schule haben wir heute Sport, Deutsch und Geschichte.", "is_phrase": false, "pos": "Substantiv"}, "spürt": {"def": "Etwas körperlich wahrnehmen oder fühlen, besonders wenn es stark oder deutlich ist. Man merkt etwas im eigenen Körper.", "example": "Nach dem Marathon spürte sie jeden Muskel in ihren Beinen.", "is_phrase": false, "pos": "Verb"}, "stabheuschrecke": {"def": "Ein sehr dünnes Insekt mit langem, schmalem Körper. Wird als Vergleich benutzt, um zu sagen, dass eine Person sehr dünn ist.", "example": "Der Junge war so dünn wie eine Stabheuschrecke und musste mehr essen.", "is_phrase": false, "pos": "Substantiv"}, "stahlseile": {"def": "Sehr dicke und starke Seile aus Metall. In diesem Text bedeutet es: Die Muskeln sind sehr hart und angespannt, wie starke Metallseile.", "example": "Nach dem harten Training fühlten sich seine Armmuskeln an wie Stahlseile.", "is_phrase": false, "pos": "Substantiv"}, "starrt": {"def": "Jemanden oder etwas sehr intensiv und ohne zu blinzeln anschauen. Man macht das oft, wenn man überrascht, wütend oder nachdenklich ist.", "example": "Der Mann starrt aus dem Fenster und denkt an seine Probleme.", "is_phrase": false, "pos": "Verb"}, "steckst": {"def": "umgangssprachlich für: wo bist du? / wo befindest du dich? Man fragt so, wenn man jemanden sucht oder lange nicht gesehen hat.", "example": "Ich habe dich überall gesucht - wo steckst du denn?", "is_phrase": false, "pos": "Verb"}, "stehen": {"def": "Sich nicht bewegen und an einem Ort bleiben. Man hört auf zu gehen und bleibt dort, wo man ist.", "example": "Der Bus kommt gleich, deshalb bleibe ich hier an der Haltestelle stehen.", "is_phrase": false, "pos": "Verb"}, "steht": {"def": "sich an einem Ort befinden, dort platziert sein. Das Verb beschreibt die Position von Gegenständen.", "example": "Auf dem Regal steht ein dickes Buch.", "is_phrase": false, "pos": "Verb"}, "stellt": {"def": "etwas an einen bestimmten Platz oder Ort bringen und dort hinlegen oder hinstehen lassen", "example": "Nach dem Telefonat stellt er den Hörer zurück auf die Station.", "is_phrase": false, "pos": "Verb"}, "stimme": {"def": "Die Laute, die aus dem Mund kommen, wenn eine Person spricht. Man hört die Stimme, wenn jemand redet.", "example": "Ich erkenne dich an deiner Stimme, auch wenn ich dich nicht sehe.", "is_phrase": false, "pos": "Substantiv"}, "streift": {"def": "etwas berührt kurz und leicht eine Körperstelle, ohne stark zu treffen oder zu verletzen", "example": "Der Ball streift meinen Arm, als er vorbeifliegt.", "is_phrase": false, "pos": "Verb"}, "studiogestählten": {"def": "Beschreibt Arme oder Muskeln, die durch Training im Fitnessstudio sehr stark und muskulös geworden sind. Die Person hat viel Sport gemacht und ihre Armmuskeln sind deutlich sichtbar.", "example": "Nach zwei Jahren regelmäßigem Training hatte er studiogestählte Oberarme, die durch das T-Shirt zu sehen waren.", "is_phrase": false, "pos": "Adjektiv"}, "stufen": {"def": "Die einzelnen Tritte einer Treppe, auf die man den Fuß setzt, um nach oben oder unten zu gehen.", "example": "Die Stufen der alten Holztreppe knarren bei jedem Schritt.", "is_phrase": false, "pos": "Substantiv"}, "stuhl": {"def": "Ein Möbelstück zum Sitzen mit einer Rückenlehne und meist vier Beinen. Man kann darauf sitzen und sich anlehnen.", "example": "Sie setzte sich auf den Stuhl am Schreibtisch und begann zu arbeiten.", "is_phrase": false, "pos": "Substantiv"}, "stärkung": {"def": "Essen oder Trinken, das man zu sich nimmt, um wieder Kraft und Energie zu bekommen. Man braucht das besonders, wenn man müde, schwach oder erschöpft ist.", "example": "Nach dem langen Spaziergang gönnte sich Maria eine kleine Stärkung mit Kaffee und Kuchen.", "is_phrase": false, "pos": "Substantiv"}, "telefon": {"def": "Ein Gerät, mit dem man andere Personen anrufen kann. Man kann damit sprechen, auch wenn die andere Person weit weg ist.", "example": "Als das Telefon klingelte, nahm er schnell den Hörer ab.", "is_phrase": false, "pos": "Substantiv"}, "termine": {"def": "Vereinbarte Zeiten, zu denen Patienten zum Arzt kommen sollen. In einer Arztpraxis werden diese Zeiten vorher festgelegt und aufgeschrieben.", "example": "Die Sprechstundenhilfe hat heute drei Termine für neue Patienten vergeben.", "is_phrase": false, "pos": "Substantiv"}, "thiel": {"def": "Ein Familienname einer Person. Hier ist es der Nachname von einer Frau.", "example": "Herr Müller und Frau Schmidt begrüßten die Gäste.", "is_phrase": false, "pos": "Eigenname"}, "tippt": {"def": "Mit den Fingern auf eine Tastatur drücken, um Text zu schreiben. Man macht das am Computer, Handy oder Tablet.", "example": "Lisa tippt schnell eine Nachricht an ihre Freundin.", "is_phrase": false, "pos": "Verb"}, "tisch": {"def": "Ein Möbelstück mit einer flachen Oberfläche, das auf Beinen steht. Man kann Gegenstände darauf stellen oder daran sitzen und essen.", "example": "Die Familie sitzt am Tisch und isst gemeinsam zu Abend.", "is_phrase": false, "pos": "Substantiv"}, "titten": {"def": "Ein vulgärer, umgangssprachlicher Ausdruck für die weibliche Brust. Das Wort wird oft von jungen Männern verwendet, um auf eine sexuell erregende Weise über Frauen zu sprechen.", "example": "Die Jugendlichen machten anzügliche Kommentare über die Frau am Strand.", "is_phrase": false, "pos": "Substantiv"}, "tolles": {"def": "sehr gut, ausgezeichnet, wunderbar (wird verwendet, um etwas sehr positiv zu beschreiben)", "example": "Das Restaurant hat tolles Essen und freundliche Bedienung.", "is_phrase": false, "pos": "Adjektiv"}, "tresen": {"def": "Eine hohe Theke oder ein Tisch, hinter dem jemand arbeitet, zum Beispiel in einem Büro oder Geschäft. Man steht normalerweise davor, wenn man mit der Person sprechen möchte.", "example": "Der Kunde wartete vor dem Tresen, bis die Verkäuferin ihm helfen konnte.", "is_phrase": false, "pos": "Substantiv"}, "trippelt": {"def": "Mit kleinen, schnellen, leichten Schritten gehen oder laufen. Man macht dabei viele kurze Schritte hintereinander.", "example": "Das kleine Mädchen trippelt aufgeregt zur Haustür, als es die Eltern kommen hört.", "is_phrase": false, "pos": "Verb"}, "trotzdem": {"def": "Obwohl etwas anderes dagegen spricht oder es schwierig ist, passiert etwas doch. Man verwendet es, wenn man zeigen will, dass etwas gegen alle Erwartungen oder Probleme trotz allem geschieht.", "example": "Es regnete sehr stark, aber wir sind trotzdem spazieren gegangen.", "is_phrase": false, "pos": "Adverb"}, "tränen": {"def": "Salzige Flüssigkeit, die aus den Augen kommt, wenn man weint. Sie entstehen, wenn man traurig, glücklich oder emotional bewegt ist.", "example": "Als sie die gute Nachricht hörte, kamen ihr Tränen der Freude.", "is_phrase": false, "pos": "Substantiv"}, "typ": {"def": "Eine umgangssprachliche Bezeichnung für einen Mann oder eine Person. Wird oft verwendet, wenn man jemanden nicht näher kennt oder nicht respektvoll über ihn spricht.", "example": "Der Typ da drüben starrt uns schon die ganze Zeit an.", "is_phrase": false, "pos": "Substantiv"}, "typen": {"def": "Umgangssprachliches Wort für Männer oder Jungen, oft mit negativer Bedeutung. Wird verwendet, wenn man die Personen nicht mag oder ihr Verhalten schlecht findet.", "example": "Diese Typen haben den ganzen Abend nur dumme Witze gemacht.", "is_phrase": false, "pos": "Substantiv"}, "tür": {"def": "Ein bewegliches Teil aus Holz, Metall oder anderem Material, das einen Raum verschließt. Man kann sie öffnen und schließen, um in einen Raum hineinzugehen oder herauszukommen.", "example": "Er klopfte an die Tür und wartete auf eine Antwort.", "is_phrase": false, "pos": "Substantiv"}, "umfunktionieren": {"def": "Einen Raum oder Gegenstand für einen anderen Zweck benutzen als ursprünglich geplant. Man ändert die Funktion von etwas, damit es eine neue Aufgabe erfüllt.", "example": "Das alte Lagerhaus wurde zu
