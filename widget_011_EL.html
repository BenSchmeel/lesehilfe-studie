<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --tooltip-bg:#2c2420;--tooltip-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}
  .wrap{max-width:780px;margin:0 auto;padding:28px 24px 60px}
  .hint{font-size:.82rem;color:var(--ink-soft);margin-bottom:18px;padding:10px 14px;
        background:var(--accent-light);border-radius:4px;border-left:3px solid var(--accent)}
  .text-box{background:white;border:1px solid var(--border);border-radius:4px;
            padding:36px 40px;line-height:2.05;font-family:'Lora',serif;
            font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .w{cursor:pointer;border-bottom:1px dotted var(--accent);border-radius:2px;
     padding:0 1px;transition:background .15s;display:inline}
  .w:hover{background:var(--accent-light)}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent)}
  .w.phrase{border-bottom:2px dashed #b07d50}
  .w.phrase:hover{background:#f5e8d5}
  .w.phrase.seen{border-bottom-color:#c9956a}
  .tip{position:fixed;background:var(--tooltip-bg);color:var(--tooltip-text);
       border-radius:8px;padding:15px 18px;max-width:320px;min-width:200px;
       font-family:'Source Sans 3',sans-serif;font-size:.88rem;line-height:1.65;
       box-shadow:0 8px 32px rgba(0,0,0,.28);z-index:9999;pointer-events:none;
       opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
  .tip.on{opacity:1;transform:translateY(0)}
  .tip-arr{position:absolute;width:0;height:0;
           border-left:7px solid transparent;border-right:7px solid transparent;
           border-top:7px solid var(--tooltip-bg);bottom:-7px;
           left:50%;transform:translateX(-50%)}
  .tw{font-weight:600;font-size:.96rem;color:#f0d9b8;display:block;
      margin-bottom:3px;font-family:'Lora',serif}
  .tpos{font-size:.72rem;color:#9e8a78;text-transform:uppercase;
        letter-spacing:.06em;display:block;margin-bottom:7px}
  .tdef{color:#d4c9be}
  .tex{margin-top:9px;font-style:italic;font-size:.82rem;color:#8a7a6e;
       border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
  .tphrase{display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
           border-radius:3px;padding:1px 6px;margin-bottom:5px;letter-spacing:.04em}
  .legend{margin-top:14px;display:flex;gap:20px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft)}
  .leg-item{display:flex;align-items:center;gap:6px}
  @media(max-width:600px){.text-box{padding:20px 16px;font-size:.97rem}}
</style>
</head>
<body>

  <div class="hint">
    Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> fuer eine Erklaerung.

    <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 4px">Wort</span>&nbsp;erklärtes Wort</span>

    <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 4px">farbig</span>&nbsp;bereits nachgeschlagen</span>
  </div>
</div>

</div>
<script>
const DICT = {"abend": {"def": "Die Zeit am Ende des Tages, wenn es dunkel wird. Meistens zwischen 18 und 22 Uhr.", "example": "Am Abend schauen wir oft zusammen fern.", "is_phrase": false, "pos": "Substantiv"}, "anfangen": {"def": "etwas beginnen oder starten. Man macht den ersten Schritt bei einer Aktivität.", "example": "Um 8 Uhr fängt die Lehrerin mit der ersten Stunde an.", "is_phrase": false, "pos": "Verb"}, "angegriffen": {"def": "Das Gefühl haben, dass jemand etwas Böses oder Unfreundliches zu einem sagt oder macht. Man fühlt sich schlecht behandelt oder beleidigt.", "example": "Als er sagte, ich sei zu langsam, fühlte ich mich angegriffen.", "is_phrase": false, "pos": "Adjektiv"}, "anruf-beantworter": {"def": "Ein Gerät, das Telefonnachrichten aufnimmt, wenn niemand ans Telefon geht. Die Nachrichten kann man später anhören.", "example": "Ich war nicht zu Hause, deshalb hat mein Freund eine Nachricht auf den Anrufbeantworter gesprochen.", "is_phrase": false, "pos": "Substantiv"}, "anruft": {"def": "Mit dem Telefon oder Handy Kontakt zu einer Person aufnehmen. Man wählt die Nummer und spricht dann mit der Person.", "example": "Ich rufe meine Mutter jeden Sonntag an, um zu hören, wie es ihr geht.", "is_phrase": false, "pos": "Verb"}, "apfel": {"def": "Eine runde Frucht, die an Bäumen wächst und oft rot, grün oder gelb ist. Man kann sie roh essen oder zum Kochen verwenden.", "example": "Ich esse jeden Tag einen Apfel, weil er gesund ist.", "is_phrase": false, "pos": "Substantiv"}, "april": {"def": "Der vierte Monat des Jahres, zwischen März und Mai. In diesem Monat beginnt oft der Frühling.", "example": "Im April blühen die ersten Blumen im Garten.", "is_phrase": false, "pos": "Substantiv"}, "arbeiten": {"def": "Eine berufliche Tätigkeit ausüben, um Geld zu verdienen. Man geht zu seinem Arbeitsplatz und macht dort seine Aufgaben.", "example": "Mein Bruder arbeitet in einer Bank und ist jeden Tag von 9 bis 17 Uhr dort.", "is_phrase": false, "pos": "Verb"}, "arbeitet": {"def": "eine berufliche Tätigkeit ausüben, seinen Job machen. Man bekommt dafür normalerweise Geld.", "example": "Meine Schwester arbeitet als Lehrerin in einer Grundschule.", "is_phrase": false, "pos": "Verb"}, "augen": {"def": "Jemanden sehr intensiv und auf eine sexuelle Art anschauen. Man starrt die Person an, als würde man sie nackt sehen wollen.", "example": "Der Mann an der Bar hat sie die ganze Zeit mit den Augen ausgezogen, das war sehr unangenehm.", "is_phrase": true, "pos": "Redewendung"}, "ausland": {"def": "Alle anderen Länder außer dem eigenen Land. Ein Ort, der nicht in Deutschland ist, wenn man aus Deutschland kommt.", "example": "Meine Schwester studiert im Ausland und kommt nur in den Ferien nach Hause.", "is_phrase": false, "pos": "Substantiv"}, "aussieht": {"def": "Das äußere Erscheinungsbild haben; so wirken oder erscheinen, als ob man eine bestimmte Person wäre. Man beschreibt damit, wie jemand optisch auf andere Menschen wirkt.", "example": "Meine neue Kollegin sieht aus wie eine berühmte Schauspielerin.", "is_phrase": false, "pos": "Verb"}, "ausziehen": {"def": "Jemanden sehr intensiv und auf eine sexuelle Art anschauen. Man stellt sich dabei vor, die Person wäre ohne Kleidung.", "example": "Der Mann an der Bar hat sie die ganze Zeit mit den Augen ausgezogen, das war sehr unangenehm für sie.", "is_phrase": true, "pos": "Redewendung"}, "banane": {"def": "Eine gelbe, längliche Frucht, die man schält und roh isst. Sie wächst an Bäumen in warmen Ländern.", "example": "Zum Frühstück esse ich oft eine Banane mit Joghurt.", "is_phrase": false, "pos": "Substantiv"}, "beiden": {"def": "Das Wort zeigt auf zwei Personen, die vorher erwähnt wurden. Es bedeutet: die zwei zusammen.", "example": "Ich habe zwei Freunde getroffen. Einer von beiden war sehr müde.", "is_phrase": false, "pos": "Pronomen"}, "beschissen": {"def": "Ein umgangssprachliches Wort, das bedeutet, dass etwas sehr schlecht, unangenehm oder ärgerlich ist. Man benutzt es, wenn man mit einer Situation unzufrieden ist.", "example": "Das Wetter heute ist echt beschissen - es regnet den ganzen Tag.", "is_phrase": false, "pos": "Adjektiv"}, "besonders": {"def": "wird verwendet, um zu sagen, dass etwas in sehr hohem Maß oder außergewöhnlich stark der Fall ist. Es macht die Aussage stärker.", "example": "Der neue Kollege ist besonders hilfsbereit und unterstützt alle.", "is_phrase": false, "pos": "Adverb"}, "bestimmt": {"def": "Drückt aus, dass man sich sehr sicher ist, dass etwas passiert oder wahr ist. Man verwendet es, wenn man eine starke Vermutung hat.", "example": "Es regnet draußen - bestimmt haben viele Leute ihre Regenschirme vergessen.", "is_phrase": false, "pos": "Adverb"}, "betritt": {"def": "in einen Raum hineingehen. Man geht durch die Tür und ist dann im Raum.", "example": "Der Lehrer betritt das Klassenzimmer und begrüßt die Schüler.", "is_phrase": false, "pos": "Verb"}, "bitte": {"def": "Ein Wort, das man sagt, wenn man höflich um etwas bittet oder jemanden freundlich auffordert. Es macht eine Bitte oder Aufforderung weniger hart und respektvoller.", "example": "Kannst du bitte das Fenster öffnen?", "is_phrase": false, "pos": "Adverb"}, "bleiben": {"def": "Bedeutet: nicht weitergehen, an einem Ort stoppen und dort stehen. Man hört auf zu laufen oder zu gehen.", "example": "Als sie die laute Musik hörte, blieb sie sofort stehen und schaute zurück.", "is_phrase": true, "pos": "Redewendung"}, "blondine": {"def": "Eine Frau oder ein Mädchen mit blonden Haaren. Das Wort wird hier verwendet, um eine Person in einer Gruppe zu beschreiben.", "example": "Die Blondine am Nachbartisch lachte laut über den Witz.", "is_phrase": false, "pos": "Substantiv"}, "blondinen": {"def": "Frauen mit blonden Haaren. Das Wort wird für Personen weiblichen Geschlechts verwendet, die helle, gelbe Haarfarbe haben.", "example": "In der Cafeteria saßen drei Blondinen am Fensterplatz und tranken Kaffee.", "is_phrase": false, "pos": "Substantiv"}, "braucht": {"def": "nötig haben, benötigen. Man verwendet es, wenn jemand etwas haben muss oder etwas für sich wichtig ist.", "example": "Nach dem langen Spaziergang braucht er eine Pause.", "is_phrase": false, "pos": "Verb"}, "bringt": {"def": "Eine Person zu einem bestimmten Ort führen oder begleiten. Die Sekretärin geht mit Nadja zum Keller und zeigt ihr den Weg.", "example": "Der Vater bringt sein Kind jeden Morgen zur Schule.", "is_phrase": false, "pos": "Verb"}, "computer": {"def": "Eine elektronische Maschine, mit der man arbeiten, spielen oder im Internet surfen kann. Man kann sie ein- und ausschalten.", "example": "Ich brauche meinen Computer für die Hausaufgaben.", "is_phrase": false, "pos": "Substantiv"}, "dicke": {"def": "Dick bedeutet hier: sehr groß und schwer, mit viel Körpergewicht. In Beleg 1 wird das Wort als Substantiv verwendet und bezeichnet eine Person mit viel Körpergewicht.", "example": "Er hat dicke Arme vom vielen Training im Fitnessstudio.", "is_phrase": false, "pos": "Adjektiv"}, "dorthin": {"def": "An den Ort, zu dem Platz, der gezeigt oder gemeint wird. Man benutzt es, wenn man eine Richtung zu einem bestimmten Ziel ausdrückt.", "example": "Der Lehrer zeigt auf die Tafel und sagt: 'Geh dorthin und schreib die Lösung auf.'", "is_phrase": false, "pos": "Adverb"}, "drei": {"def": "Die Zahl 3, hier verwendet als Kurzform für 'drei Personen'. Man sagt nur die Zahl, wenn aus dem Kontext klar ist, was gemeint ist.", "example": "Wie viele Leute kommen heute? - Vier.", "is_phrase": false, "pos": "Substantiv"}, "dritte": {"def": "Das Adjektiv zeigt an, dass etwas an Position drei in einer Reihenfolge steht. Hier bedeutet es, dass es bereits zwei andere Nachrichten vor dieser gab.", "example": "Das dritte Auto in der Schlange ist rot.", "is_phrase": false, "pos": "Adjektiv"}, "echt": {"def": "Ausdruck der Überraschung oder des Zweifels. Man sagt das, wenn man nicht glauben kann, was man gerade gehört hat.", "example": "Echt? Du hast im Lotto gewonnen?", "is_phrase": false, "pos": "Adverb"}, "eigentlich": {"def": "wird verwendet, um eine Aussage zu korrigieren oder genauer zu machen. Es bedeutet hier 'um genau zu sein' oder 'wenn man es richtig betrachtet'.", "example": "Ich dachte, alle schauen mich an, aber eigentlich waren es nur zwei Personen.", "is_phrase": false, "pos": "Adverb"}, "einmal": {"def": "Diese Phrase bedeutet 'als erstes' oder 'zuerst'. Man benutzt sie, um zu sagen, was vor allem anderen passieren soll.", "example": "Erst einmal muss ich meine Hausaufgaben machen, dann kann ich spielen.", "is_phrase": true, "pos": "Redewendung"}, "einzutragen": {"def": "etwas in einen Kalender, eine Liste oder ein Buch schreiben, damit man es nicht vergisst", "example": "Ich muss den Arzttermin schnell in meinen Kalender eintragen.", "is_phrase": false, "pos": "Verb"}, "elefantenkuh": {"def": "Ein abwertender Ausdruck für eine Frau, die sich sehr dick und unattraktiv fühlt. Das Wort wird verwendet, um zu sagen, dass man sich neben einer anderen Person besonders groß und schwer vorkommt.", "example": "Nach den Feiertagen fühlte sie sich wie eine Elefantenkuh in ihrem engen Kleid.", "is_phrase": false, "pos": "Substantiv"}, "ellbogen": {"def": "Mit dem Ellbogen (dem Gelenk zwischen Oberarm und Unterarm) eine andere Person anstoßen oder schubsen. Das macht man oft, um jemanden auf etwas aufmerksam zu machen oder um zu zeigen, dass man unhöflich ist.", "example": "Der Mann ellbogت seine Freundin und zeigte auf das teure Auto.", "is_phrase": false, "pos": "Redewendung"}, "ellie": {"def": "Ein weiblicher Vorname. In diesem Text ist Ellie eine Person, die Nachrichten schreibt und mit der Hauptperson telefonieren möchte.", "example": "Meine Freundin Ellie hat mir heute eine WhatsApp-Nachricht geschickt.", "is_phrase": false, "pos": "Eigenname"}, "entdeckt": {"def": "etwas oder jemanden sehen und bemerken, oft zum ersten Mal oder unerwartet", "example": "Als ich ins Café kam, entdeckte ich meinen alten Freund am Fensterplatz.", "is_phrase": false, "pos": "Verb"}, "erst": {"def": "Diese Phrase bedeutet: als erstes, zuerst, bevor andere Dinge passieren. Man benutzt sie, um zu sagen, dass etwas der erste Schritt ist.", "example": "Erst einmal müssen wir einkaufen gehen, dann können wir kochen.", "is_phrase": true, "pos": "Redewendung"}, "erste": {"def": "Das Wort zeigt an, dass diese Nachricht vor allen anderen Nachrichten kommt. Es ist die Nachricht, die man zuerst liest oder hört.", "example": "Als Tom sein Handy anmacht, liest er die erste E-Mail in seinem Postfach.", "is_phrase": false, "pos": "Adjektiv"}, "ersten": {"def": "Die Reihe, die ganz vorne ist, am nächsten zur Bühne oder zum wichtigsten Platz. Es ist die Reihe Nummer eins von vorne gezählt.", "example": "Im Theater wollen alle in der ersten Reihe sitzen, weil man dort am besten sehen kann.", "is_phrase": false, "pos": "Adjektiv"}, "erster": {"def": "Der Anfang von etwas; der Tag, an dem etwas zum ersten Mal passiert oder beginnt. Es bedeutet, dass es noch nie vorher so war.", "example": "Morgen ist mein erster Arbeitstag in der neuen Firma.", "is_phrase": false, "pos": "Adjektiv"}, "fast": {"def": "bedeutet beinahe oder sehr nahe daran, dass etwas passiert. Es drückt aus, dass etwas sehr wahrscheinlich oder sehr stark ist, aber nicht ganz.", "example": "Der Koffer ist so schwer, dass ich ihn fast nicht tragen kann.", "is_phrase": false, "pos": "Adverb"}, "flur": {"def": "Ein langer, schmaler Raum in einer Wohnung oder einem Haus, durch den man zu anderen Zimmern geht. Man nennt ihn auch Gang oder Korridor.", "example": "Im Flur hängen unsere Jacken an der Garderobe.", "is_phrase": false, "pos": "Substantiv"}, "frau": {"def": "Höfliche Anrede für eine erwachsene weibliche Person, besonders wenn man ihren Nachnamen dazu sagt. Man benutzt es, um respektvoll mit einer Lehrerin, Ärztin oder anderen Frau zu sprechen.", "example": "Frau Schmidt ist unsere neue Direktorin und sehr freundlich.", "is_phrase": false, "pos": "Substantiv"}, "frei": {"def": "nicht besetzt, nicht von einer Person belegt. Man kann sich dort hinsetzen oder hinlegen.", "example": "Der Stuhl am Fenster ist noch frei, du kannst dich dort hinsetzen.", "is_phrase": false, "pos": "Adjektiv"}, "freien": {"def": "Ein Platz ist frei, wenn dort niemand sitzt oder steht. Man kann sich dort hinsetzen oder hinstellen.", "example": "In der U-Bahn war nur noch ein freier Sitzplatz da.", "is_phrase": false, "pos": "Adjektiv"}, "fährt": {"def": "Den Computer anschalten und starten, so dass er bereit zum Arbeiten ist. Man drückt den Startknopf und wartet, bis alle Programme geladen sind.", "example": "Morgens fährt er als Erstes seinen Laptop hoch, um seine E-Mails zu lesen.", "is_phrase": true, "pos": "Redewendung"}, "fängt": {"def": "Diese Phrase bedeutet: etwas beginnen zu tun. Man benutzt sie, wenn jemand mit einer Aktivität oder einem Verhalten startet.", "example": "Als der Film zu Ende war, fing das Publikum an zu klatschen.", "is_phrase": true, "pos": "Redewendung"}, "fühlt": {"def": "Wenn man sich angegriffen fühlt, bedeutet das: Man hat das Gefühl, dass jemand etwas Böses oder Verletzendes zu einem gesagt oder getan hat. Man ist deshalb traurig, wütend oder gekränkt.", "example": "Als ihr Kollege sagte, ihre Arbeit sei schlecht, fühlte sie sich angegriffen.", "is_phrase": true, "pos": "Redewendung"}, "fünf": {"def": "Die Zahl 5. Wird hier als kurze Antwort oder Aussage verwendet.", "example": "Wie viele Personen kommen mit? - Fünf.", "is_phrase": false, "pos": "Zahlwort"}, "für": {"def": "Ein Ausruf, der Bewunderung oder Überraschung ausdrückt. Man benutzt es, um zu sagen, dass etwas sehr beeindruckend oder außergewöhnlich ist.", "example": "Was für ein tolles Auto! Das möchte ich auch haben.", "is_phrase": true, "pos": "Redewendung"}, "geh": {"def": "sich von einem Ort zu einem anderen Ort bewegen, zu Fuß von hier nach dort laufen", "example": "Nach der Pause gehen alle Schüler zurück in ihre Klassenzimmer.", "is_phrase": false, "pos": "Verb"}, "geplant": {"def": "so wie man es vorher überlegt und festgelegt hatte; zur geplanten Zeit bedeutet zu der Zeit, die man vorher bestimmt hat", "example": "Das Meeting dauerte länger als geplant, deshalb kam ich zu spät nach Hause.", "is_phrase": false, "pos": "Adjektiv"}, "gerade": {"def": "In diesem Moment, jetzt. Es zeigt, dass etwas zur aktuellen Zeit passiert.", "example": "Ich kann nicht telefonieren, ich esse gerade zu Mittag.", "is_phrase": false, "pos": "Adverb"}, "geschrieben": {"def": "Eine Nachricht oder einen Text mit dem Computer oder Handy getippt und gesendet haben. Man benutzt es für E-Mails, SMS oder Chat-Nachrichten.", "example": "Tim hat seiner Freundin geschrieben, dass er später kommt.", "is_phrase": false, "pos": "Verb"}, "gesicht": {"def": "Der vordere Teil vom Kopf eines Menschen, wo Augen, Nase und Mund sind. Hier wird beschrieben, wie das Gesicht aussieht - es ist rund.", "example": "Sie hat ein schmales Gesicht mit hohen Wangenknochen.", "is_phrase": false, "pos": "Substantiv"}, "gleich": {"def": "sofort, direkt beim ersten Blick. Es bedeutet, dass etwas ohne Verzögerung passiert oder bemerkt wird.", "example": "Als ich das Café betrete, sehe ich gleich meinen besten Freund am Fenster sitzen.", "is_phrase": false, "pos": "Adverb"}, "glotzen": {"def": "Jemanden oder etwas sehr intensiv und oft unhöflich anstarren. Man schaut dabei sehr direkt und lange hin.", "example": "Die Leute glotzten neugierig zu dem Unfall hinüber.", "is_phrase": false, "pos": "Verb"}, "guten": {"def": "Höfliche Begrüßung am Morgen. Man sagt das, wenn man sich am Morgen trifft.", "example": "Guten Morgen! Wie geht es dir heute?", "is_phrase": true, "pos": "Adjektiv"}, "haaren": {"def": "Die dünnen Fäden, die auf dem Kopf von Menschen wachsen. Sie können verschiedene Farben haben, wie blond, braun, schwarz oder rot.", "example": "Meine Schwester hat lange schwarze Haare und trägt sie gerne offen.", "is_phrase": false, "pos": "Substantiv"}, "hallo": {"def": "Ein freundlicher Gruß, den man am Anfang eines Gesprächs oder einer Nachricht sagt. Man benutzt es, um jemanden anzusprechen.", "example": "Hallo Peter, wie geht es dir heute?", "is_phrase": false, "pos": "Interjektion"}, "hand": {"def": "Der Körperteil am Ende des Arms mit fünf Fingern. Man benutzt die Hand zum Greifen, Schreiben oder zur Begrüßung.", "example": "Der Arzt gibt dem Patienten die Hand und stellt sich vor.", "is_phrase": false, "pos": "Substantiv"}, "hause": {"def": "bedeutet: in der eigenen Wohnung oder im eigenen Haus. Man benutzt diese Wendung, wenn man über den Ort spricht, wo man wohnt.", "example": "Nach der langen Reise war Maria froh, endlich wieder zu Hause zu sein.", "is_phrase": true, "pos": "Redewendung"}, "haustür": {"def": "Die Tür, durch die man in ein Haus oder Wohngebäude hineingeht. Sie ist der Haupteingang vom Außenbereich in das Gebäude.", "example": "Er klingelte an der Haustür und wartete, bis jemand öffnete.", "is_phrase": false, "pos": "Substantiv"}, "heißt": {"def": "Das heißt verwendet man, um etwas genauer zu erklären oder zu korrigieren. Man sagt es, wenn man seine Aussage präziser machen möchte.", "example": "Alle waren da – das heißt, fast alle, nur Maria fehlte noch.", "is_phrase": true, "pos": "Redewendung"}, "helferin": {"def": "Eine Frau, die anderen Menschen bei einer Aufgabe oder Arbeit hilft und sie unterstützt. Sie arbeitet meist freiwillig oder gegen wenig Geld.", "example": "Die Helferin im Kindergarten spielt mit den Kindern und hilft der Erzieherin.", "is_phrase": false, "pos": "Substantiv"}, "helferinnen": {"def": "Frauen, die in einer Arztpraxis arbeiten und dem Arzt bei seiner Arbeit helfen. Sie machen zum Beispiel Termine, bereiten Behandlungen vor oder assistieren bei Untersuchungen.", "example": "Die Helferinnen in der Hausarztpraxis sind sehr freundlich und erklären mir immer genau, was ich machen muss.", "is_phrase": false, "pos": "Substantiv"}, "heute": {"def": "An diesem Tag, an dem wir gerade sind. Das Wort bedeutet: jetzt, am heutigen Tag.", "example": "Heute regnet es sehr stark, deshalb bleibe ich zu Hause.", "is_phrase": false, "pos": "Adverb"}, "hoch": {"def": "Den Computer anschalten und starten, so dass er bereit ist zum Arbeiten. Man sagt auch 'hochfahren'.", "example": "Ich fahre meinen Laptop hoch, um meine E-Mails zu lesen.", "is_phrase": true, "pos": "Redewendung"}, "hört": {"def": "Mit einem Stethoskop die Lunge oder das Herz einer Person untersuchen. Ein Arzt macht das, um zu prüfen, ob alles gesund ist.", "example": "Der Arzt hört den Patienten ab und stellt fest, dass die Lunge frei ist.", "is_phrase": true, "pos": "Verb"}, "jennifer": {"def": "Ein weiblicher Vorname. Eine Person mit diesem Namen.", "example": "Jennifer ist meine Nachbarin und arbeitet als Lehrerin.", "is_phrase": false, "pos": "Eigenname"}, "kartons": {"def": "Große Schachteln aus Pappe, die man zum Verpacken und Transportieren von Gegenständen verwendet. Oft stehen viele Kartons im Flur, wenn jemand umzieht oder viele Sachen lagert.", "example": "Nach dem Umzug stapelten sich die Kartons im Wohnzimmer, bis wir alles ausgepackt hatten.", "is_phrase": false, "pos": "Substantiv"}, "kaum": {"def": "fast nicht, sehr wenig. Es bedeutet, dass etwas nur in sehr geringem Maß möglich ist.", "example": "Der Text ist so klein geschrieben, dass ich ihn kaum lesen kann.", "is_phrase": false, "pos": "Adverb"}, "keller": {"def": "Ein Raum unter der Erde in einem Gebäude. Oft werden dort Dinge aufbewahrt oder es gibt dort zusätzliche Räume.", "example": "Die Bibliothek hat ihre alten Bücher im Keller gelagert.", "is_phrase": false, "pos": "Substantiv"}, "kichern": {"def": "Leise und heimlich lachen, oft wenn man sich über jemanden lustig macht oder etwas gemein findet. Man lacht dabei nicht laut, sondern macht nur kleine, schnelle Laute.", "example": "Die Schüler kicherten, als der Lehrer einen Fleck auf seinem Hemd hatte.", "is_phrase": false, "pos": "Verb"}, "kichert": {"def": "Leise und hoch lachen, oft weil man etwas lustig oder peinlich findet. Man macht dabei kleine, schnelle Lachgeräusche.", "example": "Die Schüler kicherten, als der Lehrer einen Fehler an der Tafel machte.", "is_phrase": false, "pos": "Verb"}, "klasse": {"def": "Eine Gruppe von Menschen, die zusammengehören oder ähnliche Eigenschaften haben. Hier bedeutet es eine bestimmte Sorte oder Art von Personen.", "example": "In diesem Fitnessstudio trainiert eine ganz besondere Klasse von Sportlern.", "is_phrase": false, "pos": "Substantiv"}, "klassenraum": {"def": "Ein Raum in der Schule, wo die Schüler einer Klasse Unterricht haben. Dort stehen Tische, Stühle und eine Tafel.", "example": "Die Lehrerin wartet schon im Klassenraum auf ihre Schüler.", "is_phrase": false, "pos": "Substantiv"}, "langsam": {"def": "nicht schnell, mit wenig Tempo. Hier beschreibt es, wie die Person geht - sie hat keine Eile und bewegt sich ruhig.", "example": "Nach der Pause gingen die Schüler langsam zurück in die Klasse.", "is_phrase": false, "pos": "Adverb"}, "lauter": {"def": "bedeutet \"nur\" oder \"ausschließlich\" - alle Personen oder Dinge sind gleich. Man verwendet es, wenn eine Gruppe nur aus einer bestimmten Art besteht.", "example": "Auf der Party waren lauter junge Leute.", "is_phrase": false, "pos": "Adverb"}, "lehrerin": {"def": "Eine Frau, die in der Schule Kindern oder Jugendlichen Wissen vermittelt und Unterricht gibt. Sie arbeitet als Pädagogin an einer Schule.", "example": "Unsere Lehrerin erklärt uns heute die Mathematikaufgaben.", "is_phrase": false, "pos": "Substantiv"}, "letzten": {"def": "Das Adjektiv beschreibt etwas, das ganz hinten oder am Ende steht. Hier bedeutet es: die Reihe, die am weitesten hinten im Raum ist.", "example": "Die Schüler in der letzten Reihe können die Tafel schlecht sehen.", "is_phrase": false, "pos": "Adjektiv"}, "locker": {"def": "entspannt und ruhig, ohne Stress oder Hektik. Man bewegt sich gemütlich und nicht steif.", "example": "Nach der Prüfung ging er locker nach Hause, weil er sich keine Sorgen mehr machte.", "is_phrase": false, "pos": "Adverb"}, "los": {"def": "Diese Frage stellt man, wenn man wissen will, was passiert oder warum sich jemand seltsam verhält. Man fragt nach dem Problem oder der Situation.", "example": "Als ich das laute Geschrei hörte, rief ich: 'Was ist los?'", "is_phrase": true, "pos": "Redewendung"}, "länger": {"def": "mehr Zeit als vorher oder als normal. Das bedeutet, sie arbeitet jetzt mehr Stunden am Tag oder mehr Tage in der Woche.", "example": "Seit der Vater seinen Job verloren hat, muss die Mutter länger im Büro bleiben.", "is_phrase": false, "pos": "Adverb"}, "mathematik": {"def": "Ein Schulfach, in dem man mit Zahlen rechnet und Aufgaben löst. Man lernt dort zum Beispiel plus, minus, mal und geteilt.", "example": "In Mathematik haben wir heute Brüche gelernt.", "is_phrase": false, "pos": "Substantiv"}, "meldet": {"def": "Eine Person geht zu einem Ort und sagt dort, dass sie da ist oder gibt ihre persönlichen Daten an. Man macht das oft am ersten Tag in einer neuen Schule oder bei einem neuen Job.", "example": "Am ersten Schultag muss sich jeder neue Schüler im Sekretariat melden.", "is_phrase": true, "pos": "Redewendung"}, "mittag": {"def": "Die Zeit um 12 Uhr, wenn normalerweise Mittagspause ist oder gegessen wird.", "example": "Wir treffen uns heute Mittag um 12:30 Uhr zum Essen.", "is_phrase": false, "pos": "Substantiv"}, "models": {"def": "Menschen, die beruflich für Fotos oder Modenschauen posieren und dabei Kleidung oder Produkte zeigen. Sie sind oft sehr dünn und gelten als besonders schön.", "example": "Viele Models laufen bei der Modewoche in Paris über den Laufsteg.", "is_phrase": false, "pos": "Substantiv"}, "mondgesicht": {"def": "Ein rundes, volles Gesicht, das wie der Mond aussieht. Wird oft verwendet, um jemanden zu beschreiben, der ein dickes oder aufgedunsenes Gesicht hat.", "example": "Der kleine Junge hatte ein Mondgesicht und runde Pausbäckchen.", "is_phrase": false, "pos": "Substantiv"}, "montag": {"def": "Der erste Tag der Woche. Hier steht es als Datum am Anfang eines Tagebucheintrags oder Kalenders.", "example": "In meinem Kalender steht: Montag, 15. März - Termin beim Arzt.", "is_phrase": false, "pos": "Substantiv"}, "morgen": {"def": "Teil einer höflichen Begrüßung am Anfang des Tages, etwa zwischen 6 und 11 Uhr. Man sagt das, wenn man jemanden zum ersten Mal an diesem Tag trifft.", "example": "Als ich in die Schule kam, sagte ich zu meinem Lehrer: 'Guten Morgen!'", "is_phrase": true, "pos": "Substantiv"}, "muskel-macker": {"def": "Ein Mann, der sehr muskulös ist und gerne seine Muskeln zeigt. Das Wort wird oft abwertend verwendet für Männer, die nur auf ihr Aussehen achten.", "example": "Im Fitnessstudio trainieren viele Muskel-Macker, die ständig in den Spiegel schauen.", "is_phrase": false, "pos": "Substantiv"}, "muskeln": {"def": "Die starken Körperteile, die Menschen und Tiere haben, um sich zu bewegen und schwere Dinge zu heben. Wenn jemand dicke Muskeln hat, ist er sehr stark.", "example": "Der Sportler trainiert jeden Tag, deshalb hat er so starke Muskeln.", "is_phrase": false, "pos": "Substantiv"}, "mutter": {"def": "Eine Frau, die ein Kind geboren hat und es großzieht. Sie ist die weibliche Elternperson.", "example": "Meine Mutter kocht jeden Tag das Abendessen für die Familie.", "is_phrase": false, "pos": "Substantiv"}, "mädchen": {"def": "Ein weibliches Kind oder eine junge Frau, die noch nicht erwachsen ist. Das Wort wird hier für eine Schülerin verwendet.", "example": "Das Mädchen mit den langen Haaren sitzt in der ersten Reihe.", "is_phrase": false, "pos": "Substantiv"}, "möchte": {"def": "Eine höfliche Form, um einen Wunsch oder eine Absicht zu äußern. Man benutzt es, wenn man etwas will oder plant zu tun.", "example": "Ich möchte heute früh nach Hause gehen, weil ich müde bin.", "is_phrase": false, "pos": "Verb"}, "müller": {"def": "Ein Nachname, den Menschen in Deutschland tragen. Es ist einer der häufigsten deutschen Familiennamen.", "example": "Herr Müller wohnt in der Nachbarschaft.", "is_phrase": false, "pos": "Substantiv"}, "nachricht": {"def": "Ein kurzer Text, den jemand an eine andere Person schickt, zum Beispiel über das Handy oder per E-Mail. Man kann schnell etwas mitteilen oder fragen.", "example": "Lisa hat mir eine Nachricht geschrieben, dass sie zu spät kommt.", "is_phrase": false, "pos": "Substantiv"}, "nachrichten": {"def": "Informationen oder Mitteilungen, die jemand für eine andere Person hinterlassen hat. Diese werden meist gesprochen und auf einem Gerät aufgenommen.", "example": "Ich habe drei Nachrichten auf meinem Handy, die ich noch anhören muss.", "is_phrase": false, "pos": "Substantiv"}, "nadja": {"def": "Ein weiblicher Vorname. In diesem Text ist Nadja eine Schülerin, die an ihre neue Schule wechselt.", "example": "Meine Freundin Nadja kommt aus Polen und lernt Deutsch.", "is_phrase": false, "pos": "Eigenname"}, "neben": {"def": "Zeigt an, dass sich etwas oder jemand direkt an der Seite von einer anderen Person oder Sache befindet. Es bedeutet, dass zwei Dinge sehr nah beieinander sind.", "example": "Maria sitzt neben ihrem besten Freund in der Schule.", "is_phrase": false, "pos": "Präposition"}, "neuen": {"def": "anders als vorher; eine andere Schule als die, wo sie früher war", "example": "Nach dem Umzug muss Tom eine neue Klasse finden.", "is_phrase": false, "pos": "Adjektiv"}, "nimmt": {"def": "Etwas für sich selbst auswählen und bekommen. Man holt sich etwas, was man haben möchte.", "example": "Peter nimmt sich ein Stück Kuchen vom Teller.", "is_phrase": true, "pos": "Redewendung"}, "online": {"def": "im Internet aktiv und erreichbar sein, besonders in sozialen Medien oder Messenger-Apps. Man kann sehen, dass die Person gerade am Computer oder Handy ist.", "example": "Ich sehe, dass meine Freundin online ist, deshalb schreibe ich ihr eine Nachricht.", "is_phrase": false, "pos": "Adjektiv"}, "physik": {"def": "Ein Schulfach, in dem man lernt, wie die Natur funktioniert. Man macht Experimente und lernt über Bewegung, Licht, Wärme und andere Naturgesetze.", "example": "In Physik haben wir heute gelernt, warum ein Apfel vom Baum fällt.", "is_phrase": false, "pos": "Substantiv"}, "platz": {"def": "Ein Platz in der Schule ist der Ort, wo ein Schüler sitzt. Meist ist das ein Stuhl an einem Tisch im Klassenzimmer.", "example": "Maria hat ihren Platz in der ersten Reihe direkt vor der Tafel.", "is_phrase": false, "pos": "Substantiv"}, "projekt": {"def": "Eine größere Aufgabe oder Arbeit, die über einen längeren Zeitraum geplant und durchgeführt wird. Es hat meist ein bestimmtes Ziel und einen festen Anfang und ein Ende.", "example": "Das neue Projekt zur Entwicklung einer App wird sechs Monate dauern.", "is_phrase": false, "pos": "Substantiv"}, "pünktlich": {"def": "zur richtigen Zeit da sein; nicht zu spät kommen", "example": "Der Zug war pünktlich und kam genau um 15:30 Uhr an.", "is_phrase": false, "pos": "Adjektiv"}, "raum": {"def": "Ein Zimmer oder ein abgeschlossener Bereich in einem Gebäude. Hier ist es wahrscheinlich ein Saal oder Klassenzimmer mit Sitzreihen.", "example": "Die Studenten gehen in den Raum, wo die Vorlesung stattfindet.", "is_phrase": false, "pos": "Substantiv"}, "reicht": {"def": "Etwas zu einer anderen Person hinhalten oder geben. Man streckt etwas aus, damit die andere Person es nehmen kann.", "example": "Der Vater reicht seinem Sohn das Spielzeug.", "is_phrase": false, "pos": "Verb"}, "reihe": {"def": "Eine Linie von Sitzplätzen nebeneinander in einem Raum, zum Beispiel im Kino, Theater oder Klassenzimmer. Die erste Reihe ist ganz vorne, die letzte Reihe ganz hinten.", "example": "Im Konzert saßen wir in der dritten Reihe und konnten die Musiker gut sehen.", "is_phrase": false, "pos": "Substantiv"}, "rot": {"def": "Wenn jemand rot wird, bekommt das Gesicht eine rote Farbe, weil die Person sich schämt oder verlegen ist. Das passiert automatisch, wenn man peinlich berührt oder beschämt ist.", "example": "Als alle Schüler ihn anstarrten, wurde er rot und schaute auf den Boden.", "is_phrase": false, "pos": "Adjektiv"}, "roten": {"def": "Eine Farbe, die wie Blut oder reife Tomaten aussieht. Hier beschreibt es die Haarfarbe einer Person.", "example": "Meine Schwester hat rote Haare und bekommt im Sommer schnell einen Sonnenbrand.", "is_phrase": false, "pos": "Adjektiv"}, "ruf": {"def": "Eine andere Person bitten, dass sie einen telefonisch kontaktiert. Man möchte, dass die andere Person das Telefon benutzt und einen anruft.", "example": "Kannst du mich heute Abend rufen? Ich bin ab 20 Uhr zu Hause.", "is_phrase": false, "pos": "Verb"}, "rufst": {"def": "Du machst einen Telefonanruf. Du wählst jemandes Telefonnummer und sprichst mit dieser Person.", "example": "Rufst du deine Mutter heute Abend an?", "is_phrase": false, "pos": "Verb"}, "ruft": {"def": "Laut und deutlich sprechen, damit andere es hören können. Man macht das oft, wenn man jemanden erreichen will, der weiter weg ist.", "example": "Der Vater ruft seine Kinder zum Essen.", "is_phrase": false, "pos": "Verb"}, "runden": {"def": "beschreibt ein Gesicht, das eine kreisförmige Form hat und oft etwas dick oder voll aussieht", "example": "Der kleine Junge hatte ein rundes Gesicht mit dicken Backen.", "is_phrase": false, "pos": "Adjektiv"}, "schaffe": {"def": "Bedeutet: es ist nicht möglich für mich, pünktlich zu kommen oder etwas zu tun. Man verwendet es, wenn man keine Zeit hat oder etwas nicht schafft.", "example": "Tut mir leid, ich schaffe es heute Abend nicht zum Kino - ich muss länger arbeiten.", "is_phrase": true, "pos": "Redewendung"}, "schafft": {"def": "Es gelingt jemandem, etwas Schwieriges zu tun. Man kann etwas erreichen, obwohl es nicht einfach ist.", "example": "Nach dem Unfall schafft er es, wieder normal zu gehen.", "is_phrase": true, "pos": "Redewendung"}, "scheiße": {"def": "Ein vulgärer Ausruf, der Ärger, Überraschung oder Unzufriedenheit ausdrückt. Wird oft verwendet, wenn etwas Unerwartetes oder Störendes passiert.", "example": "Scheiße, ich habe meinen Schlüssel vergessen!", "is_phrase": false, "pos": "Interjektion"}, "schlecht": {"def": "Von niedriger Qualität, nicht gut funktionierend. Hier: Die Telefonverbindung oder Internetverbindung hat Probleme, man kann nicht gut hören oder verstehen.", "example": "Das WLAN im Hotel war so schlecht, dass ich keine Videos schauen konnte.", "is_phrase": false, "pos": "Adjektiv"}, "schläft": {"def": "Hier bedeutet es: Die Person ist entspannt und ruhig, nicht angespannt oder aggressiv. Anders als bei den anderen Personen wirkt diese Person friedlich.", "example": "Obwohl er sehr stark aussah, schläft er wohl und ist gar nicht gefährlich.", "is_phrase": false, "pos": "Verb"}, "schneewittchen": {"def": "Ein Spitzname für ein Mädchen, das sehr blass ist und schwarze Haare hat, wie die Märchenfigur Schneewittchen. So nennt man jemanden, der diesem bekannten Märchen-Aussehen ähnlich sieht.", "example": "Die neue Schülerin hatte so schwarze Haare und blasse Haut, dass alle sie Schneewittchen nannten.", "is_phrase": false, "pos": "Substantiv"}, "schule": {"def": "Eine Einrichtung, wo Kinder und Jugendliche lernen und Unterricht bekommen. Dort gehen sie jeden Tag hin, um verschiedene Fächer wie Deutsch, Mathematik oder Geschichte zu lernen.", "example": "Mein Sohn geht seit September in eine neue Schule, weil wir umgezogen sind.", "is_phrase": false, "pos": "Substantiv"}, "sechs": {"def": "Die Zahl zwischen fünf und sieben. Man schreibt sie als 6.", "example": "Ich habe sechs Äpfel gekauft.", "is_phrase": false, "pos": "Zahlwort"}, "sehe": {"def": "Diese Phrase bedeutet: so wirken oder erscheinen im Vergleich zu jemandem. Man benutzt sie, wenn man sich mit einer anderen Person vergleicht und beschreibt, wie man dabei aussieht oder wirkt.", "example": "Neben meiner sportlichen Schwester sehe ich aus wie ein Couch-Potato.", "is_phrase": true, "pos": "Redewendung"}, "seite": {"def": "Der seitliche Teil des Körpers zwischen Arm und Hüfte. Man kann dort jemanden mit dem Ellbogen stoßen oder anstoßen.", "example": "Sie stieß ihn in die Seite, um ihn auf den schönen Sonnenuntergang aufmerksam zu machen.", "is_phrase": false, "pos": "Substantiv"}, "sekretariat": {"def": "Das Büro in einer Firma, Schule oder Organisation, wo man anruft oder hingeht, um Informationen zu bekommen oder sich anzumelden.", "example": "Im Sekretariat der Schule kann man Zeugnisse abholen und Termine vereinbaren.", "is_phrase": false, "pos": "Substantiv"}, "sekretärin": {"def": "Eine Person, die in einem Büro arbeitet und administrative Aufgaben macht, wie Termine planen, Telefonate führen oder Besucher empfangen. Sie hilft oft einem Chef oder einer Organisation bei der Büroarbeit.", "example": "Die Sekretärin der Schule zeigt neuen Schülern den Weg zu ihren Klassenräumen.", "is_phrase": false, "pos": "Substantiv"}, "sekunde": {"def": "Ein sehr kurzer Zeitraum, der fast gar nicht dauert. Man verwendet das Wort, wenn etwas extrem schnell passiert oder sehr wenig Zeit vergeht.", "example": "Für eine Sekunde dachte ich, ich hätte meinen Schlüssel verloren.", "is_phrase": false, "pos": "Substantiv"}, "setz": {"def": "Eine Aufforderung, dass sich jemand hinsetzen soll. Es ist die Befehlsform von 'sich setzen'.", "example": "Setz dich auf das Sofa und warte hier auf mich.", "is_phrase": false, "pos": "Verb"}, "setzt": {"def": "Den Körper auf einen Stuhl, eine Bank oder einen anderen Platz bringen, um zu sitzen. Man geht von stehen zu sitzen über.", "example": "Nach der langen Wanderung setzt sich Maria auf die Bank im Park.", "is_phrase": false, "pos": "Verb"}, "sitze": {"def": "An einem Ort sein und dort auf einem Stuhl oder einer anderen Sitzgelegenheit Platz haben. Man befindet sich in einer sitzenden Position neben einer anderen Person.", "example": "Im Kino sitze ich immer in der ersten Reihe.", "is_phrase": false, "pos": "Verb"}, "sitzen": {"def": "Eine Position haben, bei der man auf einem Stuhl, einer Bank oder ähnlichem Platz genommen hat. Der Körper ruht dabei auf dem Gesäß.", "example": "Die Studenten sitzen im Hörsaal und hören dem Professor zu.", "is_phrase": false, "pos": "Verb"}, "soll": {"def": "Drückt eine höfliche Frage aus, wer etwas tun wird oder wer dafür verantwortlich ist. Man fragt damit nach einer Entscheidung oder einem Vorschlag.", "example": "Soll ich das Fenster öffnen, oder machst du es?", "is_phrase": false, "pos": "Modalverb"}, "sport": {"def": "Ein Schulfach, in dem die Schüler körperliche Übungen machen, verschiedene Sportarten lernen und sich bewegen. Man sagt auch Sportunterricht dazu.", "example": "In Sport haben wir heute Fußball gespielt und sind danach noch gelaufen.", "is_phrase": false, "pos": "Substantiv"}, "später": {"def": "zu einem Zeitpunkt nach dem ursprünglich geplanten oder erwarteten Zeitpunkt", "example": "Der Zug kommt heute später an, weil es Probleme auf der Strecke gibt.", "is_phrase": false, "pos": "Adverb"}, "starrt": {"def": "Jemanden oder etwas sehr intensiv und ohne zu blinzeln anschauen. Man macht das oft, wenn man erschrocken, fasziniert oder nachdenklich ist.", "example": "Der kleine Junge starrte das große Feuerwerk am Himmel an.", "is_phrase": false, "pos": "Verb"}, "stehen": {"def": "Sich nicht bewegen, an einem Ort bleiben und nicht weitergehen. Man hört auf zu laufen oder zu gehen.", "example": "Nach dem langen Marsch war er so müde, dass er kaum noch stehen bleiben konnte.", "is_phrase": true, "pos": "Redewendung"}, "steht": {"def": "bedeutet, dass ein Raum komplett mit Gegenständen gefüllt ist. Man kann sich dort nicht mehr gut bewegen.", "example": "Das Kinderzimmer steht voll mit Spielzeug, deshalb können wir heute nicht dort spielen.", "is_phrase": true, "pos": "Redewendung"}, "stärkung": {"def": "Etwas zu essen oder zu trinken, das einer schwachen oder müden Person neue Kraft gibt. Man braucht das besonders nach Anstrengung oder wenn man sich nicht gut fühlt.", "example": "Nach der langen Wanderung gönnte sich Maria eine kleine Stärkung mit Brot und Tee.", "is_phrase": false, "pos": "Substantiv"}, "stößt": {"def": "Jemanden schnell und fest mit dem Ellbogen berühren, um seine Aufmerksamkeit zu bekommen oder ihm etwas zu zeigen.", "example": "Paul stößt seinen Freund mit dem Ellbogen an und zeigt auf das lustige Plakat.", "is_phrase": false, "pos": "Verb"}, "superdünne": {"def": "Sehr, sehr dünn und schlank. Das Wort zeigt, dass jemand extrem wenig wiegt und einen sehr schmalen Körper hat.", "example": "Die Tänzerin war superdünn und konnte alle schwierigen Bewegungen machen.", "is_phrase": false, "pos": "Adjektiv"}, "tag": {"def": "Ein Tag ist die Zeit von 24 Stunden, von Mitternacht bis Mitternacht. Hier bedeutet es einen bestimmten Zeitpunkt oder ein bestimmtes Datum.", "example": "Morgen ist mein erster Tag im neuen Job.", "is_phrase": false, "pos": "Substantiv"}, "termine": {"def": "Feste Zeiten, zu denen man etwas Wichtiges machen muss oder sich mit jemandem treffen will. Man schreibt sie oft in einen Kalender, damit man sie nicht vergisst.", "example": "Morgen habe ich drei Termine: um 9 Uhr beim Zahnarzt, um 14 Uhr ein Meeting und um 18 Uhr ein Abendessen mit Freunden.", "is_phrase": false, "pos": "Substantiv"}, "thiel": {"def": "Ein Nachname einer Person. Hier ist es der Name einer Lehrerin, die Mathematik, Physik und Sport unterrichtet.", "example": "Frau Thiel erklärt den Schülern die neue Aufgabe.", "is_phrase": false, "pos": "Eigenname"}, "tippt": {"def": "Mit den Fingern auf einer Tastatur oder einem Bildschirm schreiben. Man drückt dabei die Tasten oder berührt den Bildschirm, um Buchstaben oder Wörter zu schreiben.", "example": "Sie tippt eine Nachricht auf ihr Handy und schickt sie an ihre Freundin.", "is_phrase": false, "pos": "Verb"}, "titten": {"def": "Ein sehr unhöfliches und respektloses Wort für die weibliche Brust. Es ist eine vulgäre Bezeichnung, die Frauen verletzt und beleidigt.", "example": "Der Mann machte einen respektlosen Kommentar über ihren Körper, was sie sehr verletzte.", "is_phrase": false, "pos": "Substantiv"}, "trotzdem": {"def": "Obwohl etwas anderes dagegen spricht oder es schwierig ist. Drückt aus, dass etwas passiert, auch wenn man es nicht erwartet.", "example": "Es regnete stark, trotzdem gingen wir spazieren.", "is_phrase": false, "pos": "Adverb"}, "typ": {"def": "Ein Mann oder eine männliche Person (umgangssprachlich und etwas neutral oder distanziert). Man verwendet es, wenn man jemanden beschreibt, den man nicht gut kennt oder nicht näher bezeichnen möchte.", "example": "Da steht ein Typ vor der Tür und will mit dir sprechen.", "is_phrase": false, "pos": "Substantiv"}, "typen": {"def": "umgangssprachlich für Männer oder Jungen, oft mit etwas negativer Bedeutung. Man benutzt das Wort, wenn man die Personen nicht besonders mag oder wenn sie sich schlecht benehmen.", "example": "An der Bushaltestelle standen drei Typen und machten laute Musik.", "is_phrase": false, "pos": "Substantiv"}, "unfähig": {"def": "nicht in der Lage, eine Aufgabe gut zu machen; ohne die nötigen Fähigkeiten für eine bestimmte Arbeit", "example": "Der neue Kollege ist völlig unfähig und macht jeden Tag viele Fehler.", "is_phrase": false, "pos": "Adjektiv"}, "unsinn": {"def": "Ein Ausruf, mit dem man zeigt, dass etwas dumm, falsch oder nicht wahr ist. Man sagt es, wenn man etwas für völlig verrückt hält.", "example": "Als er sagte, er könne fliegen, rief sie nur: 'Unsinn!'", "is_phrase": false, "pos": "Substantiv"}, "unterricht": {"def": "Eine Stunde in der Schule, in der eine Lehrerin oder ein Lehrer den Schülern etwas beibringt. Die Zeit, in der gelernt wird.", "example": "Der Mathelehrer beginnt pünktlich um 8 Uhr mit dem Unterricht.", "is_phrase": false, "pos": "Substantiv"}, "unterrichte": {"def": "Als Lehrerin oder Lehrer in der Schule bestimmte Fächer lehren und den Schülern Wissen vermitteln.", "example": "Herr Schmidt unterrichtet seit zehn Jahren Deutsch und Geschichte am Gymnasium.", "is_phrase": false, "pos": "Verb"}, "unterwegs": {"def": "Ich bin gerade auf dem Weg zu dir oder zu einem bestimmten Ort. Ich habe mich schon in Bewegung gesetzt und komme bald an.", "example": "Wo bleibst du denn? - Keine Sorge, bin schon unterwegs!", "is_phrase": false, "pos": "Adverb"}, "vater": {"def": "Der männliche Elternteil einer Person. Ein Mann, der ein oder mehrere Kinder hat.", "example": "Mein Vater hilft mir bei den Hausaufgaben.", "is_phrase": false, "pos": "Substantiv"}, "verbindung": {"def": "Die Qualität eines Telefongesprächs oder einer Internet-Leitung. Wenn die Verbindung schlecht ist, kann man nicht gut hören oder das Internet ist langsam.", "example": "Die Verbindung war so schlecht, dass ich meinen Bruder am Telefon kaum verstehen konnte.", "is_phrase": false, "pos": "Substantiv"}, "vergisst": {"def": "Nicht daran denken, etwas zu tun, was man tun sollte. Man macht etwas nicht, weil es einem nicht einfällt.", "example": "Er vergisst oft, seine Hausschlüssel mitzunehmen.", "is_phrase": false, "pos": "Verb"}, "verletzt": {"def": "Wenn man sich verletzt fühlt, bedeutet das: Die Gefühle sind hurt, man ist traurig oder wütend, weil jemand etwas Gemeines gesagt oder getan hat. Es tut in der Seele weh, nicht am Körper.", "example": "Als ihre beste Freundin schlecht über sie sprach, fühlte sich Maria sehr verletzt.", "is_phrase": false, "pos": "Adjektiv"}, "versprochen": {"def": "Ein Wort, das man sagt, um zu bestätigen, dass man etwas sicher machen wird. Es bedeutet: Das wird auf jeden Fall passieren.", "example": "Wir treffen uns morgen um drei Uhr im Café. - Versprochen!", "is_phrase": false, "pos": "Ausruf"}, "verstehen": {"def": "Die Worte von jemandem hören und begreifen, was die Person sagt. Man kann die Sprache oder die Bedeutung erfassen.", "example": "Ich kann dich nicht verstehen, sprich bitte lauter.", "is_phrase": false, "pos": "Verb"}, "vier": {"def": "Die Zahl 4. Zeigt an, wie viele Personen oder Dinge da sind.", "example": "Im Café sitzen vier Freunde an einem Tisch.", "is_phrase": false, "pos": "Zahlwort"}, "vierte": {"def": "Die vierte Person in einer Gruppe oder Reihe von Menschen. Hier wird eine bestimmte Person als 'der Vierte' bezeichnet, weil sie in einer Aufzählung oder Beschreibung an vierter Stelle steht.", "example": "Der Erste war groß, der Zweite klein, der Dritte hatte blonde Haare und der Vierte trug eine Brille.", "is_phrase": false, "pos": "Substantiv"}, "voll": {"def": "Wenn ein Raum voller Gegenstände steht, sodass man kaum durchgehen kann. Die Gegenstände nehmen fast den ganzen Platz ein.", "example": "Das Wohnzimmer steht voll mit Möbeln, die wir noch nicht aufgebaut haben.", "is_phrase": true, "pos": "Redewendung"}, "vorbei": {"def": "An jemandem vorbeigehen bedeutet: neben einer Person gehen und sie passieren. Man geht an der Person vorbei, ohne stehen zu bleiben.", "example": "Ich muss schnell an dem wartenden Mann vorbei, um den Bus zu erreichen.", "is_phrase": true, "pos": "Redewendung"}, "wach": {"def": "nicht schlafend; die Augen sind offen und man kann alles um sich herum sehen und hören", "example": "Obwohl es schon sehr spät war, war das Kind noch wach und wollte nicht ins Bett.", "is_phrase": false, "pos": "Adjektiv"}, "warum": {"def": "Ein Wort, mit dem man nach dem Grund für etwas fragt. Man will wissen, aus welchem Grund jemand etwas tut oder nicht tut.", "example": "Warum kommst du heute so spät nach Hause?", "is_phrase": false, "pos": "Fragewort"}, "was": {"def": "Ein Fragewort, das man benutzt, um nach Dingen, Eigenschaften oder Situationen zu fragen. In Beleg 1 drückt es Überraschung oder Bewunderung aus, in Beleg 2 fragt man nach einer Situation.", "example": "Was für ein schönes Auto! Was machst du heute Abend?", "is_phrase": false, "pos": "Interrogativpronomen"}, "weinen": {"def": "Tränen aus den Augen kommen lassen, weil man traurig, emotional oder verletzt ist. Man macht das oft, wenn man starke Gefühle hat.", "example": "Als sie die schlechte Nachricht hörte, fing sie an zu weinen.", "is_phrase": false, "pos": "Verb"}, "wissen": {"def": "informiert sein über etwas; Bescheid haben über eine Sache oder Situation", "example": "Ich will wissen, wann du nach Hause kommst.", "is_phrase": false, "pos": "Verb"}, "wollte": {"def": "Zeigt an, dass jemand die Absicht hatte, etwas zu tun oder zu sagen. Hier bedeutet es: er hatte vor zu sagen oder er plante zu sagen.", "example": "Sie wollte ihm eigentlich die Wahrheit erzählen, aber dann hat sie es sich anders überlegt.", "is_phrase": false, "pos": "Verb"}, "zahnarzt-praxis": {"def": "Ein Ort, wo ein Zahnarzt arbeitet und Patienten behandelt. Dort gibt es Behandlungsräume, Geräte und oft auch Helferinnen.", "example": "Herr Schmidt hat eine neue Zahnarztpraxis in der Stadtmitte eröffnet.", "is_phrase": false, "pos": "Substantiv"}, "zeigt": {"def": "Mit dem Finger oder der Hand eine Richtung oder einen Ort angeben, damit andere sehen, wo etwas ist. Man macht eine Bewegung in die Richtung von etwas.", "example": "Der Lehrer zeigt auf die Tafel und erklärt die Aufgabe.", "is_phrase": true, "pos": "Redewendung"}, "zimmer": {"def": "Ein Raum in einer Wohnung oder einem Haus, in dem eine Person schläft oder ihre privaten Sachen hat. Oft steht dort ein Bett, ein Schreibtisch oder andere persönliche Möbel.", "example": "Nach der Schule geht Maria in ihr Zimmer, um Hausaufgaben zu machen.", "is_phrase": false, "pos": "Substantiv"}, "zuletzt": {"def": "am Ende; als letzte Handlung in einer Reihe von Ereignissen", "example": "Erst waren alle still, dann fingen einige an zu flüstern, und zuletzt haben alle laut gelacht.", "is_phrase": false, "pos": "Adverb"}, "zurück": {"def": "Jemanden oder etwas mit den Augen fixieren, als Reaktion auf den Blick einer anderen Person. Man schaut intensiv in die Richtung, aus der man angeschaut wird.", "example": "Als er sie ansah, starrte sie zurück und wich seinem Blick nicht aus.", "is_phrase": true, "pos": "Verb"}, "zurückkommt": {"def": "An einen Ort gehen, wo man vorher war. Man kehrt zu einem Platz zurück, den man verlassen hat.", "example": "Maria kommt um 18 Uhr von der Arbeit nach Hause zurück.", "is_phrase": false, "pos": "Verb"}, "zusammen": {"def": "bedeutet hier: gemeinsam mit anderen Personen oder Dingen, als Teil von etwas. Die Mutter hat nicht nur die Praxis bekommen, sondern auch die Mitarbeiterinnen übernommen.", "example": "Er hat das Geschäft gekauft - zusammen mit allen Angestellten und der Ausrüstung.", "is_phrase": false, "pos": "Adverb"}, "zwei": {"def": "Die Zahl 2. Man verwendet sie, um zu sagen, dass es genau zwei Personen oder Dinge gibt.", "example": "In der Küche stehen zwei Stühle am Tisch.", "is_phrase": false, "pos": "Zahlwort"}, "zweite": {"def": "Die Ordnungszahl, die zeigt, dass etwas an der Position Nummer 2 in einer Reihenfolge steht. Hier bedeutet es: die Nachricht, die nach der ersten kam.", "example": "Nach dem ersten Brief kam eine zweite Post von meiner Großmutter.", "is_phrase": false, "pos": "Adjektiv"}, "zögert": {"def": "Eine kurze Zeit warten, bevor man etwas tut, weil man unsicher ist oder nachdenken muss. Man macht eine kleine Pause, bevor man handelt.", "example": "Er zögert einen Moment, bevor er die schwierige Frage beantwortet.", "is_phrase": false, "pos": "Verb"}, "übernommen": {"def": "Die Verantwortung und Kontrolle für ein Geschäft oder eine Firma von einer anderen Person bekommen. Man wird der neue Chef oder Besitzer.", "example": "Nach dem Tod seines Vaters hat Paul das Familienrestaurant übernommen.", "is_phrase": false, "pos": "Verb"}};
const META = {textId:"011_EL",condition:"standard",start:new Date().toISOString()};
const counts = {};
const log = [];

function render() {
  const tb = document.getElementById('tb');
  const raw = "Montag, 20. April\nNADJA\nHeute ist ihr erster Tag in der neuen Schule.\nSie meldet sich im Sekretariat. Dann bringt die Sekret\u00e4rin Nadja in den Keller, denn dort ist ihr Klassenraum.\nNadja betritt den Raum und entdeckt gleich zwei Blondinen, die in der ersten Reihe sitzen. Eine von beiden sagt: \u201eSchei\u00dfe, eine Dicke.\u201c Die andere Blondine f\u00e4ngt an zu kichern und nach ihr auch alle anderen. Zuletzt kichert ein M\u00e4dchen in der letzten Reihe, das aussieht wie Schneewittchen.\nDie Lehrerin reicht Nadja die Hand und sagt: \u201eGuten Morgen. Du bist also Nadja. Ich bin Frau Thiel und unterrichte Mathematik, Physik und Sport. Es ist nur noch ein Platz neben Jennifer frei. Setz dich bitte dorthin.\u201c Frau Thiel zeigt auf den freien Platz neben Schneewittchen.\nAuf dem Weg dorthin muss Nadja an vier Typen vorbei, die sie fast mit den Augen ausziehen. Das hei\u00dft, eigentlich glotzen nur drei: zwei Muskel-Macker und ein Typ mit roten Haaren und einem sehr runden Gesicht. Es sieht aus wie ein Mondgesicht. Der Vierte hat auch dicke Muskeln, aber schl\u00e4ft wohl.\nDas Mondgesicht neben ihm jedoch ist wach. Es st\u00f6\u00dft ihm den Ellbogen in die Seite und sagt: \u201eEy, was f\u00fcr Titten!\u201c\nSie f\u00fchlt sich angegriffen und verletzt. Trotzdem schafft sie es, stehen zu bleiben. Das Mondgesicht starrt sie an.\nSie starrt zur\u00fcck. Eine Sekunde. Zwei. Das Mondgesicht wird rot. Drei. Vier. F\u00fcnf. Sechs. Jetzt wird auch der Typ neben dem Mondgesicht rot.\nDa ruft Frau Thiel zu ihr: \u201eBitte geh zu deinem Platz, ich m\u00f6chte mit dem Unterricht anfangen.\u201c\nLangsam und locker geht sie weiter und setzt sich neben Schneewittchen.\n\nZu Hause kommt sie fast nicht durch die Haust\u00fcr, denn der Flur steht voll mit Kartons. Sie ruft ihre Mutter, aber sie ist nicht da.\nIhre Mutter hat eine Zahnarzt-Praxis \u00fcbernommen - zusammen mit den Helferinnen, die dort arbeiten.\nEine Helferin ist besonders unf\u00e4hig. Das ist diese Frau M\u00fcller. Sie vergisst immer wieder, Termine einzutragen. Bestimmt muss ihre Mutter deshalb jetzt l\u00e4nger arbeiten.\nAuf dem Anruf-Beantworter sind Nachrichten. Nadja h\u00f6rt sie ab.\nDie erste Nachricht ist von ihrer Mutter: \u201eHallo, Nadja, ich schaffe es heute Mittag nicht. Aber heute Abend bin ich p\u00fcnktlich. Versprochen!\u201c\nDie zweite Nachricht ist wohl von ihrem Vater. Sie kann kaum etwas verstehen, weil die Verbindung so schlecht ist. Ihr Vater arbeitet gerade an einem Projekt im Ausland. Er wollte bestimmt sagen, dass er sp\u00e4ter als geplant zur\u00fcckkommt.\nDie dritte Nachricht ist von Ellie: \u201eHe, wie war es? Ruf mich an, ja?\u201c\nWenn sie Ellie jetzt anruft, f\u00e4ngt Nadja bestimmt an zu weinen. Erst einmal braucht sie eine St\u00e4rkung.\nNadja nimmt sich eine Banane und einen Apfel. Dann geht sie in ihr Zimmer und f\u00e4hrt den Computer hoch.\nEllie ist bereits online und hat schon geschrieben:\nWarum rufst du nicht an? Ich muss doch wissen, wie\nes dir geht!\nNadja z\u00f6gert, dann tippt sie: Beschissen.\nEcht?? Was ist los???\nIn der Klasse sind lauter superd\u00fcnne Models. Und ich sitze neben einer, die aussieht wie Schneewittchen.\nNeben ihr sehe ich aus wie eine Elefantenkuh!\nUnsinn!\nKein Unsinn!\nRufst du mich an, oder soll ich?\nBin schon unterwegs.\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t\n\r]+$/.test(tok)) { html += tok; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'').toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" onclick="show(event,\'' + key + '\')">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

// Tooltip-State
let tipOpen = false;

function show(e, k) {
  e.stopPropagation();
  const d = DICT[k]; if (!d) return;
  const tip = document.getElementById('tip');

  document.getElementById('tw').textContent = k;
  document.getElementById('tpos').textContent = d.pos || '';
  document.getElementById('tdef').textContent = d.def || '';
  const tex = document.getElementById('tex');
  if (d.example) { tex.textContent = '\u201e' + d.example + '\u201c'; tex.style.display='block'; }
  else tex.style.display='none';
  const tph = document.getElementById('tphrase');
  tph.style.display = d.is_phrase ? 'inline-block' : 'none';

  // Tooltip-Hoehe messen, dann smart positionieren
  const r = e.currentTarget.getBoundingClientRect();
  const tipWidth = Math.min(320, window.innerWidth - 20);
  tip.style.maxWidth = tipWidth + 'px';
  tip.style.visibility = 'hidden';
  tip.classList.add('on');
  const tipHeight = tip.offsetHeight;
  tip.classList.remove('on');
  tip.style.visibility = '';

  let left = r.left + r.width / 2 - tipWidth / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - tipWidth - 10));

  const arr = tip.querySelector('.tip-arr');
  const spaceBelow = window.innerHeight - r.bottom;
  const spaceAbove = r.top;
  let top;
  if (spaceBelow >= tipHeight + 14 || spaceBelow >= spaceAbove) {
    top = r.bottom + window.scrollY + 10;
    arr.style.top = '-7px'; arr.style.bottom = 'auto';
    arr.style.borderTop = 'none';
    arr.style.borderBottom = '7px solid var(--tooltip-bg)';
  } else {
    top = r.top + window.scrollY - tipHeight - 14;
    arr.style.top = 'auto'; arr.style.bottom = '-7px';
    arr.style.borderBottom = 'none';
    arr.style.borderTop = '7px solid var(--tooltip-bg)';
  }

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.classList.add('on');
  tipOpen = true;

  e.currentTarget.classList.add('seen');
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

// Einziger globaler Handler – schließt Tooltip bei Klick neben ein Wort
document.addEventListener('click', function(e) {
  if (!tipOpen) return;
  if (!e.target.classList.contains('w')) {
    document.getElementById('tip').classList.remove('on');
    tipOpen = false;
  }
});

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', render);
</script>
