<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --panel-bg:#2c2420;--panel-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
    --panel-width:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}

  /* ── Layout: Text links, Panel rechts ── */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1060px;
    margin:0 auto;
    padding:24px 16px 60px;
    gap:20px;
  }
  .main{flex:1;min-width:0;}

  /* ── Erklärungsleiste rechts ── */
  .panel{
    width:var(--panel-width);
    flex-shrink:0;
    position:sticky;
    top:20px;
    background:var(--panel-bg);
    border-radius:8px;
    padding:18px 16px;
    color:var(--panel-text);
    font-size:.88rem;
    line-height:1.65;
    min-height:180px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    transition:opacity .2s;
  }
  .panel-empty{
    opacity:.45;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.82rem;
    color:#9e8a78;
    min-height:120px;
  }
  .panel-content{display:none;}
  .panel-content.visible{display:block;}
  .p-badge{
    display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
    border-radius:3px;padding:1px 7px;margin-bottom:8px;letter-spacing:.04em;
  }
  .p-word{
    font-family:'Lora',serif;font-weight:600;font-size:1.05rem;
    color:#f0d9b8;display:block;margin-bottom:3px;
  }
  .p-pos{
    font-size:.72rem;color:#9e8a78;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:8px;
  }
  .p-def{color:#d4c9be;display:block;}
  .p-ex{
    margin-top:10px;font-style:italic;font-size:.82rem;color:#8a7a6e;
    border-top:1px solid rgba(255,255,255,.08);padding-top:9px;display:block;
  }

  /* ── Hinweis oben ── */
  .hint{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;
    padding:9px 14px;background:var(--accent-light);
    border-radius:4px;border-left:3px solid var(--accent);
  }

  /* ── Textbox ── */
  .text-box{
    background:white;border:1px solid var(--border);border-radius:4px;
    padding:32px 36px;line-height:2.05;font-family:'Lora',serif;
    font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04);
  }

  /* ── Anklickbare Wörter ── */
  .w{
    cursor:pointer;border-bottom:1px dotted var(--accent);
    border-radius:2px;padding:0 1px;transition:background .15s;display:inline;
  }
  .w:hover{background:var(--accent-light);}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent);}
  .w.active{background:var(--accent);color:white;border-bottom-color:transparent;}
  .w.phrase{border-bottom:2px dashed #b07d50;}
  .w.phrase.seen{border-bottom-color:#c9956a;}
  .w.phrase.active{background:var(--accent);color:white;}

  /* ── Legende ── */
  .legend{
    margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-size:.76rem;color:var(--ink-soft);
  }
  .leg-item{display:flex;align-items:center;gap:5px;}

  @media(max-width:700px){
    .layout{flex-direction:column;}
    .panel{width:100%;position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Linke Spalte: Text -->
  <div class="main">
    <div class="hint">
      Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> – die Erklärung erscheint rechts.
      &nbsp;<span style="border-bottom:2px dashed #b07d50;padding:0 2px">Gestrichelt</span> = Redewendung.
    </div>
    <div class="text-box" id="tb"></div>
    <div class="legend">
      <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 3px">Wort</span>&nbsp;erklärtes Wort</span>
      <span class="leg-item"><span style="border-bottom:2px dashed #b07d50;padding:0 3px">Phrase</span>&nbsp;Redewendung</span>
      <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 3px">farbig</span>&nbsp;bereits nachgeschlagen</span>
    </div>
  </div>

  <!-- Rechte Spalte: Erklärungsleiste -->
  <div class="panel" id="panel">
    <div class="panel-empty" id="panelEmpty">
      ← Klicken Sie auf ein unterstrichenes Wort
    </div>
    <div class="panel-content" id="panelContent">
      <span class="p-badge" id="pBadge" style="display:none">Redewendung</span>
      <span class="p-word" id="pWord"></span>
      <span class="p-pos"  id="pPos"></span>
      <span class="p-def"  id="pDef"></span>
      <span class="p-ex"   id="pEx" style="display:none"></span>
    </div>
  </div>

</div>
<script>
const DICT = {"abgehauen": {"def": "Plötzlich weggehen oder wegfahren, ohne es vorher zu sagen. Jemand verlässt einen Ort schnell und heimlich.", "example": "Als die Polizei kam, ist der Dieb sofort abgehauen.", "is_phrase": false, "pos": "Verb"}, "ach": {"def": "Keine Erklärung verfügbar.", "example": "", "is_phrase": false, "pos": ""}, "alte": {"def": "bezeichnet etwas, das schon lange existiert oder aus früherer Zeit stammt. Wird oft für traditionelle Gebäude, Geschäfte oder Orte verwendet, die eine Geschichte haben.", "example": "Das alte Rathaus wurde vor 200 Jahren gebaut und steht immer noch im Stadtzentrum.", "is_phrase": false, "pos": "Adjektiv"}, "angestellten": {"def": "Menschen, die in einem Unternehmen oder einer Firma arbeiten und dafür regelmäßig Geld bekommen. Sie haben einen Arbeitsvertrag und sind keine Chefs.", "example": "Die Angestellten der Bank arbeiten von montags bis freitags am Schalter.", "is_phrase": false, "pos": "Substantiv"}, "angriff": {"def": "Jemanden körperlich attackieren oder gewalttätig werden. Es bedeutet, dass eine Person eine andere Person schlägt oder verletzt.", "example": "Der Mann griff den Dieb an, der seine Tasche gestohlen hatte.", "is_phrase": false, "pos": "Verb"}, "angst": {"def": "Diese Phrase bedeutet: sich vor etwas fürchten oder vor etwas erschrecken. Man benutzt sie, wenn man ausdrücken will, dass jemand etwas nicht gefährlich findet.", "example": "Ich habe vor diesem kleinen Hund keine Angst, er ist ganz lieb.", "is_phrase": true, "pos": "Redewendung"}, "antwortete": {"def": "Eine Reaktion auf eine Frage oder Aussage geben, zurücksprechen. Das Wort beschreibt, dass jemand auf etwas reagiert, was eine andere Person gesagt hat.", "example": "Der Schüler antwortete schnell auf die Frage der Lehrerin.", "is_phrase": false, "pos": "Verb"}, "atmete": {"def": "Wenn jemand schwer atmet, bedeutet das: Die Person hat Probleme beim Atmen oder atmet sehr laut und angestrengt. Das passiert oft, wenn man müde ist, sich angestrengt hat oder aufgeregt ist.", "example": "Nach dem schnellen Laufen atmete sie schwer und musste sich erst einmal hinsetzen.", "is_phrase": true, "pos": "Redewendung"}, "augen": {"def": "Die beiden Körperteile im Gesicht, mit denen man sehen kann. Man kann sie öffnen und schließen.", "example": "Nach dem langen Schlaf öffnete sie langsam die Augen und sah das Sonnenlicht.", "is_phrase": false, "pos": "Substantiv"}, "ausgegangen": {"def": "Davon ausgehen bedeutet: etwas für wahrscheinlich oder richtig halten, ohne es sicher zu wissen. Man denkt, dass etwas so ist oder so passieren wird.", "example": "Maria ist davon ausgegangen, dass die Prüfung schwer wird, deshalb hat sie viel gelernt.", "is_phrase": true, "pos": "Redewendung"}, "außen": {"def": "von einem Ort, der nicht drinnen oder nicht dabei ist; von der Position einer Person, die nicht beteiligt oder nicht anwesend ist", "example": "Die Familie hatte Probleme, aber von außen sah alles normal aus.", "is_phrase": false, "pos": "Adverb"}, "bank": {"def": "Ein Gebäude oder eine Firma, wo Menschen Geld sparen, leihen oder wechseln können. Dort arbeiten Angestellte, die mit Geld umgehen.", "example": "Nach der Arbeit ging Maria zur Bank, um Geld von ihrem Konto abzuheben.", "is_phrase": false, "pos": "Substantiv"}, "bank-überfall": {"def": "Ein Verbrechen, bei dem Kriminelle in eine Bank gehen und mit Gewalt oder Drohungen Geld stehlen. Die Täter sind oft bewaffnet und zwingen die Angestellten, ihnen das Geld zu geben.", "example": "Nach dem Banküberfall suchte die Polizei drei maskierte Männer, die mit einer Pistol gedroht hatten.", "is_phrase": false, "pos": "Substantiv"}, "bedroht": {"def": "Jemandem Angst machen und sagen, dass man ihm wehtun wird, wenn er nicht tut, was man will. Man zeigt oft eine Waffe oder macht gefährliche Gesten.", "example": "Der Räuber bedrohte die Verkäuferin mit einem Messer und verlangte das Geld aus der Kasse.", "is_phrase": false, "pos": "Verb"}, "befahl": {"def": "Jemandem mit Autorität und in scharfem Ton sagen, was er tun soll. Es ist stärker als 'bitten' und zeigt, dass man erwartet, dass die andere Person sofort gehorcht.", "example": "Der Lehrer befahl den Schülern: 'Seid sofort still!'", "is_phrase": false, "pos": "Verb"}, "bester": {"def": "Der wichtigste und liebste Freund, den man hat. Man vertraut dieser Person am meisten und verbringt gern Zeit mit ihr.", "example": "Anna ist meine beste Freundin - wir kennen uns seit der Schulzeit und erzählen uns alles.", "is_phrase": false, "pos": "Adjektiv"}, "bewegten": {"def": "Von einem Ort zum anderen gehen oder die Position ändern. Hier bedeutet es: fast stillstehen oder sich nur sehr wenig bewegen.", "example": "Die Kinder saßen so ruhig da, dass sie sich kaum bewegten.", "is_phrase": false, "pos": "Verb"}, "beweis": {"def": "Ein Faktum oder eine Information, die zeigt, dass etwas wahr ist oder wirklich passiert ist. Etwas, was eine Vermutung oder Behauptung bestätigt.", "example": "Die Fingerabdrücke auf der Tür waren der Beweis dafür, dass der Dieb im Haus gewesen war.", "is_phrase": false, "pos": "Substantiv"}, "bleibst": {"def": "nicht weggehen, an einem Ort nicht verlassen. Eine Person soll da sein und nicht zu einem anderen Platz gehen.", "example": "Bleib bitte hier, ich komme gleich zurück.", "is_phrase": false, "pos": "Verb"}, "blieb": {"def": "Vergangene Form von 'bleiben': an einem Ort oder bei einer Person nicht weggehen. Hier bedeutet es: nicht verlassen, da sein und nicht gehen.", "example": "Sie blieb noch eine Stunde bei ihrer kranken Freundin.", "is_phrase": false, "pos": "Verb"}, "blitz": {"def": "Ein heller Lichtstrahl am Himmel während eines Gewitters. Er entsteht durch elektrische Entladung in den Wolken.", "example": "Bei dem starken Gewitter sah man viele Blitze am dunklen Himmel.", "is_phrase": false, "pos": "Substantiv"}, "bloß": {"def": "drückt aus, dass etwas nicht wichtig oder nicht schlimm ist; nur, lediglich", "example": "Das war bloß ein kleiner Fehler, nichts Schlimmes.", "is_phrase": false, "pos": "Adverb"}, "boden": {"def": "Wenn jemand zu Boden sinkt, bedeutet das: Die Person fällt langsam nach unten, weil sie sehr schwach, müde oder traurig ist. Man kann nicht mehr stehen.", "example": "Als sie die schlechte Nachricht hörte, sank sie vor Schock zu Boden.", "is_phrase": true, "pos": "Redewendung"}, "bringen": {"def": "jemanden an einen bestimmten Ort transportieren oder führen, oft gegen seinen Willen. Hier bedeutet es: jemanden verhaften und ins Gefängnis einliefern.", "example": "Die Polizei brachte den Dieb nach seiner Verhaftung ins Gefängnis.", "is_phrase": false, "pos": "Verb"}, "decke": {"def": "Die obere Fläche eines Raumes, die über dem Kopf ist. Sie ist das Gegenteil vom Boden.", "example": "An der Decke hängt eine schöne Lampe.", "is_phrase": false, "pos": "Substantiv"}, "denken": {"def": "Mit dem Kopf arbeiten und Gedanken haben. Hier bedeutet es: keine klaren Gedanken mehr haben können, weil man verwirrt, geschockt oder sehr müde ist.", "example": "Nach dem Unfall war sie so geschockt, dass sie nicht mehr denken konnte.", "is_phrase": false, "pos": "Verb"}, "drückte": {"def": "Eine Waffe oder Pistole benutzen und damit schießen. Man betätigt den Abzug, um einen Schuss abzugeben.", "example": "Der Polizist zog seine Pistole und drückte ab, um den Verbrecher zu stoppen.", "is_phrase": true, "pos": "Redewendung"}, "echter": {"def": "wirklich und nicht gespielt oder vorgetäuscht. Hier bedeutet es, dass der Bankraub tatsächlich stattfinden sollte und nicht nur ein Spiel oder eine Übung war.", "example": "Die Polizei dachte erst, es wäre ein Scherz, aber es war ein echter Notfall.", "is_phrase": false, "pos": "Adjektiv"}, "egal": {"def": "bedeutet, dass etwas nicht wichtig ist oder dass man sich nicht dafür interessiert. Man hat keine starken Gefühle dazu und es macht keinen Unterschied.", "example": "Mir ist egal, welchen Film wir heute Abend schauen.", "is_phrase": false, "pos": "Adjektiv"}, "ende": {"def": "Diese Phrase bedeutet, dass eine schwierige Situation so schlimm geworden ist, dass man nicht mehr weitermachen kann. Man hat keine Kraft oder Hoffnung mehr.", "example": "Nach drei Jahren ohne Arbeit sagte er zu seiner Frau: 'Wir sind am Ende, ich weiß nicht mehr weiter.'", "is_phrase": true, "pos": "Redewendung"}, "endlich": {"def": "drückt Ungeduld aus; bedeutet, dass etwas jetzt sofort passieren soll, weil man schon lange wartet", "example": "Komm endlich her, wir warten schon seit einer Stunde auf dich!", "is_phrase": false, "pos": "Adverb"}, "entschieden": {"def": "Eine Wahl treffen oder einen Plan machen. Man hat über etwas nachgedacht und weiß jetzt, was man tun will.", "example": "Nach langem Überlegen hatte sie sich entschieden, den Job zu wechseln.", "is_phrase": false, "pos": "Verb"}, "erwartete": {"def": "Man dachte, dass etwas passieren wird. Man war sich ziemlich sicher, dass es so kommt.", "example": "Sie erwartete, dass ihr Chef sie heute loben würde.", "is_phrase": false, "pos": "Verb"}, "fertig": {"def": "am Ende seiner Kräfte, völlig erschöpft oder kaputt (emotional oder körperlich). Die Person kann nicht mehr weitermachen.", "example": "Nach der schlechten Nachricht war sie völlig fertig und konnte nur noch weinen.", "is_phrase": false, "pos": "Adjektiv"}, "fest": {"def": "Man kann einen Ort nicht verlassen, weil es nicht möglich ist. Man ist gefangen oder blockiert.", "example": "Der Zug fährt wegen des Sturms nicht weiter - wir sitzen am Bahnhof fest.", "is_phrase": true, "pos": "Redewendung"}, "fleck": {"def": "Eine schmutzige oder verfärbte Stelle auf Kleidung oder anderen Oberflächen. Entstehen kann ein Fleck zum Beispiel durch Essen, Trinken oder andere Substanzen.", "example": "Nach dem Essen hatte sie einen großen Fleck von der Tomatensoße auf ihrer weißen Bluse.", "is_phrase": false, "pos": "Substantiv"}, "frage": {"def": "Ein Satz, mit dem man etwas wissen möchte und auf den man eine Antwort erwartet. Man stellt eine Frage, um Informationen zu bekommen.", "example": "Der Polizist stellte dem Verdächtigen viele Fragen zu dem Vorfall.", "is_phrase": false, "pos": "Substantiv"}, "fragte": {"def": "Das ist die Vergangenheitsform von 'fragen'. Es bedeutet, dass jemand eine Frage gestellt hat oder wissen wollte.", "example": "Maria fragte ihren Bruder, ob er ihr helfen kann.", "is_phrase": false, "pos": "Verb"}, "freiwillig": {"def": "aus eigenem Willen, ohne dass jemand dazu zwingen musste. Die Person hat es getan, weil sie es selbst wollte.", "example": "Die Schülerin hat freiwillig bei der Klassenfahrt geholfen.", "is_phrase": false, "pos": "Adverb"}, "freund": {"def": "Eine Person, die man sehr gern hat und mit der man viel Zeit verbringt. Ein bester Freund ist die wichtigste Person unter allen Freunden.", "example": "Mein bester Freund hilft mir immer, wenn ich Probleme habe.", "is_phrase": false, "pos": "Substantiv"}, "gefängnis": {"def": "Ein Ort, wo Menschen eingesperrt werden, die gegen das Gesetz verstoßen haben. Dort müssen sie als Strafe eine bestimmte Zeit bleiben.", "example": "Der Dieb wurde zu drei Jahren Gefängnis verurteilt.", "is_phrase": false, "pos": "Substantiv"}, "gegeben": {"def": "Das ist die Partizip-Form von 'geben'. Es bedeutet hier: eine Person hat einer anderen Person etwas übergeben oder überlassen.", "example": "Die Verkäuferin hat mir das Wechselgeld gegeben.", "is_phrase": false, "pos": "Verb"}, "gehe": {"def": "Eine Person verlässt einen Ort oder eine Situation. Man sagt das, wenn man weggeht oder sich verabschiedet.", "example": "Es ist schon spät, ich gehe jetzt nach Hause.", "is_phrase": false, "pos": "Verb"}, "gekommen": {"def": "Das Partizip II von 'kommen'. Hier bedeutet es: an einen Ort angekommen sein oder sich an einem Ort befinden, nachdem man dorthin gegangen ist.", "example": "Als sie in das alte Haus gekommen war, fühlte sie sich sofort wohl.", "is_phrase": false, "pos": "Verb"}, "geld": {"def": "Münzen und Scheine, die man zum Bezahlen verwendet. Man kann damit Dinge kaufen oder es anderen Personen geben.", "example": "Ich habe nicht genug Geld dabei, um das Buch zu kaufen.", "is_phrase": false, "pos": "Substantiv"}, "gemacht": {"def": "Diese Frage stellt man, wenn man wissen will, was mit einer Person passiert ist oder wie jemand behandelt wurde. Man fragt danach, ob der Person etwas Schlechtes angetan wurde.", "example": "Nach dem Streit fragte sie besorgt: 'Was hast du mit deinem Bruder gemacht? Er weint!'", "is_phrase": true, "pos": "Redewendung"}, "genommen": {"def": "Das ist die Form von 'nehmen' im Perfekt. Es bedeutet hier: Tom hat die Wasserpistole dabei gehabt, als er in die Sparkasse gegangen ist.", "example": "Maria hat ihr Handy mit ins Kino genommen.", "is_phrase": false, "pos": "Verb"}, "genug": {"def": "Man ist müde von einer Situation und will, dass sie aufhört. Man kann nicht mehr und möchte eine Veränderung.", "example": "Nach drei Jahren Streit mit dem Nachbarn hatte sie genug und zog um.", "is_phrase": true, "pos": "Redewendung"}, "gerochen": {"def": "Partizip Perfekt von 'riechen'. Es bedeutet, dass an diesem Ort ein bestimmter Geruch war.", "example": "In der alten Bäckerei hatte es nach frischem Brot gerochen.", "is_phrase": false, "pos": "Verb"}, "geschlafen": {"def": "Das ist die Form von 'schlafen' im Perfekt. Es bedeutet: in der Vergangenheit geschlafen haben, nicht wach gewesen sein.", "example": "Während ich geschlafen habe, ist mein Bruder nach Hause gekommen.", "is_phrase": false, "pos": "Partizip Perfekt"}, "gesicht": {"def": "Der vordere Teil des Kopfes mit Augen, Nase und Mund. Hier ist es der Körperteil, den jemand schlägt.", "example": "Der Ball traf ihn direkt ins Gesicht und seine Nase begann zu bluten.", "is_phrase": false, "pos": "Substantiv"}, "gesichter": {"def": "Das Aussehen einer Person, besonders der vordere Teil des Kopfes mit Augen, Nase und Mund. Die Polizei kann die Personen an ihrem Aussehen erkennen.", "example": "Die Verkäuferin kannte die Gesichter aller Stammkunden im Laden.", "is_phrase": false, "pos": "Substantiv"}, "gesunken": {"def": "sich langsam nach unten bewegt haben, bis man am Boden sitzt oder liegt. Das passiert oft, wenn jemand sehr schwach, müde oder schockiert ist.", "example": "Nach der schlechten Nachricht ist sie auf einen Stuhl gesunken.", "is_phrase": false, "pos": "Verb"}, "griff": {"def": "Die Hand schnell in etwas hineinbewegen, um etwas zu holen oder zu suchen. Man steckt die Hand in eine Tasche, Schublade oder ähnliches.", "example": "Sie griff in ihre Handtasche und holte den Schlüssel heraus.", "is_phrase": false, "pos": "Verb"}, "größer": {"def": "Das Wort bedeutet hier: von der Größe her mehr als vorher. Es zeigt, dass etwas gewachsen ist oder sich ausgebreitet hat.", "example": "Das Loch in meiner Jacke wird immer größer.", "is_phrase": false, "pos": "Adjektiv"}, "habe": {"def": "Hilfsverb zur Bildung des Perfekts (Vergangenheit) mit 'ich'. Wird mit dem Partizip II verwendet, um auszudrücken, dass etwas in der Vergangenheit passiert ist.", "example": "Ich habe gestern einen Film gesehen.", "is_phrase": false, "pos": "Hilfsverb"}, "hals": {"def": "Diese Redewendung bedeutet, dass das Herz sehr schnell und stark schlägt, weil man aufgeregt, nervös oder ängstlich ist. Man spürt den Herzschlag bis hoch zum Hals.", "example": "Vor der wichtigen Prüfung schlug mir das Herz bis zum Hals.", "is_phrase": true, "pos": "Redewendung"}, "halt": {"def": "Eine unhöfliche Art zu sagen, dass jemand aufhören soll zu sprechen oder ruhig sein soll.", "example": "Der Lehrer war genervt und rief: 'Halt die Klappe!'", "is_phrase": true, "pos": "Verb (Imperativ)"}, "hand": {"def": "Der Körperteil am Ende des Arms, mit dem man Dinge greifen und festhalten kann. Sie hat fünf Finger.", "example": "Er nahm das Buch in die Hand und begann zu lesen.", "is_phrase": false, "pos": "Substantiv"}, "hasse": {"def": "Ein sehr starkes negatives Gefühl gegen eine Person haben. Man mag jemanden überhaupt nicht und hat böse Gefühle.", "example": "Nach dem Streit sagte sie: 'Ich hasse meinen Bruder!'", "is_phrase": false, "pos": "Verb"}, "hasst": {"def": "Jemanden sehr stark nicht mögen oder nicht leiden können. Es ist ein starkes negatives Gefühl gegenüber einer Person.", "example": "Sie hasst ihren Chef, weil er immer unfreundlich zu ihr ist.", "is_phrase": false, "pos": "Verb"}, "hast": {"def": "2. Person Singular von 'haben' im Perfekt. Man benutzt es mit einem Partizip, um zu sagen, dass etwas in der Vergangenheit passiert ist.", "example": "Du hast deine Hausaufgaben gemacht.", "is_phrase": false, "pos": "Verb"}, "hatten": {"def": "Vergangenheitsform von 'haben' für mehrere Personen. Es drückt aus, dass etwas in der Vergangenheit möglich oder nicht möglich war.", "example": "Wir hatten keine Zeit, um rechtzeitig anzukommen.", "is_phrase": false, "pos": "Verb"}, "hauptsache": {"def": "Das Wichtigste ist, dass... / Das ist am wichtigsten. Man benutzt diese Phrase, um zu zeigen: Eine Sache ist viel wichtiger als alle anderen.", "example": "Hauptsache, du bist gesund und glücklich.", "is_phrase": true, "pos": "Redewendung"}, "haus": {"def": "Ein Gebäude, in dem Menschen wohnen. Hier meint die Person wahrscheinlich das Haus, in dem sie lebt oder eine Zeit lang war.", "example": "Nach dem Streit mit den Eltern wollte sie nur noch aus dem Haus raus.", "is_phrase": false, "pos": "Substantiv"}, "heraus": {"def": "etwas aus der Tasche, aus einem Behälter oder von einem Ort nach außen nehmen und zeigen", "example": "Er zog seinen Schlüssel aus der Hosentasche heraus.", "is_phrase": false, "pos": "Verb mit Partikel"}, "herz": {"def": "Diese Redewendung bedeutet, dass jemand sehr aufgeregt, nervös oder erschrocken ist. Das Herz schlägt dann sehr schnell und stark.", "example": "Als ich die schlechte Note sah, schlug mir das Herz bis zum Hals.", "is_phrase": true, "pos": "Redewendung"}, "hielt": {"def": "Das ist die Vergangenheitsform von 'halten'. Es bedeutet hier: etwas mit den Händen festhalten oder in eine bestimmte Position bringen.", "example": "Sie hielt das Buch vor ihr Gesicht und las.", "is_phrase": false, "pos": "Verb"}, "hoch": {"def": "Sich langsam vom Boden oder aus einer liegenden Position in eine stehende Position bringen. Man benutzt dabei oft die Wand oder andere Gegenstände als Hilfe.", "example": "Nach dem Sturz schob er sich mühsam an dem Zaun hoch.", "is_phrase": true, "pos": "Redewendung"}, "hätte": {"def": "Form von 'haben' im Konjunktiv II. Wird verwendet, um über Situationen zu sprechen, die nicht real sind oder nicht passiert sind.", "example": "Wenn ich mehr Zeit gehabt hätte, wäre ich zu dir gekommen.", "is_phrase": false, "pos": "Verb"}, "hätten": {"def": "Konjunktiv II von 'haben' - drückt aus, dass etwas in der Vergangenheit möglich oder besser gewesen wäre, aber nicht passiert ist. Zeigt Bedauern oder einen unerfüllten Wunsch.", "example": "Wir hätten früher losfahren sollen, dann wären wir nicht im Stau gestanden.", "is_phrase": false, "pos": "Verb"}, "hütte": {"def": "Ein kleines, einfaches Haus, oft aus Holz gebaut. Meist steht es in der Natur, am Berg oder im Wald.", "example": "Die Familie verbrachte das Wochenende in ihrer kleinen Hütte am See.", "is_phrase": false, "pos": "Substantiv"}, "idiot": {"def": "Keine Erklärung verfügbar.", "example": "", "is_phrase": false, "pos": ""}, "ins": {"def": "Zeigt eine Bewegung oder Richtung in etwas hinein an. Es ist die kurze Form von 'in das'.", "example": "Die Kinder gehen ins Kino und schauen einen Film an.", "is_phrase": false, "pos": "Präposition"}, "irgendwann": {"def": "zu einem nicht bestimmten Zeitpunkt in der Vergangenheit. Es war nicht wichtig, wann genau das passiert ist.", "example": "Irgendwann habe ich aufgehört, täglich Sport zu machen.", "is_phrase": false, "pos": "Adverb"}, "jackentasche": {"def": "Eine Tasche, die sich an einer Jacke befindet. Man kann dort kleine Gegenstände wie Schlüssel, Geld oder ein Handy aufbewahren.", "example": "Er steckte sein Portemonnaie in die Jackentasche und verließ das Haus.", "is_phrase": false, "pos": "Substantiv"}, "jedenfalls": {"def": "Wird verwendet, um eine Schlussfolgerung oder das Wesentliche auszudrücken. Bedeutet hier: aufgrund der Situation ist klar, dass...", "example": "Du antwortest nicht auf meine Nachrichten - jedenfalls habe ich verstanden, dass du Abstand willst.", "is_phrase": false, "pos": "Adverb"}, "jurij": {"def": "Jurij ist der Name einer Person in dieser Geschichte. Es ist ein männlicher Vorname, der aus dem slawischen Sprachraum kommt.", "example": "Jurij half mir bei den Hausaufgaben.", "is_phrase": false, "pos": "Eigenname"}, "kam": {"def": "Vergangenheitsform von 'kommen'. Hier bedeutet es: sich von einem Ort wegbewegen oder einen Ort verlassen.", "example": "Endlich kam sie aus dem dunklen Keller heraus ans Tageslicht.", "is_phrase": false, "pos": "Verb"}, "kannst": {"def": "Du hast die Macht oder Fähigkeit, etwas zu tun. Hier bedeutet es: Du bist nicht stark genug oder hast nicht das Recht, mich zu etwas zu zwingen.", "example": "Du kannst mich nicht dazu bringen, diese Arbeit zu machen.", "is_phrase": false, "pos": "Verb"}, "kassierer": {"def": "Eine Person, die in einem Geschäft oder einer Bank arbeitet und Geld annimmt oder ausgibt. Der Kassierer sitzt meist an der Kasse und bedient die Kunden.", "example": "Die Kassiererin im Supermarkt hat mir das Wechselgeld zurückgegeben.", "is_phrase": false, "pos": "Substantiv"}, "kaum": {"def": "fast gar nicht, nur sehr wenig. Es bedeutet, dass etwas nur in sehr geringem Maß passiert.", "example": "Bei der Hitze konnten wir kaum atmen.", "is_phrase": false, "pos": "Adverb"}, "kennt": {"def": "Wissen, wie jemand aussieht. Man kann die Person erkennen, wenn man sie sieht.", "example": "Die Verkäuferin kennt alle Stammkunden und begrüßt sie mit Namen.", "is_phrase": false, "pos": "Verb"}, "kerze": {"def": "Ein langer, dünner Gegenstand aus Wachs mit einem Faden in der Mitte, der brennt und Licht macht. Man benutzt Kerzen, wenn es dunkel ist oder für eine schöne Atmosphäre.", "example": "Bei dem Stromausfall haben wir eine Kerze angezündet, damit wir etwas sehen konnten.", "is_phrase": false, "pos": "Substantiv"}, "klappe": {"def": "Eine unhöfliche Art zu sagen: 'Sei still!' oder 'Hör auf zu reden!' Man sagt das, wenn man möchte, dass jemand sofort aufhört zu sprechen.", "example": "Als Paul während des Films immer weiter redete, sagte seine Schwester genervt: 'Halt die Klappe!'", "is_phrase": true, "pos": "Redewendung"}, "knall": {"def": "Ein lautes, kurzes Geräusch, das plötzlich entsteht. Oft hört man es bei Explosionen, Gewitter oder wenn etwas platzt.", "example": "Der Knall war so laut, dass alle Kinder erschrocken sind.", "is_phrase": false, "pos": "Substantiv"}, "konnte": {"def": "Vergangenheitsform von können. Zeigt an, dass jemand in der Vergangenheit nicht die Kraft oder Fähigkeit hatte, etwas zu tun.", "example": "Nach dem langen Lauf konnte sie nicht mehr weitergehen.", "is_phrase": false, "pos": "Verb"}, "kopf": {"def": "Der obere Teil des Körpers, wo sich das Gesicht und das Gehirn befinden. Wenn man den Kopf schüttelt, bewegt man ihn von links nach rechts, um 'nein' zu sagen oder etwas abzulehnen.", "example": "Als sie ihn fragte, ob er müde sei, schüttelte er den Kopf.", "is_phrase": true, "pos": "Substantiv, maskulin"}, "krabbelte": {"def": "sich auf Händen und Knien oder auf dem Bauch sehr langsam und mühsam fortbewegen. Man macht das, wenn man verletzt ist oder sich verstecken will.", "example": "Nach dem Sturz krabbelte sie vorsichtig zum Sofa.", "is_phrase": false, "pos": "Verb"}, "kraft": {"def": "Die körperliche Stärke und Energie, die man hat. Hier bedeutet es: so stark wie möglich schlagen.", "example": "Der Boxer schlug mit aller Kraft zu und gewann den Kampf.", "is_phrase": false, "pos": "Substantiv"}, "kriegen": {"def": "jemanden fangen oder fassen, besonders wenn die Person sich versteckt oder wegläuft. Die Polizei oder andere Personen kriegen jemanden, wenn sie ihn endlich finden und festnehmen.", "example": "Der Dieb rannte schnell weg, aber die Polizei konnte ihn trotzdem kriegen.", "is_phrase": false, "pos": "Verb"}, "kämpfen": {"def": "sich sehr anstrengen und nicht aufgeben, auch wenn etwas sehr schwer ist. Gegen Probleme oder schwere Situationen ankommen und weitermachen.", "example": "Nach der schweren Krankheit kämpfte sie jeden Tag, um wieder gesund zu werden.", "is_phrase": false, "pos": "Verb"}, "können": {"def": "drückt aus, dass etwas möglich war oder jemand die Fähigkeit hatte, etwas zu tun. Hier bedeutet es: sie waren nicht imstande zu sehen.", "example": "Wir konnten das Problem erst später verstehen.", "is_phrase": false, "pos": "Verb"}, "könnte": {"def": "Drückt eine Möglichkeit in der Vergangenheit aus. Es bedeutet, dass etwas passieren kann oder dass es nicht sicher ist.", "example": "Maria dachte, dass das Wetter morgen schlecht werden könnte.", "is_phrase": false, "pos": "Verb"}, "lauten": {"def": "sehr stark hörbar, mit viel Geräusch. Das Gegenteil von leise.", "example": "Die Musik war so laut, dass die Nachbarn sich beschwerten.", "is_phrase": false, "pos": "Adjektiv"}, "leiche": {"def": "Der tote Körper eines Menschen. Wenn jemand stirbt, nennt man seinen Körper eine Leiche.", "example": "Die Polizei fand die Leiche im Wald und begann sofort mit den Ermittlungen.", "is_phrase": false, "pos": "Substantiv"}, "leise": {"def": "mit schwacher, niedriger Stimme sprechen, sodass man es kaum hören kann. Man spricht so, wenn man traurig, müde oder unsicher ist.", "example": "Sie sprach so leise, dass ich sie fast nicht verstehen konnte.", "is_phrase": false, "pos": "Adverb"}, "letzte": {"def": "bezeichnet die Frage, die ganz am Ende gestellt wurde, nach allen anderen Fragen", "example": "Der Lehrer stellte viele Fragen, aber auf die letzte Frage wusste niemand eine Antwort.", "is_phrase": false, "pos": "Adjektiv"}, "leute": {"def": "Menschen, die sich an einem bestimmten Ort befinden. Hier sind die Personen gemeint, die in der Bank waren, als Tom sie mit einer Pistole bedroht hat.", "example": "Die Leute im Restaurant haben sehr laut geredet.", "is_phrase": false, "pos": "Substantiv"}, "lina": {"def": "Ein weiblicher Vorname. Hier ist es der Name einer Person, mit der jemand spricht.", "example": "Lina ging in die Küche und machte sich einen Tee.", "is_phrase": false, "pos": "Substantiv"}, "los": {"def": "Ein Ausruf, mit dem man jemanden drängt, etwas schnell zu tun oder zu sagen. Man verwendet es, wenn man ungeduldig ist.", "example": "Los, beeil dich, sonst kommen wir zu spät!", "is_phrase": false, "pos": "Interjektion"}, "magst": {"def": "jemanden gern haben, eine positive Beziehung zu jemandem haben. Das Gegenteil ist: jemanden nicht leiden können.", "example": "Seit unserem Streit magst du mich gar nicht mehr und sprichst kaum noch mit mir.", "is_phrase": false, "pos": "Verb"}, "meinst": {"def": "Du glaubst oder denkst, dass etwas so ist. Man fragt damit nach der Meinung oder Vermutung einer anderen Person.", "example": "Meinst du, es wird heute regnen?", "is_phrase": false, "pos": "Verb"}, "meinte": {"def": "sagte, äußerte eine Meinung oder Gedanken (oft in ruhigem, nachdenklichem Ton). Es ist eine andere Art zu sagen 'sagte' oder 'antwortete'.", "example": "\"Das Wetter ist heute schön\", meinte sie und schaute aus dem Fenster.", "is_phrase": false, "pos": "Verb"}, "mitgenommen": {"def": "etwas von einem Ort an einen anderen Ort tragen oder transportieren. Man nimmt einen Gegenstand mit sich, wenn man irgendwohin geht.", "example": "Warum hast du deinen Regenschirm mitgenommen? Es regnet doch gar nicht.", "is_phrase": false, "pos": "Verb"}, "murmelte": {"def": "Etwas sehr leise und undeutlich sagen, so dass andere es kaum hören können. Man spricht dabei meist in sich hinein oder vor sich hin.", "example": "\"Ich verstehe das nicht\", murmelte sie leise vor sich hin.", "is_phrase": false, "pos": "Verb"}, "mühle": {"def": "Ein Gebäude, in dem früher Getreide gemahlen wurde und das heute oft als Gasthaus oder Restaurant genutzt wird. Hier ist es der Name eines Lokals.", "example": "Wir haben in der Alten Mühle am Dorfrand sehr gut gegessen.", "is_phrase": false, "pos": "Substantiv"}, "neben": {"def": "direkt bei einer Person stehen; sehr nah an jemandem sein", "example": "Ich drehte mich um und meine Schwester war plötzlich neben mir.", "is_phrase": false, "pos": "Präposition"}, "notfall": {"def": "Eine gefährliche Situation, in der man sich schnell schützen oder helfen muss. Man weiß nicht genau, wann diese Situation kommt, aber man bereitet sich darauf vor.", "example": "Sie hat immer Pfefferspray dabei, um sich im Notfall gegen Angreifer zu wehren.", "is_phrase": false, "pos": "Substantiv"}, "nächsten": {"def": "Die Stunden, die direkt nach diesem Moment kommen. Es bedeutet die Zeit, die gleich folgt.", "example": "Am nächsten Tag regnete es stark.", "is_phrase": false, "pos": "Adjektiv"}, "passiert": {"def": "geschehen, stattfinden. Man benutzt es oft, wenn man sagt, dass etwas nicht gut oder schlecht war.", "example": "Wenn ich pünktlich gekommen wäre, wäre der Unfall nicht passiert.", "is_phrase": false, "pos": "Verb"}, "passierte": {"def": "geschehen, sich ereignen. Man verwendet es, wenn etwas mit einer Person oder Sache passiert oder ihr widerfährt.", "example": "Nach dem Unfall wollte sie nicht darüber sprechen, was passiert war.", "is_phrase": false, "pos": "Verb"}, "pistole": {"def": "Eine kleine Waffe, die man in der Hand hält und mit der man schießen kann. Man benutzt sie, um andere Menschen zu bedrohen oder zu verletzen.", "example": "Der Polizist trug eine Pistole am Gürtel.", "is_phrase": false, "pos": "Substantiv"}, "platz": {"def": "Eine bestimmte Stelle oder Position, wo jemand sitzt, liegt oder steht. Oft der gewohnte oder zugewiesene Ort einer Person.", "example": "Nach der Pause ging jeder Schüler wieder an seinen Platz zurück.", "is_phrase": false, "pos": "Substantiv"}, "plötzlich": {"def": "ohne Vorwarnung, sehr schnell und unerwartet. Es passiert so schnell, dass man nicht damit gerechnet hat.", "example": "Plötzlich begann es zu regnen, obwohl der Himmel noch blau war.", "is_phrase": false, "pos": "Adverb"}, "polizei": {"def": "Die staatliche Organisation, die für Sicherheit und Ordnung sorgt und Verbrecher verfolgt. Wenn man etwas Illegales getan hat, kann die Polizei einen verhaften.", "example": "Nach dem Einbruch rief der Nachbar sofort die Polizei.", "is_phrase": false, "pos": "Substantiv"}, "polizist": {"def": "Eine Person, die für die Polizei arbeitet und für Sicherheit und Ordnung sorgt. Polizisten können Verbrecher verhaften und kennen oft die Gesichter von bekannten Kriminellen.", "example": "Der Polizist erkannte den Dieb sofort, weil er ihn schon mehrmals verhaftet hatte.", "is_phrase": false, "pos": "Substantiv"}, "pullover": {"def": "Ein warmes Kleidungsstück aus Wolle oder anderem Material, das man über dem Hemd trägt. Es hat lange Ärmel und wird über den Kopf angezogen.", "example": "Sie zog ihren dicken Pullover an, weil es draußen kalt war.", "is_phrase": false, "pos": "Substantiv"}, "raus": {"def": "nach draußen, weg von einem Ort. Man verwendet es, wenn man einen Ort verlassen möchte oder muss.", "example": "Nach dem Streit wollte sie nur noch raus aus der Wohnung.", "is_phrase": false, "pos": "Adverb"}, "rausgegangen": {"def": "Diese Wendung bedeutet: aus einer schwierigen Situation weggehen oder sich aus einem Problem zurückziehen. Man verlässt eine unangenehme oder belastende Lage, anstatt weiterzumachen.", "example": "Nach dem großen Streit mit seinem Chef wäre er am liebsten rausgegangen und hätte den Job aufgegeben.", "is_phrase": true, "pos": "Redewendung"}, "reagierte": {"def": "Eine Antwort geben oder zeigen, dass man etwas gehört oder verstanden hat. Hier bedeutet es: Tom hat nichts gesagt und keine Reaktion gezeigt.", "example": "Als sie ihm sagte, dass sie wegziehen würde, reagierte er überhaupt nicht.", "is_phrase": false, "pos": "Verb"}, "redest": {"def": "Du sprichst über etwas. Hier bedeutet es: Du machst das Geld zum Thema von Gesprächen.", "example": "Warum redest du immer nur von deiner Arbeit?", "is_phrase": false, "pos": "Verb"}, "redete": {"def": "Vergangenheitsform von 'reden': sprechen, etwas sagen. Hier bedeutet es, dass die Person gerade sprach oder etwas erzählte.", "example": "Während sie redete, hörten alle aufmerksam zu.", "is_phrase": false, "pos": "Verb"}, "reingerissen": {"def": "jemanden in eine schwierige oder gefährliche Situation hineinziehen, obwohl diese Person ursprünglich nicht betroffen war. Die Person wird ungewollt in ein Problem oder einen Konflikt hineingezogen.", "example": "Durch seinen Streit mit dem Chef hat er auch seine Kollegen mit reingezogen.", "is_phrase": false, "pos": "Verb"}, "richtete": {"def": "Eine Waffe so halten und zielen, dass sie auf eine Person oder ein Ziel zeigt. Man macht das, um zu drohen oder um zu schießen.", "example": "Der Räuber richtete seine Waffe auf den Kassierer und forderte das Geld.", "is_phrase": false, "pos": "Verb"}, "rief": {"def": "Etwas laut sagen oder schreien. Man benutzt es, wenn jemand mit lauter Stimme spricht, oft weil die Person aufgeregt ist oder Aufmerksamkeit will.", "example": "\"Hilfe!\", rief das Kind, als es den großen Hund sah.", "is_phrase": false, "pos": "Verb"}, "roch": {"def": "Vergangenheitsform von 'riechen'. Es bedeutet, dass man einen Geruch in der Nase gespürt hat.", "example": "In der Küche roch es nach frischem Brot.", "is_phrase": false, "pos": "Verb"}, "ruhig": {"def": "ohne Aufregung, mit kontrollierten Gefühlen sprechen. Die Person zeigt keine Nervosität oder Angst in der Stimme.", "example": "Obwohl er sehr wütend war, antwortete er ruhig auf ihre Vorwürfe.", "is_phrase": false, "pos": "Adverb"}, "sag": {"def": "Eine Person bittet eine andere Person dringend, etwas zu erzählen oder mitzuteilen. Das Wort wird hier als Befehl oder dringende Bitte verwendet.", "example": "Sag mir endlich, was gestern passiert ist!", "is_phrase": false, "pos": "Verb"}, "sagte": {"def": "Die Vergangenheitsform von 'sagen'. Man benutzt es, wenn man erzählt, was jemand früher gesprochen hat.", "example": "Meine Mutter sagte mir gestern, dass ich früh nach Hause kommen soll.", "is_phrase": false, "pos": "Verb"}, "sagten": {"def": "Vergangenheitsform von 'sagen': Wörter sprechen oder äußern. Hier bedeutet es, dass die Personen geschwiegen haben und nichts gesprochen haben.", "example": "Nach dem Streit sagten die beiden Freunde den ganzen Abend nichts zueinander.", "is_phrase": false, "pos": "Verb"}, "sah": {"def": "Präteritum (Vergangenheitsform) von 'sehen'. Bedeutet: mit den Augen wahrnehmen oder bemerken.", "example": "Gestern sah ich einen schönen Vogel im Garten.", "is_phrase": false, "pos": "Verb"}, "schleppte": {"def": "Sich mit großer Mühe und sehr langsam irgendwohin bewegen, weil man erschöpft, krank oder sehr schwach ist. Man kann sich kaum noch normal gehen.", "example": "Nach dem langen Lauf schleppte sie sich müde nach Hause.", "is_phrase": true, "pos": "Redewendung"}, "schlug": {"def": "Vergangenheitsform von 'schlagen'. In Beleg 1: Das Herz klopft sehr schnell und stark (vor Aufregung oder Angst). In Beleg 2: jemanden mit der Hand oder Faust treffen und verletzen.", "example": "Als ich die schlechte Note sah, schlug mein Herz so schnell, dass ich es deutlich spürte.", "is_phrase": false, "pos": "Verb"}, "schmerzen": {"def": "Ein unangenehmes Gefühl im Körper, wenn etwas weh tut oder verletzt ist. Man spürt es, wenn man krank ist oder sich verletzt hat.", "example": "Nach dem Sturz hatte sie starke Schmerzen im Bein.", "is_phrase": false, "pos": "Substantiv"}, "schob": {"def": "Sich mit Hilfe der Wand langsam vom Boden oder aus einer liegenden Position nach oben bewegen und aufstehen. Man stützt sich dabei an der Wand ab.", "example": "Nach dem Sturz schob er sich mühsam an der Hauswand hoch und stand wieder auf.", "is_phrase": true, "pos": "Redewendung"}, "schrie": {"def": "Sehr laut und mit viel Emotion sprechen, meist aus Wut oder Aufregung. Man ruft dabei lauter als normal.", "example": "Der Trainer schrie die Spieler an, weil sie schlecht gespielt hatten.", "is_phrase": false, "pos": "Verb"}, "schultern": {"def": "Eine Körperbewegung, die zeigt, dass man etwas nicht weiß, dass es einem egal ist oder dass man unsicher ist. Man hebt dabei beide Schultern kurz nach oben.", "example": "Als ich sie fragte, wo ihr Bruder ist, zuckte sie nur die Schultern.", "is_phrase": true, "pos": "Redewendung"}, "schuss": {"def": "Das Abfeuern einer Waffe wie einer Pistole oder einem Gewehr. Dabei entsteht ein lauter Knall und oft ein verbrannter Geruch.", "example": "Der Polizist hörte einen Schuss aus dem Wald kommen.", "is_phrase": false, "pos": "Substantiv"}, "schwach": {"def": "Wenn jemand schwach aussieht, wirkt die Person krank, müde oder ohne Kraft. Man sieht, dass die Person nicht gesund oder nicht stark ist.", "example": "Nach der langen Krankheit sah Maria noch sehr schwach aus.", "is_phrase": false, "pos": "Adjektiv"}, "schwein": {"def": "Ein sehr unhöfliches Schimpfwort für eine Person, die sich schlecht oder gemein verhält. Man sagt das, wenn man sehr wütend auf jemanden ist.", "example": "Nach dem Streit nannte sie ihren Ex-Freund ein Schwein, weil er sie betrogen hatte.", "is_phrase": false, "pos": "Substantiv"}, "schwer": {"def": "Mit Mühe und Anstrengung, nicht leicht. Es zeigt, dass etwas schwierig ist oder viel Kraft braucht.", "example": "Nach dem Marathon atmete sie schwer und musste sich hinsetzen.", "is_phrase": false, "pos": "Adverb"}, "schwöre": {"def": "Eine sehr starke Art zu sagen, dass etwas wahr ist oder dass man etwas bestimmt tun wird. Man verspricht es mit großer Sicherheit und Ernst.", "example": "Ich schwöre dir, dass ich pünktlich da sein werde!", "is_phrase": false, "pos": "Verb"}, "schüttelte": {"def": "Das bedeutet: nein sagen oder zeigen, dass man nicht einverstanden ist. Man bewegt den Kopf von links nach rechts, um zu zeigen, dass etwas nicht stimmt oder man etwas ablehnt.", "example": "Als der Lehrer fragte, ob ich meine Hausaufgaben gemacht hatte, schüttelte ich den Kopf.", "is_phrase": true, "pos": "Redewendung"}, "setz": {"def": "Eine Aufforderung, die bedeutet: Du sollst dich hinsetzen. Man sagt das, wenn jemand stehen soll aufhören zu stehen und sich auf einen Stuhl oder eine andere Sitzgelegenheit setzen soll.", "example": "Die Lehrerin sagte zu den Schülern: 'Setz dich bitte, der Unterricht beginnt.'", "is_phrase": true, "pos": "Redewendung"}, "setzte": {"def": "Vergangenheitsform von 'sich setzen': den Körper auf einen Stuhl, eine Bank oder einen anderen Platz bringen, um zu sitzen.", "example": "Nach der langen Wanderung setzte sie sich auf die Bank im Park.", "is_phrase": false, "pos": "Verb"}, "sitzen": {"def": "Man kann einen Ort nicht verlassen oder sich nicht von dort wegbewegen. Man ist gefangen oder blockiert.", "example": "Nach dem Schneesturm saßen die Touristen drei Tage im Hotel fest.", "is_phrase": true, "pos": "Redewendung"}, "sollen": {"def": "Drückt aus, dass etwas in der Vergangenheit richtig oder notwendig gewesen wäre, aber nicht gemacht wurde. Man bereut, dass man es nicht getan hat.", "example": "Ich hätte früher mit dem Lernen anfangen sollen, dann wäre die Prüfung leichter gewesen.", "is_phrase": false, "pos": "Modalverb"}, "sollten": {"def": "Drückt hier einen Wunsch oder eine Hoffnung aus, dass etwas passieren möge. Es ist eine höfliche oder literarische Art zu sagen 'ich hoffe, dass' oder 'mögen sie doch'.", "example": "Sollte er doch endlich kommen und mir helfen!", "is_phrase": false, "pos": "Modalverb"}, "sparkasse": {"def": "Eine Bank, die den Menschen in einer Stadt oder Region gehört und wo man Geld sparen und Kredite bekommen kann. Es ist ein Gebäude, in das normalerweise keine Waffen mitgenommen werden dürfen.", "example": "Meine Oma geht jeden Monat zur Sparkasse, um Geld von ihrem Sparbuch abzuheben.", "is_phrase": false, "pos": "Substantiv"}, "spiel": {"def": "Eine Aktivität mit Regeln, bei der man gewinnen oder verlieren kann. Kann auch eine schwierige Situation im Leben bedeuten, die man meistern muss.", "example": "Nach dem verlorenen Fußballspiel waren alle Spieler traurig.", "is_phrase": false, "pos": "Substantiv"}, "stand": {"def": "Bedeutet: sich erheben, von einem Sitz oder einer liegenden Position in eine stehende Position wechseln. Man beendet das Sitzen oder Liegen und stellt sich auf die Füße.", "example": "Nach dem Essen stand sie auf und räumte den Tisch ab.", "is_phrase": true, "pos": "Redewendung"}, "stelle": {"def": "Bedeutet: freiwillig zur Polizei gehen und sich als Verdächtiger oder Täter melden. Man gibt sich selbst bei der Polizei auf.", "example": "Nach dem Unfall stellte er sich der Polizei und erzählte alles.", "is_phrase": true, "pos": "Redewendung"}, "stunden": {"def": "Zeitraum von 60 Minuten. Hier bedeutet es: eine längere Zeit, mehrere Zeitabschnitte.", "example": "Wir warteten drei Stunden am Bahnhof auf den verspäteten Zug.", "is_phrase": false, "pos": "Substantiv"}, "stürzte": {"def": "Sich schnell und mit viel Energie auf eine Person bewegen, um sie anzugreifen oder zu packen. Man macht das meist aus Wut oder in einer emotionalen Situation.", "example": "Als er die Beleidigung hörte, stürzte er sich auf seinen Gegner.", "is_phrase": true, "pos": "Redewendung"}, "teilen": {"def": "etwas in gleiche oder faire Teile aufteilen, sodass jeder Person etwa gleich viel bekommt", "example": "Die drei Freunde wollten den Gewinn gerecht teilen.", "is_phrase": false, "pos": "Verb"}, "tom": {"def": "Tom ist ein männlicher Vorname. In diesem Text ist Tom eine Person, die in der Geschichte vorkommt.", "example": "Tom ist heute nicht in die Schule gekommen.", "is_phrase": false, "pos": "Eigenname"}, "tot": {"def": "Nicht mehr am Leben. Eine Person oder ein Tier ist gestorben.", "example": "Der alte Hund war krank und ist gestern tot aufgefunden worden.", "is_phrase": false, "pos": "Adjektiv"}, "trennen": {"def": "Wenn zwei oder mehr Personen sich trennen, gehen sie verschiedene Wege und sind nicht mehr zusammen. Sie verabschieden sich und jeder geht woanders hin.", "example": "Nach dem Streit beschlossen die beiden Freunde, sich zu trennen und allein weiterzugehen.", "is_phrase": false, "pos": "Verb"}, "tritt": {"def": "Jemandem einen Tritt versetzen bedeutet, jemanden mit dem Fuß zu stoßen oder zu schlagen. Man macht das, wenn man wütend ist oder jemanden bestrafen will.", "example": "Als der Hund nicht hörte, wollte der Mann ihm einen Tritt geben.", "is_phrase": true, "pos": "Redewendung"}, "umgebracht": {"def": "jemanden töten, das Leben von jemandem beenden. Das Wort wird verwendet, wenn eine Person eine andere Person getötet hat.", "example": "Der Täter hatte den Mann mit einem Messer umgebracht.", "is_phrase": false, "pos": "Verb"}, "unfall": {"def": "Ein Ereignis, bei dem jemand verletzt wird oder etwas kaputt geht, ohne dass es jemand absichtlich gemacht hat. Es passiert plötzlich und niemand wollte es.", "example": "Bei dem Unfall auf der Autobahn wurde zum Glück niemand schwer verletzt.", "is_phrase": false, "pos": "Substantiv"}, "unsere": {"def": "Zeigt an, dass etwas zu uns gehört oder mit uns verbunden ist. Hier bedeutet es: die Gesichter von mir und meinen Freunden/Partnern.", "example": "Die Nachbarn kennen unsere Namen schon seit Jahren.", "is_phrase": false, "pos": "Possessivpronomen"}, "verbrannt": {"def": "riecht nach Feuer oder Rauch, wie wenn etwas brennt oder gebrannt hat. Dieser Geruch entsteht oft durch Hitze, Feuer oder Explosionen.", "example": "Nach dem Feuerwerk roch die Luft verbrannt.", "is_phrase": false, "pos": "Adjektiv"}, "verdammtes": {"def": "Ein sehr starkes Schimpfwort, das zeigt, dass man sehr wütend oder ärgerlich über jemanden ist. Es macht die Beleidigung noch schlimmer.", "example": "Sie war so wütend auf ihren Bruder, dass sie ihn einen verdammten Idioten nannte.", "is_phrase": false, "pos": "Adjektiv"}, "verloren": {"def": "nicht gewonnen haben; bei einem Wettkampf oder Spiel schlechter sein als der Gegner", "example": "Unser Team hat das Fußballspiel mit 1:3 verloren.", "is_phrase": false, "pos": "Partizip Perfekt"}, "verpasst": {"def": "Jemandem einen Tritt verpassen bedeutet: jemanden treten oder schlagen. Man will einer Person wehtun oder sie bestrafen.", "example": "Der Junge war so wütend auf seinen Bruder, dass er ihm einen Tritt verpasst hat.", "is_phrase": true, "pos": "Redewendung"}, "verrückt": {"def": "Das sagt man, wenn jemand etwas Unglaubliches oder Falsches behauptet. Es bedeutet hier: 'Das ist völlig falsch' oder 'Das kannst du nicht ernst meinen'.", "example": "Als er sagte, er könne fliegen, rief ich: 'Du bist ja verrückt!'", "is_phrase": false, "pos": "Adjektiv"}, "verteidigen": {"def": "sich gegen einen Angriff oder eine Gefahr schützen und zurückkämpfen. Man wehrt sich, wenn jemand einem schaden will.", "example": "Als der Dieb ihn angriff, musste er sich mit seinen Händen verteidigen.", "is_phrase": false, "pos": "Verb"}, "vorbei": {"def": "Eine Situation, Beziehung oder Zeit ist zu Ende und wird nicht mehr fortgesetzt.", "example": "Nach fünf Jahren Ehe sagten sie sich: Es ist vorbei zwischen uns.", "is_phrase": false, "pos": "Adjektiv"}, "waffe": {"def": "Ein Gegenstand, mit dem man kämpfen oder jemanden verletzen kann, zum Beispiel eine Pistole oder ein Messer. Damit kann man schießen oder andere Menschen bedrohen.", "example": "Der Polizist trug eine Waffe am Gürtel.", "is_phrase": false, "pos": "Substantiv"}, "wand": {"def": "Eine senkrechte Fläche in einem Raum oder Gebäude, die den Raum begrenzt. Man kann sich daran abstützen oder anlehnen.", "example": "Sie lehnte müde ihren Rücken an die kalte Wand.", "is_phrase": false, "pos": "Substantiv"}, "was": {"def": "Ein Wort, mit dem man eine Frage stellt, wenn man etwas nicht weiß oder verstehen möchte. Man benutzt es, um nach Dingen, Handlungen oder Situationen zu fragen.", "example": "Was machst du heute Abend?", "is_phrase": false, "pos": "Fragepronomen"}, "wasserpistole": {"def": "Eine Waffe, die wie eine echte Pistole aussieht, aber nur Wasser verschießt. Wird normalerweise als Spielzeug verwendet, kann aber auch bei Verbrechen eingesetzt werden, um andere zu bedrohen.", "example": "Der Räuber bedrohte die Kassiererin mit einer Wasserpistole, die wie eine echte Waffe aussah.", "is_phrase": false, "pos": "Substantiv"}, "weggebracht": {"def": "Eine Leiche an einen anderen Ort bringen, damit niemand sie findet. Man versteckt oder beseitigt den toten Körper.", "example": "Nach dem Unfall hat er den toten Körper weggebracht, damit die Polizei ihn nicht findet.", "is_phrase": false, "pos": "Verb"}, "wehrte": {"def": "Wenn man sich nicht wehrt, bedeutet das: Man kämpft nicht gegen etwas oder jemanden. Man lässt etwas mit sich geschehen, ohne zu protestieren oder sich zu verteidigen.", "example": "Als die anderen Kinder ihn ärgerten, wehrte er sich nicht und ging einfach weg.", "is_phrase": true, "pos": "Redewendung"}, "weiß": {"def": "Das sagt man, wenn man etwas nicht weiß oder sich bei einer Sache nicht sicher ist. Es ist eine kurze Art zu sagen: 'Das weiß ich nicht'.", "example": "Wann kommt der Bus? - Weiß ich nicht, vielleicht in zehn Minuten.", "is_phrase": true, "pos": "Redewendung"}, "wieso": {"def": "Eine Frage nach dem Grund oder der Ursache für etwas. Man fragt damit, warum jemand etwas getan hat oder warum etwas passiert ist.", "example": "Wieso bist du so spät nach Hause gekommen?", "is_phrase": false, "pos": "Adverb"}, "wischte": {"def": "Diese Bewegung macht man, wenn man weint oder fast weint. Man bewegt die Hand über die Augen, um Tränen wegzumachen oder zu verstecken, dass man traurig ist.", "example": "Nach dem traurigen Film wischte sie sich schnell über die Augen, bevor jemand ihre Tränen sehen konnte.", "is_phrase": true, "pos": "Redewendung"}, "wissen": {"def": "Eine Information oder Antwort auf eine Frage bekommen möchten. Man möchte erfahren, was passiert ist oder wie etwas ist.", "example": "Nach dem Unfall wollte sie wissen, ob alle in Ordnung waren.", "is_phrase": false, "pos": "Verb"}, "wollte": {"def": "Vergangenheitsform von 'wollen': den Wunsch oder die Absicht haben, etwas zu tun oder zu bekommen", "example": "Sie wollte heute ins Kino gehen, aber dann wurde sie krank.", "is_phrase": false, "pos": "Verb"}, "während": {"def": "Zeigt an, dass zwei Handlungen zur gleichen Zeit passieren. Es bedeutet: in der Zeit, als etwas anderes geschah.", "example": "Während sie kochte, hörte sie Musik.", "is_phrase": false, "pos": "Konjunktion"}, "wäre": {"def": "Konjunktiv II von 'sein' - drückt aus, was in einer anderen Situation passiert wäre oder was man getan hätte. Wird für irreale Bedingungen und hypothetische Situationen verwendet.", "example": "Wenn ich mehr Zeit gehabt hätte, wäre ich länger geblieben.", "is_phrase": false, "pos": "Verb"}, "zog": {"def": "etwas schnell aus der Tasche oder einem anderen Ort herausnehmen und zeigen. Man macht eine schnelle Bewegung, um etwas hervorzuholen.", "example": "Der Polizist zog seinen Ausweis aus der Jacke und zeigte ihn dem Mann.", "is_phrase": false, "pos": "Verb"}, "zuckte": {"def": "Eine Körperbewegung, die zeigt, dass man etwas nicht weiß oder dass einem etwas egal ist. Man hebt beide Schultern kurz nach oben.", "example": "Als sie ihn fragte, wo sein Bruder ist, zuckte er nur die Schultern.", "is_phrase": true, "pos": "Redewendung"}, "zurück": {"def": "An den Ort, wo man vorher war. Man bewegt sich zu einem Platz, an dem man schon einmal gewesen ist.", "example": "Nach der Pause gingen alle Schüler zu ihren Plätzen zurück.", "is_phrase": false, "pos": "Adverb"}, "zwingen": {"def": "jemanden mit Macht oder Druck dazu bringen, etwas zu tun, was er nicht will. Die Person hat keine freie Wahl.", "example": "Der Chef kann seine Mitarbeiter nicht zwingen, am Wochenende zu arbeiten.", "is_phrase": false, "pos": "Verb"}, "zündete": {"def": "Eine Kerze anzünden bedeutet, dass man die Kerze mit einem Streichholz oder Feuerzeug zum Brennen bringt. Das Feuer fängt am Docht der Kerze an und die Kerze gibt dann Licht.", "example": "Wegen des Stromausfalls zündete sie mehrere Kerzen an, um das Zimmer zu erhellen.", "is_phrase": true, "pos": "Redewendung"}, "öffnete": {"def": "Die Augen aufmachen, nachdem sie geschlossen waren. Man macht das zum Beispiel nach dem Schlafen oder wenn man bewusst hinschauen will.", "example": "Nach dem kurzen Schlaf öffnete sie langsam die Augen und sah das Sonnenlicht.", "is_phrase": false, "pos": "Verb"}, "über": {"def": "zeigt eine Bewegung von einer Seite zur anderen Seite einer Körperstelle. Man berührt dabei die ganze Fläche.", "example": "Sie strich sich über die Wange, um die Träne wegzuwischen.", "is_phrase": false, "pos": "Präposition"}, "überhaupt": {"def": "Zeigt Verwunderung oder Überraschung bei einer Frage. Man fragt damit nach dem Grund für etwas, das man nicht verstehen kann.", "example": "Warum bist du überhaupt so spät nach Hause gekommen?", "is_phrase": false, "pos": "Adverb"}, "überlegte": {"def": "nachdenken über etwas; eine Situation oder Information in Gedanken durchgehen und darüber reflektieren", "example": "Sie überlegte lange, ob sie den Job annehmen sollte.", "is_phrase": false, "pos": "Verb"}};

function render() {
  const tb = document.getElementById('tb');
  const raw = "In den n\u00e4chsten Stunden sagten wir nichts.\nWir bewegten uns kaum. Dann z\u00fcndete ich eine Kerze an.\n\nTom atmete schwer.\nIch sagte: \u201eEs ist vorbei. Wir sind am Ende, Tom.\u201c\nEr reagierte nicht.\n\u201eWir haben das Spiel verloren\u201c, meinte ich.\nJetzt \u00f6ffnete er die Augen.\n\u201eHalt die Klappe, Lina.\u201c\n\u201eWas hast du mit Jurij gemacht?\u201c, wollte ich wissen.\n\u201eEr ist abgehauen\u201c, murmelte Tom.\n\u201eIst er nicht. Du hast ihn umgebracht.\u201c\n\u201eDu bist ja verr\u00fcckt!\u201c\n\u201eDu hast seine Leiche weggebracht, als ich geschlafen habe\u201c, sagte ich.\n\u201eUnd wenn es so war?\u201c  fragte Tom.\nIch antwortete ihm nicht, sondern stand auf. \u201eIch gehe\u201c, sagte ich. \u201eIch stelle mich der Polizei.\u201c\nTom schob sich an der Wand hoch.\n\u201eDu bleibst hier\u201c, murmelte er.\n\u201eDu kannst mich nicht zwingen\u201c, sagte ich ruhig. Ich erwartete, dass Tom mich angriff. Dann h\u00e4tte ich ihm einen Tritt verpasst.\nAber Tom sah schwach aus. Er konnte nicht mehr k\u00e4mpfen.\n\nIch hatte mich entschieden:\nIch wollte nicht mehr. Jetzt war es mir egal, was mit mir passierte. Sollten sie mich doch ins Gef\u00e4ngnis bringen. Hauptsache, ich kam hier raus aus diesem Haus.\n\n\u201eAch?\u201c, sagte Tom und griff in eine Jackentasche. Wollte er mir Geld geben, damit ich bei ihm blieb? Aber Tom zog kein Geld heraus, sondern eine Pistole.\nEr richtete die Pistole auf mich.\nDas war der Beweis: Tom hatte doch eine Wasserpistole mit in die Sparkasse\ngenommen. Er hatte den Kassierer und die anderen Angestellten bedroht.\nJurij und ich hatten das von au\u00dfen nur nicht sehen k\u00f6nnen.\nTom befahl: \u201eSetz dich!\u201c\n\u201eIdiot!\u201c, sagte ich. \u201eMeinst du, ich habe vor einer Wasserpistole Angst?\u201c\nPl\u00f6tzlich war er neben mir.\n\u201eDas ist keine Wasserpistole\u201c, sagte er. Tom hielt die Waffe gegen\ndie Decke und dr\u00fcckte ab. Es gab einen Blitz und einen lauten Knall.\n\nNach dem Schuss roch es verbrannt.\nSo hatte es auch gerochen, als ich wieder in die \u201eAlte M\u00fchle\u201c gekommen war.\n\u201eSetz dich\u201c, sagte Tom. \u201eSetz dich endlich hin.\u201c\nIch setzte mich. Er schleppte sich zu seinem Platz.\nIch sah, dass er Schmerzen hatte.\nDie Pistole hielt er weiter in der Hand.\n\nIch sagte: \u201eDu hast die Leute in der Bank mit der Pistole bedroht.\u201c\nTom sch\u00fcttelte den Kopf. \u201eDas habe ich nicht. Der Kassierer hat mir das Geld freiwillig gegeben. Ich schw\u00f6re es!\u201c\n\n\u201eWieso hast du die Pistole \u00fcberhaupt mitgenommen?\u201c, fragte ich. \u201eEs war doch\nblo\u00df ein Spiel! Und wo hast du die Waffe her?\u201c\nAuf die letzte Frage antwortete er nicht.\n\u201eIch wollte mich im Notfall verteidigen\u201c, sagte er nur.\n\nIch \u00fcberlegte: Tom war also davon ausgegangen, dass es ein echter Bank-\u00fcberfall werden k\u00f6nnte.\n\u201eDu hast Jurij und mich mit reingerissen\u201c, sagte ich.\nEr zuckte die Schultern. \u201eEs w\u00e4re nichts passiert, wenn mir der Kassierer nicht das Geld gegeben h\u00e4tte. Ich w\u00e4re rausgegangen und fertig.\u201c\nEr wischte sich \u00fcber die Augen.\n\u201eWir h\u00e4tten das Geld in der H\u00fctte teilen und uns trennen sollen\u201c, murmelte er.\n\u201eDann h\u00e4tte es die Polizei schwer, uns zu kriegen.\u201c\n\u201eGeld! Geld!\u201c, schrie ich ihn an. \u201eImmer redest du nur von dem Geld! Das Geld ist doch egal! Wir sitzen hier fest. Jeder Polizist kennt unsere Gesichter.\u201c\n\nW\u00e4hrend ich redete, war Tom zu Boden gesunken. Der Fleck auf seinem Pullover war jetzt gr\u00f6\u00dfer.\n\u201eWas ist mit Jurij?\u201c, rief ich. \u201eLos, sag es mir!\u201c\nEr \u00f6ffnete die Augen. \u201eDu hasst mich\u201c, sagte er.\n\u201eOb ich dich hasse? Wei\u00df ich nicht\u201c, meinte ich. \u201eWas hast du mit Jurij gemacht?\u201c\n\u201eJedenfalls magst du mich nicht mehr\u201c, sagte er.\n\u201eWas ist mit Jurij?\u201c, rief ich. \nTom sagte: \u201eEr ist tot.\u201c\nTot? Jurij tot? Ich konnte nicht mehr denken. Das Herz schlug mir bis zum Hals. \n\nIch st\u00fcrzte mich auf Tom und schlug ihn mit aller Kraft ins Gesicht. Immer und immer wieder. Er wehrte sich nicht.\n\nIrgendwann hatte ich genug.\nIch krabbelte zu meinem Platz zur\u00fcck.\n\u201eJurij war mein bester Freund\u201c, sagte ich.\n\u201eDu hast ihn umgebracht. Du bist du ein verdammtes Schwein, Tom!\u201c\nEr sch\u00fcttelte den Kopf. \u201eEs war ein Unfall. Ich wollte das nicht\u201c, sagte er leise.\n\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t\n\r]+$/.test(tok)) { html += tok; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'')
                   .toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" onclick="show(event,\'' + key + '\')">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

function show(e, k) {
  const d = DICT[k]; if (!d) return;

  // Aktives Wort hervorheben
  if (activeEl) activeEl.classList.remove('active');
  activeEl = e.currentTarget;
  activeEl.classList.add('active', 'seen');

  // Panel befüllen
  document.getElementById('pWord').textContent = k;
  document.getElementById('pPos').textContent  = d.pos || '';
  document.getElementById('pDef').textContent  = d.def || '';

  const pEx = document.getElementById('pEx');
  if (d.example) {
    pEx.textContent = '\u201e' + d.example + '\u201c';
    pEx.style.display = 'block';
  } else {
    pEx.style.display = 'none';
  }

  const pBadge = document.getElementById('pBadge');
  pBadge.style.display = d.is_phrase ? 'inline-block' : 'none';

  document.getElementById('panelEmpty').style.display   = 'none';
  document.getElementById('panelContent').classList.add('visible');

  // Tracking
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(ex) {}
}

document.addEventListener('DOMContentLoaded', render);
</script>
