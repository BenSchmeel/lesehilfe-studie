<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --panel-bg:#2c2420;--panel-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
    --panel-width:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}

  /* ── Layout: Text links, Panel rechts ── */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1060px;
    margin:0 auto;
    padding:24px 16px 60px;
    gap:20px;
  }
  .main{flex:1;min-width:0;}

  /* ── Erklärungsleiste rechts ── */
  .panel{
    width:var(--panel-width);
    flex-shrink:0;
    position:sticky;
    top:20px;
    background:var(--panel-bg);
    border-radius:8px;
    padding:18px 16px;
    color:var(--panel-text);
    font-size:.88rem;
    line-height:1.65;
    min-height:180px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    transition:opacity .2s;
  }
  .panel-empty{
    opacity:.45;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.82rem;
    color:#9e8a78;
    min-height:120px;
  }
  .panel-content{display:none;}
  .panel-content.visible{display:block;}
  .p-badge{
    display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
    border-radius:3px;padding:1px 7px;margin-bottom:8px;letter-spacing:.04em;
  }
  .p-word{
    font-family:'Lora',serif;font-weight:600;font-size:1.05rem;
    color:#f0d9b8;display:block;margin-bottom:3px;
  }
  .p-pos{
    font-size:.72rem;color:#9e8a78;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:8px;
  }
  .p-def{color:#d4c9be;display:block;}
  .p-ex{
    margin-top:10px;font-style:italic;font-size:.82rem;color:#8a7a6e;
    border-top:1px solid rgba(255,255,255,.08);padding-top:9px;display:block;
  }

  /* ── Hinweis oben ── */
  .hint{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;
    padding:9px 14px;background:var(--accent-light);
    border-radius:4px;border-left:3px solid var(--accent);
  }

  /* ── Textbox ── */
  .text-box{
    background:white;border:1px solid var(--border);border-radius:4px;
    padding:32px 36px;line-height:2.05;font-family:'Lora',serif;
    font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04);
  }

  /* ── Anklickbare Wörter ── */
  .w{
    cursor:pointer;border-bottom:1px dotted var(--accent);
    border-radius:2px;padding:0 1px;transition:background .15s;display:inline;
  }
  .w:hover{background:var(--accent-light);}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent);}
  .w.active{background:var(--accent);color:white;border-bottom-color:transparent;}
  .w.phrase{border-bottom:2px dashed #b07d50;}
  .w.phrase.seen{border-bottom-color:#c9956a;}
  .w.phrase.active{background:var(--accent);color:white;}

  /* ── Legende ── */
  .legend{
    margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-size:.76rem;color:var(--ink-soft);
  }
  .leg-item{display:flex;align-items:center;gap:5px;}

  @media(max-width:700px){
    .layout{flex-direction:column;}
    .panel{width:100%;position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Linke Spalte: Text -->
  <div class="main">
    <div class="hint">
      Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> – die Erklärung erscheint rechts.
      &nbsp;<span style="border-bottom:2px dashed #b07d50;padding:0 2px">Gestrichelt</span> = Redewendung.
    </div>
    <div class="text-box" id="tb"></div>
    <div class="legend">
      <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 3px">Wort</span>&nbsp;erklärtes Wort</span>
      <span class="leg-item"><span style="border-bottom:2px dashed #b07d50;padding:0 3px">Phrase</span>&nbsp;Redewendung</span>
      <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 3px">farbig</span>&nbsp;bereits nachgeschlagen</span>
    </div>
  </div>

  <!-- Rechte Spalte: Erklärungsleiste -->
  <div class="panel" id="panel">
    <div class="panel-empty" id="panelEmpty">
      ← Klicken Sie auf ein unterstrichenes Wort
    </div>
    <div class="panel-content" id="panelContent">
      <span class="p-badge" id="pBadge" style="display:none">Redewendung</span>
      <span class="p-word" id="pWord"></span>
      <span class="p-pos"  id="pPos"></span>
      <span class="p-def"  id="pDef"></span>
      <span class="p-ex"   id="pEx" style="display:none"></span>
    </div>
  </div>

</div>
<script>
const DICT = {"abgehauen": {"def": "heimlich und schnell weggegangen sein, ohne etwas zu sagen. Man verwendet es, wenn jemand plötzlich verschwunden ist.", "example": "Meine Schwester ist gestern Abend abgehauen und kam erst am nächsten Tag zurück.", "is_phrase": false, "pos": "Verb"}, "ach": {"def": "Keine Erklärung verfügbar.", "example": "", "is_phrase": false, "pos": ""}, "anfang": {"def": "Von Anfang an bedeutet: vom ersten Moment, von Beginn der Situation. Es zeigt, dass etwas schon am Start so war oder geplant wurde.", "example": "Maria hat von Anfang an gewusst, dass das Projekt schwierig wird.", "is_phrase": true, "pos": "Redewendung"}, "angestellten": {"def": "Personen, die in einem Geschäft oder Unternehmen arbeiten und dort einen festen Arbeitsplatz haben. Sie bekommen jeden Monat Lohn oder Gehalt von ihrem Arbeitgeber.", "example": "Die Angestellten in dem Supermarkt müssen jeden Tag um 8 Uhr mit der Arbeit beginnen.", "is_phrase": false, "pos": "Substantiv"}, "angreifen": {"def": "Jemanden körperlich attackieren oder verletzen wollen. Eine Person mit Gewalt bedrohen oder ihr schaden wollen.", "example": "Der aggressive Mann griff den Passanten ohne Grund an und schlug ihn.", "is_phrase": false, "pos": "Verb"}, "angst": {"def": "Diese Phrase bedeutet: sich vor etwas fürchten oder vor etwas Sorge haben. Man verwendet sie, wenn man ausdrücken will, dass jemand nervös oder ängstlich wegen einer Sache ist.", "example": "Hast du vor der Prüfung morgen Angst?", "is_phrase": true, "pos": "Redewendung"}, "antworten": {"def": "etwas sagen, wenn jemand anderes etwas gesagt oder gefragt hat. Man reagiert mit Worten auf das, was eine andere Person gesagt hat.", "example": "Als sie mich nach meinem Namen fragte, wollte ich nicht antworten.", "is_phrase": false, "pos": "Verb"}, "atem": {"def": "Wenn man wieder zu Atem kommt, bedeutet das: Man beruhigt sich nach einem Schock oder einer schweren Situation. Man kann wieder normal denken und sprechen.", "example": "Nach der schlechten Nachricht brauchte sie ein paar Minuten, um wieder zu Atem zu kommen.", "is_phrase": true, "pos": "Redewendung"}, "atmend": {"def": "Mit schwerer, angestrengter Atmung; so, dass man nur mit Mühe Luft bekommt. Das zeigt, dass jemand erschöpft, müde oder in schlechter körperlicher Verfassung ist.", "example": "Nach dem schnellen Lauf kam er schwer atmend im Büro an.", "is_phrase": false, "pos": "Adverb"}, "atmete": {"def": "Luft in die Lungen ziehen und wieder ausatmen. Wenn man schwer atmet, macht man das langsam und mit Anstrengung.", "example": "Nach dem schnellen Laufen atmete sie schwer und musste sich hinsetzen.", "is_phrase": false, "pos": "Verb"}, "augen": {"def": "Die beiden Körperteile im Gesicht, mit denen man sieht. Man kann sie öffnen und schließen.", "example": "Sie machte müde die Augen zu und schlief ein.", "is_phrase": false, "pos": "Substantiv"}, "augenblick": {"def": "Ein sehr kurzer Moment in der Zeit. Man verwendet es, wenn etwas sehr schnell passiert oder passieren kann.", "example": "Einen Augenblick später klingelte das Telefon.", "is_phrase": false, "pos": "Substantiv"}, "ausgegangen": {"def": "Von etwas ausgehen bedeutet: etwas annehmen oder vermuten, ohne es sicher zu wissen. Man denkt, dass etwas wahrscheinlich so ist oder so passieren wird.", "example": "Ich bin davon ausgegangen, dass du heute früher nach Hause kommst, deshalb habe ich schon das Abendessen vorbereitet.", "is_phrase": true, "pos": "Redewendung"}, "außer": {"def": "Jemanden außer Gefecht setzen bedeutet: jemanden kampfunfähig machen oder stoppen. Die Person kann dann nicht mehr kämpfen oder angreifen.", "example": "Der Boxer wurde mit einem harten Schlag außer Gefecht gesetzt und konnte nicht weiterkämpfen.", "is_phrase": true, "pos": "Redewendung"}, "bank": {"def": "Ein Gebäude oder Ort, wo Menschen Geld aufbewahren, Kredite bekommen oder andere Geldgeschäfte machen. Dort arbeiten Angestellte, die den Kunden helfen.", "example": "Nach dem Überfall auf die Bank wurden alle Mitarbeiter befragt.", "is_phrase": false, "pos": "Substantiv"}, "banküberfall": {"def": "Ein Verbrechen, bei dem Kriminelle mit Gewalt oder Drohungen in eine Bank gehen und Geld stehlen wollen. Die Täter sind oft bewaffnet und sehr gefährlich.", "example": "Nach dem Banküberfall suchte die Polizei nach drei maskierten Männern, die mit einer Pistol gedroht hatten.", "is_phrase": false, "pos": "Substantiv"}, "bedroht": {"def": "jemandem Angst machen und sagen, dass man ihm etwas Schlimmes antun wird, wenn er nicht macht, was man will", "example": "Der Räuber bedrohte die Verkäuferin mit einem Messer und forderte das Geld aus der Kasse.", "is_phrase": false, "pos": "Verb"}, "befahl": {"def": "Eine andere Form von 'befehlen' - jemandem mit Autorität und in scharfem Ton sagen, was er tun soll. Man erwartet, dass die andere Person sofort gehorcht.", "example": "Der Offizier befahl den Soldaten, still zu stehen.", "is_phrase": false, "pos": "Verb"}, "behielt": {"def": "Er ließ die Pistole nicht los und hielt sie weiter fest. Das Verb zeigt, dass er die Pistole in der Hand hatte und dort ließ.", "example": "Nach dem Kampf behielt der Soldat sein Gewehr in der Hand.", "is_phrase": false, "pos": "Verb"}, "bekannt": {"def": "Man hat das Gefühl, dass man eine Person schon einmal gesehen hat oder sie kennt. Man erinnert sich vielleicht an sie, aber ist nicht ganz sicher.", "example": "Die Frau an der Bushaltestelle kam mir bekannt vor, aber ich wusste nicht woher.", "is_phrase": true, "pos": "Redewendung"}, "beruhigt": {"def": "Wenn eine Flamme sich beruhigt, wird sie wieder ruhig und brennt gleichmäßig, nachdem sie vorher unruhig war oder stark geflackert hat.", "example": "Nach dem Windstoß beruhigte sich das Kerzenlicht wieder und brannte stetig.", "is_phrase": false, "pos": "Verb"}, "bester": {"def": "Diese Phrase bedeutet: die wichtigste und engste Freundschaft, die man hat. Man verwendet sie für den Freund, der einem am nächsten steht.", "example": "Maria ist meine beste Freundin - wir kennen uns seit der Schulzeit und erzählen uns alles.", "is_phrase": true, "pos": "Redewendung"}, "bewegten": {"def": "Den Körper oder Körperteile von einer Position in eine andere bringen. Hier bedeutet es: fast ganz still sitzen oder stehen.", "example": "Nach dem Schock bewegte sie sich stundenlang nicht vom Sofa.", "is_phrase": false, "pos": "Verb"}, "bewegung": {"def": "Eine schnelle Aktion mit dem Körper oder einem Körperteil. Hier: Tom macht eine schnelle Handbewegung, um die Waffe nach oben zu heben.", "example": "Mit einer schnellen Bewegung öffnete sie das Fenster.", "is_phrase": false, "pos": "Substantiv"}, "bleibst": {"def": "Du gehst nicht weg von diesem Ort. Du musst an diesem Platz sein und darfst ihn nicht verlassen.", "example": "Die Mutter sagte zu ihrem Kind: 'Du bleibst im Garten und kommst nicht auf die Straße.'", "is_phrase": false, "pos": "Verb"}, "blickte": {"def": "Die Augen in eine bestimmte Richtung richten und etwas sehen. Hier bedeutet es: plötzlich etwas bemerken oder entdecken.", "example": "Nach dem lauten Geräusch blickte sie zur Tür und sah einen Fremden.", "is_phrase": false, "pos": "Verb"}, "blieb": {"def": "Vergangenheitsform von 'bleiben': an einem Ort oder bei einer Person nicht weggehen. Hier bedeutet es: in der Beziehung oder Nähe zu jemandem bleiben.", "example": "Sie fragte sich, ob er nur wegen des Geldes bei ihr blieb.", "is_phrase": false, "pos": "Verb"}, "blitz": {"def": "Ein sehr heller Lichtstrahl, der bei einem Gewitter am Himmel zu sehen ist. Er entsteht durch elektrische Entladung in den Wolken.", "example": "Der Blitz leuchtete so hell auf, dass die ganze Nacht für einen Moment wie Tag aussah.", "is_phrase": false, "pos": "Substantiv"}, "bloß": {"def": "Wird verwendet, um zu betonen, dass etwas nicht wichtig oder nicht schlimm ist. Es bedeutet 'nur' oder 'lediglich' und macht die Sache kleiner.", "example": "Das war bloß ein kleiner Fehler, kein großes Problem.", "is_phrase": false, "pos": "Adverb"}, "boden": {"def": "Die untere Fläche in einem Raum, auf der man steht und geht. Hier steht eine Kerze auf dem Fußboden.", "example": "Die Vase fiel vom Tisch und zerbrach auf dem Boden.", "is_phrase": false, "pos": "Substantiv"}, "brach": {"def": "Wenn etwas in jemandem zusammenbricht, dann wird die Person plötzlich sehr traurig oder verzweifelt. Man fühlt sich innerlich kaputt oder leer.", "example": "Als sie die schlechte Nachricht hörte, brach in ihr etwas zusammen und sie konnte nicht mehr aufhören zu weinen.", "is_phrase": true, "pos": "Redewendung"}, "brachte": {"def": "etwas beinahe zu einem bestimmten Zustand führen; etwas fast erreichen oder verursachen", "example": "Der starke Wind brachte den Baum fast zum Umfallen.", "is_phrase": true, "pos": "Redewendung"}, "brandgeruch": {"def": "Der typische Geruch, der entsteht, wenn etwas brennt oder verbrannt ist. Dieser Geruch ist meist unangenehm und stechend.", "example": "Nach dem Küchenbrand hing noch stundenlang ein penetranter Brandgeruch in der Wohnung.", "is_phrase": false, "pos": "Substantiv"}, "bullen": {"def": "Umgangssprachliches Wort für Polizisten. Wird oft in der Jugendsprache oder von Personen verwendet, die negativ über die Polizei sprechen.", "example": "Die Jugendlichen rannten weg, als sie die Bullen sahen.", "is_phrase": false, "pos": "Substantiv"}, "ding": {"def": "Eine Waffe oder ein gefährlicher Gegenstand, den man verwendet, um andere Menschen zu bedrohen. Man sagt oft 'Ding' statt des genauen Namens der Waffe.", "example": "Der Räuber hatte ein Ding in der Tasche und zeigte es dem Kassirer.", "is_phrase": false, "pos": "Substantiv"}, "drang": {"def": "sich schnell und stark in eine Richtung bewegen, meist von Gerüchen, Geräuschen oder Flüssigkeiten. Etwas kommt plötzlich und deutlich an einen Ort.", "example": "Kalte Luft drang durch das offene Fenster ins Zimmer.", "is_phrase": false, "pos": "Verb"}, "draußen": {"def": "außerhalb eines Gebäudes oder Raums; im Freien oder an einem anderen Ort, nicht da wo man gerade ist", "example": "Von draußen konnte man die Musik aus dem Haus hören.", "is_phrase": false, "pos": "Adverb"}, "drohte": {"def": "Wenn etwas zu passieren droht, dann kann es sehr wahrscheinlich bald passieren. Man verwendet das für negative oder gefährliche Situationen, die fast eintreten.", "example": "Der alte Baum drohte bei dem starken Wind umzufallen.", "is_phrase": true, "pos": "Redewendung"}, "drückte": {"def": "Eine Waffe benutzen und einen Schuss abgeben. Man sagt das, wenn jemand mit einer Pistole oder einem Gewehr schießt.", "example": "Der Polizist drückte ab, um den Verbrecher zu stoppen.", "is_phrase": true, "pos": "Redewendung"}, "dunklen": {"def": "ohne Licht; so, dass man nichts oder nur wenig sehen kann", "example": "In dem dunklen Keller konnte sie nichts erkennen.", "is_phrase": false, "pos": "Adjektiv"}, "durchstehen": {"def": "Eine schwierige oder anstrengende Situation bis zum Ende aushalten, ohne aufzugeben. Etwas Hartes oder Unangenehmes komplett überstehen.", "example": "Sie musste die schwere Operation durchstehen, bevor es ihr wieder besser ging.", "is_phrase": false, "pos": "Verb"}, "echter": {"def": "wirklich und nicht nur gespielt oder vorgetäuscht; tatsächlich gefährlich und ernst gemeint", "example": "Die Polizei stellte fest, dass es sich um einen echten Überfall handelte, nicht nur um einen Scherz.", "is_phrase": false, "pos": "Adjektiv"}, "egal": {"def": "Diese Phrase bedeutet: Es ist mir nicht wichtig, es interessiert mich nicht. Man verwendet sie, wenn man gleichgültig ist oder sich keine Sorgen macht.", "example": "Nach der schlechten Note war es ihm egal, was die anderen Schüler dachten.", "is_phrase": true, "pos": "Redewendung"}, "eigentlich": {"def": "drückt aus, dass man sich nicht bewusst war oder nicht genau wusste, was man macht. Es bedeutet hier 'wirklich' oder 'richtig'.", "example": "Ohne eigentlich einen Plan zu haben, ging sie einfach los und suchte nach dem verlorenen Schlüssel.", "is_phrase": false, "pos": "Adverb"}, "einmal": {"def": "auf einmal = plötzlich, sehr schnell und unerwartet; nicht einmal = nicht auch nur, sogar nicht", "example": "Auf einmal begann es zu regnen und er hatte nicht einmal einen Regenschirm dabei.", "is_phrase": true, "pos": "Adverb"}, "einsperren": {"def": "jemanden in ein Gefängnis bringen oder an einem Ort festhalten, wo er nicht frei sein kann. Die Person kann dann nicht mehr gehen, wohin sie will.", "example": "Der Dieb wurde eingesperrt, weil er Geld gestohlen hatte.", "is_phrase": false, "pos": "Verb"}, "eiskalten": {"def": "Sehr kalt, so kalt dass es schockiert und einen erschreckt. Hier wird das Gefühl von plötzlichem Schock und Angst beschrieben.", "example": "Als sie die schlechte Nachricht hörte, lief ihr ein eiskalter Schauer über den Rücken.", "is_phrase": false, "pos": "Adjektiv"}, "ende": {"def": "Eine Situation ist hoffnungslos und es gibt keine Lösung mehr. Man kann nichts mehr tun, um die Lage zu verbessern.", "example": "Nach dem dritten Kredit sind wir am Ende - wir können die Schulden nicht mehr bezahlen.", "is_phrase": true, "pos": "Redewendung"}, "endlich": {"def": "Drückt Ungeduld oder Ärger aus und bedeutet: nach so langer Zeit solltest du das jetzt wirklich tun oder verstehen. Wird verwendet, wenn man will, dass etwas sofort passiert.", "example": "Mach endlich deine Hausaufgaben, du sitzt schon seit einer Stunde da!", "is_phrase": false, "pos": "Adverb"}, "entschluss": {"def": "Bedeutet: Ich war mir ganz sicher, was ich tun wollte. Meine Entscheidung war endgültig und ich würde sie nicht mehr ändern.", "example": "Nach langem Überlegen stand ihr Entschluss fest: Sie würde nach Berlin ziehen.", "is_phrase": true, "pos": "Redewendung"}, "erkennen": {"def": "sehen können, mit den Augen wahrnehmen können. Hier bedeutet es: Tom war in der Dunkelheit nur schwach sichtbar.", "example": "Bei dem starken Nebel konnte ich die Straße kaum noch erkennen.", "is_phrase": false, "pos": "Verb"}, "erlöschen": {"def": "Das Ausgehen oder Verlöschen einer Flamme oder eines Lichts. Die Kerze hört auf zu brennen.", "example": "Der starke Wind brachte das Lagerfeuer zum Erlöschen.", "is_phrase": false, "pos": "Substantiv"}, "fast": {"def": "bedeutet beinahe oder sehr nahe daran, dass etwas passiert, aber es passiert nicht ganz oder nicht vollständig", "example": "Der Teller fiel vom Tisch und wäre fast zerbrochen.", "is_phrase": false, "pos": "Adverb"}, "fertig": {"def": "völlig erschöpft und am Ende der Kraft; so müde oder belastet, dass man nicht mehr kann", "example": "Nach der schweren Prüfung war sie total fertig und konnte nur noch weinen.", "is_phrase": false, "pos": "Adjektiv"}, "fest": {"def": "Wenn etwas feststeht, ist es sicher und wird nicht mehr geändert. Man hat sich endgültig entschieden oder kann eine Situation nicht mehr verlassen.", "example": "Nach langer Überlegung steht fest: Wir ziehen nächsten Monat um.", "is_phrase": true, "pos": "Redewendung"}, "fiele": {"def": "Das ist die Konjunktiv-Form von 'fallen'. Hier wird es in einem Vergleich benutzt: Die Person beschreibt ein Gefühl, als würde sie plötzlich tief fallen oder stürzen.", "example": "Als sie die schlechte Nachricht hörte, hatte sie das Gefühl, als fiele sie in ein tiefes Loch.", "is_phrase": false, "pos": "Verb"}, "flackernde": {"def": "unregelmäßig bewegend, unruhig zitternd (wie bei einer Kerze oder einem Feuer im Wind). Das Licht wird dabei abwechselnd heller und dunkler.", "example": "Das flackernde Kerzenlicht machte das Zimmer sehr gemütlich.", "is_phrase": false, "pos": "Adjektiv"}, "flamme": {"def": "Das helle Licht und die leuchtenden Gase, die entstehen, wenn etwas brennt. Man sieht sie als bewegliche, helle Zungen über dem Feuer.", "example": "Die Flamme der Kerze tanzte im Wind und warf Schatten an die Wand.", "is_phrase": false, "pos": "Substantiv"}, "fleck": {"def": "Eine schmutzige oder verfärbte Stelle auf Kleidung oder anderen Oberflächen. Entsteht zum Beispiel durch verschüttete Flüssigkeiten, Essen oder Schmutz.", "example": "Nach dem Mittagessen hatte sie einen großen Fleck von der Tomatensoße auf ihrer weißen Bluse.", "is_phrase": false, "pos": "Substantiv"}, "fort": {"def": "Bedeutet, dass man weiterspricht oder weiterredet, nachdem man eine Pause gemacht hat. Man setzt seine Rede da fort, wo man aufgehört hat.", "example": "Nach einer kurzen Unterbrechung fuhr der Lehrer mit seinem Vortrag fort.", "is_phrase": true, "pos": "Redewendung"}, "fortgeschafft": {"def": "etwas heimlich wegbringen oder verstecken, damit andere es nicht finden. Man macht das oft mit Dingen, die man nicht zeigen will.", "example": "Die Diebe haben die gestohlenen Sachen schnell fortgeschafft, bevor die Polizei kam.", "is_phrase": false, "pos": "Verb"}, "frage": {"def": "Etwas, was man wissen möchte und deshalb fragt. Eine Frage stellt man, um eine Antwort zu bekommen.", "example": "Der Lehrer stellte eine schwierige Frage über die Geschichte.", "is_phrase": false, "pos": "Substantiv"}, "fragte": {"def": "Das ist die Vergangenheitsform von 'fragen'. Es bedeutet, dass jemand eine Frage gestellt hat oder wissen wollte.", "example": "Maria fragte ihren Bruder, ob er ihr beim Umzug helfen kann.", "is_phrase": false, "pos": "Verb"}, "freiwillig": {"def": "aus eigenem Willen, ohne dass jemand dazu gezwungen wurde. Die Person hat es selbst entschieden und getan.", "example": "Sie hat freiwillig bei der Veranstaltung geholfen, obwohl niemand sie darum gebeten hatte.", "is_phrase": false, "pos": "Adverb"}, "freund": {"def": "Eine Person, die man sehr gern hat und der man vertraut. Mit einem Freund verbringt man gerne Zeit und teilt wichtige Dinge.", "example": "Mein bester Freund hilft mir immer, wenn ich Probleme habe.", "is_phrase": false, "pos": "Substantiv"}, "fuhr": {"def": "Präteritum von 'fahren' in zwei verschiedenen Bedeutungen: 1) fortfahren = weitersprechen, weiterreden 2) sich schnell und plötzlich bewegen (bei Wind, Luft)", "example": "Der Professor fuhr mit seinem Vortrag fort, während draußen ein starker Wind durch die offenen Fenster fuhr.", "is_phrase": false, "pos": "Verb"}, "für": {"def": "Diese Phrase wird verwendet, um starke Gefühle über eine Person auszudrücken. Man betont damit, was für eine Art von Person jemand ist - meist negativ.", "example": "Was bist du doch für ein wundervoller Mensch!", "is_phrase": true, "pos": "Redewendung"}, "gar": {"def": "Verstärkt die Verneinung und bedeutet \"überhaupt\" oder \"absolut\". Es macht die Aussage stärker und zeigt, dass wirklich nichts passiert wäre.", "example": "Ohne deine Hilfe hätte ich gar keine Chance gehabt, die Prüfung zu bestehen.", "is_phrase": false, "pos": "Adverb"}, "gedanken": {"def": "Eine Vorstellung oder Idee, die plötzlich im Kopf entsteht und starke Gefühle auslöst. Hier bedeutet es eine schreckliche Erkenntnis oder Befürchtung, die große Angst macht.", "example": "Bei dem Gedanken, dass ich die Prüfung nicht bestehen könnte, wurde mir ganz schlecht.", "is_phrase": false, "pos": "Substantiv"}, "gefallen": {"def": "Diese Redewendung bedeutet: völlig überrascht oder schockiert sein, nicht wissen, was man sagen oder tun soll. Man fühlt sich, als wäre man nicht mehr in der normalen Welt.", "example": "Als sie die schlechte Nachricht hörte, war sie wie aus der Welt gefallen.", "is_phrase": true, "pos": "Redewendung"}, "gefecht": {"def": "Jemanden außer Gefecht setzen bedeutet: jemanden so verletzen oder schwächen, dass er nicht mehr kämpfen oder sich wehren kann. Die Person wird kampfunfähig gemacht.", "example": "Der Boxer wurde mit einem harten Schlag außer Gefecht gesetzt und konnte nicht weiterkämpfen.", "is_phrase": true, "pos": "Redewendung"}, "gefühl": {"def": "Eine starke emotionale Empfindung, die plötzlich und intensiv auftritt. Hier beschreibt es einen Schock oder eine sehr unangenehme seelische Reaktion.", "example": "Als sie die schlechte Nachricht hörte, hatte sie das Gefühl, als würde die Welt um sie herum stillstehen.", "is_phrase": false, "pos": "Substantiv"}, "gegeben": {"def": "Eine Person hat einer anderen Person etwas in die Hand gelegt oder übergeben. Hier: jemand hat Geldscheine an eine andere Person weitergegeben.", "example": "Der Verkäufer hat mir das Wechselgeld gegeben.", "is_phrase": false, "pos": "Verb"}, "gegenüber": {"def": "Wenn zwei Personen sich gegenübersitzen, dann sitzen sie so, dass sie sich direkt ansehen können. Eine Person sitzt auf der einen Seite, die andere Person auf der anderen Seite.", "example": "Am Esstisch saßen sich die Eltern und ihr Sohn gegenüber und sprachen über seine Zukunft.", "is_phrase": true, "pos": "Redewendung"}, "gehe": {"def": "Ich verlasse diesen Ort und bewege mich weg von hier. Man sagt das, wenn man einen Platz oder eine Situation verlassen will.", "example": "\"Ich gehe jetzt nach Hause\", sagte Maria und stand auf.", "is_phrase": false, "pos": "Verb"}, "gekommen": {"def": "Wieder normal atmen können, nachdem man aus der Puste war oder sich aufgeregt hat. Man braucht einen Moment, um ruhig zu werden.", "example": "Nach dem schnellen Lauf musste sie erst zu Atem kommen, bevor sie sprechen konnte.", "is_phrase": true, "pos": "Redewendung"}, "geld": {"def": "Münzen und Scheine, die man zum Bezahlen verwendet. Hier scheint es um Geld zu gehen, das die Personen durch illegale Aktivitäten bekommen haben.", "example": "Die Diebe wollten das gestohlene Geld schnell unter sich aufteilen.", "is_phrase": false, "pos": "Substantiv"}, "gelogen": {"def": "Eine unwahre Aussage gemacht haben. Etwas gesagt haben, was nicht der Wahrheit entspricht.", "example": "Sie hat nicht gelogen, als sie sagte, dass sie krank war - sie hatte wirklich Fieber.", "is_phrase": false, "pos": "Partizip Perfekt"}, "gemacht": {"def": "Diese Frage stellt man, wenn man wissen will, was mit einer Person passiert ist oder wie jemand behandelt wurde. Man fragt danach, besonders wenn man sich Sorgen macht oder etwas Schlimmes vermutet.", "example": "Als mein Bruder nicht nach Hause kam, fragte ich meine Mutter: 'Was hast du mit ihm gemacht?'", "is_phrase": true, "pos": "Redewendung"}, "genauso": {"def": "auf die gleiche Art und Weise; genau so wie etwas anderes war oder ist", "example": "Das Essen schmeckt heute genauso gut wie gestern.", "is_phrase": false, "pos": "Adverb"}, "genommen": {"def": "Das ist die Vergangenheitsform von 'mitnehmen'. Es bedeutet: etwas von einem Ort zu einem anderen Ort bringen oder transportieren.", "example": "Sie hat ihren Regenschirm mit zur Arbeit genommen.", "is_phrase": false, "pos": "Verb"}, "genug": {"def": "Diese Phrase bedeutet: Ich war müde von einer Situation und wollte sie beenden. Man sagt das, wenn man keine Lust mehr hat, etwas zu ertragen.", "example": "Nach dem dritten Streit mit meinem Mitbewohner hatte ich genug und bin ausgezogen.", "is_phrase": true, "pos": "Redewendung"}, "gericht": {"def": "Eine offizielle Institution, wo Richter über Verbrechen und Konflikte entscheiden. Dort wird bestimmt, ob jemand schuldig ist und welche Strafe er bekommt.", "example": "Der Dieb muss nächste Woche vor Gericht erscheinen.", "is_phrase": false, "pos": "Substantiv"}, "gerichtet": {"def": "Eine Waffe auf jemanden richten bedeutet: die Waffe so halten, dass sie auf eine Person zeigt und man schießen könnte. Es ist eine bedrohliche Handlung.", "example": "Der Räuber richtete seine Waffe auf den Kassierer und forderte das Geld.", "is_phrase": true, "pos": "Redewendung"}, "gerochen": {"def": "Das ist die Partizip-Form von 'riechen'. Es bedeutet: einen bestimmten Geruch wahrgenommen haben. Hier fragt sich die Person, ob der gleiche Geruch da war.", "example": "Es hatte nach Zigaretten gerochen, als ich das Zimmer betrat.", "is_phrase": false, "pos": "Verb"}, "geschehen": {"def": "Nichts tun, um etwas zu verhindern oder zu stoppen. Man akzeptiert eine Situation passiv, auch wenn sie unangenehm ist.", "example": "Als die anderen Kinder ihn ärgerten, ließ er es einfach geschehen und wehrte sich nicht.", "is_phrase": true, "pos": "Redewendung"}, "geschlafen": {"def": "Das ist die Vergangenheitsform von 'schlafen'. Es bedeutet, dass jemand geschlafen hat - also im Bett war und nicht wach war.", "example": "Während ich geschlafen habe, ist mein Bruder heimgekommen.", "is_phrase": false, "pos": "Verb"}, "gesicht": {"def": "Der vordere Teil des Kopfes mit Augen, Nase und Mund. Hier zeigen sich Gefühle und Emotionen.", "example": "Als sie die schlechte Nachricht hörte, wurde ihr Gesicht ganz blass.", "is_phrase": false, "pos": "Substantiv"}, "gesichter": {"def": "Das Aussehen einer Person, besonders von vorne betrachtet. Die Polizei kann die Personen an ihrem Aussehen erkennen.", "example": "Die Verkäuferin erkannte sofort mein Gesicht, weil ich oft in diesem Laden einkaufe.", "is_phrase": false, "pos": "Substantiv"}, "gewesen": {"def": "Partizip Perfekt von 'sein'. Wird verwendet, um über etwas zu sprechen, das in der Vergangenheit war oder passiert ist.", "example": "Wenn das Wetter schöner gewesen wäre, hätten wir einen Spaziergang gemacht.", "is_phrase": false, "pos": "Verb"}, "geworden": {"def": "Das ist die Vergangenheitsform von 'werden'. Man benutzt es, um zu sagen, dass sich etwas verändert hat oder dass etwas zu einem anderen Zustand gekommen ist.", "example": "Meine Schwester ist sehr groß geworden, seit ich sie das letzte Mal gesehen habe.", "is_phrase": false, "pos": "Partizip Perfekt"}, "geöffneten": {"def": "Ein bisschen offen, nicht ganz geschlossen. Die Augen sind nur wenig geöffnet, fast zu.", "example": "Sie lag müde im Bett mit halb geöffneten Augen und konnte kaum noch wach bleiben.", "is_phrase": false, "pos": "Adjektiv"}, "ging": {"def": "Wenn jemand auf eine Frage oder ein Thema nicht eingeht, bedeutet das: Die Person antwortet nicht darauf oder will nicht darüber sprechen. Man ignoriert das Thema bewusst.", "example": "Als ich ihn nach seinem Gehalt fragte, ging er nicht darauf ein und wechselte das Thema.", "is_phrase": true, "pos": "Redewendung"}, "glaubte": {"def": "dachte oder meinte, dass etwas wahr ist; war der Meinung, dass etwas so ist", "example": "Sie glaubte, dass der Zug pünktlich kommt, aber er hatte Verspätung.", "is_phrase": false, "pos": "Verb"}, "gleichzeitig": {"def": "zur selben Zeit; im gleichen Moment", "example": "Sie hörten das Telefon klingeln und gleichzeitig ging die Türklingel.", "is_phrase": false, "pos": "Adverb"}, "glänzte": {"def": "Licht reflektieren und dadurch hell und glatt aussehen. Die Oberfläche von etwas wirft Licht zurück.", "example": "Der nasse Asphalt glänzte im Scheinwerferlicht.", "is_phrase": false, "pos": "Verb"}, "griff": {"def": "Die Hand schnell zu etwas hinbewegen und es anfassen oder nehmen. Man macht diese Bewegung oft, um etwas aus der Tasche zu holen.", "example": "Sie griff nach ihrem Handy, als es klingelte.", "is_phrase": false, "pos": "Verb"}, "großen": {"def": "Von beträchtlicher Größe oder Ausdehnung; hier beschreibt es eine Luftblase, die viel Raum einnimmt. Das Wort betont, dass die Luftblase nicht klein ist, sondern deutlich sichtbar und umfangreich.", "example": "Der Taucher sah eine große Luftblase unter Wasser aufsteigen.", "is_phrase": false, "pos": "Adjektiv"}, "größer": {"def": "Das bedeutet: von einer kleineren zu einer ausgedehnteren Größe verändert. Etwas nimmt mehr Platz ein als vorher.", "example": "Das Loch in der Wand ist größer geworden, nachdem es geregnet hat.", "is_phrase": false, "pos": "Adjektiv"}, "gute": {"def": "Schön, angenehm und positiv. Man verwendet es, wenn man sich an etwas Schönes erinnert oder damit zufrieden war.", "example": "Wir hatten eine gute Reise nach Italien - das Wetter war perfekt und wir haben viel erlebt.", "is_phrase": false, "pos": "Adjektiv"}, "gänsehaut": {"def": "Das bedeutet: jemand bekommt plötzlich ein Gefühl von Angst oder Schrecken. Man spürt dann oft ein kaltes, unangenehmes Gefühl auf der Haut.", "example": "Als ich den gruseligen Film sah, jagte er mir eine Gänsehaut über den ganzen Körper.", "is_phrase": true, "pos": "Redewendung"}, "halb": {"def": "Nicht ganz, nur zur Hälfte oder teilweise. Es bedeutet, dass etwas nicht vollständig ist.", "example": "Die Tür war nur halb geschlossen, deshalb konnte man die Stimmen hören.", "is_phrase": false, "pos": "Adverb"}, "hals": {"def": "Diese Redewendung bedeutet, dass das Herz sehr schnell und stark schlägt, weil man aufgeregt, nervös oder ängstlich ist. Man spürt den Herzschlag bis hoch zum Hals.", "example": "Vor der wichtigen Prüfung schlug mir das Herz bis zum Hals.", "is_phrase": true, "pos": "Redewendung"}, "halt": {"def": "Eine unhöfliche Art zu sagen, dass jemand aufhören soll zu sprechen. Man verwendet es, wenn man ärgerlich ist und nicht zuhören will.", "example": "Als Tim immer weiter über das Spiel redete, sagte sein Bruder genervt: 'Halt die Klappe!'", "is_phrase": true, "pos": "Redewendung"}, "hand": {"def": "Der Körperteil am Ende des Arms, mit dem man Dinge greifen und festhalten kann. Man hat normalerweise zwei Hände mit jeweils fünf Fingern.", "example": "Er hielt den Schlüssel fest in der Hand, damit er ihn nicht verliert.", "is_phrase": false, "pos": "Substantiv"}, "hasst": {"def": "Ein sehr starkes negatives Gefühl gegen eine Person haben. Man mag jemanden überhaupt nicht und wünscht sich, dass diese Person nicht da ist.", "example": "Maria hasst ihren Chef, weil er immer unfreundlich zu ihr ist.", "is_phrase": false, "pos": "Verb"}, "hast": {"def": "Die 2. Person Singular von 'haben' im Präsens. Man benutzt es, wenn man zu einer Person spricht und sagt, dass diese Person etwas besitzt oder gemacht hat.", "example": "Du hast heute viel gearbeitet.", "is_phrase": false, "pos": "Verb"}, "hatten": {"def": "Vergangenheitsform von 'haben'. Zeigt an, dass etwas in der Vergangenheit besessen, erlebt oder gemacht wurde.", "example": "Gestern hatten wir schönes Wetter und sind spazieren gegangen.", "is_phrase": false, "pos": "Verb"}, "hauptsache": {"def": "Wird verwendet, um zu sagen, dass etwas das Wichtigste ist oder dass alles andere nicht so wichtig ist. Man drückt damit aus, was einem am meisten bedeutet.", "example": "Hauptsache, du bist gesund - alles andere können wir später regeln.", "is_phrase": true, "pos": "Redewendung"}, "haus": {"def": "Ein Gebäude, in dem Menschen wohnen. Hier beschreibt es ein altes, kaputtes Gebäude, das wie eine dunkle Höhle wirkt.", "example": "Das alte Haus am Ende der Straße steht seit Jahren leer und verfällt immer mehr.", "is_phrase": false, "pos": "Substantiv"}, "heraus": {"def": "Nach draußen, weg von einem Ort. Man benutzt es, wenn man einen Ort verlassen will oder verlassen hat.", "example": "Nach dem Streit wollte sie schnell aus dem Zimmer heraus.", "is_phrase": false, "pos": "Adverb"}, "heruntergebrannt": {"def": "Eine Kerze ist heruntergebrannt, wenn sie fast ganz abgebrannt ist und nur noch sehr wenig Wachs übrig ist. Das bedeutet, sie gibt nur noch wenig Licht.", "example": "Die Kerze auf dem Tisch war schon so weit heruntergebrannt, dass wir bald eine neue anzünden mussten.", "is_phrase": false, "pos": "Adjektiv"}, "herz": {"def": "Diese Redewendung bedeutet, dass man sehr aufgeregt, nervös oder ängstlich ist. Das Herz schlägt dann so stark und schnell, dass man es bis zum Hals spürt.", "example": "Vor der wichtigen Prüfung schlug mir das Herz bis zum Hals.", "is_phrase": true, "pos": "Redewendung"}, "hielt": {"def": "Die Pistole in eine bestimmte Position bringen und dort festhalten, so dass sie auf eine Person zeigt.", "example": "Der Räuber hielt das Messer bedrohlich in der Hand.", "is_phrase": false, "pos": "Verb"}, "hinein": {"def": "Man sagt etwas in eine stille Situation oder Atmosphäre. Die Worte durchbrechen die Ruhe oder Stimmung.", "example": "Nach dem Streit herrschte Schweigen, dann sprach sie leise in die Stille hinein: 'Es tut mir leid.'", "is_phrase": true, "pos": "Redewendung"}, "hinstecken": {"def": "Eine vulgäre Redewendung, die bedeutet: etwas ist völlig nutzlos oder wertlos. Man drückt damit starken Ärger aus und sagt, dass etwas keinen Wert hat.", "example": "Seine Entschuldigung können wir uns sonst wo hinstecken - er hat uns schon zu oft enttäuscht.", "is_phrase": true, "pos": "Redewendung"}, "hob": {"def": "Eine schnelle Bewegung nach oben machen, etwas höher bewegen. Man nimmt etwas und bewegt es von unten nach oben.", "example": "Sie hob das schwere Buch vom Boden auf und legte es auf den Tisch.", "is_phrase": false, "pos": "Verb"}, "hoch": {"def": "Sich langsam von einer liegenden oder sitzenden Position in eine stehende Position bringen, meist mit Hilfe von etwas zum Festhalten. Man bewegt sich dabei nach oben.", "example": "Nach dem Sturz schob sie sich mühsam am Geländer hoch.", "is_phrase": true, "pos": "Redewendung"}, "holte": {"def": "sich etwas nehmen oder bringen; einen Gegenstand von einem Ort zu sich nehmen", "example": "Sie holte ihr Buch aus der Tasche und begann zu lesen.", "is_phrase": false, "pos": "Verb"}, "hände": {"def": "Die beiden Körperteile am Ende der Arme, mit denen man Dinge greifen und sich schützen kann. Man benutzt sie, um etwas zu halten oder um sich zu verteidigen.", "example": "Das Kind hielt die Hände vor das Gesicht, als der Ball auf es zuflog.", "is_phrase": false, "pos": "Substantiv"}, "hätte": {"def": "Konjunktiv II von 'haben' - wird für irreale Bedingungen in der Vergangenheit verwendet. Drückt aus, was nicht wirklich passiert ist, aber möglich gewesen wäre.", "example": "Wenn ich mehr Zeit gehabt hätte, wäre ich zu der Party gekommen.", "is_phrase": false, "pos": "Verb"}, "hätten": {"def": "Form von 'haben' im Konjunktiv II. Drückt aus, dass etwas in der Vergangenheit möglich gewesen wäre oder dass man etwas bereut.", "example": "Wir hätten früher gehen sollen, dann wären wir nicht im Stau gestanden.", "is_phrase": false, "pos": "Verb"}, "höhle": {"def": "Ein dunkler, ungemütlicher Ort, an dem man sich gefangen oder unwohl fühlt. Hier wird das verfallene Haus mit einer Höhle verglichen, weil es dunkel und bedrohlich wirkt.", "example": "Nach der Trennung verließ er endlich seine kleine Wohnung, die für ihn zu einer düsteren Höhle geworden war.", "is_phrase": false, "pos": "Substantiv"}, "hütte": {"def": "Ein kleines, einfaches Haus, oft aus Holz gebaut. Meist steht es abseits von der Stadt, zum Beispiel im Wald oder in den Bergen.", "example": "Die Wanderer übernachteten in einer kleinen Hütte am See.", "is_phrase": false, "pos": "Substantiv"}, "idiot": {"def": "Ein Schimpfwort für eine Person, die sich dumm oder nervig verhalten hat. Man sagt es, wenn man über jemanden ärgerlich ist.", "example": "Als er mir nicht geholfen hat, dachte ich nur: Was für ein Idiot!", "is_phrase": false, "pos": "Substantiv"}, "ins": {"def": "Eine Verschmelzung von 'in' und 'das', die eine Richtung oder ein Ziel angibt. Hier bedeutet es 'in das Gesicht hinein'.", "example": "Der Ball flog ins Tor und das Team gewann das Spiel.", "is_phrase": false, "pos": "Präposition"}, "irgendwann": {"def": "zu einem nicht genau bestimmten Zeitpunkt in der Vergangenheit. Es war nicht sofort, sondern nach einer gewissen Zeit.", "example": "Irgendwann merkte sie, dass ihr Job sie nicht glücklich machte.", "is_phrase": false, "pos": "Adverb"}, "ironisch": {"def": "Auf eine Art, die zeigt, dass man etwas anderes meint als das, was man sagt. Man spricht so, wenn man sich über etwas lustig macht oder Kritik versteckt ausdrückt.", "example": "Als es regnete, sagte sie ironisch: 'Was für ein wunderschönes Wetter heute!'", "is_phrase": false, "pos": "Adverb"}, "jagte": {"def": "Wenn etwas jemandem eine Gänsehaut über den Rücken jagt, bedeutet das: Es macht einem Angst oder lässt einen erschrecken. Man bekommt dann kleine Beulen auf der Haut, weil man sich fürchtet.", "example": "Der laute Knall in der Nacht jagte mir eine Gänsehaut über den Rücken.", "is_phrase": true, "pos": "Redewendung"}, "jedenfalls": {"def": "Das Wort zeigt hier an, dass die Person eine Schlussfolgerung zieht oder eine Sache feststellt, die für sie klar ist. Es bedeutet 'auf jeden Fall' oder 'zumindest das eine ist sicher'.", "example": "Du antwortest nicht auf meine Nachrichten - jedenfalls habe ich verstanden, dass du sauer bist.", "is_phrase": false, "pos": "Adverb"}, "jurij": {"def": "Ein männlicher Vorname. Jurij ist eine Person, die in der Geschichte eine wichtige Rolle spielt.", "example": "Jurij kam zu spät zur Verabredung, deshalb waren alle schon gegangen.", "is_phrase": false, "pos": "Substantiv"}, "kalk": {"def": "Weißes Material, das zum Bauen verwendet wird und von alten Wänden oder Decken abfallen kann. Es entsteht, wenn alte Farbe oder Putz trocken wird und sich löst.", "example": "Nach dem Erdbeben lag überall Kalk auf dem Boden, der von den beschädigten Wänden gefallen war.", "is_phrase": false, "pos": "Substantiv"}, "kalter": {"def": "nicht warm, mit niedriger Temperatur. Hier beschreibt es einen Wind, der unangenehm kühl ist.", "example": "Die kalte Luft ließ mich frieren.", "is_phrase": false, "pos": "Adjektiv"}, "kam": {"def": "Präteritum (Vergangenheitsform) von 'kommen'. Es bedeutet: sich von einem Ort zu einem anderen bewegen oder eine bestimmte Wirkung auf jemanden haben.", "example": "Sie kam schnell nach Hause und erzählte von ihrem Tag.", "is_phrase": false, "pos": "Verb"}, "kampf": {"def": "Eine körperliche Auseinandersetzung zwischen zwei oder mehreren Personen, bei der sie sich schlagen oder raufen. Dabei braucht man Kraft und Ausdauer.", "example": "Nach dem Kampf auf dem Schulhof waren beide Jungen müde und hatten blaue Flecken.", "is_phrase": false, "pos": "Substantiv"}, "kannst": {"def": "Du hast die Macht oder Fähigkeit nicht, mich zu etwas zu bringen, was ich nicht will. Es bedeutet hier: du bist nicht stark genug oder hast nicht das Recht dazu.", "example": "Du kannst mich nicht dazu bringen, diese Arbeit zu machen, wenn ich nicht will.", "is_phrase": false, "pos": "Verb"}, "kapier": {"def": "verstehen, begreifen (umgangssprachlich). Man sagt das, wenn jemand etwas endlich verstehen soll.", "example": "Kapier doch, dass du zu spät kommst, wenn du nicht bald gehst!", "is_phrase": false, "pos": "Verb"}, "kasse": {"def": "Der Ort in einem Geschäft, wo man bezahlt und sein Wechselgeld bekommt. Dort arbeitet eine Person, die das Geld annimmt und Geldscheine zurückgibt.", "example": "An der Kasse im Supermarkt bekam ich fünf Euro zurück.", "is_phrase": false, "pos": "Substantiv"}, "kassierer": {"def": "Eine Person, die in einem Geschäft oder einer Bank arbeitet und Geld von Kunden entgegennimmt oder auszahlt. Der Kassierer steht meist an der Kasse und rechnet ab.", "example": "Die Kassiererin im Supermarkt scannte alle Artikel und sagte mir den Preis.", "is_phrase": false, "pos": "Substantiv"}, "kaufen": {"def": "jemanden mit Geld oder Geschenken dazu bringen, dass er tut, was man will; jemanden bestechen", "example": "Der reiche Mann dachte, er könnte den Richter mit viel Geld kaufen.", "is_phrase": false, "pos": "Verb"}, "kaum": {"def": "fast gar nicht, nur sehr wenig oder sehr selten. Es bedeutet, dass etwas nur in sehr geringem Maß passiert.", "example": "Der kranke Mann konnte kaum sprechen und lag still im Bett.", "is_phrase": false, "pos": "Adverb"}, "kennt": {"def": "Wissen, wie jemand aussieht. Man kann die Person erkennen, wenn man sie sieht.", "example": "Der Verkäufer kennt alle seine Stammkunden und grüßt sie immer freundlich.", "is_phrase": false, "pos": "Verb"}, "kerze": {"def": "Ein länglicher Gegenstand aus Wachs mit einem Faden in der Mitte, den man anzündet, um Licht zu haben. Die Kerze brennt langsam ab und wird dabei kleiner.", "example": "Bei dem Stromausfall haben wir eine Kerze angezündet, damit wir etwas sehen konnten.", "is_phrase": false, "pos": "Substantiv"}, "klappe": {"def": "Eine unhöfliche Art zu sagen: 'Sei still!' oder 'Rede nicht mehr!'. Man verwendet das, wenn man will, dass jemand aufhört zu sprechen.", "example": "Als Tom immer weiter störte, sagte die Lehrerin: 'Halt die Klappe!'", "is_phrase": true, "pos": "Redewendung"}, "knall": {"def": "Ein sehr lautes, plötzliches Geräusch, das meist kurz und scharf ist. Es entsteht oft durch eine Explosion oder wenn etwas sehr hart aufschlägt.", "example": "Der Knall der Silvesterrakete war so laut, dass alle Kinder erschrocken sind.", "is_phrase": false, "pos": "Substantiv"}, "kopf": {"def": "Der obere Teil des Körpers, wo sich das Gehirn befindet. Man denkt mit dem Kopf und bewegt ihn, um ja oder nein zu sagen.", "example": "Sie nickte mit dem Kopf, um zu zeigen, dass sie einverstanden war.", "is_phrase": false, "pos": "Substantiv"}, "kraft": {"def": "Die körperliche Stärke und Energie, die man für eine Bewegung oder Handlung einsetzt. Hier bedeutet es: so stark wie möglich schlagen.", "example": "Der Boxer schlug seinen Gegner mit voller Kraft.", "is_phrase": false, "pos": "Substantiv"}, "kreise": {"def": "Runde Formen oder Punkte, die man sieht, wenn man sich schwindelig oder unwohl fühlt. Das passiert oft, wenn man müde ist oder gesundheitliche Probleme hat.", "example": "Nach dem langen Lauf sah sie bunte Kreise vor den Augen und musste sich hinsetzen.", "is_phrase": false, "pos": "Substantiv"}, "kriegen": {"def": "jemanden fangen oder festnehmen, besonders wenn diese Person wegläuft oder sich versteckt. Die Polizei versucht, Verbrecher zu kriegen.", "example": "Die Diebe liefen schnell weg, aber die Polizei konnte sie trotzdem kriegen.", "is_phrase": false, "pos": "Verb"}, "kroch": {"def": "sich sehr langsam und mit großer Anstrengung bewegen, oft weil man erschöpft oder verletzt ist. Man bewegt sich dabei meist auf Händen und Knien oder am Boden.", "example": "Nach dem schweren Unfall kroch er mühsam zur Haustür.", "is_phrase": false, "pos": "Verb"}, "könne": {"def": "Konjunktiv II von 'können'. Drückt aus, dass etwas möglich wäre oder dass man zweifelt, ob jemand etwas schaffen kann.", "example": "Sie sah müde aus, als könne sie nicht mehr weiterlaufen.", "is_phrase": false, "pos": "Verb"}, "können": {"def": "drückt aus, dass etwas möglich oder machbar ist; die Fähigkeit oder Gelegenheit haben, etwas zu tun", "example": "Wir können morgen ins Kino gehen, wenn du Zeit hast.", "is_phrase": false, "pos": "Verb"}, "könnte": {"def": "Konjunktiv II von 'können' - drückt aus, dass etwas möglich ist oder sein könnte. Wird verwendet, um über unsichere Situationen oder Möglichkeiten zu sprechen.", "example": "Sie dachte, dass das Wetter morgen schlecht werden könnte.", "is_phrase": false, "pos": "Verb"}, "lauernd": {"def": "Auf eine Art, die zeigt, dass man auf etwas Bestimmtes wartet oder hofft. Man spricht so, wenn man eine bestimmte Reaktion oder Antwort bekommen möchte.", "example": "Sie schaute ihn lauernd an und wartete darauf, dass er endlich die Wahrheit sagte.", "is_phrase": false, "pos": "Adverb"}, "lehnte": {"def": "Den Körper oder Rücken gegen etwas drücken, um sich darauf zu stützen oder auszuruhen. Man macht das oft, wenn man müde ist oder Schmerzen hat.", "example": "Nach dem langen Lauf lehnte sie sich an den Baum und atmete tief durch.", "is_phrase": false, "pos": "Verb"}, "leiche": {"def": "Der tote Körper eines Menschen. Wenn jemand gestorben ist, nennt man seinen Körper eine Leiche.", "example": "Die Polizei fand die Leiche im Wald und begann mit der Untersuchung.", "is_phrase": false, "pos": "Substantiv"}, "leise": {"def": "Mit sehr schwacher, kaum hörbarer Stimme sprechen. Man kann die Person schlecht verstehen, weil sie sehr ruhig und leise redet.", "example": "Sie sprach so leise, dass ich mich zu ihr beugen musste, um sie zu verstehen.", "is_phrase": false, "pos": "Adverb"}, "letzte": {"def": "die zuletzt gestellte, die vorherige. Bezieht sich auf die Frage, die gerade davor gestellt wurde.", "example": "Der Lehrer stellte drei Fragen, aber auf die letzte antwortete niemand.", "is_phrase": false, "pos": "Adjektiv"}, "leute": {"def": "Menschen, die sich an einem bestimmten Ort befinden oder zu einer bestimmten Gruppe gehören. Hier sind es die Personen, die in der Bank waren.", "example": "Die Leute im Supermarkt waren sehr erschrocken, als der Alarm losging.", "is_phrase": false, "pos": "Substantiv"}, "lidern": {"def": "Die beweglichen Hautteile, die das Auge bedecken können. Man schließt sie beim Schlafen oder wenn man müde ist.", "example": "Sie war so müde, dass ihre Lider immer wieder zufielen.", "is_phrase": false, "pos": "Substantiv"}, "ließ": {"def": "Bedeutet: Er hat nicht eingegriffen oder versucht, etwas zu verhindern. Er hat zugelassen, dass etwas passiert, ohne aktiv zu werden.", "example": "Als die Kinder im Garten Unsinn machten, ließ die Mutter es geschehen und griff nicht ein.", "is_phrase": true, "pos": "Redewendung"}, "lina": {"def": "Lina ist ein weiblicher Vorname. Hier spricht jemand eine Person namens Lina direkt an.", "example": "Lina, kommst du heute Abend mit ins Kino?", "is_phrase": false, "pos": "Eigenname"}, "los": {"def": "Ein Ausruf, mit dem man jemanden dazu auffordert, schnell etwas zu tun oder zu sagen. Man verwendet es, wenn man ungeduldig ist.", "example": "Los, beeil dich! Wir kommen zu spät!", "is_phrase": false, "pos": "Interjektion"}, "luftblase": {"def": "Ein Raum oder eine Situation, die von der Realität getrennt ist und nicht stabil ist. Etwas, das nicht echt ist und schnell verschwinden kann.", "example": "Er lebte in einer Luftblase aus falschen Hoffnungen, bis die Wahrheit ihn einholte.", "is_phrase": false, "pos": "Substantiv"}, "magst": {"def": "jemanden gern haben oder lieben; positive Gefühle für eine Person haben", "example": "Seit dem Streit magst du mich wohl nicht mehr.", "is_phrase": false, "pos": "Verb"}, "meinst": {"def": "Eine Frage stellen, um zu wissen, was jemand denkt oder glaubt. Man fragt nach der Meinung oder Einschätzung einer anderen Person.", "example": "Meinst du, es wird morgen regnen?", "is_phrase": false, "pos": "Verb"}, "metallisch": {"def": "So wie Metall aussehend oder sich anfühlend. Hier bedeutet es: mit dem typischen kalten, harten Glanz von Metall.", "example": "Das Messer hatte einen metallischen Glanz in der Sonne.", "is_phrase": false, "pos": "Adjektiv"}, "minute": {"def": "Eine sehr kurze Zeitspanne von 60 Sekunden. Wird hier verwendet, um zu zeigen, dass Tom sehr schwach ist und nicht einmal sehr kurz kämpfen könnte.", "example": "Der alte Mann war so müde, dass er keine Minute länger stehen konnte.", "is_phrase": false, "pos": "Substantiv"}, "mitgenommen": {"def": "etwas von einem Ort zu einem anderen Ort bringen oder transportieren. Man nimmt einen Gegenstand mit sich, wenn man irgendwohin geht.", "example": "Hast du deine Jacke mitgenommen? Es wird heute kalt.", "is_phrase": false, "pos": "Verb"}, "murmelte": {"def": "etwas sehr leise und undeutlich sagen, so dass andere es kaum hören können. Man spricht dabei meist mit geschlossenem Mund oder sehr leise vor sich hin.", "example": "\"Ich habe keine Lust\", murmelte Anna und schaute auf den Boden.", "is_phrase": false, "pos": "Verb"}, "mündung": {"def": "Die vordere Öffnung einer Waffe, aus der die Kugel herauskommt. Man sagt das, wenn jemand mit einer Pistole oder einem Gewehr auf eine Person zielt.", "example": "Der Räuber hielt die Mündung seiner Waffe direkt auf den Kassierer gerichtet.", "is_phrase": false, "pos": "Substantiv"}, "nachdem": {"def": "Zeigt an, dass etwas zeitlich nach einer anderen Handlung passiert. Bedeutet: als eine Sache beendet war, dann kam die nächste.", "example": "Nachdem ich geduscht hatte, ging ich ins Bett.", "is_phrase": false, "pos": "Konjunktion"}, "nase": {"def": "Das Organ im Gesicht, mit dem man riecht. Durch die Nase atmet man auch ein und aus.", "example": "Der Duft von frischen Blumen stieg ihr in die Nase.", "is_phrase": false, "pos": "Substantiv"}, "neben": {"def": "Bedeutet, dass etwas zusätzlich zu einer anderen Sache nicht mehr funktioniert oder aufhört. Es drückt aus, dass mehrere Dinge gleichzeitig versagen oder aussetzen.", "example": "Neben den starken Schmerzen setzte auch noch das Fieber ein.", "is_phrase": true, "pos": "Redewendung"}, "nee": {"def": "Ein informeller Ausruf, der Überraschung, Ärger oder Ablehnung ausdrückt. Wird oft gesagt, wenn etwas Unerwartetes oder Störendes passiert.", "example": "Nee, das kann doch nicht wahr sein!", "is_phrase": false, "pos": "Interjektion"}, "nein": {"def": "Ein Wort, das man sagt, wenn man etwas ablehnt oder nicht will. Es ist das Gegenteil von 'ja'.", "example": "Möchtest du noch ein Stück Kuchen? - Nein, danke.", "is_phrase": false, "pos": "Partikel"}, "notfall": {"def": "Eine gefährliche Situation, in der man schnell handeln muss. Wenn etwas Schlimmes passiert und man sich schützen oder helfen muss.", "example": "Im Notfall rufe ich sofort die Polizei an.", "is_phrase": false, "pos": "Substantiv"}, "nächsten": {"def": "Die Zeit, die direkt nach diesem Moment kommt. Es bedeutet hier: die Stunden, die danach folgten.", "example": "In den nächsten Tagen werde ich viel arbeiten müssen.", "is_phrase": false, "pos": "Adjektiv"}, "nötig": {"def": "bedeutet: man muss es tun oder braucht es. Wenn etwas nötig ist, dann ist es wichtig und notwendig.", "example": "Es ist nicht nötig, dass du mir hilfst - ich schaffe das allein.", "is_phrase": false, "pos": "Adjektiv"}, "ohrenbetäubenden": {"def": "So laut, dass es sehr unangenehm für die Ohren ist und fast wehtut. Man verwendet es für extrem laute Geräusche.", "example": "Die Musik auf dem Konzert war ohrenbetäubend laut.", "is_phrase": false, "pos": "Adjektiv"}, "passiert": {"def": "geschehen, sich ereignen. Man benutzt es, wenn man sagt, dass etwas stattgefunden hat oder nicht stattgefunden hat.", "example": "Ohne den Regen wäre das Picknick wie geplant passiert.", "is_phrase": false, "pos": "Verb"}, "passierte": {"def": "geschehen, sich ereignen. Es bedeutet, dass etwas mit einer Person oder Sache passiert oder ihr widerfährt.", "example": "Mir ist gestern etwas Seltsames passiert - ich habe meinen Nachbarn nach 20 Jahren wiedergetroffen.", "is_phrase": false, "pos": "Verb"}, "pistole": {"def": "Eine kleine Waffe, die man mit einer Hand halten kann und mit der man schießt. Man verwendet sie, um andere Menschen zu bedrohen oder zu verletzen.", "example": "Der Räuber zog eine Pistole aus der Jacke und forderte das Geld.", "is_phrase": false, "pos": "Substantiv"}, "platz": {"def": "Eine bestimmte Stelle oder Position, wo jemand normalerweise sitzt, liegt oder steht. Oft ist es ein Ort, den man regelmäßig benutzt oder der einem gehört.", "example": "Nach der Pause ging jeder Schüler wieder zu seinem Platz im Klassenzimmer.", "is_phrase": false, "pos": "Substantiv"}, "platzen": {"def": "Wenn etwas platzt, zerreißt oder zerbricht es plötzlich, weil zu viel Druck darin ist. Bei einer Luftblase bedeutet es, dass sie kaputtgeht und die Luft herauskommt.", "example": "Der Ballon platzte mit einem lauten Knall, als das Kind ihn zu stark aufblies.", "is_phrase": false, "pos": "Verb"}, "platzte": {"def": "Das bedeutet, dass etwas sehr laut war und das Ohr wehgetan hat. Man sagt das, wenn ein Geräusch so stark ist, dass man Schmerzen im Ohr bekommt.", "example": "Die Musik war so laut, dass mir fast das Trommelfell platzte.", "is_phrase": true, "pos": "Redewendung"}, "plötzlich": {"def": "ohne Vorwarnung, von einem Moment zum anderen, sehr schnell und unerwartet", "example": "Plötzlich begann es zu regnen, obwohl der Himmel klar war.", "is_phrase": false, "pos": "Adverb"}, "polizist": {"def": "Eine Person, die bei der Polizei arbeitet und für Ordnung und Sicherheit sorgt. Polizisten haben die Aufgabe, Verbrecher zu fangen und Gesetze durchzusetzen.", "example": "Der Polizist kontrollierte die Ausweise der Passanten.", "is_phrase": false, "pos": "Substantiv"}, "position": {"def": "Sich bereit machen zum Kampf oder zur Verteidigung. Man stellt sich so hin, dass man sich wehren oder angreifen kann.", "example": "Als der Hund knurrte, stellte sich der Mann in Position, um sich zu verteidigen.", "is_phrase": true, "pos": "Redewendung"}, "präparierten": {"def": "so verändert oder bearbeitet, dass etwas anders aussieht oder funktioniert als normal. Hier bedeutet es, dass die Wasserpistolen so gemacht wurden, dass sie wie echte Waffen aussehen.", "example": "Die Schauspieler verwendeten präparierte Requisiten, die wie echte Gegenstände wirkten.", "is_phrase": false, "pos": "Adjektiv"}, "pullover": {"def": "Ein warmes Kleidungsstück aus Wolle oder anderem Material, das man über dem Hemd oder T-Shirt trägt. Es hat lange Ärmel und man zieht es über den Kopf an.", "example": "Im Winter trage ich immer einen warmen Pullover unter meiner Jacke.", "is_phrase": false, "pos": "Substantiv"}, "quatschst": {"def": "Du redest immer noch über etwas, obwohl es nervt oder sinnlos ist. Es bedeutet, dass jemand zu viel über ein Thema spricht.", "example": "Hör auf, von deinen Problemen zu quatschen - wir haben das schon hundert Mal besprochen!", "is_phrase": false, "pos": "Verb"}, "raschen": {"def": "sehr schnell und ohne zu zögern. Die Bewegung passiert in sehr kurzer Zeit.", "example": "Mit einer raschen Handbewegung wischte sie die Tränen weg.", "is_phrase": false, "pos": "Adjektiv"}, "raststätte": {"def": "Ein Platz an der Autobahn, wo Autofahrer anhalten können, um zu essen, zu trinken oder zur Toilette zu gehen. Dort gibt es meist ein Restaurant, einen Shop und Tankstellen.", "example": "Wir haben an der Raststätte eine Pause gemacht und Kaffee getrunken.", "is_phrase": false, "pos": "Substantiv"}, "rattenloch": {"def": "Ein sehr schlechter, ungemütlicher oder unangenehmer Ort, an dem man nicht sein möchte. Man benutzt dieses Wort, wenn man einen Ort stark kritisiert.", "example": "Diese kleine, dunkle Wohnung ist ein richtiges Rattenloch - hier kann man nicht wohnen.", "is_phrase": false, "pos": "Substantiv"}, "raum": {"def": "Ein Bereich oder Gebiet, das keine festen Grenzen hat und in dem man sich bewegen kann. Oft ist es ein größerer, offener Bereich ohne Wände oder Decke.", "example": "Die Vögel flogen durch den weiten Raum über den Feldern.", "is_phrase": false, "pos": "Substantiv"}, "rausgegangen": {"def": "Umgangssprachlich für 'hinausgegangen' oder 'weggegangen'. Bedeutet, dass man einen Ort verlassen hat oder nach draußen gegangen ist.", "example": "Nach dem Streit ist sie einfach rausgegangen und hat die Tür zugemacht.", "is_phrase": false, "pos": "Verb"}, "reagierte": {"def": "Eine Antwort geben oder zeigen, dass man etwas gehört oder verstanden hat. Wenn jemand nicht reagiert, antwortet er nicht und zeigt keine Reaktion.", "example": "Als ich ihn nach seinem Namen fragte, reagierte er überhaupt nicht.", "is_phrase": false, "pos": "Verb"}, "redest": {"def": "Du sprichst über etwas. Du machst etwas zum Thema deiner Worte.", "example": "Warum redest du immer von der Arbeit, wenn wir Freizeit haben?", "is_phrase": false, "pos": "Verb"}, "redete": {"def": "Sprach oder sagte etwas. Es ist die Vergangenheitsform von 'reden'.", "example": "Als sie mit ihm über das Problem redete, wurde er sehr traurig.", "is_phrase": false, "pos": "Verb"}, "reingerissen": {"def": "Jemanden mit in eine schwierige oder gefährliche Situation hineinziehen. Die Person wird ungewollt in Probleme oder Schwierigkeiten verwickelt.", "example": "Durch seinen Betrug hat er auch seine Familie mit reingerissen.", "is_phrase": true, "pos": "Redewendung"}, "rief": {"def": "Etwas laut sagen oder schreien. Man benutzt dieses Wort, wenn jemand mit lauter Stimme spricht.", "example": "\"Hilfe!\", rief das Kind, als es den großen Hund sah.", "is_phrase": false, "pos": "Verb"}, "rieselte": {"def": "langsam in kleinen Stücken oder Körnern herunterfallen. Das passiert oft, wenn etwas alt oder kaputt ist.", "example": "Sand rieselte durch meine Finger, als ich ihn hochhob.", "is_phrase": false, "pos": "Verb"}, "rote": {"def": "Die Farbe rot, die man sieht, wenn man Schmerzen hat, sehr müde ist oder fast ohnmächtig wird. Das passiert, wenn die Augen nicht richtig funktionieren.", "example": "Nach dem harten Training sah ich rote Punkte vor meinen Augen.", "is_phrase": false, "pos": "Adjektiv"}, "ruhig": {"def": "ohne Aufregung oder starke Gefühle, mit einer kontrollierten und gelassenen Stimme sprechen", "example": "Als der Chef ihn kritisierte, antwortete er ruhig und höflich.", "is_phrase": false, "pos": "Adverb"}, "rücken": {"def": "Wenn man eine Gänsehaut über den Rücken bekommt, fühlt man plötzlich Angst oder Schrecken. Die Haut wird dabei kalt und man bekommt kleine Erhebungen auf der Haut.", "example": "Als ich das gruselige Geräusch hörte, jagte es mir eine Gänsehaut über den Rücken.", "is_phrase": true, "pos": "Redewendung"}, "sag": {"def": "Eine andere Person soll etwas mit Worten mitteilen oder erzählen. Man fordert jemanden auf, Informationen zu geben.", "example": "Sag mir bitte, wie spät es ist!", "is_phrase": false, "pos": "Verb"}, "sagte": {"def": "Vergangenheitsform von 'sagen'. Man benutzt es, um zu zeigen, dass jemand Worte gesprochen hat.", "example": "Maria sagte mir gestern, dass sie nach Berlin ziehen will.", "is_phrase": false, "pos": "Verb"}, "sagten": {"def": "Vergangenheitsform von 'sagen'. Hier bedeutet es: sprechen oder etwas mit Worten ausdrücken.", "example": "Die beiden Freunde waren traurig und sagten den ganzen Abend kein Wort.", "is_phrase": false, "pos": "Verb"}, "sah": {"def": "Vergangenheitsform von 'sehen'. Hier bedeutet es: einen bestimmten Eindruck machen oder wirken.", "example": "Maria sah müde aus, deshalb ging sie früh ins Bett.", "is_phrase": false, "pos": "Verb"}, "satz": {"def": "Eine schnelle, große Bewegung, mit der man springt oder sich schnell bewegt. Hier bedeutet es: Er ist mit einem großen Sprung schnell zu mir gekommen.", "example": "Die Katze erreichte mit einem Satz das andere Ufer des Bachs.", "is_phrase": false, "pos": "Substantiv"}, "saß": {"def": "Vergangenheitsform von 'sitzen'. Es bedeutet, dass jemand auf einem Stuhl, einer Bank oder an einem Ort war und dort blieb.", "example": "Maria saß den ganzen Nachmittag am Schreibtisch und lernte für die Prüfung.", "is_phrase": false, "pos": "Verb"}, "saßen": {"def": "Vergangenheitsform von 'sitzen': auf einem Stuhl oder an einem Platz bleiben und sich nicht bewegen. Hier bedeutet es, dass zwei Personen längere Zeit an ihren Plätzen blieben.", "example": "Nach dem Streit saßen die beiden Freunde eine Stunde lang schweigend am Tisch.", "is_phrase": false, "pos": "Verb"}, "schatten": {"def": "Dunkle Bereiche an einer Wand oder Oberfläche, die entstehen, wenn Licht durch Gegenstände blockiert wird. Diese dunklen Formen bewegen sich, wenn das Licht unruhig ist.", "example": "Die Kerze auf dem Tisch warf tanzende Schatten an die Zimmerdecke.", "is_phrase": false, "pos": "Substantiv"}, "schein": {"def": "Das Licht, das von einer Lampe, Kerze oder anderen Lichtquelle kommt. Dieses Licht macht die Umgebung hell und man kann Schatten sehen.", "example": "Der Schein der Straßenlaterne erleuchtete den dunklen Weg.", "is_phrase": false, "pos": "Substantiv"}, "scheine": {"def": "Geldscheine, also Papiergeld wie 10-Euro-Scheine, 20-Euro-Scheine usw. Das ist Geld in Form von Papier, nicht Münzen.", "example": "An der Tankstelle bezahlte er mit Scheinen, weil er keine Karte dabei hatte.", "is_phrase": false, "pos": "Substantiv"}, "schien": {"def": "Es sah so aus, als ob etwas der Fall war. Man hatte den Eindruck, dass etwas so ist, aber man war sich nicht ganz sicher.", "example": "Das Kind schien müde zu sein, deshalb brachten wir es ins Bett.", "is_phrase": false, "pos": "Verb"}, "schleppte": {"def": "Sich mit großer Mühe und langsam fortbewegen, weil man schwach, krank oder sehr erschöpft ist. Man kann sich nur schwer bewegen.", "example": "Nach der schweren Operation schleppte sie sich mühsam die Treppe hinauf.", "is_phrase": true, "pos": "Redewendung"}, "schlug": {"def": "Vergangenheitsform von 'schlagen'. In Beleg 1: Das Herz klopfte sehr stark und schnell (vor Aufregung oder Angst). In Beleg 2: jemanden mit der Hand oder Faust hart treffen.", "example": "Mein Herz schlug wild, als ich die Prüfungsergebnisse sah.", "is_phrase": false, "pos": "Verb"}, "schlägen": {"def": "Harte Bewegungen mit der Hand oder Faust, mit denen man jemanden trifft und verletzt. Man macht das, wenn man sehr wütend ist oder jemanden angreifen will.", "example": "Nach dem Streit musste der Arzt seine Schläge behandeln.", "is_phrase": false, "pos": "Substantiv"}, "schmerzen": {"def": "Das unangenehme Gefühl im Körper, wenn etwas wehtut oder verletzt ist. Man spürt Schmerzen zum Beispiel bei einer Wunde oder wenn man krank ist.", "example": "Nach der Operation hatte sie starke Schmerzen im Bauch.", "is_phrase": false, "pos": "Substantiv"}, "schmerzverzerrtem": {"def": "Das Gesicht ist durch starke Schmerzen verändert und entstellt. Die Schmerzen sind so stark, dass man sie deutlich im Gesicht sehen kann.", "example": "Nach dem Sturz lag er mit schmerzverzerrtem Gesicht auf dem Boden.", "is_phrase": false, "pos": "Adjektiv"}, "schob": {"def": "Mit den Händen an der Wand helfen, um vom Boden aufzustehen oder sich hochzuziehen. Man benutzt die Wand als Stütze, um sich zu erheben.", "example": "Nach dem Sturz schob er sich mühsam an der Hauswand hoch.", "is_phrase": true, "pos": "Redewendung"}, "schrie": {"def": "Sehr laut und aggressiv sprechen, wenn man wütend oder aufgeregt ist. Es ist viel lauter als normales Sprechen.", "example": "Als sie den Unfall sah, schrie sie vor Schreck.", "is_phrase": false, "pos": "Verb"}, "schultern": {"def": "Das ist eine Körperbewegung, die zeigt, dass man etwas nicht weiß oder dass einem etwas egal ist. Man hebt beide Schultern kurz nach oben.", "example": "Als sie ihn fragte, wo sein Bruder ist, zuckte er nur mit den Schultern.", "is_phrase": true, "pos": "Redewendung"}, "schwarzen": {"def": "dunkel und bedrohlich wirkend; ohne Licht und hoffnungslos. Hier beschreibt es eine gefährliche, unheimliche Situation.", "example": "Der Himmel wurde schwarz und kündigte das Unwetter an.", "is_phrase": false, "pos": "Adjektiv"}, "schwebten": {"def": "sich langsam und leicht durch die Luft bewegen, ohne den Boden zu berühren. Man fühlt sich dabei oft wie im Traum oder in der Fantasie.", "example": "Die Tänzerin schwebte so leicht über die Bühne, als hätte sie keine Füße.", "is_phrase": false, "pos": "Verb"}, "schwein": {"def": "Ein sehr unhöfliches Schimpfwort für eine Person, die sich schlecht oder gemein verhält. Man benutzt es, wenn man sehr wütend auf jemanden ist.", "example": "Nach dem Streit nannte sie ihren Ex-Freund ein Schwein, weil er sie betrogen hatte.", "is_phrase": false, "pos": "Substantiv"}, "schwer": {"def": "mit Mühe und Anstrengung, nicht leicht oder normal. Man benutzt es oft bei der Atmung, wenn jemand krank ist oder sich angestrengt hat.", "example": "Nach dem langen Lauf atmete sie schwer und musste sich hinsetzen.", "is_phrase": false, "pos": "Adverb"}, "schwör": {"def": "Eine umgangssprachliche Art zu sagen 'Ich verspreche es' oder 'Das ist wahr'. Man benutzt es, um zu zeigen, dass man etwas ganz sicher meint.", "example": "Ich schwör's, ich war gestern wirklich krank und bin nicht zur Party gegangen!", "is_phrase": true, "pos": "Redewendung"}, "schüttelte": {"def": "Eine Geste, die zeigt, dass man etwas nicht will, nicht zustimmt oder verneint. Man bewegt den Kopf von links nach rechts.", "example": "Als ich ihn fragte, ob er mitkommen möchte, schüttelte er den Kopf.", "is_phrase": true, "pos": "Redewendung"}, "schützen": {"def": "Etwas tun, damit man sich selbst vor Schmerz oder Verletzung bewahrt. Man versucht zu verhindern, dass einem etwas Schlechtes passiert.", "example": "Bei dem Sturm hielt sie sich die Jacke vor das Gesicht, um sich vor dem Regen zu schützen.", "is_phrase": false, "pos": "Verb"}, "see": {"def": "Ein großes Gewässer mit stehendem Wasser, das von Land umgeben ist. Hier wird es als Bild für ein Gefühl von Kälte, Schock und Hilflosigkeit verwendet.", "example": "Als sie die schlechte Nachricht hörte, fühlte sie sich, als würde sie in einen kalten See fallen.", "is_phrase": false, "pos": "Substantiv"}, "setz": {"def": "Imperativ von 'sich setzen' - eine Aufforderung, den Körper auf einen Stuhl, eine Bank oder einen anderen Platz zu bringen. Man benutzt es, wenn man jemandem sagen will, dass er sich hinsetzen soll.", "example": "Setz dich auf den Stuhl und warte hier.", "is_phrase": false, "pos": "Verb"}, "setzen": {"def": "Jemanden außer Gefecht setzen bedeutet: jemanden kampfunfähig machen oder besiegen. Die Person kann dann nicht mehr kämpfen oder angreifen.", "example": "Der Boxer konnte seinen Gegner mit einem starken Schlag außer Gefecht setzen.", "is_phrase": true, "pos": "Redewendung"}, "setzte": {"def": "Wenn etwas aussetzt, dann hört es plötzlich auf zu funktionieren oder zu arbeiten. Man kann es nicht mehr kontrollieren oder benutzen.", "example": "Bei der schlechten Nachricht setzte sein Gedächtnis aus und er konnte sich an nichts mehr erinnern.", "is_phrase": true, "pos": "Redewendung"}, "sieh": {"def": "Eine Redewendung, die bedeutet: akzeptiere die Wahrheit oder verstehe endlich die Situation. Man sagt das, wenn jemand etwas nicht wahrhaben will.", "example": "Sieh doch ein, dass du einen Fehler gemacht hast und entschuldige dich.", "is_phrase": true, "pos": "Redewendung"}, "sitzen": {"def": "Nicht weggehen können, weil man gefangen ist oder keine Möglichkeit hat zu fliehen. Man ist an einem Ort und kann nicht weg, obwohl man das möchte.", "example": "Nach dem Schneesturm saßen die Wanderer drei Tage in der Berghütte fest.", "is_phrase": true, "pos": "Redewendung"}, "solarplexus": {"def": "Eine empfindliche Stelle am Oberkörper, zwischen den Rippen und dem Bauch. Wenn man dort getroffen wird, kann man schlecht atmen und bekommt starke Schmerzen.", "example": "Der Boxer zielte auf den Solarplexus seines Gegners, um ihn schnell zu besiegen.", "is_phrase": false, "pos": "Substantiv"}, "sollen": {"def": "drückt aus, dass etwas richtig oder nötig gewesen wäre, aber nicht gemacht wurde (Bedauern über etwas Vergangenes)", "example": "Ich hätte früher anfangen sollen zu lernen, dann wäre die Prüfung einfacher gewesen.", "is_phrase": false, "pos": "Modalverb"}, "sollten": {"def": "Drückt einen trotzigen Wunsch aus: 'Es wäre mir egal, wenn das passiert' oder 'Das können sie ruhig machen'. Wird mit 'doch' verwendet, um zu zeigen, dass man keine Angst hat.", "example": "Sollten sie doch kommen und mich kritisieren - es ist mir gleichgültig.", "is_phrase": false, "pos": "Verb"}, "sparkasse": {"def": "Eine Bank, die vor allem für normale Bürger da ist und wo man Geld sparen und Kredite bekommen kann. Sparkassen gehören meist der Stadt oder dem Kreis.", "example": "Ich gehe zur Sparkasse, um Geld von meinem Konto abzuheben.", "is_phrase": false, "pos": "Substantiv"}, "spiel": {"def": "Eine Situation, in der Menschen gegeneinander kämpfen oder konkurrieren und es Gewinner und Verlierer gibt. Kann auch bedeuten: etwas, das nicht ernst oder wichtig ist.", "example": "Die Verhandlungen waren für ihn nur ein Spiel, aber für uns ging es um unsere Zukunft.", "is_phrase": false, "pos": "Substantiv"}, "stand": {"def": "Das Verb 'stehen' in der Vergangenheitsform. In Beleg 1 bedeutet es: sich von einem Sitz erheben. In Beleg 2 in der festen Verbindung 'feststehen': sicher und unveränderlich sein.", "example": "Als der Lehrer hereinkam, stand die ganze Klasse auf. Meine Meinung steht fest - ich werde nicht nachgeben.", "is_phrase": false, "pos": "Verb"}, "stank": {"def": "Einen sehr schlechten, unangenehmen Geruch haben. Das Verb drückt aus, dass etwas übel riecht.", "example": "In der alten Küche stank es nach faulem Fleisch und schmutzigem Geschirr.", "is_phrase": false, "pos": "Verb"}, "statt": {"def": "Zeigt an, dass man etwas anderes macht als erwartet oder als Alternative. Man benutzt es, wenn man eine Handlung durch eine andere ersetzt.", "example": "Statt zu lernen, schaute er den ganzen Tag fern.", "is_phrase": false, "pos": "Konjunktion"}, "stechender": {"def": "So stark und unangenehm, dass es in der Nase brennt oder schmerzt. Wird bei sehr intensiven, scharfen Gerüchen verwendet.", "example": "Der stechende Geruch von Rauch machte das Atmen schwer.", "is_phrase": false, "pos": "Adjektiv"}, "stelle": {"def": "sich dem Gegner oder der Polizei ergeben; aufgeben und sich nicht mehr verstecken", "example": "Der Dieb stellte sich nach drei Tagen bei der Polizei.", "is_phrase": false, "pos": "Verb (reflexiv)"}, "stellen": {"def": "Jemanden vor Gericht bringen bedeutet, dass diese Person wegen einer Straftat angeklagt wird. Die Person muss dann vor einem Richter erscheinen und sich für ihre Taten verantworten.", "example": "Der Dieb wurde vor Gericht gestellt und zu zwei Jahren Gefängnis verurteilt.", "is_phrase": true, "pos": "Redewendung"}, "stellte": {"def": "Sich bereit machen für einen Kampf oder eine schwierige Situation. Man bringt seinen Körper in eine gute Stellung, um sich zu verteidigen oder anzugreifen.", "example": "Als der große Hund auf ihn zukam, stellte sich der kleine Junge mutig in Position.", "is_phrase": true, "pos": "Redewendung"}, "steppjacke": {"def": "Eine warme Jacke mit vielen kleinen Kammern, die mit weichem Material gefüllt sind. Sie hält sehr warm und wird oft im Winter getragen.", "example": "Bei der Kälte zog sie ihre dicke Steppjacke an, bevor sie das Haus verließ.", "is_phrase": false, "pos": "Substantiv"}, "stille": {"def": "Ein Zustand, in dem niemand spricht und es sehr ruhig ist. Oft entsteht diese Atmosphäre in wichtigen oder emotionalen Momenten.", "example": "Nach der schlechten Nachricht herrschte eine lange Stille im Raum.", "is_phrase": false, "pos": "Substantiv"}, "stumm": {"def": "Ohne zu sprechen, schweigend. Man sagt nichts und macht keinen Ton mit dem Mund.", "example": "Nach dem Streit blieben beide stumm und schauten nur auf den Boden.", "is_phrase": false, "pos": "Adjektiv"}, "stunden": {"def": "Zeitraum von 60 Minuten. Wird oft verwendet, um eine längere Zeit zu beschreiben.", "example": "Nach drei Stunden Autofahrt machten wir endlich eine Pause.", "is_phrase": false, "pos": "Substantiv"}, "stürzte": {"def": "Sich sehr schnell und heftig auf eine Person bewegen, um sie anzugreifen. Man macht das ohne nachzudenken, aus starken Gefühlen heraus.", "example": "Als er seine Schwester beleidigte, stürzte sie sich auf ihn und schrie ihn an.", "is_phrase": true, "pos": "Redewendung"}, "tanzten": {"def": "sich schnell und unregelmäßig vor den Augen bewegen, oft wenn man schwindlig ist oder sich unwohl fühlt", "example": "Nach dem schnellen Aufstehen tanzten bunte Punkte vor ihren Augen.", "is_phrase": false, "pos": "Verb"}, "tasche": {"def": "Ein kleiner Raum in der Kleidung, wo man Dinge wie Geld, Schlüssel oder Handy aufbewahren kann.", "example": "Sie steckte ihr Portemonnaie in die Tasche ihres Mantels.", "is_phrase": false, "pos": "Substantiv"}, "tat": {"def": "Vergangenheitsform von 'tun'. Bedeutet: eine Handlung ausführen oder etwas machen.", "example": "Er bat mich, leise zu sein, und ich tat es sofort.", "is_phrase": false, "pos": "Verb"}, "teilen": {"def": "Etwas unter mehreren Personen aufteilen, so dass jeder einen Teil bekommt. Hier bedeutet es: das Geld zwischen den beiden Personen aufteilen.", "example": "Die drei Freunde wollten den Gewinn gerecht teilen.", "is_phrase": false, "pos": "Verb"}, "tod": {"def": "Das Ende des Lebens, wenn ein Lebewesen stirbt. Hier wird der Geruch beschrieben, der entsteht, wenn etwas gestorben ist.", "example": "In dem alten Keller roch es nach Tod, weil dort tote Tiere lagen.", "is_phrase": false, "pos": "Substantiv"}, "tom": {"def": "Tom ist ein männlicher Vorname. In diesem Text ist Tom eine Person, mit der der Erzähler spricht oder über die er erzählt.", "example": "Tom ist mein bester Freund und wir machen alles zusammen.", "is_phrase": false, "pos": "Eigenname"}, "toms": {"def": "Toms ist hier ein männlicher Vorname. Es ist der Name einer Person, die in der Szene anwesend ist.", "example": "Bei dem schwachen Licht konnte ich nur Marias Gesicht deutlich sehen.", "is_phrase": false, "pos": "Substantiv"}, "tot": {"def": "Nicht mehr lebend. Eine Person oder ein Tier ist gestorben und lebt nicht mehr.", "example": "Der alte Mann war krank und ist gestern tot aufgefunden worden.", "is_phrase": false, "pos": "Adjektiv"}, "trennen": {"def": "sich voneinander entfernen und verschiedene Wege gehen. Man geht nicht mehr zusammen weiter.", "example": "Nach dem Streit beschlossen die beiden Freunde, sich zu trennen und allein weiterzureisen.", "is_phrase": false, "pos": "Verb"}, "tritt": {"def": "Eine schnelle, kräftige Bewegung mit dem Fuß, um jemanden zu verletzen oder wegzustoßen. Man hebt das Bein und stößt mit dem Fuß gegen eine Person oder Sache.", "example": "Der Fußballspieler bekam einen Tritt gegen das Schienbein und fiel zu Boden.", "is_phrase": false, "pos": "Substantiv"}, "trommelfell": {"def": "Das bedeutet, dass etwas sehr laut war. Man sagt das, wenn ein Geräusch so stark ist, dass es in den Ohren wehtut.", "example": "Die Musik war so laut, dass mir fast das Trommelfell platzte.", "is_phrase": true, "pos": "Redewendung"}, "typ": {"def": "Ein Mann oder eine Person, die man nicht näher kennt oder deren Namen man nicht weiß. Es ist eine umgangssprachliche und etwas unhöfliche Art, über jemanden zu sprechen.", "example": "Der Typ da drüben hat mein Fahrrad gestohlen.", "is_phrase": false, "pos": "Substantiv"}, "tür": {"def": "Eine Öffnung in der Wand, durch die man einen Raum verlassen oder betreten kann. Sie kann mit einem beweglichen Teil (Türblatt) geschlossen werden.", "example": "Als sie böse wurde, ging sie schnell zur Tür und verließ das Zimmer.", "is_phrase": false, "pos": "Substantiv"}, "umgebracht": {"def": "jemanden töten, das Leben von einer Person beenden. Es ist ein starkes Wort, das bedeutet, dass jemand einen anderen Menschen getötet hat.", "example": "Der Täter wurde verhaftet, weil er seinen Nachbarn umgebracht h
