atte.", "is_phrase": false, "pos": "Verb"}, "umrisse": {"def": "Die schwachen Linien oder Formen einer Person oder eines Gegenstands, die man bei schlechtem Licht nur undeutlich sehen kann. Man erkennt nur die äußere Form, aber keine Details.", "example": "Im Nebel konnte sie nur die Umrisse des Hauses erkennen.", "is_phrase": false, "pos": "Substantiv"}, "unfall": {"def": "Ein Ereignis, bei dem jemand verletzt wird oder etwas kaputt geht, ohne dass es jemand absichtlich gemacht hat. Es passiert aus Versehen oder durch Pech.", "example": "Bei dem Unfall auf der Autobahn wurde zum Glück niemand schwer verletzt.", "is_phrase": false, "pos": "Substantiv"}, "unsere": {"def": "Das Wort zeigt, dass etwas zu uns gehört oder mit uns zu tun hat. Hier bedeutet es: die Gesichter von uns (einer Gruppe von Personen, zu der der Sprecher gehört).", "example": "Die Lehrerin hat unsere Namen in ihr Buch geschrieben.", "is_phrase": false, "pos": "Possessivpronomen"}, "unserer": {"def": "Zeigt an, dass etwas zu der Gruppe gehört, zu der der Sprecher gehört. Bedeutet: von uns, die zu uns gehört.", "example": "Die Lehrerin lobte unsere Klasse für die gute Arbeit.", "is_phrase": false, "pos": "Possessivpronomen"}, "verdammtes": {"def": "Ein Schimpfwort, das Wut und Ärger ausdrückt. Es macht die Beleidigung stärker und zeigt, dass jemand sehr böse ist.", "example": "Du verdammter Idiot, warum hast du das gemacht!", "is_phrase": false, "pos": "Adjektiv"}, "verfallenen": {"def": "Ein Gebäude oder Ort, der sehr alt und kaputt ist, weil niemand sich darum gekümmert hat. Es ist in sehr schlechtem Zustand.", "example": "Die verfallene Ruine war einmal ein schönes Schloss, aber jetzt waren die Wände eingestürzt und Pflanzen wuchsen überall.", "is_phrase": false, "pos": "Adjektiv"}, "verloren": {"def": "Nicht gewonnen haben, bei einem Wettkampf oder Spiel schlechter sein als der Gegner. Das Gegenteil von gewinnen.", "example": "Unsere Mannschaft hat das Fußballspiel 2:3 verloren.", "is_phrase": false, "pos": "Partizip Perfekt"}, "verrückt": {"def": "Das sagt man, wenn jemand etwas sehr Unlogisches oder Falsches denkt oder behauptet. Es bedeutet hier nicht wirklich krank im Kopf, sondern dass die Idee völlig falsch ist.", "example": "Du bist verrückt, wenn du glaubst, dass ich dein Geld gestohlen habe!", "is_phrase": false, "pos": "Adjektiv"}, "verstand": {"def": "Die Fähigkeit, klar zu denken und Situationen zu verstehen. Wenn der Verstand aussetzt, kann man nicht mehr rational denken.", "example": "Der Schock war so groß, dass ihr Verstand völlig aussetzte und sie nicht mehr wusste, was sie tun sollte.", "is_phrase": false, "pos": "Substantiv"}, "verteidigen": {"def": "sich gegen einen Angriff oder eine Gefahr schützen und zurückkämpfen. Man will sich selbst oder andere vor Schaden bewahren.", "example": "Der Mann lernte Kampfsport, um sich im Notfall verteidigen zu können.", "is_phrase": false, "pos": "Verb"}, "verwesung": {"def": "Der Prozess, wenn ein toter Körper langsam zerfällt und dabei einen sehr unangenehmen Geruch entwickelt. Es ist der natürliche Abbau von totem organischem Material.", "example": "Der Geruch der Verwesung im alten Keller war so stark, dass niemand dort bleiben konnte.", "is_phrase": false, "pos": "Substantiv"}, "vorbei": {"def": "beendet, zu Ende; wenn etwas nicht mehr existiert oder nicht mehr passiert", "example": "Unsere Beziehung ist vorbei, wir haben uns getrennt.", "is_phrase": false, "pos": "Adjektiv"}, "waffe": {"def": "Ein Gegenstand aus Metall, mit dem man schießen kann, um andere zu verletzen oder zu töten. Man hält sie in der Hand und drückt einen Knopf, um zu schießen.", "example": "Der Polizist zog seine Waffe, als er den Verbrecher sah.", "is_phrase": false, "pos": "Substantiv"}, "wahrscheinlich": {"def": "Drückt aus, dass etwas sehr möglich ist, aber nicht sicher. Man verwendet es, wenn man denkt, dass etwas passieren wird oder wahr ist.", "example": "Es regnet heute wahrscheinlich, denn der Himmel ist sehr dunkel.", "is_phrase": false, "pos": "Adverb"}, "wand": {"def": "Eine senkrechte Fläche in einem Raum oder Gebäude, die einen Raum begrenzt. Man kann sich daran anlehnen oder abstützen.", "example": "Sie stellte das Bett direkt an die Wand.", "is_phrase": false, "pos": "Substantiv"}, "wandte": {"def": "sich drehen und in eine andere Richtung gehen oder schauen", "example": "Nach dem Gespräch wandte sie sich ab und ging weg.", "is_phrase": false, "pos": "Verb"}, "warf": {"def": "machte, dass etwas an einem anderen Ort zu sehen war. Das Licht ließ die Schatten entstehen und auf die Wände fallen.", "example": "Die Straßenlaterne warf helles Licht auf den dunklen Weg.", "is_phrase": false, "pos": "Verb"}, "was": {"def": "Ein Fragewort, mit dem man nach einer Sache, einem Ereignis oder einer Handlung fragt. Man benutzt es, wenn man wissen möchte, welche Sache oder welches Ereignis gemeint ist.", "example": "Was machst du morgen in deiner Freizeit?", "is_phrase": false, "pos": "Pronomen"}, "wasserpistole": {"def": "Ein Spielzeug in Form einer Pistole, das Wasser schießt. Wird oft als Vergleich für eine harmlose oder ungefährliche Waffe verwendet.", "example": "Die Kinder spielten im Garten mit ihren Wasserpistolen und spritzten sich gegenseitig nass.", "is_phrase": false, "pos": "Substantiv"}, "wasserpistolen": {"def": "Spielzeugwaffen, die Wasser spritzen, aber hier so verändert wurden, dass sie wie echte Waffen aussehen. Sie werden benutzt, um andere Menschen zu täuschen oder zu bedrohen.", "example": "Die Räuber benutzten präparierte Wasserpistolen, damit die Polizei dachte, sie hätten echte Waffen.", "is_phrase": false, "pos": "Substantiv"}, "weiß": {"def": "haben Kenntnis oder Information über etwas; etwas ist einem bekannt oder man hat es gelernt", "example": "Ich weiß seinen Namen nicht mehr.", "is_phrase": false, "pos": "Verb"}, "weißt": {"def": "Eine umgangssprachliche Wendung, die man am Ende eines Satzes sagt, um zu zeigen, dass der andere verstehen soll, was gemeint ist. Man verwendet es, wenn man nicht alles direkt aussprechen möchte.", "example": "Ich bringe vorsichtshalber einen Regenschirm mit, weißt du.", "is_phrase": true, "pos": "Redewendung"}, "welt": {"def": "Diese Redewendung bedeutet: sehr überrascht oder schockiert sein. Man fühlt sich, als ob man nicht mehr zur normalen Welt gehört.", "example": "Als ich hörte, dass ich im Lotto gewonnen hatte, war ich wie aus der Welt gefallen.", "is_phrase": true, "pos": "Redewendung"}, "wiederholte": {"def": "Etwas noch einmal sagen, was man schon vorher gesagt hat. Hier: Die Person sagt das Wort 'Idiot' zum zweiten Mal.", "example": "Er sagte 'Nein' und wiederholte es noch lauter: 'Nein!'", "is_phrase": false, "pos": "Verb"}, "wieso": {"def": "Eine Frage nach dem Grund für etwas. Man fragt damit, warum jemand etwas getan hat.", "example": "Wieso bist du so spät nach Hause gekommen?", "is_phrase": false, "pos": "Adverb"}, "willst": {"def": "Diese Frage stellt man, wenn jemand etwas behauptet und man bezweifelt, dass die Person das wirklich wissen kann. Man fragt nach dem Beweis oder der Quelle für diese Information.", "example": "Er sagt, dass morgen schönes Wetter wird. Woher willst du das denn wissen?", "is_phrase": true, "pos": "Redewendung"}, "windstoß": {"def": "Eine plötzliche, kurze und starke Bewegung von Wind. Der Wind kommt schnell und unerwartet.", "example": "Der Windstoß war so stark, dass er die Tür zugeschlagen hat.", "is_phrase": false, "pos": "Substantiv"}, "wirklich": {"def": "Drückt Zweifel oder Erstaunen aus. Man fragt sich, ob etwas tatsächlich so ist, wie es scheint.", "example": "Denkst du wirklich, dass er die Wahrheit sagt?", "is_phrase": false, "pos": "Adverb"}, "wischte": {"def": "Mit der Hand schnell über eine Stelle streichen, um etwas wegzumachen. Hier: Er streicht sich über die Augen, um Tränen wegzumachen.", "example": "Nach dem traurigen Film wischte sie sich die Tränen aus dem Gesicht.", "is_phrase": false, "pos": "Verb"}, "wissen": {"def": "Informationen haben wollen oder eine Antwort auf eine Frage bekommen wollen. Man möchte erfahren, was passiert ist oder was wahr ist.", "example": "Nach dem Unfall wollte die Polizei wissen, wie alles passiert war.", "is_phrase": false, "pos": "Verb"}, "woher": {"def": "Eine Frage nach dem Grund oder der Quelle einer Information. Man fragt damit: Warum denkst du das? Wie kannst du das wissen?", "example": "Woher weißt du, dass morgen schönes Wetter wird?", "is_phrase": false, "pos": "Adverb"}, "wollte": {"def": "Vergangenheitsform von 'wollen'. Drückt einen Wunsch, eine Absicht oder den Willen zu etwas aus, das in der Vergangenheit war.", "example": "Sie wollte heute ins Kino gehen, aber es hat geregnet.", "is_phrase": false, "pos": "Verb"}, "während": {"def": "Zeigt an, dass zwei Dinge zur gleichen Zeit passieren. Es bedeutet: in der Zeit, als etwas anderes geschah.", "example": "Während sie telefonierte, kochte ihr Mann das Abendessen.", "is_phrase": false, "pos": "Konjunktion"}, "wände": {"def": "Die senkrechten Flächen in einem Raum, die den Raum begrenzen. Sie stehen zwischen Boden und Decke.", "example": "Die Kinder malten bunte Bilder und hängten sie an die Wände ihres Zimmers.", "is_phrase": false, "pos": "Substantiv"}, "wäre": {"def": "Form von 'sein' im Konjunktiv II. Man benutzt es, um über Situationen zu sprechen, die nicht real sind oder nicht passiert sind.", "example": "Wenn ich mehr gelernt hätte, wäre die Prüfung einfacher gewesen.", "is_phrase": false, "pos": "Verb"}, "würde": {"def": "Drückt aus, dass etwas möglich ist oder in der Zukunft passieren könnte. Wird für höfliche Aussagen und hypothetische Situationen verwendet.", "example": "Wenn es regnet, würde ich zu Hause bleiben.", "is_phrase": false, "pos": "Hilfsverb"}, "zeit": {"def": "Ein Zeitraum in der Vergangenheit, den man zusammen mit anderen Menschen erlebt hat. Oft denkt man gern an diese Zeit zurück.", "example": "Wir hatten in der Schule eine schöne Zeit zusammen.", "is_phrase": false, "pos": "Substantiv"}, "zimmerdecke": {"def": "Die obere Fläche eines Raumes, die über dem Kopf ist. Sie trennt einen Raum vom Raum darüber oder vom Dach.", "example": "An der Zimmerdecke hängt eine schöne Lampe.", "is_phrase": false, "pos": "Substantiv"}, "zuckte": {"def": "Eine Geste, die zeigt, dass man etwas nicht weiß, dass es einem egal ist oder dass man nichts ändern kann. Man hebt beide Schultern kurz hoch und lässt sie wieder fallen.", "example": "Als sie ihn fragte, wo er gestern war, zuckte er nur die Schultern und sagte nichts.", "is_phrase": true, "pos": "Redewendung"}, "zurück": {"def": "An den Ort, wo man vorher war. Man geht oder bewegt sich zu einem Platz, den man schon einmal hatte.", "example": "Nach der Pause gingen alle Schüler zu ihren Plätzen zurück.", "is_phrase": false, "pos": "Adverb"}, "zurückgekommen": {"def": "An einen Ort zurückkehren, von dem man weggegangen war. Es bedeutet, dass man wieder da ist, wo man vorher war.", "example": "Nach dem Einkaufen bin ich nach Hause zurückgekommen und habe sofort das Abendessen gekocht.", "is_phrase": false, "pos": "Verb"}, "zusammen": {"def": "Wenn in jemandem etwas zusammenbricht, bedeutet das: Die Person verliert plötzlich ihre innere Kraft oder Hoffnung. Man fühlt sich dann sehr schwach und kann nicht mehr klar denken.", "example": "Als sie die schlechte Nachricht hörte, brach in ihr etwas zusammen und sie konnte nur noch weinen.", "is_phrase": true, "pos": "Redewendung"}, "zusammengesunken": {"def": "Wenn jemand in sich zusammensinkt, zeigt die Person durch ihre Körperhaltung, dass sie sehr traurig, enttäuscht oder hoffnungslos ist. Die Person macht sich kleiner und lässt die Schultern hängen.", "example": "Als Maria hörte, dass sie die Prüfung nicht bestanden hatte, sank sie in sich zusammen.", "is_phrase": true, "pos": "Redewendung"}, "zwingen": {"def": "Jemanden mit Macht oder Druck dazu bringen, etwas zu tun, was er nicht will. Die Person hat dann keine Wahl mehr.", "example": "Die Eltern wollten ihre Tochter zwingen, Medizin zu studieren, aber sie wollte lieber Kunst machen.", "is_phrase": false, "pos": "Verb"}, "zündete": {"def": "Eine Kerze oder Lampe zum Brennen bringen. Man macht Feuer oder Licht damit.", "example": "Sie zündete die Lampe an, weil es dunkel wurde.", "is_phrase": true, "pos": "Redewendung"}, "öffnete": {"def": "Die Augenlider nach oben bewegen, so dass man wieder sehen kann. Das macht man, wenn man vorher die Augen geschlossen hatte.", "example": "Nach dem lauten Knall öffnete sie erschrocken die Augen.", "is_phrase": false, "pos": "Verb"}, "über": {"def": "zeigt eine Bewegung oder Richtung auf der Oberfläche von etwas an, von einem Punkt zum anderen", "example": "Sie strich mit der Hand über das weiche Fell der Katze.", "is_phrase": false, "pos": "Präposition"}, "überhaupt": {"def": "Drückt Verwunderung oder Unverständnis aus und betont die Frage. Es bedeutet hier: aus welchem Grund denn, warum denn.", "example": "Warum bist du überhaupt so spät nach Hause gekommen?", "is_phrase": false, "pos": "Adverb"}};
const META = {textId:"001_SL",condition:"standard",start:new Date().toISOString()};
const counts = {};
const log = [];
let activeEl = null;

function render() {
  const tb = document.getElementById('tb');
  const raw = "In den n\u00e4chsten Stunden sa\u00dfen wir uns nur stumm gegen\u00fcber, sagten nichts, bewegten uns kaum. Tom und ich waren wie aus der Welt gefallen. Wir schwebten durch einen dunklen Raum. In einer gro\u00dfen schwarzen Luftblase, die jeden Augenblick zu platzen drohte.\nIch holte eine Kerze und z\u00fcndete sie an. Ihr Schein warf flackernde Schatten an die W\u00e4nde.\nTom sa\u00df mit halb ge\u00f6ffneten Lidern da und atmete schwer.\n\u201eEs ist vorbei\u201c, sagte ich in die Stille hinein.\nEr reagierte nicht.\n\u201eWir sind am Ende, Tom\u201c, fuhr ich fort. \u201eSieh das doch ein.\u201c\nEr reagierte noch immer nicht.\n\u201eWir haben das Spiel verloren.\u201c\nJetzt \u00f6ffnete er die Augen. \u201eHalt die Klappe, Lina.\u201c\n\u201eWas hast du mit Jurij gemacht?\u201c, wollte ich wissen.\n\u201eEr ist abgehauen\u201c, murmelte Tom.\n\u201eIst er nicht.\u201c\n\u201eWoher willst du das wissen?\u201c\n\u201eDu hast ihn umgebracht.\u201c\n\u201eDu bist ja verr\u00fcckt!\u201c\n\u201eAls ich geschlafen hab, hast du seine Leiche fortgeschafft\u201c sagte ich.\n\u201eUnd wenn es so gewesen w\u00e4re?\u201c, fragte Tom lauernd.\nStatt ihm zu antworten, stand ich auf. \u201eIch gehe\u201c, sagte ich. \u201eIch stelle mich.\u201c\nTom schob sich an der Wand hoch. \u201eDu bleibst hier\u201c, murmelte er.\n\u201eDu kannst mich nicht zwingen\u201c, sagte ich ruhig und stellte mich in Position. Sollte er mich angreifen, w\u00fcrde ich ihn mit einem Tritt gegen den Solarplexus au\u00dfer Gefecht setzen.\nAber wahrscheinlich w\u00fcrde das nicht n\u00f6tig sein. Tom sah nicht so aus, als k\u00f6nne er einen Kampf auch nur eine Minute durchstehen.\nMein Entschluss stand fest. Ich wollte nicht mehr. In diesem Augenblick war mir egal, was mit mir passierte. Sollten sie mich doch vor Gericht stellen. Sollten sie mich doch einsperren.\nHauptsache, ich kam aus dieser H\u00f6hle heraus, aus diesem verfallenen Haus, in dem es nach Tod und Verwesung stank.\n\u201eAch?\u201c, sagte Tom ironisch und griff in die Tasche seiner Steppjacke. Wollte er mir Geld geben, damit ich bei ihm blieb? Glaubte er wirklich, er k\u00f6nnte mich damit kaufen? Ein kalter Windsto\u00df fuhr durch den Raum. Er jagte mir eine G\u00e4nsehaut \u00fcber den R\u00fccken und brachte die Kerze auf dem Boden fast zum Erl\u00f6schen.\nAls sich die Flamme wieder beruhigt hatte, blickte ich auf einmal in die M\u00fcndung einer Pistole, die Tom auf mich gerichtet hielt. Die Waffe gl\u00e4nzte metallisch. Er hatte also doch eine unserer pr\u00e4parierten Wasserpistolen mit in die Sparkasse genommen. Der Kassierer hatte nicht gelogen, Tom hatte ihn und die anderen Angestellten bedroht. Jurij und ich hatten das von drau\u00dfen nur nicht sehen k\u00f6nnen.\n\u201eIdiot\u201c, sagte ich und wandte mich zur T\u00fcr.\n\u201eSetz dich\u201c, befahl Tom.\n\u201eIdiot!\u201c, wiederholte ich. \u201eMeinst du, ich hab vor einer Wasserpistole Angst?\u201c\nMit einem Satz war er neben mir. Pl\u00f6tzlich schien er keine Schmerzen mehr zu haben.\n\u201eDas ist keine Wasserpistole\u201c, sagte er.\n\u201eAch nee!\u201c\nTom hob die Waffe mit einer raschen Bewegung \u00fcber den Kopf und dr\u00fcckte ab. Es gab einen Blitz und fast gleichzeitig einen ohrenbet\u00e4ubenden Knall. Mir platzte fast das Trommelfell. Kalk rieselte von der Zimmerdecke.\n\u201eUnd was war das?\u201c fragte Tom.\nVor meinen Augen tanzten rote Kreise. Ein stechender Brandgeruch drang mir in die Nase.\nEr kam mir bekannt vor. Hatte es nicht genauso gerochen, als ich von der Rastst\u00e4tte zur\u00fcckgekommen war?\n\u201eDu bist verr\u00fcckt\u201c, murmelte ich.\n\u201eSetz dich\u201c, sagte Tom. \u201eSetz dich endlich hin.\u201c\nIch tat es. Er schleppte sich zu seinem Platz und lehnte sich mit schmerzverzerrtem Gesicht an die Wand. Die Pistole behielt er in der Hand.\n\u201eDu hast die Leute in der Bank mit dem Ding da bedroht\u201c, sagte ich.\nTom sch\u00fcttelte den Kopf. \u201eHab ich nicht. Der Typ hat mir die Scheine freiwillig gegeben. Ich schw\u00f6r\u2019s!\u201c\n\u201eWieso hast du die Pistole \u00fcberhaupt mitgenommen?\u201c fragte ich. \u201eEs war doch blo\u00df ein Spiel! Und wo hast du die Waffe her?\u201c\nAuf die letzte Frage ging er nicht ein. \u201eIch wollte mich verteidigen k\u00f6nnen\u201c, sagte er nur.\n\u201eVerteidigen?\u201c\n\u201eIm Notfall, wei\u00dft du.\u201c\nEr war also von Anfang an davon ausgegangen, dass es ein echter Bank\u00fcberfall werden\nk\u00f6nnte, ging es mir durch den Kopf.\n\u201eDu hast uns mit reingerissen, Jurij und mich\u201c, sagte ich.\nEr zuckte die Schultern. \u201eWenn mir der Typ an der Kasse nicht die Scheine gegeben h\u00e4tte, w\u00e4re gar nichts passiert. Ich w\u00e4re rausgegangen und fertig.\u201c Er wischte sich \u00fcber die Augen.\n\u201eWir h\u00e4tten das Geld in der H\u00fctte teilen sollen\nund uns trennen\u201c, murmelte er. \u201eDann h\u00e4tten es die Bullen schwer, uns zu Kriegen.\u201c\n\u201eGeld! Geld!\u201c, schrie ich ihn an. \u00bb\u201cImmer redest du nur von dem Geld! Das k\u00f6nnen wir uns sonst wo hinstecken, kapier das doch endlich! Wir sitzen hier fest, in diesem Rattenloch. Jeder Polizist kennt unsere Gesichter. Und du quatschst immer noch von dem Geld!\u201c\nW\u00e4hrend ich redete, war Tom in sich zusammengesunken. Der Fleck auf seinem Pullover\nschien gr\u00f6\u00dfer geworden zu sein.\n\u201eWas ist mit Jurij?\u201c rief ich. \u201eLos, sag es mir!\u201c\nEr \u00f6ffnete die Augen. \u201eDu hasst mich\u201c, sagte er.\n\u201eIch wei\u00df nicht. Was hast du mit Jurij gemacht?\u201c\n\u201eJedenfalls magst du mich nicht mehr\u00ab, sagte er.\n\u201eNein.\u201c\n\u201eWir hatten eine gute Zeit\u201c, sagte er.\n\u201eWas ist mit Jurij?\u201c, rief ich, Die Kerze war fast heruntergebrannt, nur Toms Umrisse waren noch zu erkennen.\n\u201eEr ist tot.\u201c\nTot? Jurij tot? Bei dem Gedanken brach in mir etwas zusammen, es war ein Gef\u00fchl, als fiele ich in einen eiskalten See, als setzte neben meinem Atem auch mein Verstand aus. Das Herz schlug mir bis zum Hals. Ohne eigentlich zu wissen, was ich tat, st\u00fcrzte ich mich auf Tom und schlug ihn mit aller Kraft ins Gesicht. Immer und immer wieder. Er lie\u00df es geschehen. Er hob nicht einmal die H\u00e4nde, um sich vor meinen Schl\u00e4gen zu sch\u00fctzen.\nIrgendwann hatte ich genug. Schwer atmend kroch ich zu meinem Platz zur\u00fcck. \u201eJurij war mein bester Freund\u201c, sagte ich, nachdem ich wieder zu Atem gekommen war. \u201eDu hast ihn umgebracht. Was bist du doch f\u00fcr ein verdammtes Schwein, Tom!\u201c\nEr sch\u00fcttelte den Kopf. \u201eEs war ein Unfall. Ich wollte das nicht\u201c, sagte er leise.\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t\n\r]+$/.test(tok)) { html += tok; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'')
                   .toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" onclick="show(event,\'' + key + '\')">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

function show(e, k) {
  const d = DICT[k]; if (!d) return;

  // Aktives Wort hervorheben
  if (activeEl) activeEl.classList.remove('active');
  activeEl = e.currentTarget;
  activeEl.classList.add('active', 'seen');

  // Panel befüllen
  document.getElementById('pWord').textContent = k;
  document.getElementById('pPos').textContent  = d.pos || '';
  document.getElementById('pDef').textContent  = d.def || '';

  const pEx = document.getElementById('pEx');
  if (d.example) {
    pEx.textContent = '\u201e' + d.example + '\u201c';
    pEx.style.display = 'block';
  } else {
    pEx.style.display = 'none';
  }

  const pBadge = document.getElementById('pBadge');
  pBadge.style.display = d.is_phrase ? 'inline-block' : 'none';

  document.getElementById('panelEmpty').style.display   = 'none';
  document.getElementById('panelContent').classList.add('visible');

  // Tracking
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(ex) {}
}

document.addEventListener('DOMContentLoaded', render);
</script>
