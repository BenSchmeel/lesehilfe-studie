st oder Unsicherheit.", "example": "Sie sprach selbstsicher vor der ganzen Klasse, obwohl sie nervös war.", "is_phrase": false, "pos": "Adjektiv"}, "seufzend": {"def": "Mit einem tiefen Atemzug, der Enttäuschung oder Resignation ausdrückt. Man macht das, wenn man traurig, müde oder frustriert ist.", "example": "Seufzend schaute er auf seine schlechte Note und wusste nicht, was er seinen Eltern sagen sollte.", "is_phrase": false, "pos": "Adverb"}, "sicher": {"def": "bedeutet hier: ohne Zweifel wissen, ob etwas wahr ist oder stimmt. Man hat keine klare Gewissheit und ist unsicher.", "example": "Nach dem schweren Test war ich mir nicht sicher, ob ich bestanden hatte.", "is_phrase": true, "pos": "Adjektiv"}, "sicherheitsproblem": {"def": "Eine gefährliche Situation, die Menschen oder Sachen bedroht und schnell gelöst werden muss. Man weiß oft nicht genau, was passiert ist oder wie schlimm es ist.", "example": "Wegen eines Sicherheitsproblems mussten alle Mitarbeiter das Gebäude sofort verlassen.", "is_phrase": false, "pos": "Substantiv"}, "sinken": {"def": "sich langsam nach unten bewegen und dort bleiben. Man lässt etwas fallen oder entspannt sich und bewegt sich nach unten.", "example": "Nach dem langen Tag ließ sie müde die Schultern sinken.", "is_phrase": false, "pos": "Verb"}, "sinnlosen": {"def": "ohne Zweck oder Nutzen; überflüssig und unwichtig. Hier beschreibt es Gekritzel, das keinen besonderen Grund oder Wert hat.", "example": "Sie malte sinnlose Kreise auf das Papier, während sie telefonierte.", "is_phrase": false, "pos": "Adjektiv"}, "smarte": {"def": "Elegant, attraktiv und gut gekleidet. Eine Person, die smart ist, sieht gepflegt aus und macht einen guten Eindruck.", "example": "Der neue Chef wirkt sehr smart in seinem teuren Anzug.", "is_phrase": false, "pos": "Adjektiv"}, "sofort": {"def": "bedeutet: jetzt gleich, ohne zu warten, in diesem Moment. Man soll etwas sehr schnell machen.", "example": "Der Arzt sagte: 'Sie müssen sofort ins Krankenhaus!'", "is_phrase": false, "pos": "Adverb"}, "solche": {"def": "bedeutet 'Menschen von dieser Art' oder 'Personen, die so sind'. Man benutzt es, wenn man über bestimmte Gruppen von Menschen spricht, ohne ihre Namen zu sagen.", "example": "Solche, die immer zu spät kommen, ärgern mich sehr.", "is_phrase": false, "pos": "Pronomen"}, "soldaten": {"def": "Eine Person, die beim Militär arbeitet und kämpfen muss. Soldaten tragen Uniformen und haben Waffen.", "example": "Der Schauspieler bereitet sich auf seine Rolle als Soldat vor.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "soll": {"def": "Drückt aus, dass etwas geplant ist oder dass jemand die Aufgabe hat, etwas zu tun. Es zeigt eine Bestimmung oder einen Plan an.", "example": "Der Schauspieler soll in dem neuen Film den Helden spielen.", "is_phrase": false, "pos": "Modalverb"}, "sollt": {"def": "Eine Form von 'sollen' im Konjunktiv I für indirekte Rede. Zeigt an, dass jemand einen Befehl oder Auftrag von einer anderen Person weitergibt.", "example": "Der Lehrer sagte, wir sollt bis morgen die Hausaufgaben machen.", "is_phrase": false, "pos": "Verb"}, "sorgenaugen": {"def": "Augen, die traurig oder besorgt aussehen und zeigen, dass eine Person viele Probleme oder Kummer hat. Die Augen wirken müde und voller Sorge.", "example": "Die alte Frau hatte große Sorgenaugen, weil sie sich um ihre kranke Tochter sorgte.", "is_phrase": false, "pos": "Substantiv"}, "spielen": {"def": "Eine Rolle in einem Film, Theater oder einer anderen Aufführung darstellen. Man tut so, als wäre man eine andere Person und zeigt deren Verhalten.", "example": "Der Schauspieler spielt einen Arzt in der neuen Serie.", "is_phrase": false, "pos": "Verb"}, "spitzschnabliger": {"def": "Mit einem spitzen, scharfen Schnabel. Beschreibt die Form des Schnabels von einem Vogel, der schmal und an der Spitze sehr scharf ist.", "example": "Der spitzschnablige Reiher stand am Ufer und wartete auf Fische.", "is_phrase": false, "pos": "Adjektiv"}, "spuckig": {"def": "Die Stimme klingt rau und trocken, oft weil man nervös oder aufgeregt ist. Man kann dann nicht klar sprechen.", "example": "Nach dem langen Vortrag klang ihre Stimme spuckig und müde.", "is_phrase": false, "pos": "Adjektiv"}, "spähte": {"def": "Heimlich und vorsichtig in eine bestimmte Richtung schauen, oft weil man neugierig ist oder etwas beobachten möchte.", "example": "Die Nachbarin spähte durch den Vorhang, um zu sehen, wer vor der Tür stand.", "is_phrase": false, "pos": "Verb"}, "stand": {"def": "Vergangenheitsform von 'stehen'. Bedeutet: eine aufrechte Position haben, nicht sitzen oder liegen.", "example": "Er stand lange vor dem Spiegel und kämmte sich die Haare.", "is_phrase": false, "pos": "Verb"}, "starrten": {"def": "Jemanden oder etwas sehr intensiv und lange anschauen, oft mit großen Augen und ohne zu blinzeln. Man macht das, wenn man überrascht, neugierig oder schockiert ist.", "example": "Als der berühmte Schauspieler in das Restaurant kam, starrten ihn alle Gäste an.", "is_phrase": false, "pos": "Verb"}, "statt": {"def": "zeigt an, dass etwas anderes passiert als vorher oder als erwartet; anstelle von etwas anderem", "example": "Statt ins Kino gingen wir in den Park spazieren.", "is_phrase": false, "pos": "Präposition"}, "stellen": {"def": "Bestimmte Punkte oder Bereiche auf einer Oberfläche oder an einem Ort. Man meint damit einzelne Teile von etwas Größerem.", "example": "An einigen Stellen der Wand war die Farbe schon abgeblättert.", "is_phrase": false, "pos": "Substantiv"}, "stemmte": {"def": "die Arme angewinkelt zur Seite legen und die Hände fest auf die Hüften drücken. Diese Körperhaltung zeigt oft Selbstbewusstsein, Autorität oder dass man bereit für eine Konfrontation ist.", "example": "Die Lehrerin stemmte die Hände in die Hüften und schaute die lauten Schüler streng an.", "is_phrase": true, "pos": "Verb"}, "stille": {"def": "Ein Moment ohne Geräusche oder Gespräche, in dem es sehr ruhig ist. Die Zeit zwischen zwei lauten oder aktiven Momenten.", "example": "Nach dem lauten Streit herrschte eine unangenehme Stille im Raum.", "is_phrase": false, "pos": "Substantiv, feminin"}, "stimm": {"def": "einer Meinung oder einem Vorschlag zustimmen; sagen, dass man einverstanden ist", "example": "Stimmst du mir zu, dass wir früher gehen sollten?", "is_phrase": true, "pos": "Verb"}, "stimme": {"def": "Der Klang, den man hört, wenn jemand spricht oder singt. Die Art, wie die Worte einer Person klingen.", "example": "Seine Stimme war sehr leise, deshalb konnte ich ihn kaum verstehen.", "is_phrase": false, "pos": "Substantiv, feminin"}, "stirn": {"def": "Der obere Teil des Gesichts zwischen den Augenbrauen und den Haaren. Hier wachsen oft einzelne Haare oder Locken hinein.", "example": "Er wischte sich den Schweiß von der Stirn.", "is_phrase": false, "pos": "Substantiv, feminin"}, "streich": {"def": "Wenn das Gehirn oder die Sinne einem einen Streich spielen, dann funktionieren sie nicht richtig und man sieht, hört oder versteht etwas falsch. Man ist sich nicht sicher, ob das, was man wahrnimmt, wirklich stimmt.", "example": "Nach der langen Nachtschicht spielten mir meine Augen einen Streich - ich dachte, ich sehe meinen Kollegen, aber es war nur ein Schatten.", "is_phrase": true, "pos": "Redewendung"}, "strich": {"def": "Mit der Hand sanft über etwas fahren oder bewegen. Man macht diese Bewegung oft, um etwas glatt zu machen oder um sich zu beruhigen.", "example": "Sie strich nervös über ihr Kleid, bevor sie das Zimmer betrat.", "is_phrase": false, "pos": "Verb"}, "stufen": {"def": "Die einzelnen Teile einer Treppe, auf die man den Fuß setzt, um nach oben oder unten zu gehen.", "example": "Die Kinder sitzen auf den Stufen vor der Schule und essen ihr Pausenbrot.", "is_phrase": false, "pos": "Substantiv (Plural)"}, "stürzen": {"def": "schnell und mit Kraft auf jemanden oder etwas zufliegen oder zuspringen, um anzugreifen. Das macht man meist, wenn man jagen oder kämpfen will.", "example": "Die Katze stürzte sich auf die Maus, die aus dem Loch gekommen war.", "is_phrase": false, "pos": "Verb"}, "sylvester": {"def": "Ein männlicher Vorname. In den Belegen ist Sylvester der Name einer Figur in der Geschichte.", "example": "Sylvester ist ein beliebter Junge in der Klasse und sehr gut in Mathematik.", "is_phrase": false, "pos": "Eigenname"}, "t-shirts": {"def": "Ein Kleidungsstück mit kurzen Ärmeln, das man über dem Oberkörper trägt. Es ist meist aus dünnem Stoff und wird oft mit Bildern oder Texten bedruckt.", "example": "Sie trägt ein T-Shirt mit dem Logo ihrer Lieblingsband.", "is_phrase": false, "pos": "Substantiv"}, "tage": {"def": "Zeitraum von 24 Stunden. Wird hier verwendet, um zu zeigen, wie oft etwas passiert.", "example": "Sie wäscht ihre Haare alle drei Tage.", "is_phrase": false, "pos": "Substantiv, Plural"}, "tamara": {"def": "Ein weiblicher Vorname. Die Person mit diesem Namen spricht vorsichtig und reagiert erschrocken auf laute Worte.", "example": "Tamara fragte leise, weil sie unsicher war.", "is_phrase": false, "pos": "Eigenname"}, "tat": {"def": "Vergangenheitsform von 'tun'. Bedeutet: etwas machen oder eine Handlung ausführen.", "example": "Er tat den ganzen Tag nichts und lag nur auf dem Sofa.", "is_phrase": false, "pos": "Verb"}, "teufel": {"def": "Diese Redewendung bedeutet: man soll nicht zu negativ denken oder schlimme Dinge vorhersagen. Man soll nicht gleich das Schlimmste erwarten, was passieren könnte.", "example": "Nur weil es regnet, musst du nicht den Teufel an die Wand malen - das Picknick wird trotzdem schön.", "is_phrase": true, "pos": "Redewendung"}, "tischkante": {"def": "Der Rand eines Tisches, wo die Tischplatte aufhört. Dort können Gegenstände herunterfallen.", "example": "Der Ball rollte über die Tischkante auf den Boden.", "is_phrase": false, "pos": "Substantiv, feminin"}, "tischplatte": {"def": "Die obere, flache Fläche eines Tisches, auf die man Dinge legt oder stellt.", "example": "Er legte das Buch auf die Tischplatte und begann zu lesen.", "is_phrase": false, "pos": "Substantiv, feminin"}, "toll": {"def": "Wird ironisch verwendet, um Ärger oder Enttäuschung auszudrücken. Bedeutet das Gegenteil von gut - die Person ist unzufrieden mit der Situation.", "example": "Als er erfuhr, dass der Zug Verspätung hatte, sagte er nur: 'Na toll, jetzt komme ich zu spät zum Termin.'", "is_phrase": false, "pos": "Adjektiv"}, "trug": {"def": "Kleidung am Körper haben, etwas anziehen und anhaben. Es ist die Vergangenheitsform von 'tragen'.", "example": "Gestern trug sie ein rotes Kleid zur Party.", "is_phrase": false, "pos": "Verb"}, "trugen": {"def": "Kleidung am Körper haben, sich mit bestimmten Kleidungsstücken anziehen. Es ist die Vergangenheitsform von 'tragen'.", "example": "Gestern trugen alle Schüler blaue T-Shirts mit dem Logo der Schule.", "is_phrase": false, "pos": "Verb"}, "tumult": {"def": "Eine unruhige, chaotische Situation, in der viele Menschen gleichzeitig laut sprechen oder sich aufgeregt verhalten. Es herrscht Verwirrung und Durcheinander.", "example": "Nach der Ankündigung entstand ein großer Tumult im Saal.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "tun": {"def": "Eine Handlung ausführen oder etwas machen. Das Wort wird oft verwendet, wenn man nicht genau sagt, welche Aktion gemeint ist.", "example": "Was soll ich denn jetzt tun? Ich weiß nicht weiter.", "is_phrase": false, "pos": "Verb"}, "tust": {"def": "2. Person Singular von 'tun' - bedeutet eine Handlung oder Aktivität machen oder ausführen. Wird oft verwendet, wenn man nicht genau sagen will oder muss, was die Person macht.", "example": "Du musst nicht perfekt sein, es reicht, dass du es tust.", "is_phrase": false, "pos": "Verb"}, "typen": {"def": "Menschen mit besonderen oder seltsamen Eigenschaften. Man benutzt das Wort oft, wenn man Personen beschreibt, die anders oder eigenartig sind.", "example": "In unserem Kurs sind ein paar lustige Typen, die immer Witze machen.", "is_phrase": false, "pos": "Substantiv"}, "tür": {"def": "Ein bewegliches Teil aus Holz, Metall oder anderem Material, das eine Öffnung in der Wand verschließt. Man kann durch eine Tür in einen Raum hineingehen oder ihn verlassen.", "example": "Bitte klopf an die Tür, bevor du das Büro betrittst.", "is_phrase": false, "pos": "Substantiv"}, "unbehagen": {"def": "Ein unangenehmes Gefühl, wenn man sich unsicher oder unwohl fühlt. Man ist nervös und hat das Gefühl, dass etwas nicht stimmt.", "example": "Nach dem Streit herrschte ein großes Unbehagen zwischen den beiden Freunden.", "is_phrase": false, "pos": "Substantiv, das"}, "ungläubig": {"def": "Man kann nicht glauben, dass etwas wirklich passiert ist. Man ist sehr überrascht und denkt, dass etwas nicht wahr sein kann.", "example": "Als sie hörte, dass sie im Lotto gewonnen hatte, schaute sie ungläubig auf den Schein.", "is_phrase": false, "pos": "Adjektiv"}, "unmöglich": {"def": "Etwas kann nicht sein oder nicht passieren, weil es nicht zusammenpasst oder nicht vorstellbar ist. Man benutzt es, wenn zwei Dinge sich ausschließen.", "example": "Mein Bruder und Ordnung, das ist unmöglich - sein Zimmer ist immer chaotisch.", "is_phrase": false, "pos": "Adjektiv"}, "unserer": {"def": "Zeigt an, dass etwas zu uns gehört oder mit uns verbunden ist. Wird verwendet, wenn man von sich selbst und anderen zusammen spricht.", "example": "Unserer Familie geht es gut.", "is_phrase": false, "pos": "Possessivpronomen"}, "unterricht": {"def": "Die Zeit in der Schule, in der ein Lehrer den Schülern etwas beibringt. Es ist eine Stunde, in der gelernt wird.", "example": "Im Mathematikunterricht lernen die Schüler rechnen.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "unterwegs": {"def": "auf dem Weg zu einem Ort; nicht zu Hause, sondern gerade irgendwo hingehend oder fahrend", "example": "Ich bin noch unterwegs zur Arbeit und komme in 10 Minuten an.", "is_phrase": false, "pos": "Adverb"}, "verdammte": {"def": "Ein Schimpfwort, das man vor ein Substantiv stellt, wenn man sehr wütend oder genervt ist. Es macht die Aussage stärker und zeigt starke negative Gefühle.", "example": "Wo ist denn der verdammte Schlüssel schon wieder?", "is_phrase": false, "pos": "Adjektiv"}, "verlegen": {"def": "Wenn man sich unsicher oder peinlich berührt fühlt und nicht weiß, was man sagen oder tun soll. Man schämt sich ein bisschen oder fühlt sich unbehaglich.", "example": "Er wurde ganz verlegen, als alle ihn anschauten und auf seine Antwort warteten.", "is_phrase": false, "pos": "Adjektiv"}, "vermutlich": {"def": "Drückt aus, dass man etwas für wahrscheinlich hält, aber nicht sicher ist. Man denkt, dass etwas so ist, kann es aber nicht beweisen.", "example": "Er kommt vermutlich zu spät, weil der Zug Verspätung hat.", "is_phrase": false, "pos": "Adverb"}, "verraten": {"def": "eine Information sagen oder bekannt machen, die andere wissen wollen. Man gibt ein Geheimnis oder eine wichtige Sache preis.", "example": "Der Politiker wollte nicht verraten, wann die neuen Gesetze kommen.", "is_phrase": false, "pos": "Verb"}, "verrückt": {"def": "psychisch krank; eine Person, die nicht normal denken kann und gefährliche Dinge tut", "example": "Nur ein verrückter Mensch würde andere Menschen ohne Grund verletzen.", "is_phrase": false, "pos": "Adjektiv"}, "verschluss": {"def": "Ein Teil an einer Flasche oder einem Behälter, den man drehen kann, um ihn zu öffnen oder zu schließen. Meist ist das der Deckel mit Gewinde.", "example": "Sie öffnete die Wasserflasche, indem sie den Verschluss nach links drehte.", "is_phrase": false, "pos": "Substantiv"}, "versteh": {"def": "Eine höfliche Art zu sagen, dass man etwas erklären möchte, damit andere einen nicht falsch beurteilen. Man benutzt es, bevor man etwas sagt, was andere vielleicht negativ finden könnten.", "example": "Versteh mich nicht falsch, aber dein neues Kleid gefällt mir nicht so gut.", "is_phrase": true, "pos": "Redewendung"}, "verstörte": {"def": "Kinder, die durch ein schlimmes Erlebnis sehr erschrocken und verwirrt sind. Sie haben Angst und können nicht mehr normal denken oder sich verhalten.", "example": "Nach dem Unfall waren die verstörten Kinder sehr still und wollten nicht sprechen.", "is_phrase": false, "pos": "Adjektiv"}, "verstörtes": {"def": "Sehr erschrocken, verwirrt oder ängstlich durch etwas Schlimmes oder Schockierendes. Die Person ist emotional aufgewühlt und kann nicht mehr klar denken.", "example": "Nach dem Unfall war das kleine Mädchen völlig verstört und konnte nicht aufhören zu weinen.", "is_phrase": false, "pos": "Adjektiv"}, "versuchte": {"def": "sich bemühen, etwas zu tun oder zu erreichen, aber nicht sicher sein, ob es gelingt", "example": "Er versuchte, ruhig zu bleiben, obwohl er sehr nervös war.", "is_phrase": false, "pos": "Verb"}, "verteilt": {"def": "An verschiedenen Stellen oder Orten sein, nicht zusammen an einem Platz. Die Schüler stehen nicht alle zusammen, sondern sind in kleinen Gruppen an verschiedenen Stellen des Hofes.", "example": "Die Kinder waren über den ganzen Spielplatz verteilt.", "is_phrase": false, "pos": "Partizip/Adjektiv"}, "vertieft": {"def": "Wenn man in etwas vertieft ist, dann konzentriert man sich so stark darauf, dass man alles andere um sich herum vergisst. Man ist ganz bei einer Sache und bekommt nichts anderes mit.", "example": "Sie war so in ihr Buch vertieft, dass sie das Klingeln an der Tür nicht hörte.", "is_phrase": true, "pos": "Redewendung"}, "vertretungsplan": {"def": "Ein Plan in der Schule, der zeigt, welcher Lehrer welche Stunde unterrichtet, wenn der normale Lehrer krank ist oder fehlt. In diesem Kontext wird er als Beispiel für etwas Unwichtiges und Alltägliches verwendet.", "example": "Die Schüler schauen jeden Morgen auf den Vertretungsplan, um zu sehen, ob ihr Mathelehrer da ist.", "is_phrase": false, "pos": "Substantiv"}, "viel": {"def": "bedeutet eine große Menge oder einen hohen Grad von etwas. Es zeigt, dass etwas in großem Ausmaß vorhanden ist.", "example": "Sie hat viel Zeit in ihr Studium investiert.", "is_phrase": false, "pos": "Adverb"}, "vielen": {"def": "Bestimmter Artikel für Nomen im Plural (Mehrzahl) in allen Fällen außer Nominativ und Akkusativ. Hier steht es vor 'Schüler' und zeigt, dass es sich um mehrere bestimmte Schüler handelt.", "example": "Ich sah die vielen Autos auf der Straße.", "is_phrase": false, "pos": "Artikel"}, "vielleicht": {"def": "Drückt aus, dass man sich bei etwas nicht sicher ist. Man denkt, dass etwas möglich ist, aber weiß es nicht genau.", "example": "Vielleicht regnet es morgen, ich bin mir nicht sicher.", "is_phrase": false, "pos": "Adverb"}, "vogelnestflusen": {"def": "Sehr unordentliche, wirre Haare, die aussehen wie ein durcheinander geratenes Vogelnest. Das Wort beschreibt Haare, die nicht gekämmt sind und in alle Richtungen stehen.", "example": "Nach dem Aufwachen hatte sie richtige Vogelnestflusen auf dem Kopf.", "is_phrase": false, "pos": "Substantiv (Plural)"}, "vorsichtig": {"def": "auf eine Art und Weise, die zeigt, dass man aufpasst und nichts Falsches sagen möchte. Man ist unsicher und möchte niemanden verletzen oder ärgern.", "example": "Sie fragte vorsichtig nach seinem Gehalt, weil das ein heikles Thema war.", "is_phrase": false, "pos": "Adverb"}, "völlig": {"def": "Das bedeutet komplett oder ganz und gar. Es macht das Adjektiv stärker und zeigt, dass etwas zu 100% so ist.", "example": "Nach dem langen Tag war ich völlig müde und konnte nicht mehr denken.", "is_phrase": false, "pos": "Adverb"}, "waffe": {"def": "Ein Gegenstand, mit dem man andere Menschen verletzen oder töten kann, zum Beispiel ein Messer oder eine Pistole. Waffen werden oft für Gewalt oder zum Kämpfen benutzt.", "example": "Der Polizist trug eine Waffe bei sich, um sich zu schützen.", "is_phrase": false, "pos": "Substantiv"}, "wahrscheinlich": {"def": "Drückt aus, dass etwas ziemlich sicher ist, aber man sich nicht ganz sicher ist. Man denkt, dass es so ist, aber weiß es nicht zu 100 Prozent.", "example": "Es ist schon spät - wahrscheinlich sind alle Geschäfte zu.", "is_phrase": false, "pos": "Adverb"}, "wand": {"def": "Diese Redewendung bedeutet: man soll nicht zu pessimistisch sein oder das Schlimmste erwarten. Man soll die Situation nicht schlimmer machen, als sie ist.", "example": "Nur weil du einmal schlecht geschlafen hast, musst du nicht gleich den Teufel an die Wand malen - morgen wird es bestimmt besser.", "is_phrase": true, "pos": "Redewendung"}, "warten": {"def": "Nichts tun und bleiben, wo man ist, bis etwas passiert oder jemand kommt. Man bleibt an einem Ort und macht nichts anderes, bis man neue Informationen bekommt.", "example": "Nach dem Alarm mussten alle Schüler im Klassenzimmer warten, bis der Lehrer sagte, was sie machen sollen.", "is_phrase": false, "pos": "Verb"}, "was": {"def": "Ein Wort, das man sagt, wenn man überrascht ist oder etwas nicht verstanden hat. Man benutzt es auch, um eine Frage zu stellen oder um Erstaunen auszudrücken.", "example": "Was? Das hast du wirklich gemacht?", "is_phrase": false, "pos": "Ausruf"}, "weiterarbeiten": {"def": "Mit einer Arbeit oder Tätigkeit fortfahren, ohne aufzuhören. Man macht mit dem weiter, was man gerade tut.", "example": "Nach der Pause rief der Chef: 'Weiterarbeiten!' und alle gingen zurück an ihre Plätze.", "is_phrase": false, "pos": "Verb"}, "weitere": {"def": "bedeutet zusätzlich oder noch kommend. Man verwendet es, wenn noch mehr Informationen oder Dinge folgen werden.", "example": "Der Chef sagte, er würde uns weitere Details zum neuen Projekt morgen mitteilen.", "is_phrase": false, "pos": "Adjektiv"}, "welle": {"def": "eine große Menge von etwas, die sich bewegt oder fließt. Hier beschreibt es die langen Haare, die wie Wasser über den Tischrand fallen.", "example": "Als sie den Kopf schüttelte, fiel eine Welle von lockigen Haaren über ihre Schultern.", "is_phrase": false, "pos": "Substantiv, feminin"}, "wenig": {"def": "bedeutet hier \"etwas\" oder \"ein bisschen\". Man benutzt es, um zu sagen, dass etwas nur zu einem kleinen Teil so ist.", "example": "Sie sieht ein wenig müde aus, aber es geht ihr gut.", "is_phrase": false, "pos": "Adverb"}, "winter": {"def": "Ein Familienname oder Nachname einer Person. Hier wird jemand mit dem Namen Winter gerufen oder angesprochen.", "example": "Herr Winter arbeitet in unserem Büro.", "is_phrase": false, "pos": "Substantiv"}, "winzige": {"def": "Sehr, sehr klein. So klein, dass man es fast nicht sehen kann.", "example": "Die winzigen Regentropfen zerplatzten an der Fensterscheibe.", "is_phrase": false, "pos": "Adjektiv"}, "wippten": {"def": "sich schnell und rhythmisch nach oben und unten bewegen, wie bei einem Federball oder einer Wippe", "example": "Beim Laufen wippten ihre Haare im Takt mit jedem Schritt.", "is_phrase": false, "pos": "Verb"}, "wirklich": {"def": "Drückt Zweifel oder Erstaunen aus. Man benutzt es in Fragen, wenn man nicht glauben kann, dass etwas wahr ist.", "example": "Hat sie wirklich gesagt, dass sie morgen nicht kommt?", "is_phrase": false, "pos": "Adverb"}, "wirkte": {"def": "einen bestimmten Eindruck machen oder aussehen wie etwas. Man benutzt es, wenn man beschreibt, wie jemand oder etwas auf andere Menschen aussieht oder welchen Eindruck es macht.", "example": "Mit ihren langen Haaren wirkte sie viel jünger als sie war.", "is_phrase": false, "pos": "Verb"}, "wirkten": {"def": "Einen bestimmten Eindruck machen oder so aussehen, als ob etwas eine bestimmte Eigenschaft hat. Man beschreibt damit, wie etwas auf andere Menschen aussieht oder welchen Eindruck es macht.", "example": "Mit dem neuen Haarschnitt wirkte sie viel jünger.", "is_phrase": false, "pos": "Verb"}, "wissen": {"def": "Eine Information haben oder sich einer Sache bewusst sein. Man ist sicher, dass etwas wahr ist.", "example": "Sie weiß, dass sie gut aussieht.", "is_phrase": false, "pos": "Verb"}, "wochen": {"def": "Zeitraum von mehreren Wochen, besonders am Anfang von etwas. Eine Woche hat sieben Tage.", "example": "In den ersten Wochen an der neuen Schu muck hineinzumachen.", "example": "Sie ließ sich die Zunge piercen und trug jetzt einen kleinen Ring darin.", "is_phrase": false, "pos": "Substantiv, feminin"}, "zurück": {"def": "Eine Zeitrichtung, die bedeutet: in die Vergangenheit, an etwas Vergangenes denken. Man erinnert sich an etwas, was früher passiert ist.", "example": "Sie dachte an ihre Schulzeit zurück und wurde nostalgisch.", "is_phrase": true, "pos": "Adverb"}, "zusammen": {"def": "sich plötzlich erschrecken und eine schnelle Körperbewegung machen, weil man überrascht oder schockiert ist", "example": "Als die Tür laut knallte, zuckte ich zusammen.", "is_phrase": true, "pos": "Verb"}, "zusammenzuckte": {"def": "Sich plötzlich und schnell bewegen, weil man erschreckt oder überrascht ist. Der Körper macht eine kurze, unkontrollierte Bewegung.", "example": "Als der Hund plötzlich bellte, zuckte das Kind zusammen.", "is_phrase": false, "pos": "Verb"}, "zwei": {"def": "Die Zahl 2; bedeutet eine kleine Anzahl von etwas. Wird verwendet, um zu sagen, dass es nur wenige Schritte oder wenige Tage sind.", "example": "Er wohnt nur zwei Straßen weiter von mir.", "is_phrase": false, "pos": "Zahlwort"}, "zweimal": {"def": "Das bedeutet: zwei Runden oder zwei Umdrehungen. Man dreht etwas komplett herum und dann noch einmal komplett herum.", "example": "Sie drehte den Schlüssel zweimal im Schloss, bevor die Tür aufging.", "is_phrase": false, "pos": "Adverb"}, "über": {"def": "zeigt eine Bewegung oder Berührung auf der Oberfläche von etwas an, von einem Punkt zum anderen", "example": "Sie streichelte über das weiche Fell der Katze.", "is_phrase": false, "pos": "Präposition"}, "überhaupt": {"def": "wird verwendet, um etwas zu verstärken und bedeutet 'gar nicht' oder 'absolut nicht'. Es macht die Verneinung stärker.", "example": "Das Essen schmeckt überhaupt nicht gut.", "is_phrase": false, "pos": "Adverb"}};
const META = {textId:"021_SL",condition:"standard",start:new Date().toISOString()};

function render() {
  const tb = document.getElementById('tb');
  const raw = "\"Es ist ein schwerwiegendes Sicherheitsproblem aufgetreten.\nBitte bewahren Sie Ruhe.\nBegeben Sie sich sofort in einen geschlossenen Fachraum und warten Sie auf weitere Anweisungen.\"\n\nMARK\nAls es pl\u00f6tzlich im Lautsprecher knackte, war ich schon kurz davor, alles hinzuschmei\u00dfen.\nDie Durchsage war meine Rettung. W\u00e4hrend alle andern die Decke anstierten, nutzte ich die Gelegenheit, um vom Knallermann die dritte Aufgabe abzuschreiben. Knallermann, das ist Sylvester (M\u00e4dchenschwarm und Mathecrack \u2014 Knallermann macht\u2019s m\u00f6glich).\nAus den Augenwinkeln sah ich, wie Herr Filler in meine Richtung sp\u00e4hte. Ein spitzschnabliger Habicht, bereit, sich auf mich zu st\u00fcrzen.\nSchei\u00dfe, dachte ich, und dabei hatte ich mir so viel M\u00fche mit der Platzwahl gegeben. Bei Klausuren muss man sich g\u00fcnstig positionieren, am besten ganz hinten in der Ecke bei dem Eingang. Schnell tat ich so, als w\u00e4re ich in meine eigenen Rechnungen vertieft.\n\u201eMark!\u201c\nIch zuckte zusammen. Er hatte mich erwischt. Sechs, aus, Ende.\n\u201eMark Winter! Schlie\u00dft! du mal bitte die T\u00fcr ab?\u201c\nJetzt erst blickte ich von meinem v\u00f6llig sinnlosen Gekritzel auf. \u201eWas?\u201c\n\u201eDu schlie\u00dft sofort die verdammte T\u00fcr ab!\u201c\nIch war mir nicht sicher, ob mein mathegeplagtes Hirn mir nicht einen Streich gespielt hatte. Konnte das wirklich Herr Filler gesagt haben?\nStatt den Lautsprecher starrten jetzt alle mich an.\n\u201eMach endlich die T\u00fcr zu, du Depp!\u201c, rief Sylvester.\n\u201eBeeilung!\u201c, kommandierte Herr Filler.\nIch stand auf. Ging die zwei Schritte zur T\u00fcr.  Drehte den Verschluss zweimal rum.\n\u201eSo okay?\u201c\nHerr Filler nickte schwer atmend. \u201eMehr k\u00f6nnen wir im\nAugenblick nicht tun.\u201c\n\nFIONA\nHerr Filler war f\u00fcr mich immer nur der smarte Mathelehrer.\nDer Mann in Jeans und dunkelblauem Sakko, der sich im Unterricht nie hinsetzte und auch nicht hin und her schlenderte. Herr Filler stand einfach, und zwar mit beiden Beinen fest auf dem Boden. Wie ein Filmstar, der einen Soldaten spielen soll.\nIn den ersten Wochen hatte es in unserer Klasse keine dringlichere Frage gegeben als die, ob er nun Schulterpolster trug oder nicht und ob er sich die Haare wohl f\u00e4rbte. Blond. Blond mit blauen Augen und ohne Schulterpolster. Das war Herr Filler. Nie w\u00e4re ich auf den Gedanken gekommen, er k\u00f6nnte auch nur eine Sekunde lang nicht Herr der Lage sein. Herr Filler und Angst, das war unm\u00f6glich!\nAber ich sa\u00df in der ersten Reihe. Und ich kann dir schw\u00f6ren, der hatte so was von Bammel.\n\u201eHerr Filler? Ist das der Amokalarm?\u201c, fragte Ida-Sophie.\nIhre Locken wippten auf und ab. Richtige Korkenzieherlocken waren das, keine fedrigen Vogelnestflusen\nAmokoalarm. Mit welcher Lockerheit sie das gesagt hatte, als ginge es nur um einen Fehler im Vertretungsplan.\nAmokalarm.\nEin Unbehagen breitete sich zwischen uns aus, h\u00fcllte uns ein wie eine dichte Wolke. Ich sah meinen F\u00fcllerdeckel \u00fcber die Tischkante kullern, ohne dass ich ihn aufhielt. Lauschte dem leisen Auftitschen. Merkte, wie Herr Filler bei dem Ger\u00e4usch zusammenzuckte.\nEs gibt W\u00f6rter, da kommt es gar nicht darauf an, wie du sie aussprichst. Es reicht, dass du es tust.\n\u201eNa ja, kein Grund, gleich den Teufel an die Wand zu malen.\u201c Herr Filler versuchte, selbstsicher zu klingen, so wie sonst. \u201eEin Sicherheitsproblem, das kann alles M\u00f6gliche sein.\u201c Er strich sich \u00fcber sein Sakko, als wollte er die Angstwegschnippen wie einen Fusel. Strich \u00fcber Schultern, die keine Polsterung n\u00f6tig hatten. Herr Filler w\u00fcrde nicht zulassen, dass uns etwas passierte, das. wusste ich.\nEigentlich.\n\u201eAber wenn es ein Amokalarm w\u00e4re\u201c, fragte ich, \u201edann w\u00fcrde diese Durchsage kommen, oder?\u201c\nHerr Filler nickte. Woraufhin ein kleiner Tumult ausbrach, alle redeten durcheinander. Was, ein Amokl\u00e4ufer? Nein, das kann nicht sein. Ein echter Amokl\u00e4ufer?!\nIch war genauso ungl\u00e4ubig wie der Rest der Klasse.\n\u201eWer sollte das denn bitte sein?\u201c, raunte ich meiner Freundin Greta zu, \u201eso durchgeknallt ist doch hier keiner!\u201c Meine Stimme klang schnell und spuckig und \u00fcberhaupt nicht nach mir selbst\nIch sah Greta an. Durch die Brille wirkten ihre Augen noch runder, als sie es ohnehin schon waren \u2014 gro\u00dfe, dunkle Sorgenaugen. Sag was, dachte ich, los, stimm mir zu, mach mir keine Angst!\nGreta fummelte an ihrem Brillenb\u00fcgel. Das tat sie immer, wenn sie nachdachte oder verlegen war. An manchen Stellen war das Plastik schon ganz blank poliert. \u201eWahrscheinlich nicht\u201c, antwortete sie.\nWahrscheinlich. Das Wort gefiel mir ganz und gar nicht.\n\u201eW\u00fcrden die doch endlich verraten, was los ist\u201c, sagte ich.\n\u201eHerr Filler hat recht, schwerwiegendes Sicherheitsproblem, das kann alles M\u00f6gliche sein!\u201c\nRegentropfen pladderten in der Stille gegen das Fenster. Zerplatzten an der Scheibe wie winzige Geschosse.\n\u201eJa\u201c, murmelte Greta, \u201edas kann alles M\u00f6gliche sein.\u201c\n\nIch dachte an die letzte Pause zur\u00fcck, die vielen Sch\u00fcler, in Gr\u00fcppchen \u00fcber den Hof verteilt. Manche quatschend auf den Stufen, manche auf der Mauer, um noch schnell die Hausaufgaben abzuschreiben, manche dahinter ... Ein paar komische Typen waren schon dabei. Solche, die sich die Haare f\u00e4rbten, alle zwei Tage anders, oder die T-Shirts trugen mit Marilyn-Manson-Zitaten oder die sich die Zunge piercen lie\u00dfen, einmal mittendurch. Wie verr\u00fcckt musste man sein f\u00fcr einen Amoklauf?\n\u201eHerr Filler!\u201c Mark meldete sich, der Idiot aus der letzten Reihe. \u201eHei\u00dft das, wir m\u00fcssen die Klausur nicht zu Ende schreiben?\u201c\nIch lachte, laut und schrill. Wie absurd war das denn?\n\u201eRuhe!\u201c Da war sie wieder. Herrn Fillers Autorit\u00e4t. Er stemmte die H\u00e4nde in die H\u00fcften und fokussierte uns einen nach dem anderen. \u201eFreunde, wahrscheinlich ist das hier kein echter Amokalarm. Wir warten gemeinsam auf weitere Anweisungen, bis dahin seid ihr einfach ruhig und arbeitet weiter.\u201c\nAllgemeines Aufst\u00f6hnen.\n\u201eNa toll.\u201c Seufzend lie\u00df Ida-Sophie den Kopf auf die Tischplatte sinken und eine Welle von Haaren schwappte \u00fcber die Kante. \u201eIch dachte, wir m\u00fcssen kein Mathe mehr machen ...\u201c\nSie pfl\u00fcckte sich eine Locke aus der Stirn und g\u00e4hnte.\nIch mochte sie nicht besonders, vermutlich weil sie h\u00fcbsch war. Versteh mich nicht falsch, ich hab nichts gegen h\u00fcbsche Menschen. Nur gegen solche, die wissen, dass sie h\u00fcbsch sind, und Ida-Sophie wusste das sehr genau.\n\u00bb\u201ceint ihr, da ist wirklich jemand ... unterwegs?\u201c, fragte Tamara vorsichtig. \u201eJemand mit einer echten Waffe?\u201c Durch die rosa Pausb\u00e4ckchen wirkte sie immer noch ein wenig wie ein Kind, ein ziemlich verst\u00f6rtes Kind.\nAber vielleicht waren wir das auch alle. Verst\u00f6rte Kinder.\n\u201eIch hab gesagt, ihr sollt abwarten!\u201c, herrschte Herr Filler sie an und Tamara sackte zusammen. \u201eWeiterarbeiten! Freunde, ihr habt noch viel zu tun!\u201c\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t\n\r]+$/.test(tok)) { html += tok; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'')
                   .toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" onclick="show(event,\'' + key + '\')">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

function show(e, k) {
  const d = DICT[k]; if (!d) return;

  // Aktives Wort hervorheben
  if (activeEl) activeEl.classList.remove('active');
  activeEl = e.currentTarget;
  activeEl.classList.add('active', 'seen');

  // Panel befüllen
  document.getElementById('pWord').textContent = k;
  document.getElementById('pPos').textContent  = d.pos || '';
  document.getElementById('pDef').textContent  = d.def || '';

  const pEx = document.getElementById('pEx');
  if (d.example) {
    pEx.textContent = '\u201e' + d.example + '\u201c';
    pEx.style.display = 'block';
  } else {
    pEx.style.display = 'none';
  }

  const pBadge = document.getElementById('pBadge');
  pBadge.style.display = d.is_phrase ? 'inline-block' : 'none';

  document.getElementById('panelEmpty').style.display   = 'none';
  document.getElementById('panelContent').classList.add('visible');

  // Tracking
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(ex) {}
}
