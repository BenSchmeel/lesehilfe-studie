<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --panel-bg:#2c2420;--panel-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
    --panel-width:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}

  /* ── Layout: Text links, Panel rechts ── */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1060px;
    margin:0 auto;
    padding:24px 16px 60px;
    gap:20px;
  }
  .main{flex:1;min-width:0;}

  /* ── Erklärungsleiste rechts ── */
  .panel{
    width:var(--panel-width);
    flex-shrink:0;
    position:sticky;
    top:20px;
    background:var(--panel-bg);
    border-radius:8px;
    padding:18px 16px;
    color:var(--panel-text);
    font-size:.88rem;
    line-height:1.65;
    min-height:180px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    transition:opacity .2s;
  }
  .panel-empty{
    opacity:.45;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.82rem;
    color:#9e8a78;
    min-height:120px;
  }
  .panel-content{display:none;}
  .panel-content.visible{display:block;}
  .p-badge{
    display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
    border-radius:3px;padding:1px 7px;margin-bottom:8px;letter-spacing:.04em;
  }
  .p-word{
    font-family:'Lora',serif;font-weight:600;font-size:1.05rem;
    color:#f0d9b8;display:block;margin-bottom:3px;
  }
  .p-pos{
    font-size:.72rem;color:#9e8a78;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:8px;
  }
  .p-def{color:#d4c9be;display:block;}
  .p-ex{
    margin-top:10px;font-style:italic;font-size:.82rem;color:#8a7a6e;
    border-top:1px solid rgba(255,255,255,.08);padding-top:9px;display:block;
  }

  /* ── Hinweis oben ── */
  .hint{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;
    padding:9px 14px;background:var(--accent-light);
    border-radius:4px;border-left:3px solid var(--accent);
  }

  /* ── Textbox ── */
  .text-box{
    background:white;border:1px solid var(--border);border-radius:4px;
    padding:32px 36px;line-height:2.05;font-family:'Lora',serif;
    font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04);
  }

  /* ── Anklickbare Wörter ── */
  .w{
    cursor:pointer;border-bottom:1px dotted var(--accent);
    border-radius:2px;padding:0 1px;transition:background .15s;display:inline;
  }
  .w:hover{background:var(--accent-light);}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent);}
  .w.active{background:var(--accent);color:white;border-bottom-color:transparent;}
  .w.phrase{border-bottom:2px dashed #b07d50;}
  .w.phrase.seen{border-bottom-color:#c9956a;}
  .w.phrase.active{background:var(--accent);color:white;}

  /* ── Legende ── */
  .legend{
    margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-size:.76rem;color:var(--ink-soft);
  }
  .leg-item{display:flex;align-items:center;gap:5px;}

  @media(max-width:700px){
    .layout{flex-direction:column;}
    .panel{width:100%;position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Linke Spalte: Text -->
  <div class="main">
    <div class="hint">
      Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> – die Erklärung erscheint rechts.
      &nbsp;<span style="border-bottom:2px dashed #b07d50;padding:0 2px">Gestrichelt</span> = Redewendung.
    </div>
    <div class="text-box" id="tb"></div>
    <div class="legend">
      <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 3px">Wort</span>&nbsp;erklärtes Wort</span>
      <span class="leg-item"><span style="border-bottom:2px dashed #b07d50;padding:0 3px">Phrase</span>&nbsp;Redewendung</span>
      <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 3px">farbig</span>&nbsp;bereits nachgeschlagen</span>
    </div>
  </div>

  <!-- Rechte Spalte: Erklärungsleiste -->
  <div class="panel" id="panel">
    <div class="panel-empty" id="panelEmpty">
      ← Klicken Sie auf ein unterstrichenes Wort
    </div>
    <div class="panel-content" id="panelContent">
      <span class="p-badge" id="pBadge" style="display:none">Redewendung</span>
      <span class="p-word" id="pWord"></span>
      <span class="p-pos"  id="pPos"></span>
      <span class="p-def"  id="pDef"></span>
      <span class="p-ex"   id="pEx" style="display:none"></span>
    </div>
  </div>

</div>
<script>
const DICT = {"absurd": {"def": "So unlogisch, verrückt oder sinnlos, dass man es kaum glauben kann. Man verwendet es, wenn etwas völlig unvernünftig oder lächerlich ist.", "example": "Es ist absurd, dass wir drei Stunden auf den Bus warten müssen.", "is_phrase": false, "pos": "Adjektiv"}, "abwarten": {"def": "Nichts tun und warten, bis etwas passiert oder sich ändert. Man wartet geduldig, ohne selbst aktiv zu werden.", "example": "Der Arzt sagte mir, ich soll abwarten, ob die Schmerzen von allein weggehen.", "is_phrase": false, "pos": "Verb"}, "abzuschreiben": {"def": "Die Lösung oder Antwort von einem anderen Schüler heimlich kopieren, ohne selbst zu arbeiten. Man schaut auf das Blatt von einem Mitschüler und schreibt seine Antworten ab.", "example": "Tim hatte keine Zeit für die Mathehausaufgaben und wollte sie in der Pause von seiner Sitznachbarin abschreiben.", "is_phrase": false, "pos": "Verb"}, "allgemeines": {"def": "Von allen Personen in einer Gruppe kommend oder geteilt. Beschreibt etwas, was gleichzeitig von vielen Menschen gemacht wird.", "example": "Nach der schlechten Nachricht gab es allgemeines Schweigen im Raum.", "is_phrase": false, "pos": "Adjektiv"}, "amokalarm": {"def": "Ein Warnsignal in Schulen oder anderen Gebäuden, das bedeutet, dass eine gefährliche Person mit einer Waffe da ist. Alle Menschen müssen sich dann verstecken oder das Gebäude verlassen.", "example": "Als der Amokalarm kam, blieben alle Schüler ruhig in ihren Klassenzimmern.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "amoklauf": {"def": "Eine Tat, bei der eine Person plötzlich und ohne klaren Grund andere Menschen angreift oder tötet. Die Person handelt dabei völlig unkontrolliert.", "example": "Nach dem Amoklauf in der Schule waren alle Schüler sehr schockiert.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "amokläufer": {"def": "Eine Person, die plötzlich und ohne klaren Grund andere Menschen angreift oder tötet. Meist passiert das an öffentlichen Orten wie Schulen oder Büros.", "example": "Nach dem Angriff suchte die Polizei nach dem Amokläufer.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "amokoalarm": {"def": "Wird hier bildlich verwendet, um Haare zu beschreiben, die sehr unordentlich und wild durcheinander stehen. Es bedeutet, dass die Haare so chaotisch aussehen wie bei einem Notfall.", "example": "Nach dem Aufstehen hatte sie einen richtigen Amokoalarm auf dem Kopf - ihre Haare standen in alle Richtungen ab.", "is_phrase": false, "pos": "Substantiv (maskulin)"}, "andern": {"def": "alle anderen Personen; alle Leute außer mir selbst. Man benutzt es, wenn man sich von einer Gruppe unterscheiden will.", "example": "Während alle andern Fußball spielten, blieb ich zu Hause und las ein Buch.", "is_phrase": false, "pos": "Pronomen"}, "angst": {"def": "Ein starkes Gefühl von Furcht oder Sorge vor etwas Unangenehmem oder Gefährlichem. Man hat Angst, wenn man sich bedroht fühlt oder etwas Schlimmes erwartet.", "example": "Sie hatte Angst vor der schweren Prüfung und konnte nicht schlafen.", "is_phrase": false, "pos": "Substantiv"}, "angstwegschnippen": {"def": "Das Gefühl der Angst, das man schnell loswerden oder verstecken möchte. Man tut so, als wäre die Angst nur etwas Kleines, das man einfach wegmachen kann.", "example": "Nach dem Unfall versuchte sie, ihre Angst wegzuschnippen, aber ihre Hände zitterten noch immer.", "is_phrase": false, "pos": "Substantiv"}, "anstierten": {"def": "Starr und ohne zu blinzeln auf etwas schauen, oft weil man sich langweilt oder nicht aufpasst. Man blickt lange Zeit in eine Richtung, ohne wirklich zu denken.", "example": "Die Schüler starrten gelangweilt aus dem Fenster, während der Lehrer erklärte.", "is_phrase": false, "pos": "Verb"}, "antwortete": {"def": "Das ist die Vergangenheitsform von 'antworten'. Es bedeutet, dass jemand auf eine Frage oder Aussage reagiert hat und etwas gesagt hat.", "example": "Er fragte nach dem Weg und sie antwortete freundlich.", "is_phrase": false, "pos": "Verb"}, "anweisungen": {"def": "Befehle oder Informationen, die jemand gibt, damit andere wissen, was sie tun sollen. Man bekommt Anweisungen von Personen mit Autorität, zum Beispiel vom Chef oder in Notfällen.", "example": "Die Feuerwehr gab den Bewohnern klare Anweisungen, wie sie das Gebäude verlassen sollten.", "is_phrase": false, "pos": "Substantiv"}, "arbeitet": {"def": "eine Tätigkeit oder Aufgabe fortsetzen, die man schon begonnen hat. Man macht mit dem weiter, was man vorher getan hat.", "example": "Die Schüler arbeiten weiter an ihren Projekten, obwohl es schon spät ist.", "is_phrase": false, "pos": "Verb"}, "atmend": {"def": "beschreibt eine Person, die schwer und angestrengt Luft holt, oft weil sie müde, krank oder aufgeregt ist", "example": "Nach dem schnellen Lauf kam er schwer atmend zu Hause an.", "is_phrase": false, "pos": "Adjektiv"}, "aufgabe": {"def": "Eine Übung oder ein Problem, das man in der Schule lösen muss. Oft steht sie in einem Heft oder auf einem Arbeitsblatt.", "example": "Die erste Aufgabe in Mathe war sehr schwer, deshalb habe ich lange gebraucht.", "is_phrase": false, "pos": "Substantiv"}, "aufgetreten": {"def": "etwas ist passiert oder entstanden, meist etwas Unerwartetes oder Problematisches. Es bedeutet, dass sich etwas ereignet hat.", "example": "Während des Fluges ist ein technischer Fehler aufgetreten.", "is_phrase": false, "pos": "Verb"}, "aufhielt": {"def": "etwas stoppen oder fangen, bevor es weiterfällt oder sich weiterbewegt. Man greift nach einem Gegenstand, um zu verhindern, dass er herunterfällt.", "example": "Der Ball rollte vom Tisch, aber sie hielt ihn noch rechtzeitig auf.", "is_phrase": false, "pos": "Verb"}, "aufstöhnen": {"def": "Ein lauter Laut, den mehrere Menschen gleichzeitig machen, wenn sie unzufrieden oder enttäuscht sind. Es zeigt, dass die Gruppe nicht glücklich mit einer Situation ist.", "example": "Als der Lehrer sagte, dass die Klassenfahrt abgesagt wird, gab es ein allgemeines Aufstöhnen.", "is_phrase": false, "pos": "Substantiv"}, "auftitschen": {"def": "Das leise Geräusch, wenn etwas Weiches oder Flüssiges sanft auf eine Oberfläche trifft. Es beschreibt einen sehr zarten, kaum hörbaren Aufprall.", "example": "Das Auftitschen der Regentropfen auf den Blättern war kaum zu hören.", "is_phrase": false, "pos": "Substantiv (das)"}, "augen": {"def": "Die beiden runden Körperteile im Gesicht, mit denen man sehen kann. Sie können verschiedene Farben haben, zum Beispiel blau, braun oder grün.", "example": "Sie hat wunderschöne grüne Augen.", "is_phrase": false, "pos": "Substantiv (Plural)"}, "augenblick": {"def": "Eine feste Wendung, die bedeutet: jetzt gerade, in dieser Zeit. Man verwendet sie, wenn man über die gegenwärtige Situation spricht.", "example": "Im Augenblick habe ich keine Zeit für ein Gespräch, aber später können wir gerne reden.", "is_phrase": true, "pos": "Redewendung"}, "augenwinkeln": {"def": "Mit den Augen zur Seite schauen, ohne den Kopf zu drehen. Man sieht etwas heimlich oder unauffällig.", "example": "Aus den Augenwinkeln bemerkte sie, dass ihr Nachbar sie beobachtete.", "is_phrase": true, "pos": "Redewendung"}, "ausbrach": {"def": "plötzlich und heftig beginnen oder entstehen. Wird oft für Unruhe, Streit oder andere störende Situationen verwendet.", "example": "Als der Politiker seine Meinung sagte, brach im Saal großer Lärm aus.", "is_phrase": false, "pos": "Verb"}, "aussprichst": {"def": "Die Laute und Töne eines Wortes mit dem Mund bilden und sagen. Es geht darum, wie ein Wort klingt, wenn man es spricht.", "example": "Manche Leute sprechen das Wort 'China' anders aus als andere.", "is_phrase": false, "pos": "Verb"}, "autorität": {"def": "Der Respekt und das Vertrauen, das andere Menschen einer Person entgegenbringen, weil sie kompetent ist oder eine wichtige Position hat. Die Macht oder der Einfluss, den jemand durch sein Wissen oder seine Stellung ausübt.", "example": "Der Professor hat große Autorität in seinem Fachgebiet und alle hören auf seine Meinung.", "is_phrase": false, "pos": "Substantiv, feminin"}, "bammel": {"def": "Große Angst vor etwas, das passieren könnte. Man verwendet es umgangssprachlich, wenn jemand sehr nervös oder ängstlich ist.", "example": "Vor der Prüfung hatte sie richtig Bammel.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "beeilung": {"def": "Ein Ausruf, mit dem man jemanden auffordert, sich zu beeilen und schneller zu machen. Man sagt es, wenn jemand zu langsam ist.", "example": "\"Beeilung! Wir kommen zu spät zum Zug!\"", "is_phrase": false, "pos": "Substantiv, feminin"}, "begeben": {"def": "sich begeben bedeutet: an einen bestimmten Ort gehen oder sich dorthin bewegen. Es ist eine höfliche, formelle Art zu sagen 'gehen Sie'.", "example": "Die Passagiere sollen sich zum Notausgang begeben.", "is_phrase": true, "pos": "Redewendung"}, "beiden": {"def": "Mit beiden Beinen fest auf dem Boden stehen bedeutet: eine Person ist sehr praktisch und realistisch. Sie lässt sich nicht von Träumen oder unrealistischen Ideen leiten.", "example": "Maria steht mit beiden Beinen fest auf dem Boden - sie spart ihr Geld und kauft nur, was sie wirklich braucht.", "is_phrase": true, "pos": "Pronomen"}, "beinen": {"def": "Mit beiden Beinen fest auf dem Boden stehen bedeutet: eine Person ist sehr realistisch und praktisch. Sie hat eine vernünftige und stabile Art zu denken.", "example": "Obwohl alle Träume hatten, stand Maria mit beiden Beinen fest auf dem Boden und machte realistische Pläne.", "is_phrase": true, "pos": "Substantiv"}, "bereit": {"def": "Das bedeutet: vorbereitet und willens, etwas zu tun. Der Habicht ist in einer Position, wo er jeden Moment angreifen kann.", "example": "Der Hund stand bereit, das Haus zu verteidigen.", "is_phrase": false, "pos": "Adjektiv"}, "besonders": {"def": "nicht sehr, nur wenig oder gar nicht. Man benutzt es in negativen Sätzen, um zu sagen, dass etwas nicht stark oder intensiv ist.", "example": "Das Essen hat mir nicht besonders geschmeckt.", "is_phrase": false, "pos": "Adverb"}, "besten": {"def": "Diese Phrase bedeutet: das ist die ideale Lösung oder der perfekte Weg. Man verwendet sie, um zu sagen, was in einer Situation am klügsten oder vorteilhaftesten ist.", "example": "Wenn du schnell abnehmen willst, machst du am besten jeden Tag Sport und isst weniger Süßigkeiten.", "is_phrase": true, "pos": "Redewendung"}, "bewahren": {"def": "Diese Phrase bedeutet: bleiben Sie ruhig und werden Sie nicht nervös oder aufgeregt. Man sagt das in schwierigen Situationen, damit die Menschen nicht in Panik geraten.", "example": "Als das Feuer ausbrach, sagte der Feuerwehrmann: 'Bewahren Sie Ruhe und gehen Sie langsam zum Ausgang.'", "is_phrase": true, "pos": "Redewendung"}, "bitte": {"def": "Ein Wort, das Höflichkeit ausdrückt oder Ungeduld und Verwunderung verstärkt. Es macht eine Frage oder Bitte freundlicher oder zeigt, dass man etwas nicht verstehen kann.", "example": "Könnten Sie mir bitte helfen? - Wer soll das bitte gewesen sein?", "is_phrase": false, "pos": "Partikel"}, "blank": {"def": "So glatt und glänzend, dass man sich darin spiegeln kann. Das passiert, wenn eine Oberfläche sehr oft gerieben oder poliert wurde.", "example": "Der Türgriff war schon ganz blank von den vielen Händen, die ihn berührt hatten.", "is_phrase": false, "pos": "Adjektiv"}, "blauen": {"def": "Eine Farbe wie der Himmel oder das Meer. Das Wort beschreibt hier die Augenfarbe einer Person.", "example": "Sie hat schöne blaue Augen wie ihr Vater.", "is_phrase": false, "pos": "Adjektiv"}, "blickte": {"def": "Den Kopf heben und in eine andere Richtung schauen. Hier: aufhören zu schreiben und den Kopf vom Papier heben.", "example": "Als ihr Name gerufen wurde, blickte sie vom Buch auf und sah zur Tür.", "is_phrase": false, "pos": "Verb"}, "blond": {"def": "Eine Haarfarbe, die hell und gelblich ist. Menschen mit blonden Haaren haben helle, oft goldene oder gelbliche Haare.", "example": "Sie hat blonde Haare und grüne Augen.", "is_phrase": false, "pos": "Adjektiv"}, "boden": {"def": "Die Erde oder Oberfläche, auf der man steht oder geht. Der feste Grund unter den Füßen.", "example": "Nach dem langen Flug war ich froh, wieder festen Boden unter den Füßen zu haben.", "is_phrase": false, "pos": "Substantiv"}, "breitete": {"def": "sich ausbreiten bedeutet hier: ein Gefühl wird immer stärker und erfasst alle Personen. Das Unbehagen wird zwischen den Menschen immer größer und spürbarer.", "example": "Nervosität breitete sich im Wartezimmer aus, als der Arzt so lange nicht kam.", "is_phrase": true, "pos": "Verb"}, "brille": {"def": "Ein Gegenstand mit zwei Gläsern, den man vor die Augen setzt, um besser sehen zu können.", "example": "Ohne seine Brille kann er die Schrift nicht lesen.", "is_phrase": false, "pos": "Substantiv (die)"}, "brillenbügel": {"def": "Der Teil einer Brille, der hinter dem Ohr liegt und die Brille am Kopf hält. Es gibt zwei Brillenbügel - einen rechts und einen links.", "example": "Der Brillenbügel war kaputt, deshalb rutschte die Brille immer von der Nase.", "is_phrase": false, "pos": "Substantiv"}, "dachte": {"def": "Vergangenheitsform von 'denken'. Hier wird gezeigt, was jemand in seinem Kopf gedacht hat, ohne es laut zu sagen.", "example": "Er sah den teuren Preis und dachte: Das kann ich mir nicht leisten.", "is_phrase": false, "pos": "Verb"}, "dahin": {"def": "bedeutet 'bis zu diesem Zeitpunkt' oder 'solange'. Man verwendet es, wenn man über die Zeit spricht, die zwischen jetzt und einem späteren Moment liegt.", "example": "Der Zug kommt um 15 Uhr, bis dahin können wir noch einen Kaffee trinken.", "is_phrase": false, "pos": "Adverb"}, "dahinter": {"def": "an einem Ort, der sich hinter etwas anderem befindet. Man kann die Person oder Sache nicht sofort sehen, weil etwas anderes davor ist.", "example": "Die Kinder versteckten sich dahinter, wo niemand sie finden konnte.", "is_phrase": false, "pos": "Adverb"}, "davor": {"def": "Kurz davor sein bedeutet: Etwas fast tun wollen oder sehr nah daran sein, etwas zu tun. Man ist in dem Moment, wo man eine Entscheidung treffen will.", "example": "Nach dem schweren Tag war sie kurz davor, zu weinen.", "is_phrase": true, "pos": "Redewendung"}, "decke": {"def": "Die obere Fläche eines Raumes, die über den Köpfen der Menschen ist. Oft schauen Menschen zur Decke, wenn sie nachdenken oder gelangweilt sind.", "example": "Der Student schaute zur Decke, weil die Vorlesung sehr langweilig war.", "is_phrase": false, "pos": "Substantiv"}, "depp": {"def": "Ein unhöfliches Wort für eine Person, die sich dumm oder ungeschickt verhält. Man benutzt es, wenn man sich über jemanden ärgert.", "example": "Als er zum dritten Mal seinen Schlüssel vergessen hatte, nannte sie ihn einen Depp.", "is_phrase": false, "pos": "Substantiv"}, "dichte": {"def": "Sehr stark und schwer, so dass man schlecht durchsehen oder durchkommen kann. Hier: Das Unbehagen war sehr stark und man konnte es deutlich spüren.", "example": "Der dichte Nebel machte das Autofahren gefährlich.", "is_phrase": false, "pos": "Adjektiv"}, "drehte": {"def": "Den Verschluss mit kreisenden Bewegungen bewegen, um ihn zu öffnen oder zu schließen. Hier: den Verschluss durch zweimaliges Drehen öffnen.", "example": "Sie drehte den Deckel vom Marmeladenglas ab.", "is_phrase": false, "pos": "Verb"}, "dringlichere": {"def": "Wichtiger oder eiliger als andere Dinge. Es bedeutet, dass etwas mehr Aufmerksamkeit braucht als alles andere.", "example": "Für die Schüler gab es keine dringlichere Frage als die nach seinem Aussehen.", "is_phrase": false, "pos": "Adjektiv"}, "dritte": {"def": "Die Zahl 3 in einer Reihenfolge. Wenn etwas das dritte ist, kommt es nach dem ersten und dem zweiten.", "example": "Ich habe schon die erste und zweite Übung gemacht, jetzt mache ich die dritte.", "is_phrase": false, "pos": "Ordinalzahl"}, "dunkelblauem": {"def": "Eine sehr dunkle blaue Farbe, fast wie die Farbe vom Himmel in der Nacht. Es ist ein tiefes Blau, das fast schwarz aussieht.", "example": "Sie trug eine dunkelrote Bluse zu ihrer dunkelroten Hose.", "is_phrase": false, "pos": "Adjektiv"}, "dunkle": {"def": "Eine Farbe, die nicht hell ist, wie braun oder schwarz. Bei Augen bedeutet es meist braune oder schwarze Augenfarbe.", "example": "Sie hat dunkle Haare und helle Haut.", "is_phrase": false, "pos": "Adjektiv"}, "durcheinander": {"def": "Alle sprechen zur gleichen Zeit, sodass man nichts verstehen kann. Es herrscht Chaos beim Reden.", "example": "In der Diskussion redeten alle durcheinander, deshalb konnte niemand dem Gespräch folgen.", "is_phrase": false, "pos": "Adverb"}, "durchgeknallt": {"def": "verrückt oder seltsam im Verhalten, so dass andere Menschen es komisch finden. Man sagt das über jemanden, der sich sehr ungewöhnlich benimmt.", "example": "Mein Nachbar ist total durchgeknallt - er redet den ganzen Tag mit seinen Pflanzen.", "is_phrase": false, "pos": "Adjektiv"}, "durchsage": {"def": "Eine offizielle Nachricht, die über Lautsprecher an alle Menschen in einem Gebäude gemacht wird. Sie informiert über wichtige Ereignisse oder Gefahren.", "example": "Nach dem Feueralarm kam eine Durchsage, dass alle das Gebäude verlassen sollen.", "is_phrase": false, "pos": "Substantiv"}, "echten": {"def": "wirklich und nicht falsch oder nachgemacht. Eine echte Waffe ist eine richtige Waffe, mit der man Menschen verletzen kann.", "example": "Die Polizei fand eine echte Pistole in seiner Tasche.", "is_phrase": false, "pos": "Adjektiv"}, "echter": {"def": "Wirklich, nicht falsch oder vorgetäuscht. Beschreibt etwas, das tatsächlich so ist, wie es scheint.", "example": "Die Polizei prüft, ob es ein echter Notfall ist oder nur ein falscher Alarm.", "is_phrase": false, "pos": "Adjektiv"}, "ecke": {"def": "Der Platz in einem Raum, wo zwei Wände zusammentreffen. Hier ist ein Ort gemeint, der etwas versteckt oder geschützt ist.", "example": "Sarah setzte sich in die hinterste Ecke des Cafés, damit niemand sie sehen konnte.", "is_phrase": false, "pos": "Substantiv"}, "eigenen": {"def": "gehört zu mir persönlich; ist mein Besitz oder meine Arbeit", "example": "Sie arbeitet an ihren eigenen Projekten und hilft nicht bei fremden Aufgaben.", "is_phrase": false, "pos": "Adjektiv"}, "eigentlich": {"def": "Wird als kurze Antwort verwendet, wenn man zustimmt oder bestätigt, dass etwas richtig oder wahr ist. Bedeutet 'ja, das stimmt' oder 'genau'.", "example": "Findest du den Film gut? - Eigentlich.", "is_phrase": false, "pos": "Adverb"}, "einfach": {"def": "Das Wort betont, dass etwas ohne besondere Umstände oder Komplikationen so ist oder getan wird. Es macht die Aussage stärker und zeigt, dass etwas ganz normal oder selbstverständlich ist.", "example": "Sie ging einfach weg, ohne etwas zu sagen.", "is_phrase": false, "pos": "Adverb"}, "eingang": {"def": "Eine Tür oder Öffnung, durch die man in einen Raum hineingeht oder aus einem Raum herausgeht. In diesem Fall ist es die Stelle im Klassenraum, wo die Tür ist.", "example": "Die Studenten saßen in der Nähe vom Eingang, damit sie schnell den Raum verlassen konnten.", "is_phrase": false, "pos": "Substantiv"}, "einmal": {"def": "bedeutet hier: komplett durch die Mitte, von einer Seite zur anderen. Es beschreibt, wie das Piercing durch die ganze Zunge geht.", "example": "Er hat sich das Ohr einmal durch stechen lassen.", "is_phrase": false, "pos": "Adverb"}, "eint": {"def": "Eine umgangssprachliche Form von 'meint ihr'. Man fragt damit andere Personen nach ihrer Meinung oder Vermutung.", "example": "Eint ihr, wir schaffen das bis morgen?", "is_phrase": false, "pos": "Verb"}, "ende": {"def": "Diese Phrase bedeutet: etwas vollständig fertig machen oder bis zum Schluss durchführen. Man benutzt sie, wenn man fragt, ob man eine Aufgabe komplett abschließen muss.", "example": "Musst du das Buch zu Ende lesen oder reichen die ersten Kapitel?", "is_phrase": true, "pos": "Redewendung"}, "endlich": {"def": "Drückt Ungeduld aus und bedeutet 'jetzt sofort' oder 'nach so langer Zeit'. Man verwendet es, wenn man will, dass etwas schneller passiert oder wenn man lange auf etwas gewartet hat.", "example": "Hör endlich auf zu reden, ich möchte schlafen!", "is_phrase": false, "pos": "Adverb"}, "erst": {"def": "zeigt an, dass etwas zu einem bestimmten Zeitpunkt beginnt oder passiert, oft als Reaktion auf etwas anderes", "example": "Als er meinen Namen rief, schaute ich erst auf und erkannte ihn.", "is_phrase": false, "pos": "Adverb"}, "ersten": {"def": "Das Wort beschreibt etwas, was am Anfang steht oder als Nummer 1 kommt. Es zeigt die Reihenfolge in der Zeit oder im Raum.", "example": "In den ersten Tagen des Urlaubs war das Wetter schlecht.", "is_phrase": false, "pos": "Adjektiv"}, "erwischt": {"def": "Jemanden bei etwas entdecken, was er heimlich oder verboten gemacht hat. Die Person wurde dabei beobachtet, wie sie etwas Falsches getan hat.", "example": "Die Mutter hat ihren Sohn erwischt, als er heimlich Süßigkeiten aus der Küche genommen hat.", "is_phrase": false, "pos": "Verb"}, "fachraum": {"def": "Ein spezieller Raum in einem Gebäude, der für bestimmte Arbeiten oder Fächer verwendet wird. In Schulen sind das zum Beispiel Chemie- oder Physikräume, in anderen Gebäuden können es auch Arbeits- oder Sicherheitsräume sein.", "example": "Die Schüler gingen in den Fachraum für Biologie, um dort Experimente zu machen.", "is_phrase": false, "pos": "Substantiv"}, "falsch": {"def": "Diese Phrase bedeutet: verstehe meine Worte nicht in einer negativen Art. Man sagt das, bevor man etwas sagt, was andere schlecht verstehen könnten.", "example": "Versteh mich nicht falsch, aber dein neues Kleid gefällt mir nicht so gut.", "is_phrase": true, "pos": "Redewendung"}, "fedrigen": {"def": "Beschreibt Haare, die leicht und locker sind, aber unordentlich aussehen. Die Haare stehen in verschiedene Richtungen ab, wie die weichen Federn eines Vogels.", "example": "Ihre fedrigen Haare sahen aus, als wäre sie gerade aufgestanden.", "is_phrase": false, "pos": "Adjektiv"}, "fehler": {"def": "Etwas, was nicht richtig oder falsch gemacht wurde. Ein kleines Problem oder eine Ungenauigkeit.", "example": "In dem Text war nur ein kleiner Fehler - ein falsches Datum.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "fenster": {"def": "Eine Öffnung in der Wand eines Gebäudes, die mit Glas verschlossen ist. Durch ein Fenster kann man nach draußen schauen und Licht kommt herein.", "example": "Die Regentropfen klopften laut gegen das Fenster.", "is_phrase": false, "pos": "Substantiv"}, "fest": {"def": "Stabil und sicher stehen, ohne zu wackeln oder umzufallen. Die Füße haben guten Kontakt zum Boden.", "example": "Nach dem Sturz stand sie wieder fest auf den Beinen.", "is_phrase": false, "pos": "Adverb"}, "filler": {"def": "Ein Eigenname für eine Person, hier der Nachname eines Mannes. In diesem Text ist Herr Filler eine bestimmte Person, die andere Leute beobachtet und Befehle gibt.", "example": "Herr Müller ist unser neuer Nachbar.", "is_phrase": false, "pos": "Substantiv"}, "fillers": {"def": "Ein Nachname einer Person. In diesem Fall ist Filler der Familienname von Herrn Filler.", "example": "Herr Müllers Büro befindet sich im ersten Stock.", "is_phrase": false, "pos": "Substantiv (Eigenname)"}, "filmstar": {"def": "Eine sehr bekannte und berühmte Person, die in Filmen mitspielt. Filmstars sind oft sehr schön und elegant und werden von vielen Menschen bewundert.", "example": "Der Filmstar trug ein teures Kleid auf dem roten Teppich.", "is_phrase": false, "pos": "Nomen"}, "fiona": {"def": "Ein weiblicher Vorname. Hier ist es der Name einer Person, die in dem Text spricht oder erwähnt wird.", "example": "Fiona ist meine Klassenkameradin und sitzt neben mir in der Schule.", "is_phrase": false, "pos": "Substantiv"}, "fokussierte": {"def": "Jemanden scharf und konzentriert anschauen, den Blick gezielt auf eine Person richten. Man schaut dabei sehr aufmerksam und intensiv.", "example": "Die Lehrerin fokussierte den störenden Schüler und wartete, bis er ruhig war.", "is_phrase": false, "pos": "Verb"}, "frage": {"def": "Ein Thema oder Problem, das Menschen beschäftigt und über das sie nachdenken oder sprechen. Hier bedeutet es: Das war das wichtigste Thema, worüber alle geredet haben.", "example": "Die Frage, wer der neue Chef wird, beschäftigt alle Mitarbeiter.", "is_phrase": false, "pos": "Nomen, feminin"}, "fragte": {"def": "Das ist die Vergangenheitsform von 'fragen'. Man benutzt es, wenn jemand eine Frage gestellt hat.", "example": "\"Wie spät ist es?\", fragte Maria ihren Bruder.", "is_phrase": false, "pos": "Verb"}, "freunde": {"def": "Eine informelle Anrede, um eine Gruppe von Menschen anzusprechen, auch wenn man sie nicht persönlich kennt. Man verwendet es, um freundlich und locker mit mehreren Personen zu sprechen.", "example": "Freunde, wir müssen uns beeilen!", "is_phrase": false, "pos": "Interjektion"}, "freundin": {"def": "Eine Frau oder ein Mädchen, mit der man befreundet ist und gerne Zeit verbringt. Man vertraut ihr und mag sie sehr.", "example": "Meine beste Freundin Lisa und ich gehen oft zusammen ins Kino.", "is_phrase": false, "pos": "Substantiv, feminin"}, "fummelte": {"def": "Mit den Fingern nervös oder ungeschickt an etwas herumspielen oder daran herumdrehen. Man macht das oft, wenn man unsicher ist oder nachdenkt.", "example": "Er fummelte nervös an seinem Schlüssel herum, während er auf das Vorstellungsgespräch wartete.", "is_phrase": false, "pos": "Verb"}, "fusel": {"def": "Ein kleines Stückchen oder Teilchen, das an Kleidung hängt (wie Haare, Staub oder Fäden). Man kann es leicht mit der Hand wegmachen.", "example": "Sie entfernte einen Fusel von ihrem schwarzen Pullover.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "färbte": {"def": "Die Haare mit Farbe behandeln, um ihre natürliche Farbe zu ändern. Man macht das oft, um graue Haare zu verstecken oder eine andere Haarfarbe zu bekommen.", "example": "Meine Mutter färbt sich regelmäßig die Haare blond, weil sie ihre grauen Haare nicht mag.", "is_phrase": false, "pos": "Verb"}, "färbten": {"def": "Die Farbe der Haare mit chemischen Mitteln ändern. Man macht das, um eine andere Haarfarbe zu bekommen.", "example": "Sie färbte sich die Haare von braun zu blond.", "is_phrase": false, "pos": "Verb"}, "füllerdeckel": {"def": "Der kleine runde Deckel, der oben auf einen Füller gehört und die Spitze schützt. Ohne den Deckel kann die Tinte austrocknen.", "example": "Der Füllerdeckel ist vom Tisch gefallen und ich konnte ihn nicht mehr finden.", "is_phrase": false, "pos": "Substantiv"}, "für": {"def": "zeigt eine persönliche Einschätzung oder Bewertung aus der Sicht einer Person. Drückt aus, wie jemand etwas oder jemanden sieht oder beurteilt.", "example": "Das Restaurant ist für mich das beste in der Stadt.", "is_phrase": false, "pos": "Präposition"}, "ganz": {"def": "Das Wort 'ganz' verstärkt hier andere Wörter und bedeutet 'völlig' oder 'komplett'. Es macht die Aussage stärker.", "example": "Der Kuchen ist ganz lecker geworden.", "is_phrase": false, "pos": "Adverb"}, "gar": {"def": "Verstärkt eine Verneinung und bedeutet 'überhaupt nicht' oder 'absolut nicht'. Macht die negative Aussage stärker.", "example": "Das verstehe ich gar nicht.", "is_phrase": false, "pos": "Adverb"}, "gedanken": {"def": "Diese Wendung bedeutet: eine Idee oder Möglichkeit haben. Man verwendet sie oft in der Verneinung, wenn man sagen will, dass man nicht an etwas gedacht hat.", "example": "Ich wäre nie auf den Gedanken gekommen, dass du schon verheiratet bist.", "is_phrase": true, "pos": "Redewendung"}, "gefiel": {"def": "Etwas fand man gut, schön oder angenehm. Es ist die Vergangenheitsform von 'gefallen'.", "example": "Der Film gefiel mir sehr gut.", "is_phrase": false, "pos": "Verb"}, "gegeben": {"def": "Das Partizip von 'geben' wird hier in zwei verschiedenen Kontexten verwendet. In Beleg 1 ist es Teil der Redewendung 'sich Mühe geben' (= sich anstrengen). In Beleg 2 bildet es mit 'hatte' das Plusquamperfekt von 'es gibt' (= etwas ist vorhanden/existiert).", "example": "Ich hatte mir viel Mühe mit der Hausaufgabe gegeben, aber es hatte trotzdem viele Fehler gegeben.", "is_phrase": false, "pos": "Verb"}, "gekommen": {"def": "Eine feste Wendung, die bedeutet: eine Idee haben, an etwas denken. Man verwendet diese Phrase, wenn man über Gedanken oder Ideen spricht, die man hat oder nicht hat.", "example": "Ich bin nie auf den Gedanken gekommen, dass er lügen könnte.", "is_phrase": true, "pos": "Redewendung"}, "gekritzel": {"def": "Unordentliche, nachlässige Schreiberei oder Zeichnerei ohne besonderen Zweck. Man macht das oft unbewusst, wenn man nachdenkt oder sich langweilt.", "example": "Während des langweiligen Telefonats entstanden lauter kleine Gekritzel auf meinem Notizblock.", "is_phrase": false, "pos": "Substantiv"}, "gelegenheit": {"def": "Ein günstiger Moment, in dem man etwas tun kann, was normalerweise nicht möglich ist. Eine Chance, die man nutzen sollte, bevor sie vorbei ist.", "example": "Als der Lehrer kurz aus dem Klassenzimmer ging, nutzte Max die Gelegenheit und schaute heimlich auf sein Handy.", "is_phrase": false, "pos": "Substantiv"}, "gemeinsam": {"def": "Zusammen mit anderen Personen zur selben Zeit. Alle machen etwas zur gleichen Zeit oder sind in der gleichen Situation.", "example": "Die ganze Klasse wartet gemeinsam vor dem Klassenzimmer auf den Lehrer.", "is_phrase": false, "pos": "Adverb"}, "genau": {"def": "bedeutet hier: sicher, ohne Zweifel. Man verwendet es, wenn jemand etwas sehr gut weiß und sich völlig sicher ist.", "example": "Er wusste genau, dass er der beste Spieler im Team war.", "is_phrase": false, "pos": "Adverb"}, "genauso": {"def": "bedeutet 'in der gleichen Art' oder 'im gleichen Maß'. Man benutzt es, um zu zeigen, dass zwei Dinge oder Personen gleich sind.", "example": "Sie ist genauso müde wie ich nach der langen Reise.", "is_phrase": false, "pos": "Adverb"}, "geräusch": {"def": "Ein Ton oder Laut, den man hört. Kann laut oder leise, angenehm oder störend sein.", "example": "Das laute Geräusch der Bohrmaschine störte die Nachbarn.", "is_phrase": false, "pos": "Substantiv, das"}, "gesagt": {"def": "Das ist die Vergangenheitsform von 'sagen'. Man verwendet es, wenn jemand in der Vergangenheit Worte gesprochen oder etwas ausgedrückt hat.", "example": "Meine Mutter hat gesagt, dass ich um zehn Uhr zu Hause sein soll.", "is_phrase": false, "pos": "Verb"}, "geschlossenen": {"def": "Ein Raum, der von außen abgeschlossen und sicher ist. Man kann die Tür schließen und ist vor Gefahren geschützt.", "example": "Bei dem Feueralarm gingen alle Schüler in einen geschlossenen Klassenraum und warteten auf Hilfe.", "is_phrase": false, "pos": "Adjektiv"}, "geschosse": {"def": "Kleine Objekte, die sehr schnell durch die Luft fliegen und gegen etwas prallen. Hier werden kleine Dinge mit Kugeln oder Projektilen verglichen, die mit großer Kraft auf eine Scheibe treffen.", "example": "Die Regentropfen schlugen wie kleine Geschosse gegen das Fenster.", "is_phrase": false, "pos": "Substantiv"}, "gespielt": {"def": "Wenn das Gehirn oder der Verstand jemandem einen Streich spielt, dann funktioniert das Denken nicht richtig. Man ist verwirrt oder unsicher, ob man etwas richtig verstanden oder wahrgenommen hat.", "example": "Nach der langen Autofahrt war ich so müde, dass ich dachte, mein Verstand hätte mir einen Streich gespielt.", "is_phrase": true, "pos": "Redewendung"}, "ging": {"def": "Vergangenheitsform von 'gehen'. Es bedeutet: sich zu Fuß von einem Ort zu einem anderen bewegen.", "example": "Sie ging schnell zum Fenster und schaute hinaus.", "is_phrase": false, "pos": "Verb"}, "ginge": {"def": "Form von 'gehen' im Konjunktiv II, die ausdrückt, dass etwas nicht real ist, sondern nur vorgestellt oder verglichen wird. Wird oft mit 'als' verwendet, um einen irrealen Vergleich zu machen.", "example": "Sie tat so, als ginge sie nur schnell einkaufen, aber sie wollte eigentlich ihren Ex-Freund besuchen.", "is_phrase": false, "pos": "Verb (Konjunktiv II)"}, "gleich": {"def": "bedeutet hier 'sofort' oder 'direkt' - verstärkt die Aussage, dass man nicht zu schnell das Schlimmste denken soll", "example": "Du musst nicht gleich Angst haben, nur weil er nicht antwortet.", "is_phrase": false, "pos": "Adverb"}, "greta": {"def": "Ein weiblicher Vorname. Hier ist Greta die Freundin der Erzählerin.", "example": "Greta ist meine beste Freundin in der Schule.", "is_phrase": false, "pos": "Eigenname"}, "große": {"def": "Von der Größe her nicht klein, sondern weit geöffnet oder ausgedehnt. Hier beschreibt es Augen, die sehr weit und auffällig sind.", "example": "Das kleine Mädchen hatte große, braune Augen, die sehr traurig aussahen.", "is_phrase": false, "pos": "Adjektiv"}, "grund": {"def": "Eine Ursache oder ein Anlass, warum man etwas tut oder warum etwas passiert. Hier bedeutet es: Es gibt keinen Anlass, sich Sorgen zu machen oder das Schlimmste zu erwarten.", "example": "Es gibt keinen Grund zur Panik, alles wird gut.", "is_phrase": false, "pos": "Substantiv"}, "grüppchen": {"def": "Eine kleine Gruppe von Menschen, die zusammenstehen oder sich zusammen aufhalten. Das Wort klingt freundlich und gemütlich.", "example": "In der Pause standen die Schüler in kleinen Grüppchen auf dem Schulhof und unterhielten sich.", "is_phrase": false, "pos": "Substantiv, das"}, "gähnte": {"def": "Den Mund weit öffnen und tief einatmen, weil man müde ist oder sich langweilt. Das passiert oft automatisch, wenn der Körper mehr Sauerstoff braucht.", "example": "Nach der langen Schulstunde gähnte Lisa laut.", "is_phrase": false, "pos": "Verb"}, "günstig": {"def": "So, dass es einen Vorteil bringt oder eine gute Lage ist. Man hat dadurch bessere Chancen oder kann etwas besser machen.", "example": "Der Platz am Fenster ist günstig, weil man von dort alles gut sehen kann.", "is_phrase": false, "pos": "Adjektiv"}, "haare": {"def": "Die dünnen Fäden, die auf dem Kopf wachsen. Man kann sie schneiden, waschen und in verschiedenen Farben färben.", "example": "Sie färbt sich die Haare blond, weil ihr die natürliche braune Farbe nicht gefällt.", "is_phrase": false, "pos": "Substantiv"}, "haaren": {"def": "Die langen Haare auf dem Kopf einer Person. Wenn jemand sehr lange Haare hat, können sie sich wie Wasser bewegen.", "example": "Ihre langen Haare fielen über die Schultern, als sie den Kopf bewegte.", "is_phrase": false, "pos": "Substantiv"}, "habicht": {"def": "Ein Raubvogel mit scharfen Krallen und spitzem Schnabel, der andere Tiere jagt und frisst. Habichte sind schnelle und aggressive Jäger.", "example": "Der Habicht saß auf dem Ast und beobachtete die Mäuse im Garten.", "is_phrase": false, "pos": "Substantiv"}, "habt": {"def": "2. Person Plural von 'haben' im Präsens. Man benutzt es, wenn man zu mehreren Personen spricht und sagt, dass sie etwas besitzen oder dass etwas bei ihnen vorhanden ist.", "example": "Ihr habt heute keine Zeit für das Meeting.", "is_phrase": false, "pos": "Verb"}, "hatten": {"def": "Vergangene Form von 'haben' für mehrere Personen oder Dinge. Drückt aus, dass etwas in der Vergangenheit besessen wurde oder vorhanden war.", "example": "Die Schultern hatten keine Polsterung nötig, weil sie schon breit genug waren.", "is_phrase": false, "pos": "Verb"}, "hausaufgaben": {"def": "Aufgaben, die Schüler zu Hause machen müssen, nachdem sie in der Schule waren. Sie werden vom Lehrer gegeben und müssen bis zur nächsten Stunde fertig sein.", "example": "Lisa macht jeden Tag nach dem Mittagessen ihre Hausaufgaben.", "is_phrase": false, "pos": "Substantiv (Plural)"}, "heißt": {"def": "bedeuten, dass etwas der Fall ist; ausdrücken, was die Folge oder Konsequenz von etwas ist", "example": "Heißt das, dass wir morgen frei haben?", "is_phrase": false, "pos": "Verb"}, "herr": {"def": "Höfliche Anrede für einen Mann, die vor dem Nachnamen steht. Man benutzt es, wenn man respektvoll oder förmlich mit jemandem spricht.", "example": "Herr Schmidt arbeitet in unserem Büro und ist sehr freundlich.", "is_phrase": false, "pos": "Substantiv"}, "herrn": {"def": "Höfliche Form, um einen Mann zu bezeichnen, besonders in formellen Situationen. Wird oft mit dem Nachnamen verwendet.", "example": "Herrn Müllers Büro ist im zweiten Stock.", "is_phrase": false, "pos": "Substantiv"}, "herrschte": {"def": "jemanden sehr laut und streng ansprechen, weil man wütend oder ungeduldig ist", "example": "Die Lehrerin herrschte den Schüler an, weil er zu spät gekommen war.", "is_phrase": true, "pos": "Verb"}, "hinsetzte": {"def": "sich auf einen Stuhl oder eine andere Sitzgelegenheit setzen. Das Gegenteil von stehen bleiben.", "example": "Die Lehrerin blieb während der ganzen Stunde stehen und setzte sich nie hin.", "is_phrase": false, "pos": "Verb"}, "hinten": {"def": "An der Rückseite eines Raumes, weit weg vom vorderen Bereich. Der Platz, der am weitesten vom Lehrer oder der wichtigsten Stelle entfernt ist.", "example": "In der Bibliothek setze ich mich gerne hinten hin, weil es dort ruhiger ist.", "is_phrase": false, "pos": "Adverb"}, "hinzuschmeißen": {"def": "aufgeben, etwas nicht mehr weitermachen wollen. Man benutzt es, wenn man frustriert ist und keine Lust mehr hat.", "example": "Nach dem dritten gescheiterten Versuch wollte sie das Projekt hinzuschmeißen.", "is_phrase": false, "pos": "Verb"}, "hirn": {"def": "Das Gehirn als Organ zum Denken und Verstehen. Wird hier umgangssprachlich verwendet, wenn man über die eigene Denkfähigkeit spricht.", "example": "Nach der langen Prüfung war mein Hirn so müde, dass ich nichts mehr verstehen konnte.", "is_phrase": false, "pos": "Substantiv"}, "hof": {"def": "Ein offener Platz in einer Schule, wo die Schüler in den Pausen sind. Hier können sie sich bewegen und mit anderen sprechen.", "example": "In der großen Pause gehen alle Kinder auf den Schulhof.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "hände": {"def": "Die Redewendung bedeutet: die Arme so halten, dass man selbstbewusst und bestimmt wirkt. Man stellt sich dabei oft breit hin und zeigt, dass man die Kontrolle hat.", "example": "Die Lehrerin stemmte die Hände in die Hüften und schaute die lauten Schüler streng an.", "is_phrase": true, "pos": "Substantiv"}, "hübsch": {"def": "Eine Person ist hübsch, wenn sie ein schönes Gesicht hat und attraktiv aussieht. Das Wort beschreibt meist das Aussehen von Frauen oder Mädchen.", "example": "Das hübsche Mädchen hatte viele Verehrer in der Schule.", "is_phrase": false, "pos": "Adjektiv"}, "hübsche": {"def": "Eine Person, die schön aussieht und attraktiv ist. Man findet das Aussehen dieser Person angenehm und anziehend.", "example": "Sie ist eine hübsche Frau mit langen, blonden Haaren.", "is_phrase": false, "pos": "Adjektiv"}, "hüften": {"def": "Die Redewendung 'die Hände in die Hüften stemmen' bedeutet: eine selbstbewusste, strenge oder vorwurfsvolle Körperhaltung einnehmen. Man stellt sich dabei aufrecht hin und legt beide Hände seitlich an die Taille.", "example": "Die Lehrerin stemmte die Hände in die Hüften und schaute die lauten Schüler streng an.", "is_phrase": true, "pos": "Substantiv (Plural)"}, "hüllte": {"def": "jemanden oder etwas vollständig umgeben und bedecken, sodass man davon umschlossen ist. Wird oft bei Gefühlen oder Atmosphäre verwendet.", "example": "Die Traurigkeit hüllte ihn ein, nachdem er die schlechten Nachrichten gehört hatte.", "is_phrase": false, "pos": "Verb"}, "ida-sophie": {"def": "Ein weiblicher Vorname, der aus zwei Teilen besteht (Ida und Sophie). Die Person mit diesem Namen ist ein Mädchen oder eine junge Frau.", "example": "Ida-Sophie ist ein hübsches Mädchen in der Klasse.", "is_phrase": false, "pos": "Eigenname"}, "idiot": {"def": "Eine Person, die dumm ist oder sich dumm verhält. Oft als Beleidigung oder abwertende Bezeichnung verwendet.", "example": "Der Lehrer ärgerte sich über den Schüler, den er als Idiot bezeichnete.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "jeans": {"def": "Eine Hose aus festem, meist blauem Stoff, die man im Alltag trägt. Jeans sind bequem und werden oft in der Freizeit getragen.", "example": "Sie zog ihre schwarzen Jeans und ein weißes T-Shirt an.", "is_phrase": false, "pos": "Substantiv"}, "jemand": {"def": "Eine Person, die man nicht kennt oder nicht genau bestimmen kann. Man verwendet es, wenn man nicht weiß, wer diese Person ist.", "example": "Hörst du das? Da ist jemand an der Tür.", "is_phrase": false, "pos": "Pronomen"}, "kante": {"def": "Der äußere Rand von etwas, besonders von einer Fläche oder einem Gegenstand. Hier ist der vordere Rand der Tischplatte gemeint.", "example": "Die Bücher lagen zu nah an der Kante und fielen vom Tisch.", "is_phrase": false, "pos": "Substantiv, feminin"}, "kind": {"def": "Eine junge Person, die noch nicht erwachsen ist. Wird hier verwendet, um zu zeigen, dass die Person jung und unschuldig aussieht, obwohl sie älter ist.", "example": "Mit ihren runden Wangen sah sie aus wie ein Kind, obwohl sie schon 25 Jahre alt war.", "is_phrase": false, "pos": "Substantiv"}, "kinder": {"def": "Junge Menschen, die noch nicht erwachsen sind. Sie sind meist zwischen 0 und etwa 14 Jahre alt.", "example": "Die Kinder spielen im Park.", "is_phrase": false, "pos": "Substantiv"}, "klang": {"def": "So hörbar sein, einen bestimmten Eindruck durch die Art des Sprechens machen. Das Verb beschreibt, wie die Stimme auf andere wirkt.", "example": "Seine Stimme klang müde, als er nach der langen Reise anrief.", "is_phrase": false, "pos": "Verb"}, "klasse": {"def": "Eine Gruppe von Schülern, die zusammen unterrichtet werden. Alle Schüler in einer Klasse sind meist im gleichen Alter und lernen die gleichen Fächer.", "example": "In meiner Klasse sind 25 Schüler.", "is_phrase": false, "pos": "Substantiv"}, "klausur": {"def": "Eine schriftliche Prüfung in der Schule oder Universität, die meist länger dauert und benotet wird. Die Studenten oder Schüler müssen dabei Fragen beantworten oder Aufgaben lösen.", "example": "Morgen schreibe ich eine schwere Klausur in Mathematik.", "is_phrase": false, "pos": "Substantiv, feminin"}, "klausuren": {"def": "Schriftliche Prüfungen in der Schule oder Universität, bei denen Studenten oder Schüler Aufgaben in einem bestimmten Raum lösen müssen. Man sitzt dabei meist an Tischen und darf nicht mit anderen sprechen.", "example": "Morgen schreiben wir drei Klausuren in Mathematik, Deutsch und Geschichte.", "is_phrase": false, "pos": "Substantiv"}, "kleiner": {"def": "nicht sehr groß oder stark; von geringem Ausmaß. Hier bedeutet es, dass der Tumult nicht sehr heftig oder dramatisch war.", "example": "Nach der Ankündigung gab es einen kleinen Aufruhr im Publikum.", "is_phrase": false, "pos": "Adjektiv"}, "klingen": {"def": "einen bestimmten Eindruck machen, wenn man spricht; so sprechen, dass andere denken, man hat bestimmte Eigenschaften oder Gefühle", "example": "Er wollte freundlich klingen, aber seine Stimme war kalt.", "is_phrase": false, "pos": "Verb"}, "knackte": {"def": "Ein kurzes, trockenes Geräusch machen, wie es elektronische Geräte manchmal von sich geben. Oft passiert das bei Lautsprechern oder Radios, wenn sie Störungen haben oder sich ein- oder ausschalten.", "example": "Das alte Radio knackte ein paar Mal, bevor die Musik zu hören war.", "is_phrase": false, "pos": "Verb"}, "knallermann": {"def": "Ein Spitzname für einen Schüler, der sehr gut in Mathematik ist und bei dem andere gerne abschreiben. Der Name kommt wahrscheinlich daher, dass er die Antworten schnell und sicher weiß.", "example": "Tom ist unser Knallermann - er löst jede Rechenaufgabe in wenigen Sekunden.", "is_phrase": false, "pos": "Substantiv"}, "komische": {"def": "seltsam, merkwürdig oder ungewöhnlich in einer Art, die einen unsicher oder misstrauisch macht. Man findet das Verhalten oder Aussehen dieser Person nicht normal.", "example": "Auf der Party waren ein paar komische Leute, die sich sehr seltsam benommen haben.", "is_phrase": false, "pos": "Adjektiv"}, "kommandierte": {"def": "Etwas mit lauter, harter Stimme befehlen oder anordnen, wie ein Soldat oder Chef es tut.", "example": "Der Trainer kommandierte: 'Alle sofort zum Training!'", "is_phrase": false, "pos": "Verb"}, "konnte": {"def": "Präteritum von 'können' - drückt hier Zweifel oder Erstaunen aus. Man fragt sich, ob etwas möglich oder wahr ist.", "example": "Konnte sie wirklich so etwas Gemeines zu dir gesagt haben?", "is_phrase": false, "pos": "Verb"}, "kopf": {"def": "Der obere Teil des Körpers, wo sich Gesicht, Haare, Gehirn und Sinnesorgane befinden. Hier wird gezeigt, dass Ida-Sophie müde oder frustriert ist und ihren Kopf auf den Tisch legt.", "example": "Nach der schweren Prüfung legte sie den Kopf in die Hände.", "is_phrase": false, "pos": "Substantiv"}, "korkenzieherlocken": {"def": "Haare, die sehr stark gedreht sind und wie eine Spirale aussehen. Sie haben die Form wie ein Korkenzieher, mit dem man Weinflaschen öffnet.", "example": "Das kleine Mädchen hatte wunderschöne Korkenzieherlocken, die um ihr Gesicht tanzten.", "is_phrase": false, "pos": "Substantiv, Plural"}, "kullern": {"def": "sich rollend bewegen, meist langsam und unkontrolliert. Kleine runde Gegenstände kullern oft, wenn sie von einer Fläche fallen.", "example": "Der Ball kullerte die Treppe hinunter.", "is_phrase": false, "pos": "Verb"}, "kurz": {"def": "Bedeutet, dass man sehr nah daran ist, etwas zu tun. Man ist fast bereit, eine Entscheidung zu treffen oder eine Handlung auszuführen.", "example": "Nach der schlechten Note war Lisa kurz davor, das Studium abzubrechen.", "is_phrase": true, "pos": "Redewendung"}, "können": {"def": "in der Lage sein, etwas zu schaffen oder zu machen. Hier bedeutet es: es ist möglich für uns, mehr zu tun.", "example": "Wir können heute nicht mehr helfen, aber morgen haben wir Zeit.", "is_phrase": false, "pos": "Verb"}, "könnte": {"def": "Drückt eine Möglichkeit oder Vermutung aus. Man ist sich nicht sicher, ob etwas wirklich so ist.", "example": "Er könnte krank sein, deshalb ist er heute nicht da.", "is_phrase": false, "pos": "Modalverb"}, "lachte": {"def": "Ein Geräusch machen, wenn man etwas lustig findet oder sich freut. Hier zeigt es starke Emotion - die Person ist erleichtert oder glücklich über die gute Nachricht.", "example": "Als sie hörte, dass die Prüfung verschoben wird, lachte sie vor Freude.", "is_phrase": false, "pos": "Verb"}, "lage": {"def": "Herr der Lage sein bedeutet: eine schwierige Situation kontrollieren und gut damit umgehen können. Die Person weiß, was sie tun muss und hat alles unter Kontrolle.", "example": "Obwohl viele Probleme auftraten, blieb der Manager Herr der Lage und löste alles schnell.", "is_phrase": true, "pos": "Redewendung"}, "lang": {"def": "Zeigt die Dauer einer Handlung oder eines Zustands an. Es bedeutet 'für die Zeit von' oder 'während'.", "example": "Er war drei Stunden lang im Büro.", "is_phrase": false, "pos": "Adverb"}, "lauschte": {"def": "aufmerksam zuhören, besonders leisen Geräuschen. Man hört sehr konzentriert hin.", "example": "Sie lauschte den Vögeln im Garten.", "is_phrase": false, "pos": "Verb"}, "laut": {"def": "Mit großer Lautstärke, so dass andere Menschen es gut hören können. Das Gegenteil von leise.", "example": "Die Kinder spielten laut im Garten.", "is_phrase": false, "pos": "Adverb"}, "lautsprecher": {"def": "Ein Gerät, das Töne, Musik oder Stimmen laut macht, damit alle Menschen in einem Raum sie hören können. Wird oft für Durchsagen in Gebäuden verwendet.", "example": "Im Kaufhaus kam eine Durchsage aus dem Lautsprecher, dass das Geschäft in zehn Minuten schließt.", "is_phrase": false, "pos": "Substantiv"}, "leisen": {"def": "Sehr schwach hörbar, kaum zu hören. Das Gegenteil von laut.", "example": "Die leisen Schritte im Flur weckten niemanden auf.", "is_phrase": false, "pos": "Adjektiv"}, "letzte": {"def": "Die Pause, die kurz vorher war und jetzt vorbei ist. Das bedeutet die Pause, die direkt vor dem jetzigen Moment stattgefunden hat.", "example": "In der letzten Stunde hatten wir Mathematik.", "is_phrase": false, "pos": "Adjektiv"}, "letzten": {"def": "beschreibt etwas, das ganz hinten oder am Ende ist. Wird hier für die Reihe verwendet, die am weitesten vom Lehrer entfernt ist.", "example": "Die Schüler in der letzten Reihe können die Tafel schlecht sehen.", "is_phrase": false, "pos": "Adjektiv"}, "ließ": {"def": "Vergangenheitsform von 'lassen': etwas bewusst nach unten bewegen oder fallen lassen. Hier bedeutet es, dass Ida-Sophie ihren Kopf absichtlich auf den Tisch sinken lässt.", "example": "Müde ließ er die Arme sinken.", "is_phrase": false, "pos": "Verb"}, "ließen": {"def": "sich etwas machen lassen bedeutet, dass eine andere Person etwas für einen macht. Man geht zu jemandem, der das professionell kann.", "example": "Sie ließ sich beim Friseur die Haare schneiden.", "is_phrase": true, "pos": "Verb"}, "locke": {"def": "Ein einzelnes Haar oder eine kleine Gruppe von Haaren, die sich kräuselt oder wellig ist. Oft hängen Locken ins Gesicht oder fallen über die Stirn.", "example": "Ihre blonde Locke hing ihr immer in die Augen, deshalb strich sie sie oft zur Seite.", "is_phrase": false, "pos": "Substantiv, feminin"}, "locken": {"def": "Haare, die sich in runden oder spiralförmigen Kreisen drehen. Sie entstehen natürlich oder werden mit besonderen Geräten gemacht.", "example": "Maria hat schöne blonde Locken, die ihr bis auf die Schultern fallen.", "is_phrase": false, "pos": "Substantiv (feminin, Plural)"}, "lockerheit": {"def": "Eine entspannte, ruhige Art, wie jemand etwas sagt oder tut, ohne nervös oder aufgeregt zu sein. Die Person zeigt keine starken Gefühle und wirkt gelassen.", "example": "Er erzählte mit großer Lockerheit von seinem Unfall, als wäre nichts Schlimmes passiert.", "is_phrase": false, "pos": "Substantiv"}, "los": {"def": "Was los ist bedeutet: was passiert, was ist das Problem, was ist die Situation. Man fragt danach, wenn man wissen will, warum etwas anders ist als normal.", "example": "Die Kinder sind heute sehr ruhig - was ist denn los?", "is_phrase": true, "pos": "Adverb"}, "mach": {"def": "Eine Aufforderung oder Bitte, etwas zu tun oder nicht zu tun. Man verwendet es im Imperativ, um jemanden direkt anzusprechen.", "example": "Mach bitte das Fenster auf, es ist so heiß hier drinnen!", "is_phrase": false, "pos": "Verb"}, "mal": {"def": "Ein Wort, das eine Bitte oder Aufforderung höflicher macht. Es zeigt, dass man freundlich um etwas bittet.", "example": "Kannst du mal das Fenster öffnen?", "is_phrase": false, "pos": "Partikel"}, "malen": {"def": "Die Redewendung 'den Teufel an die Wand malen' bedeutet: sich unnötig Sorgen machen oder über schlimme Dinge sprechen, die vielleicht gar nicht passieren. Man soll nicht zu pessimistisch sein oder Probleme größer machen, als sie sind.", "example": "Reg dich nicht auf - mal nicht gleich den Teufel an die Wand, wenn der Chef ein Gespräch mit dir führen möchte.", "is_phrase": true, "pos": "Verb (in Redewendung)"}, "manche": {"def": "Ein Teil von einer Gruppe von Menschen oder Dingen, aber nicht alle. Man benutzt es, wenn man verschiedene Gruppen beschreibt.", "example": "Manche Schüler lernen gern, manche nicht.", "is_phrase": false, "pos": "Pronomen"}, "manchen": {"def": "bedeutet 'einige' oder 'ein paar'; wird verwendet, wenn man über mehrere, aber nicht alle Teile von etwas spricht", "example": "An manchen Tagen regnet es, an anderen scheint die Sonne.", "is_phrase": false, "pos": "Indefinitpronomen"}, "mann": {"def": "Eine erwachsene männliche Person. Das Wort wird hier verwendet, um eine bestimmte Person zu beschreiben.", "example": "Der Mann an der Bushaltestelle trug einen grauen Mantel.", "is_phrase": false, "pos": "Substantiv"}, "marilyn-manson-zitaten": {"def": "Aussagen oder Sprüche von Marilyn Manson, einem bekannten amerikanischen Rockmusiker, die oft auf T-Shirts gedruckt werden. Diese Zitate sind meist provokant oder rebellisch und werden von Jugendlichen getragen, um zu zeigen, dass sie anders sind.", "example": "Viele Teenager tragen T-Shirts mit Marilyn-Manson-Zitaten, um ihre rebellische Einstellung zu zeigen.", "is_phrase": false, "pos": "Substantiv"}, "mark": {"def": "Ein männlicher Vorname. In diesem Text ist Mark der Name der Hauptperson.", "example": "Mark ging zur Schule und traf dort seinen Freund.", "is_phrase": false, "pos": "Substantiv"}, "mathe": {"def": "Kurzform für das Schulfach Mathematik. Man rechnet dort mit Zahlen und löst mathematische Aufgaben.", "example": "In der Schule haben wir heute zwei Stunden Mathe.", "is_phrase": false, "pos": "Substantiv"}, "mathecrack": {"def": "Eine Person, die sehr gut in Mathematik ist und schwierige Aufgaben schnell lösen kann. Das Wort wird umgangssprachlich verwendet, um jemanden zu beschreiben, der ein Talent für Zahlen hat.", "example": "Lisa ist ein echter Mathecrack - sie rechnet komplizierte Aufgaben im Kopf aus.", "is_phrase": false, "pos": "Substantiv"}, "mathegeplagtes": {"def": "Von Mathematik müde und gestresst. Das Gehirn ist erschöpft vom vielen Rechnen und kann nicht mehr klar denken.", "example": "Nach drei Stunden Algebra war mein mathegeplagtes Gehirn so müde, dass ich einfache Aufgaben nicht mehr lösen konnte.", "is_phrase": false, "pos": "Adjektiv"}, "mathelehrer": {"def": "Eine Person, die an einer Schule das Fach Mathematik unterrichtet. Hier zeigt es, dass Fiona Herrn Filler nur in seiner beruflichen Rolle als Lehrer kannte.", "example": "Mein Mathelehrer erklärt die Aufgaben immer sehr geduldig.", "is_phrase": false, "pos": "Substantiv"}, "mauer": {"def": "Ein Bauwerk aus Steinen oder Ziegeln, das hoch und lang ist. Es trennt zwei Bereiche voneinander oder umgibt ein Gebäude.", "example": "Die Schüler sitzen auf der Mauer vor der Schule und machen ihre Hausaufgaben.", "is_phrase": false, "pos": "Substantiv, feminin"}, "meldete": {"def": "Die Hand heben oder etwas sagen, um die Aufmerksamkeit des Lehrers zu bekommen. Man macht das im Unterricht, wenn man eine Frage stellen oder antworten möchte.", "example": "Lisa meldete sich schnell, als der Lehrer eine Frage stellte.", "is_phrase": true, "pos": "Verb"}, "menschen": {"def": "Personen oder Leute allgemein. Das Wort wird hier verwendet, um über andere Personen zu sprechen.", "example": "In der Stadt sieht man viele verschiedene Menschen.", "is_phrase": false, "pos": "Substantiv"}, "merkte": {"def": "Mit den Sinnen wahrnehmen oder beobachten, dass etwas passiert. Man sieht, hört oder spürt etwas und wird sich dessen bewusst.", "example": "Sie merkte, dass ihr Kollege nervös wurde, als das Telefon klingelte.", "is_phrase": false, "pos": "Verb"}, "mittendurch": {"def": "durch die Mitte von etwas hindurch; so, dass etwas in der Mitte geteilt wird", "example": "Sie ließ sich die Zunge mittendurch piercen, also genau in der Mitte.", "is_phrase": false, "pos": "Adverb"}, "mochte": {"def": "Das ist die Vergangenheitsform von 'mögen'. Es bedeutet: jemanden oder etwas nicht gern haben oder sympathisch finden.", "example": "Er mochte seinen neuen Kollegen von Anfang an nicht.", "is_phrase": false, "pos": "Verb"}, "murmelte": {"def": "sehr leise und undeutlich sprechen, oft weil man unsicher ist oder nicht will, dass andere es hören", "example": "Er murmelte eine Entschuldigung, weil er sich schämte.", "is_phrase": false, "pos": "Verb"}, "musste": {"def": "Drückt hier eine rhetorische Frage aus, die bedeutet: Welche Art von Person würde so etwas Schreckliches tun? Es zeigt Unverständnis über die psychische Verfassung einer Person.", "example": "Wie krank musste jemand sein, um so etwas zu tun?", "is_phrase": false, "pos": "Modalverb"}, "mädchenschwarm": {"def": "Ein Junge oder junger Mann, in den viele Mädchen verliebt sind oder den sie sehr attraktiv finden. Er ist bei Mädchen sehr beliebt und begehrt.", "example": "Tom war der Mädchenschwarm der ganzen Schule - alle Mädchen wollten mit ihm tanzen.", "is_phrase": false, "pos": "Substantiv"}, "möglich": {"def": "Das bedeutet: jemand kann Dinge schaffen oder erreichen, die normalerweise schwer sind. Die Person löst Probleme und macht Träume wahr.", "example": "Sarah kann gleichzeitig studieren und arbeiten - sie macht's möglich.", "is_phrase": true, "pos": "Redewendung"}, "mögliche": {"def": "Diese Wendung bedeutet: viele verschiedene Dinge sind denkbar oder es gibt viele unterschiedliche Optionen. Man sagt das, wenn man nicht genau weiß, was passiert ist oder passieren könnte.", "example": "Was ist in der Schachtel? Das kann alles Mögliche sein - Bücher, Kleidung oder Spielzeug.", "is_phrase": true, "pos": "Phrase"}, "mühe": {"def": "Wenn man sich Mühe gibt, arbeitet man sehr sorgfältig und investiert viel Zeit und Energie in etwas. Man strengt sich besonders an, um ein gutes Ergebnis zu bekommen.", "example": "Sie hat sich viel Mühe mit dem Kuchen gegeben und drei Stunden gebacken.", "is_phrase": true, "pos": "Redewendung"}, "müssen": {"def": "Drückt aus, dass etwas nötig oder verpflichtend ist. Man hat keine andere Wahl und ist dazu verpflichtet, etwas zu tun.", "example": "Ich muss heute zum Arzt gehen, weil ich krank bin.", "is_phrase": false, "pos": "Modalverb"}, "nachdachte": {"def": "intensiv über etwas denken und es sich durch den Kopf gehen lassen. Man denkt konzentriert über ein Problem oder eine Situation nach.", "example": "Er nachdachte lange über die schwierige Entscheidung.", "is_phrase": false, "pos": "Verb"}, "nein": {"def": "Ein Ausruf, der Ablehnung oder Ungläubigkeit ausdrückt. Man sagt es, wenn man etwas nicht glauben kann oder will.", "example": "Nein, das ist unmöglich!", "is_phrase": false, "pos": "Interjektion"}, "nickte": {"def": "Den Kopf nach unten und oben bewegen, um zu zeigen, dass man ja sagt oder zustimmt. Man macht das oft, wenn man nicht sprechen möchte oder kann.", "example": "Als ich fragte, ob alles in Ordnung ist, nickte sie nur stumm.", "is_phrase": false, "pos": "Verb"}, "nie": {"def": "Das Wort bedeutet 'zu keiner Zeit' oder 'nicht ein einziges Mal'. Es drückt aus, dass etwas überhaupt nicht passiert oder nicht der Fall ist.", "example": "Ich habe nie Angst vor Prüfungen.", "is_phrase": false, "pos": "Adverb"}, "nutzte": {"def": "Eine günstige Situation oder einen passenden Moment verwenden, um etwas zu tun. Man macht etwas in einem Moment, wo es besonders gut möglich ist.", "example": "Sie nutzte die Pause, um schnell ihre Freundin anzurufen.", "is_phrase": false, "pos": "Verb"}, "nötig": {"def": "Man braucht etwas oder muss etwas haben. Es ist notwendig oder erforderlich.", "example": "Die Jacke ist warm genug, ich habe keinen Schal nötig.", "is_phrase": false, "pos": "Adjektiv"}, "ohnehin": {"def": "bedeutet 'sowieso' oder 'bereits von sich aus'. Es drückt aus, dass etwas schon vorher so war, auch ohne zusätzliche Einflüsse.", "example": "Das Zimmer ist ohnehin zu klein, und mit den vielen Möbeln wirkt es noch enger.", "is_phrase": false, "pos": "Adverb"}, "okay": {"def": "Eine Frage, ob etwas in Ordnung oder gut genug ist. Man fragt damit, ob die andere Person mit etwas zufrieden ist.", "example": "Ist die Temperatur so okay für dich?", "is_phrase": false, "pos": "Adverb"}, "paar": {"def": "Eine kleine, unbestimmte Anzahl von etwas. Man verwendet es, wenn man nicht genau sagen will oder kann, wie viele es sind.", "example": "Ich habe ein paar Freunde eingeladen.", "is_phrase": false, "pos": "Artikel"}, "passierte": {"def": "Etwas Ungewolltes oder Gefährliches geschieht mit jemandem. Man benutzt es oft für Unfälle oder schlechte Ereignisse.", "example": "Ich hoffe, dass meiner Tochter nichts passiert, wenn sie allein nach Hause geht.", "is_phrase": false, "pos": "Verb"}, "pausbäckchen": {"def": "Dicke, runde Wangen, die jemand kindlich aussehen lassen. Man sagt das oft über Menschen, die ein junges, unschuldiges Gesicht haben.", "example": "Mit ihren rosa Pausbäckchen sah die junge Frau aus wie ein kleines Mädchen.", "is_phrase": false, "pos": "Substantiv (Plural)"}, "pause": {"def": "Eine Zeit zwischen den Schulstunden, in der die Schüler nicht im Unterricht sind. In dieser Zeit können sie sich ausruhen, spielen oder mit Freunden sprechen.", "example": "In der großen Pause gehen alle Schüler auf den Schulhof.", "is_phrase": false, "pos": "Substantiv, feminin"}, "pflückte": {"def": "etwas vorsichtig mit den Fingern wegziehen oder zur Seite schieben. Man macht das oft bei Haaren, die im Gesicht hängen.", "example": "Sie pflückte sich die Haare aus dem Gesicht, weil sie störten.", "is_phrase": false, "pos": "Verb"}, "piercen": {"def": "Ein kleines Loch in einen Körperteil machen, um dort Schmuck hineinzustecken. Das macht man meist bei den Ohren, der Nase oder der Zunge.", "example": "Viele Jugendliche lassen sich die Ohren piercen, um Ohrringe zu tragen.", "is_phrase": false, "pos": "Verb"}, "pladderten": {"def": "Ein Geräusch machen, wenn Regentropfen gegen etwas schlagen. Es ist ein sanftes, rhythmisches Klopfen von vielen kleinen Wassertropfen.", "example": "Die Regentropfen pladderten die ganze Nacht gegen das Dachfenster.", "is_phrase": false, "pos": "Verb"}, "plastik": {"def": "Ein künstliches Material, das aus Chemikalien hergestellt wird und für viele Gegenstände verwendet wird. Es ist leicht, kann verschiedene Formen haben und geht nicht kaputt wie Glas.", "example": "Die Flasche ist aus Plastik und nicht aus Glas.", "is_phrase": false, "pos": "Substantiv"}, "platzwahl": {"def": "Die Entscheidung, wo man sich hinsetzt oder hinstellt. Man überlegt sich gut, welcher Platz der beste ist.", "example": "Bei der Prüfung war mir die Platzwahl wichtig - ich wollte nicht direkt vor dem Lehrer sitzen.", "is_phrase": false, "pos": "Substantiv"}, "plötzlich": {"def": "Auf einmal, ohne Warnung, sehr schnell und unerwartet. Etwas passiert von einem Moment zum anderen.", "example": "Plötzlich begann es zu regnen, obwohl der Himmel klar war.", "is_phrase": false, "pos": "Adverb"}, "poliert": {"def": "Durch häufiges Reiben glatt und glänzend gemacht. Die Oberfläche wird durch Berührung oder Gebrauch immer glatter.", "example": "Die Türklinke war vom vielen Anfassen blank poliert.", "is_phrase": false, "pos": "Partizip/Adjektiv"}, "polsterung": {"def": "Extra Material oder Stoff, das man unter die Kleidung legt, um die Körperform zu verändern oder zu verstärken. Hier bedeutet es, dass die Schultern natürlich breit und stark sind.", "example": "Seine Jacke brauchte keine Polsterung in den Schultern, weil er von Natur aus athletisch gebaut war.", "is_phrase": false, "pos": "Substantiv, feminin"}, "positionieren": {"def": "einen bestimmten Platz wählen und sich dort hinsetzen oder hinstellen, weil dieser Ort Vorteile hat", "example": "Im Theater positionierte sie sich in der ersten Reihe, um alles gut sehen zu können.", "is_phrase": false, "pos": "Verb"}, "quatschend": {"def": "sich unterhaltend, redend. Beschreibt Personen, die gerade sprechen oder ein Gespräch führen.", "example": "Die Schüler standen quatschend vor dem Schulgebäude und unterhielten sich über das Wochenende.", "is_phrase": false, "pos": "Partizip I (als Adjektiv verwendet)"}, "raunte": {"def": "jemandem etwas leise und heimlich ins Ohr sagen, so dass andere es nicht hören können", "example": "Sie raunte mir zu: 'Pass auf, der Chef kommt!'", "is_phrase": false, "pos": "Verb"}, "rechnungen": {"def": "Mathematische Aufgaben, bei denen man mit Zahlen rechnet. Man löst sie durch Addition, Subtraktion, Multiplikation oder Division.", "example": "Der Schüler saß am Schreibtisch und löste seine Mathematik-Rechnungen für die Hausaufgaben.", "is_phrase": false, "pos": "Substantiv"}, "recht": {"def": "bedeutet, dass jemand die Wahrheit sagt oder eine richtige Meinung hat", "example": "Du hast recht - wir sollten früher gehen, sonst verpassen wir den Zug.", "is_phrase": true, "pos": "Nomen"}, "redeten": {"def": "Hier bedeutet es: Alle sprechen zur gleichen Zeit und man kann niemanden richtig verstehen. Es ist laut und chaotisch.", "example": "Nach dem Unfall redeten alle Zeugen durcheinander und die Polizei musste um Ruhe bitten.", "is_phrase": true, "pos": "Verb"}, "regentropfen": {"def": "Kleine Wassertropfen, die vom Himmel fallen, wenn es regnet. Sie entstehen in den Wolken und fallen zur Erde.", "example": "Die Regentropfen klopften laut an das Fenster.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "reicht": {"def": "Es ist genug oder ausreichend. Man braucht nicht mehr zu tun.", "example": "Es reicht, wenn du mir kurz hilfst - du musst nicht den ganzen Tag bleiben.", "is_phrase": false, "pos": "Verb"}, "reihe": {"def": "Eine Linie von Sitzplätzen hintereinander, zum Beispiel in einem Klassenzimmer, Theater oder Kino. Die erste Reihe ist ganz vorn, die letzte Reihe ist ganz hinten.", "example": "In der ersten Reihe kann man die Tafel sehr gut sehen.", "is_phrase": false, "pos": "Substantiv, feminin"}, "rest": {"def": "alle anderen Personen oder Dinge in einer Gruppe, außer der Person oder Sache, von der man spricht", "example": "Peter war krank, aber der Rest der Familie war gesund.", "is_phrase": false, "pos": "Substantiv, maskulin"}, "rettung": {"def": "etwas, das eine Person aus einer schwierigen oder unangenehmen Situation befreit. Hier bedeutet es: die Durchsage hat geholfen, ein Problem zu lösen oder eine schlechte Lage zu beenden.", "example": "Das Telefon klingelte genau im richtigen Moment - es war meine Rettung vor dem langweiligen Gespräch.", "is_phrase": false, "pos": "Substantiv"}, "richtige": {"def": "Bedeutet hier: echte, wahre, perfekte. Wird verwendet, um zu betonen, dass etwas genau so ist, wie es sein soll.", "example": "Das sind richtige Berge, nicht nur kleine Hügel.", "is_phrase": false, "pos": "Adjektiv"}, "richtung": {"def": "Die Seite oder der Bereich, wo sich jemand befindet. Wenn man in jemandes Richtung schaut, blickt man zu der Person hin.", "example": "Die Lehrerin schaute in meine Richtung, als sie die Frage stellte.", "is_phrase": false, "pos": "Substantiv"}, "rief": {"def": "Etwas laut sagen oder schreien. Man benutzt es, wenn jemand mit lauter Stimme spricht.", "example": "\"Komm sofort her!\", rief die Mutter ihrem Kind zu.", "is_phrase": false, "pos": "Verb"}, "rosa": {"def": "Eine helle rötliche Farbe, wie sie oft bei gesunden, jungen Wangen zu sehen ist. Die Farbe macht das Gesicht frisch und kindlich.", "example": "Das kleine Mädchen hatte rosa Wangen vom Spielen im Schnee.", "is_phrase": false, "pos": "Adjektiv"}, "ruhe": {"def": "Ein Befehl, mit dem man anderen sagt, dass sie still sein und nicht sprechen sollen. Man ruft das, wenn es zu laut ist oder wenn man Stille braucht.", "example": "Der Lehrer rief \"Ruhe!\" als die Schüler zu laut wurden.", "is_phrase": false, "pos": "Ausruf"}, "ruhig": {"def": "Man soll sich normal verhalten und nichts Besonderes machen. Man soll nicht nervös werden oder Probleme machen.", "example": "Bleibt ruhig und wartet, bis der Lehrer zurückkommt.", "is_phrase": false, "pos": "Adjektiv"}, "rum": {"def": "herum; in eine Drehbewegung oder um etwas herum. Das Wort wird oft am Ende von Verben der Bewegung verwendet.", "example": "Sie drehte den Deckel vom Marmeladenglas rum, um es zu öffnen.", "is_phrase": false, "pos": "Adverb"}, "runder": {"def": "Beschreibt eine Form, die wie ein Kreis aussieht, ohne Ecken und gleichmäßig gebogen. Hier: Die Augen wirken durch die Brille größer und kreisförmiger.", "example": "Mit der neuen Brille sehen ihre Augen viel runder aus als normal.", "is_phrase": false, "pos": "Adjektiv"}, "sackte": {"def": "Plötzlich schwach werden und körperlich in sich zusammenfallen, oft durch Schreck, Angst oder Erschöpfung. Der Körper wird schlaff und die Person kann nicht mehr gerade stehen.", "example": "Nach der schlechten Nachricht sackte sie zusammen und musste sich setzen.", "is_phrase": true, "pos": "Verb"}, "sag": {"def": "Eine Aufforderung an jemanden, etwas zu sprechen oder zu antworten. Wird verwendet, wenn man möchte, dass die andere Person nicht schweigt.", "example": "Sag doch mal deine Meinung zu diesem Problem!", "is_phrase": false, "pos": "Imperativ"}, "sagte": {"def": "Vergangenheitsform von 'sagen'. Zeigt an, dass jemand Worte gesprochen hat.", "example": "Er sagte mir gestern die Wahrheit.", "is_phrase": false, "pos": "Verb"}, "sah": {"def": "Präteritum von 'sehen' - etwas mit den Augen wahrnehmen oder bemerken. Beschreibt eine abgeschlossene Handlung in der Vergangenheit.", "example": "Sie sah ihren Bruder am Fenster stehen und winkte ihm zu.", "is_phrase": false, "pos": "Verb"}, "sakko": {"def": "Ein elegantes Kleidungsstück für Männer, das wie eine Jacke aussieht und meist zu formellen Anlässen getragen wird. Es ist weniger förmlich als ein Anzug und wird oft über einem Hemd getragen.", "example": "Zu der Hochzeit zog er ein weißes Hemd und ein schwarzes Sakko an.", "is_phrase": false, "pos": "Substantiv, das"}, "saß": {"def": "Vergangenheitsform von 'sitzen': sich auf einem Stuhl oder an einem Platz befinden. Man hat eine Position eingenommen und ist dort geblieben.", "example": "Sie saß den ganzen Abend auf dem Sofa und las ein Buch.", "is_phrase": false, "pos": "Verb"}, "scheibe": {"def": "Eine dünne, flache Platte aus Glas, die man zum Beispiel in Fenstern oder Türen findet. Durch eine Scheibe kann man hindurchsehen.", "example": "Der Ball flog gegen die Scheibe des Küchenfensters.", "is_phrase": false, "pos": "Substantiv, feminin"}, "scheiße": {"def": "Ein vulgärer Ausruf, den man verwendet, wenn man sich ärgert oder wenn etwas schiefgeht. Drückt Frustration und Enttäuschung aus.", "example": "Scheiße, ich habe meinen Schlüssel vergessen und kann nicht in die Wohnung!", "is_phrase": false, "pos": "Ausruf"}, "schlenderte": {"def": "langsam und entspannt gehen, ohne Eile und ohne bestimmtes Ziel. Man geht gemütlich hin und her oder umher.", "example": "Am Sonntagmorgen schlenderte sie durch die Innenstadt und schaute sich die Schaufenster an.", "is_phrase": false, "pos": "Verb"}, "schließt": {"def": "Eine Tür oder ein Fenster zumachen und mit einem Schlüssel absperren, so dass andere nicht hineinkommen können. Man dreht den Schlüssel im Schloss herum.", "example": "Bevor sie das Haus verlässt, schließt sie immer die Haustür ab.", "is_phrase": false, "pos": "Verb"}, "schnell": {"def": "sofort, ohne zu warten oder zu zögern. Man macht etwas direkt in diesem Moment.", "example": "Als der Lehrer hereinkam, setzte ich mich schnell auf meinen Platz.", "is_phrase": false, "pos": "Adverb"}, "schreiben": {"def": "eine Prüfung oder Test vollständig bearbeiten und alle Aufgaben beantworten. Man macht die Klausur fertig.", "example": "Die Studenten hatten nur zwei Stunden Zeit, um die Klausur zu Ende zu schreiben.", "is_phrase": true, "pos": "Verb"}, "schrill": {"def": "Ein Lachen oder eine Stimme, die sehr hoch und oft unangenehm oder scharf klingt. Man hört es oft, wenn jemand nervös ist oder sich sehr freut.", "example": "Sie lachte schrill vor Aufregung, als sie die gute Nachricht hörte.", "is_phrase": false, "pos": "Adjektiv"}, "schritte": {"def": "Eine Bewegung mit dem Fuß beim Gehen. Wenn man geht, macht man mehrere Schritte nacheinander.", "example": "Sie machte drei Schritte nach vorn und blieb dann stehen.", "is_phrase": false, "pos": "Substantiv"}, "schultern": {"def": "Der obere Teil des Körpers zwischen Hals und Armen. An den Schultern tragen wir Kleidung wie Jacken oder T-Shirts.", "example": "Seine breiten Schultern zeigten, dass er viel Sport machte.", "is_phrase": false, "pos": "Substantiv"}, "schulterpolster": {"def": "Dicke Kissen aus Stoff oder anderen Materialien, die in Jacken oder Mäntel eingenäht werden, damit die Schultern breiter und stärker aussehen. Sie waren besonders in den 1980er Jahren sehr beliebt.", "example": "Die Jacke mit den großen Schulterpolstern machte sie breiter, als sie wirklich war.", "is_phrase": false, "pos": "Substantiv, Plural"}, "schwappte": {"def": "sich wellenförmig und fließend bewegen, wie Wasser oder andere weiche Dinge. Hier: die Haare fallen sanft und wellig herunter.", "example": "Als sie den Kopf schüttelte, schwappten ihre langen Locken hin und her.", "is_phrase": false, "pos": "Verb"}, "schwer": {"def": "mit Mühe und Anstrengung, nicht leicht oder normal. Zeigt, dass eine Handlung schwierig oder anstrengend ist.", "example": "Nach dem langen Lauf stand er schwer atmend am Ziel.", "is_phrase": false, "pos": "Adverb"}, "schwerwiegendes": {"def": "Sehr ernst und gefährlich, mit schlimmen Folgen. Etwas, das große Probleme oder Schäden verursachen kann.", "example": "Der Arzt fand eine schwerwiegende Krankheit bei dem Patienten.", "is_phrase": false, "pos": "Adjektiv"}, "schwören": {"def": "sehr sicher versprechen oder beteuern, dass etwas wahr ist. Man sagt das, wenn man absolut überzeugt ist und andere das auch glauben sollen.", "example": "Ich kann dir schwören, dass ich pünktlich da bin.", "is_phrase": false, "pos": "Verb"}, "schüler": {"def": "Kinder und Jugendliche, die eine Schule besuchen und dort lernen. Sie gehen jeden Tag in die Schule und haben Unterricht in verschiedenen Fächern.", "example": "Die Schüler stehen in der Pause zusammen auf dem Schulhof.", "is_phrase": false, "pos": "Substantiv"}, "sechs": {"def": "Das bedeutet: es ist vorbei, fertig, nichts mehr da. Man sagt das, wenn etwas definitiv zu Ende ist.", "example": "Nach dem Streit sagte er nur: 'Sechs, aus, Ende' und verließ das Zimmer.", "is_phrase": true, "pos": "Redewendung"}, "seid": {"def": "2. Person Plural von 'sein' im Imperativ. Man verwendet es, um einer Gruppe von Personen einen Befehl oder eine Aufforderung zu geben.", "example": "Seid bitte leise während der Prüfung!", "is_phrase": false, "pos": "Verb"}, "sekunde": {"def": "Ein sehr kurzer Moment oder Zeitraum. Wird oft verwendet, um zu zeigen, dass etwas überhaupt nicht oder nur ganz kurz passiert.", "example": "Er hat keine Sekunde gezögert und sofort geholfen.", "is_phrase": false, "pos": "Substantiv, f"}, "selbstsicher": {"def": "Wenn man selbstsicher ist, hat man Vertrauen in sich selbst und wirkt stark und ruhig. Man zeigt keine Ang
