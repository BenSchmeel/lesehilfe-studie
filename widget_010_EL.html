<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --panel-bg:#2c2420;--panel-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
    --panel-width:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}

  /* ── Layout: Text links, Panel rechts ── */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1060px;
    margin:0 auto;
    padding:24px 16px 60px;
    gap:20px;
  }
  .main{flex:1;min-width:0;}

  /* ── Erklärungsleiste rechts ── */
  .panel{
    width:var(--panel-width);
    flex-shrink:0;
    position:sticky;
    top:20px;
    background:var(--panel-bg);
    border-radius:8px;
    padding:18px 16px;
    color:var(--panel-text);
    font-size:.88rem;
    line-height:1.65;
    min-height:180px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    transition:opacity .2s;
  }
  .panel-empty{
    opacity:.45;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.82rem;
    color:#9e8a78;
    min-height:120px;
  }
  .panel-content{display:none;}
  .panel-content.visible{display:block;}
  .p-badge{
    display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
    border-radius:3px;padding:1px 7px;margin-bottom:8px;letter-spacing:.04em;
  }
  .p-word{
    font-family:'Lora',serif;font-weight:600;font-size:1.05rem;
    color:#f0d9b8;display:block;margin-bottom:3px;
  }
  .p-pos{
    font-size:.72rem;color:#9e8a78;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:8px;
  }
  .p-def{color:#d4c9be;display:block;}
  .p-ex{
    margin-top:10px;font-style:italic;font-size:.82rem;color:#8a7a6e;
    border-top:1px solid rgba(255,255,255,.08);padding-top:9px;display:block;
  }

  /* ── Hinweis oben ── */
  .hint{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;
    padding:9px 14px;background:var(--accent-light);
    border-radius:4px;border-left:3px solid var(--accent);
  }

  /* ── Textbox ── */
  .text-box{
    background:white;border:1px solid var(--border);border-radius:4px;
    padding:32px 36px;line-height:2.05;font-family:'Lora',serif;
    font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04);
  }

  /* ── Anklickbare Wörter ── */
  .w{
    cursor:pointer;border-bottom:1px dotted var(--accent);
    border-radius:2px;padding:0 1px;transition:background .15s;display:inline;
  }
  .w:hover{background:var(--accent-light);}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent);}
  .w.active{background:var(--accent);color:white;border-bottom-color:transparent;}
  .w.phrase{border-bottom:2px dashed #b07d50;}
  .w.phrase.seen{border-bottom-color:#c9956a;}
  .w.phrase.active{background:var(--accent);color:white;}

  /* ── Legende ── */
  .legend{
    margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-size:.76rem;color:var(--ink-soft);
  }
  .leg-item{display:flex;align-items:center;gap:5px;}

  @media(max-width:700px){
    .layout{flex-direction:column;}
    .panel{width:100%;position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Linke Spalte: Text -->
  <div class="main">
    <div class="hint">
      Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> – die Erklärung erscheint rechts.
      &nbsp;<span style="border-bottom:2px dashed #b07d50;padding:0 2px">Gestrichelt</span> = Redewendung.
    </div>
    <div class="text-box" id="tb"></div>
    <div class="legend">
      <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 3px">Wort</span>&nbsp;erklärtes Wort</span>
      <span class="leg-item"><span style="border-bottom:2px dashed #b07d50;padding:0 3px">Phrase</span>&nbsp;Redewendung</span>
      <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 3px">farbig</span>&nbsp;bereits nachgeschlagen</span>
    </div>
  </div>

  <!-- Rechte Spalte: Erklärungsleiste -->
  <div class="panel" id="panel">
    <div class="panel-empty" id="panelEmpty">
      ← Klicken Sie auf ein unterstrichenes Wort
    </div>
    <div class="panel-content" id="panelContent">
      <span class="p-badge" id="pBadge" style="display:none">Redewendung</span>
      <span class="p-word" id="pWord"></span>
      <span class="p-pos"  id="pPos"></span>
      <span class="p-def"  id="pDef"></span>
      <span class="p-ex"   id="pEx" style="display:none"></span>
    </div>
  </div>

</div>
<script>
const DICT = {"abgeleckt": {"def": "Mit der Zunge über etwas fahren und dabei feucht machen. Tiere wie Hunde machen das oft, um Zuneigung zu zeigen.", "example": "Der Hund hat seinem Besitzer die Hand abgeleckt, als er nach Hause kam.", "is_phrase": false, "pos": "Verb"}, "abschied": {"def": "Das Weggehen oder die Trennung von einer Person oder einem Ort, oft für immer. Ein trauriger Moment, wenn man sich von jemandem verabschiedet.", "example": "Zum Abschied von der Schule bekam sie von ihren Mitschülern ein schönes Buch geschenkt.", "is_phrase": false, "pos": "Substantiv"}, "altes": {"def": "nicht neu, schon länger im Besitz; das Auto, das er schon seit einiger Zeit hat", "example": "Sie zog in ihre alte Wohnung zurück, weil sie sich dort wohler fühlte.", "is_phrase": false, "pos": "Adjektiv"}, "anfasse": {"def": "jemanden auf eine sexuelle Art berühren, besonders wenn es gegen den Willen der Person ist oder wenn es sich um Kinder handelt", "example": "Der Mann wurde verhaftet, weil er Kinder angefasst hatte.", "is_phrase": false, "pos": "Verb"}, "angeguckt": {"def": "Den Blick auf jemanden richten und ihn ansehen. Es bedeutet, dass man eine Person mit den Augen betrachtet.", "example": "Sie war so schüchtern, dass sie ihren Lehrer nicht angeguckt hat.", "is_phrase": false, "pos": "Verb"}, "antwort": {"def": "Eine Reaktion oder ein Kommentar auf eine Frage oder eine Bitte. Man gibt eine Antwort, wenn jemand etwas von einem wissen möchte.", "example": "Der Chef wartet noch auf meine Antwort zu seinem Vorschlag.", "is_phrase": false, "pos": "Substantiv"}, "arm": {"def": "Der Körperteil zwischen Schulter und Hand, mit dem man Dinge halten und tragen kann. Hier trägt die Person wahrscheinlich ein Tier oder Kind namens Ozzy.", "example": "Die Mutter nahm das Baby auf den Arm und wiegte es sanft.", "is_phrase": false, "pos": "Substantiv"}, "armreifen": {"def": "Ein Schmuckstück aus Metall, das man um das Handgelenk trägt. Es ist meist rund und fest, ohne Verschluss.", "example": "Sie trug mehrere goldene Armreifen an beiden Armen.", "is_phrase": false, "pos": "Substantiv"}, "aufreißt": {"def": "Wenn sich die Wolken plötzlich teilen und ein Stück blauer Himmel sichtbar wird. Das passiert oft nach Regen oder bei bewölktem Wetter.", "example": "Nach dem Gewitter riss der Himmel auf und wir konnten endlich wieder die Sonne sehen.", "is_phrase": false, "pos": "Verb"}, "aufzuhalten": {"def": "jemanden davon abhalten, etwas zu tun oder irgendwohin zu gehen; jemanden stoppen oder zurückhalten", "example": "Die Polizei konnte den Mann aufhalten, bevor er das Gebäude verließ.", "is_phrase": false, "pos": "Verb"}, "augen": {"def": "Die beiden Körperteile im Gesicht, mit denen man sehen kann. Sie haben eine bestimmte Farbe und Größe.", "example": "Der Mann hat braune Augen und schaut freundlich.", "is_phrase": false, "pos": "Substantiv"}, "aussah": {"def": "Das ist die Vergangenheitsform von 'aussehen'. Es bedeutet: welches Erscheinungsbild oder welchen Ausdruck jemand oder etwas zu einem bestimmten Zeitpunkt in der Vergangenheit hatte.", "example": "Sie fragte sich, wie ihre Mutter als junge Frau aussah.", "is_phrase": false, "pos": "Verb"}, "aussieht": {"def": "Diese Phrase bedeutet: etwas hat das Erscheinungsbild von etwas anderem, es wirkt so oder scheint so zu sein. Man verwendet es, wenn man etwas beschreibt, das einem anderen Ding sehr ähnlich ist.", "example": "Das Gebäude sieht aus wie ein Schloss, aber es ist nur ein Hotel.", "is_phrase": true, "pos": "Redewendung"}, "auto": {"def": "Ein Fahrzeug mit vier Rädern, das mit einem Motor fährt und Menschen oder Sachen transportiert. Man kann damit von einem Ort zum anderen fahren.", "example": "Morgens fahre ich mit dem Auto zur Arbeit.", "is_phrase": false, "pos": "Substantiv"}, "bald": {"def": "in kurzer Zeit, nicht mehr lange warten müssen. Das bedeutet: in den nächsten Minuten oder Stunden.", "example": "Der Zug kommt bald, wir müssen nur noch fünf Minuten warten.", "is_phrase": false, "pos": "Adverb"}, "band": {"def": "Eine Gruppe von Musikern, die zusammen Musik macht und Konzerte gibt. Sie spielen oft Rock, Pop oder Jazz.", "example": "Die Band hat ein neues Lied aufgenommen und spielt nächste Woche im Stadtpark.", "is_phrase": false, "pos": "Substantiv"}, "beschissenes": {"def": "Ein sehr derbes Wort, das ausdrückt, dass etwas sehr schlecht, unangenehm oder störend ist. Es ist eine vulgäre Verstärkung von 'schlecht' oder 'furchtbar'.", "example": "Nach dem Streit herrschte eine beschissene Stimmung im Raum.", "is_phrase": false, "pos": "Adjektiv"}, "bestimmt": {"def": "drückt aus, dass man sehr sicher ist, dass etwas so ist oder passiert ist. Man hat keine Zweifel daran.", "example": "Er kommt heute bestimmt zu spät, er ist immer unpünktlich.", "is_phrase": false, "pos": "Adverb"}, "bett": {"def": "Ein Möbelstück zum Schlafen und Liegen mit einer weichen Matratze. Man liegt oder sitzt darauf, um sich auszuruhen.", "example": "Die Katze springt auf das Bett und macht es sich gemütlich.", "is_phrase": false, "pos": "Substantiv"}, "bewegt": {"def": "Eine Körperposition ändern oder den Körper von einer Stelle zur anderen bewegen. Das kann zum Beispiel sein: aufstehen, sich umdrehen, die Hand heben oder einen Schritt machen.", "example": "Im Theater darf man sich nicht bewegen, sonst stört man die anderen Zuschauer.", "is_phrase": false, "pos": "Verb"}, "bezahlt": {"def": "Geld für eine Arbeit oder Leistung geben. Man gibt einer Person Geld, damit sie etwas für einen macht.", "example": "Der Chef bezahlt seinen Angestellten jeden Monat das Gehalt.", "is_phrase": false, "pos": "Verb"}, "bild": {"def": "Eine Erinnerung oder Vorstellung im Kopf von etwas, was man gesehen hat. Es ist wie ein Foto in den Gedanken.", "example": "Ich habe noch ein deutliches Bild von meinem ersten Schultag im Kopf.", "is_phrase": false, "pos": "Substantiv"}, "bitten": {"def": "Jemanden höflich fragen, etwas zu tun oder nicht zu tun. Man möchte, dass die andere Person etwas macht, aber man befiehlt es nicht.", "example": "Sie bat ihren Bruder, ihr bei den Hausaufgaben zu helfen.", "is_phrase": false, "pos": "Verb"}, "bleiben": {"def": "An einem Ort nicht weggehen. Da sein und nicht verlassen.", "example": "Kannst du heute Abend bei mir bleiben?", "is_phrase": false, "pos": "Verb"}, "bleibt": {"def": "Wo jemand bleibt bedeutet: warum jemand noch nicht da ist oder warum jemand so lange braucht. Man fragt sich, wo die Person ist und wann sie endlich kommt.", "example": "Wir warten schon eine Stunde auf Paul - wo er nur bleibt?", "is_phrase": true, "pos": "Redewendung"}, "blieben": {"def": "Das ist die Vergangenheitsform von 'bleiben'. Es bedeutet: an einem Ort sein und nicht weggehen.", "example": "Wegen des Regens blieben wir den ganzen Tag zu Hause.", "is_phrase": false, "pos": "Verb"}, "blättert": {"def": "Die Seiten von Papieren oder Dokumenten umdrehen und durchschauen, um etwas zu suchen oder zu finden.", "example": "Der Student blättert in seinem Buch, um die richtige Seite zu finden.", "is_phrase": false, "pos": "Verb"}, "braune": {"def": "Eine Farbe, die dunkel ist wie Schokolade oder Holz. Haare in dieser Farbe sind dunkler als blonde Haare, aber heller als schwarze Haare.", "example": "Mein Bruder hat braune Augen und braune Haare.", "is_phrase": false, "pos": "Adjektiv"}, "braunen": {"def": "Eine Farbe, die dunkel ist wie Erde oder Holz. Die Farbe ist zwischen schwarz und orange.", "example": "Der braune Mantel passt gut zu ihren braunen Haaren.", "is_phrase": false, "pos": "Adjektiv"}, "cowboystiefel": {"def": "Hohe Stiefel aus Leder, die typisch für amerikanische Cowboys sind. Sie haben oft einen kleinen Absatz und eine spitze Form.", "example": "Er kaufte sich schwarze Cowboystiefel für das Western-Festival.", "is_phrase": false, "pos": "Substantiv"}, "dachte": {"def": "Vergangenheitsform von 'denken'. Bedeutet: eine Meinung haben oder glauben, dass etwas so ist.", "example": "Ich dachte, dass das Geschäft heute geschlossen ist, aber es war offen.", "is_phrase": false, "pos": "Verb"}, "daniel": {"def": "Daniel ist ein männlicher Vorname. In diesem Text ist Daniel der Name einer Person, die mit einer Frau (wahrscheinlich Frau Stenzer) spricht.", "example": "Daniel geht heute zum Arzt.", "is_phrase": false, "pos": "Eigenname"}, "decke": {"def": "Ein großes Stück Stoff, das man über sich legt, um warm zu bleiben, besonders im Bett oder auf dem Sofa.", "example": "Ich hole mir eine warme Decke, weil mir kalt ist.", "is_phrase": false, "pos": "Substantiv"}, "denke": {"def": "Mit dem Kopf arbeiten, sich Gedanken machen oder eine Meinung haben. Kann auch bedeuten, dass man an jemanden oder etwas denkt.", "example": "Ich denke, dass das Wetter morgen schön wird.", "is_phrase": false, "pos": "Verb"}, "denken": {"def": "Mit dem Kopf arbeiten, um Probleme zu lösen oder Entscheidungen zu treffen. Konzentriert nachdenken und überlegen.", "example": "Nach dem lauten Konzert konnte ich nicht mehr klar denken.", "is_phrase": false, "pos": "Verb"}, "denkst": {"def": "Mit dem Kopf über eine Person nachdenken oder sie in Gedanken haben. Man stellt sich vor, wie diese Person ist oder was sie macht.", "example": "Wenn ich traurig bin, denke ich an meine Großmutter.", "is_phrase": false, "pos": "Verb"}, "draußen": {"def": "außerhalb des Hauses oder Gebäudes, im Freien. Das Gegenteil von 'drinnen'.", "example": "Es regnet draußen, deshalb bleiben wir im Haus.", "is_phrase": false, "pos": "Adverb"}, "eigentlich": {"def": "Wird in Fragen verwendet, um höflich nach Information zu fragen, die man haben möchte oder sollte. Macht die Frage weniger direkt und zeigt Interesse.", "example": "Wie heißt du eigentlich? Wir haben uns noch gar nicht richtig vorgestellt.", "is_phrase": false, "pos": "Adverb"}, "einfach": {"def": "drückt aus, dass etwas ohne besonderen Grund oder ohne Erklärung passiert; betont, dass die Situation überraschend oder unerwartet ist", "example": "Er ist einfach weggegangen, ohne etwas zu sagen.", "is_phrase": false, "pos": "Adverb"}, "einziges": {"def": "Benutzt man, um zu sagen, dass es nur eines gibt und nicht mehr. Es macht deutlich, dass etwas sehr wenig oder sehr selten ist.", "example": "Nach dem Unfall hatte sie nur eine einzige Erinnerung an den Abend.", "is_phrase": false, "pos": "Adjektiv"}, "endgültiges": {"def": "vollständig, total, absolut - wird hier verwendet, um das Geräusch sehr stark zu beschreiben. Es verstärkt das negative Adjektiv und bedeutet, dass das Geräusch komplett schrecklich war.", "example": "Das war ein endgültiges Chaos in der Küche nach dem Unfall.", "is_phrase": false, "pos": "Adjektiv"}, "erinnern": {"def": "Wenn man versucht, etwas aus der Vergangenheit wieder in den Kopf zu bekommen. Man denkt zurück und möchte sich an etwas erinnern, was früher passiert ist.", "example": "Sie konnte sich nicht mehr daran erinnern, wie ihr Lehrer hieß.", "is_phrase": true, "pos": "Redewendung"}, "erkläre": {"def": "Keine Erklärung verfügbar.", "example": "", "is_phrase": false, "pos": ""}, "ernst": {"def": "Auf eine Weise, die zeigt, dass man die Situation wichtig nimmt und nicht scherzt. Man spricht ruhig und konzentriert, ohne zu lächeln.", "example": "Der Arzt schaute mich ernst an und sagte, dass ich mehr Sport machen muss.", "is_phrase": false, "pos": "Adverb"}, "erzähl": {"def": "Mit Worten sagen, was man erlebt hat oder was man denkt. Man berichtet einer anderen Person etwas.", "example": "Die Mutter fragt ihr Kind: 'Erzähl mir, was heute in der Schule passiert ist!'", "is_phrase": false, "pos": "Verb"}, "erzählen": {"def": "Jemandem etwas mit Worten mitteilen, berichten oder sagen. Man spricht über Erlebnisse, Geschichten oder persönliche Dinge.", "example": "Der Vater erzählt seinem Sohn jeden Abend eine Geschichte vor dem Schlafen.", "is_phrase": false, "pos": "Verb"}, "erzählt": {"def": "jemandem eine Geschichte oder Information mit Worten mitteilen. Man spricht über etwas, was passiert ist oder was man weiß.", "example": "Mein Bruder hat mir erzählt, dass er nächste Woche umzieht.", "is_phrase": false, "pos": "Verb"}, "explosion": {"def": "Ein sehr starkes, plötzliches Gefühl von Schmerz oder Verwirrung im Kopf. Es fühlt sich an, als würde etwas im Kopf platzen oder explodieren.", "example": "Nach dem Unfall hatte sie eine Explosion im Kopf und konnte sich nicht mehr konzentrieren.", "is_phrase": false, "pos": "Substantiv"}, "fahrrad": {"def": "Ein Fahrzeug mit zwei Rädern, das man mit den Beinen antreibt. Man sitzt darauf und tritt in die Pedale, um vorwärts zu fahren.", "example": "Mein Bruder fährt jeden Tag mit dem Fahrrad zur Arbeit.", "is_phrase": false, "pos": "Substantiv"}, "falsche": {"def": "nicht passend oder nicht richtig in dieser Situation; eine Frage, die nicht hilft oder die man nicht stellen sollte", "example": "Nach dem Unfall stellte er mir viele falsche Fragen, anstatt zu fragen, ob ich Hilfe brauche.", "is_phrase": false, "pos": "Adjektiv"}, "fee": {"def": "Eine Fee ist eine Fantasiefigur aus Märchen, die meist freundlich ist und Zauberkräfte hat. Wenn man sagt, jemand lächelt wie eine gute Fee, meint man, dass die Person sehr freundlich und hilfsbereit wirkt.", "example": "Die Krankenschwester kümmerte sich wie eine gute Fee um alle Patienten.", "is_phrase": false, "pos": "Substantiv"}, "fertig": {"def": "Eine Tätigkeit beenden oder abschließen. Man hat eine Arbeit zu Ende gebracht.", "example": "Nach drei Stunden war sie endlich fertig mit dem Aufräumen ihres Zimmers.", "is_phrase": true, "pos": "Redewendung"}, "fingerspitzen": {"def": "Die äußersten Enden der Finger, wo man am besten fühlen kann. Das sind die Teile der Finger, mit denen man vorsichtig Dinge berührt.", "example": "Sie berührte das weiche Fell der Katze mit den Fingerspitzen.", "is_phrase": false, "pos": "Substantiv"}, "frage": {"def": "Etwas, was man wissen möchte und deshalb andere Menschen fragt. Man stellt eine Frage, um eine Antwort zu bekommen.", "example": "Der Lehrer stellte eine schwere Frage und wartete auf die Antwort der Schüler.", "is_phrase": false, "pos": "Substantiv/Verb"}, "fragen": {"def": "Jemanden etwas wissen wollen und deshalb eine Frage stellen. Man möchte eine Information von einer anderen Person bekommen.", "example": "Die Nachbarn fragen oft nach meiner kranken Mutter.", "is_phrase": false, "pos": "Verb"}, "fragt": {"def": "Eine Frage stellen, um eine Information zu bekommen oder etwas zu erfahren.", "example": "Der Lehrer fragt die Schüler, ob sie die Hausaufgaben gemacht haben.", "is_phrase": false, "pos": "Verb"}, "frau": {"def": "Höfliche Anrede für eine erwachsene weibliche Person, die vor dem Familiennamen steht. Man benutzt es, wenn man respektvoll mit einer Frau spricht oder über sie redet.", "example": "Frau Müller ist unsere neue Lehrerin.", "is_phrase": false, "pos": "Substantiv"}, "furz": {"def": "Ein Geräusch, das aus dem Körper kommt, wenn Luft aus dem Darm entweicht. Hier wird es verwendet, um ein ähnlich klingendes Geräusch zu beschreiben.", "example": "Das alte Sofa macht ein Geräusch wie ein Furz, wenn man sich darauf setzt.", "is_phrase": false, "pos": "Substantiv"}, "fühle": {"def": "Wenn man sagt, wie es einem körperlich oder seelisch geht. Man beschreibt damit seinen Zustand oder seine Stimmung.", "example": "Nach dem Streit mit meiner besten Freundin fühle ich mich traurig und einsam.", "is_phrase": true, "pos": "Redewendung"}, "für": {"def": "zeigt an, dass etwas als Gegenleistung oder Bezahlung für etwas anderes gegeben wird", "example": "Für die Hilfe im Haushalt bekommt sie 50 Euro pro Woche.", "is_phrase": false, "pos": "Präposition"}, "ganz": {"def": "bedeutet 'sehr' oder 'völlig' und macht ein Adjektiv oder Adverb stärker. Es zeigt, dass etwas in hohem Maß so ist.", "example": "Sie war ganz müde nach der langen Reise.", "is_phrase": false, "pos": "Adverb"}, "ganze": {"def": "bedeutet hier: die komplette Zeit, ohne Unterbrechung. Es verstärkt Zeitangaben und zeigt, dass etwas während der gesamten Dauer passiert ist.", "example": "Er hat den ganzen Tag auf seinen Freund gewartet.", "is_phrase": false, "pos": "Adjektiv"}, "gar": {"def": "Verstärkt eine Verneinung und bedeutet \"überhaupt nicht\" oder \"absolut nicht\". Macht deutlich, dass etwas komplett unmöglich ist oder vollständig fehlt.", "example": "Ich habe gar keine Zeit für das Projekt.", "is_phrase": false, "pos": "Adverb"}, "gearbeitet": {"def": "Eine berufliche Tätigkeit ausüben, um Geld zu verdienen. Man ist an seinem Arbeitsplatz und macht seine Arbeit.", "example": "Mein Vater hat heute den ganzen Tag im Büro gearbeitet.", "is_phrase": false, "pos": "Verb"}, "geguckt": {"def": "Die Augen in eine bestimmte Richtung richten und aufmerksam schauen. Man wartet dabei oft auf etwas oder jemanden.", "example": "Er hat den ganzen Abend zum Fenster geguckt, weil er auf seinen Freund gewartet hat.", "is_phrase": false, "pos": "Verb"}, "gehofft": {"def": "Das ist die Vergangenheitsform von 'hoffen'. Es bedeutet: Man hat gewünscht oder erwartet, dass etwas Bestimmtes passiert.", "example": "Sie hat gehofft, dass das Wetter am Wochenende schön wird.", "is_phrase": false, "pos": "Verb"}, "gelb-grün": {"def": "Eine Farbe, die zwischen gelb und grün liegt. Es ist eine Mischung aus beiden Farben.", "example": "Das Blatt im Herbst hatte eine gelb-grüne Farbe.", "is_phrase": false, "pos": "Adjektiv"}, "geld": {"def": "Münzen und Scheine, die man als Bezahlung bekommt oder gibt. Wenn jemand für seine Arbeit Geld erhält, dann soll er dafür eine Leistung erbringen.", "example": "Der Babysitter bekommt Geld von den Eltern und passt dafür auf die Kinder auf.", "is_phrase": false, "pos": "Substantiv"}, "geliebt": {"def": "Starke romantische Gefühle für eine Person haben. Man fühlt sich sehr zu jemandem hingezogen und möchte mit dieser Person zusammen sein.", "example": "Sie hat ihn vom ersten Tag an geliebt, obwohl sie wusste, dass er vergeben war.", "is_phrase": false, "pos": "Verb"}, "genau": {"def": "sehr präzise und deutlich, ohne etwas zu vergessen oder falsch zu machen", "example": "Sie kann sich ganz genau an den Namen ihres ersten Lehrers erinnern.", "is_phrase": false, "pos": "Adverb"}, "gepinkelt": {"def": "Urin lassen, seine Blase entleeren. Das Wort ist umgangssprachlich und wird oft verwendet, wenn Tiere oder kleine Kinder ihre Blase nicht kontrollieren können.", "example": "Der kleine Hund hat aus Angst auf den Teppich gepinkelt.", "is_phrase": false, "pos": "Verb"}, "gerne": {"def": "Drückt aus, dass man Lust oder Interesse an etwas hat. Man möchte etwas tun, weil es einem gefällt oder Freude macht.", "example": "Sie würde gerne ins Kino gehen, aber sie hat keine Zeit.", "is_phrase": false, "pos": "Adverb"}, "geräusch": {"def": "Ein Ton oder Sound, den man hört. Es kann laut oder leise sein und durch verschiedene Dinge entstehen.", "example": "Das Geräusch der Schritte im Flur war deutlich zu hören.", "is_phrase": false, "pos": "Substantiv"}, "gesagt": {"def": "sprechen oder etwas mit Worten ausdrücken. Wenn man nichts gesagt hat, war man still und hat nicht geredet.", "example": "In der Besprechung habe ich nichts gesagt, weil ich keine Meinung zu dem Thema hatte.", "is_phrase": false, "pos": "Verb"}, "geschenk": {"def": "Etwas, das man einer anderen Person gibt, um ihr eine Freude zu machen oder um etwas Besonderes zu zeigen. Man bekommt es normalerweise zu besonderen Anlässen oder als Zeichen der Liebe.", "example": "Zum Geburtstag bekam sie ein schönes Geschenk von ihren Eltern.", "is_phrase": false, "pos": "Substantiv"}, "geschminkt": {"def": "Mit Kosmetik behandelt, so dass die natürliche Farbe verändert wurde. Man trägt Make-up auf, um schöner oder anders auszusehen.", "example": "Sie war stark geschminkt und trug blauen Lidschatten.", "is_phrase": false, "pos": "Adjektiv"}, "gesetzt": {"def": "Jemanden oder etwas vorsichtig an einen Platz bringen und dort hinlegen oder hinplatzieren. Es bedeutet hier, dass eine Person (wahrscheinlich ein Tier) ins Bett gebracht wurde.", "example": "Die Mutter hat das kranke Kind ins Bett gesetzt, damit es sich ausruhen kann.", "is_phrase": false, "pos": "Verb"}, "gesicht": {"def": "Der vordere Teil vom Kopf eines Menschen oder Tieres mit Augen, Nase und Mund. Man kann am Gesicht oft sehen, wie jemand sich fühlt.", "example": "Das kleine Kind hatte ein fröhliches Gesicht, als es das Geschenk sah.", "is_phrase": false, "pos": "Substantiv"}, "gitarren": {"def": "Musikinstrumente mit Saiten, die man mit den Fingern spielt. Man hält sie in den Armen und macht Musik damit.", "example": "Maria übt jeden Tag auf ihrer Gitarre und spielt schöne Lieder.", "is_phrase": false, "pos": "Substantiv"}, "gleichzeitig": {"def": "zur selben Zeit; zeigt an, dass zwei Dinge im gleichen Moment passieren", "example": "Er war glücklich über den neuen Job, gleichzeitig machte er sich Sorgen wegen der Verantwortung.", "is_phrase": false, "pos": "Adverb"}, "guckt": {"def": "Die Augen auf jemanden richten und ihn ansehen. Das ist eine umgangssprachliche Form von 'schauen' oder 'blicken'.", "example": "Der kleine Junge guckt neugierig durch das Fenster.", "is_phrase": false, "pos": "Verb"}, "gute": {"def": "freundlich und hilfsbereit, will anderen Menschen helfen und Gutes tun", "example": "Die gute Nachbarin brachte uns Suppe, als wir krank waren.", "is_phrase": false, "pos": "Adjektiv"}, "habe": {"def": "Das Wort wird verwendet, um das Perfekt zu bilden. Es steht vor dem Partizip II und zeigt an, dass etwas in der Vergangenheit passiert ist.", "example": "Ich habe gestern einen Brief geschrieben.", "is_phrase": false, "pos": "Hilfsverb"}, "handgelenken": {"def": "Der Teil des Körpers zwischen der Hand und dem Unterarm. Dort trägt man oft Uhren oder Schmuck wie Armbänder.", "example": "Sie trug eine goldene Uhr am Handgelenk.", "is_phrase": false, "pos": "Substantiv"}, "hasse": {"def": "Ein sehr starkes negatives Gefühl gegenüber etwas haben. Man mag etwas überhaupt nicht und ärgert sich darüber.", "example": "Sie hasst es, wenn Menschen zu spät kommen.", "is_phrase": false, "pos": "Verb"}, "haus": {"def": "Ein Gebäude, in dem Menschen wohnen. Es hat meist mehrere Räume wie Küche, Bad und Schlafzimmer.", "example": "Meine Familie lebt in einem kleinen Haus mit Garten.", "is_phrase": false, "pos": "Substantiv"}, "heiß": {"def": "Das Wetter oder die Luft hat eine sehr hohe Temperatur. Man schwitzt und fühlt sich warm.", "example": "Im Sommer ist es oft so heiß, dass wir den ganzen Tag im Schatten bleiben.", "is_phrase": false, "pos": "Adjektiv"}, "helfe": {"def": "Jemanden unterstützen oder dabei helfen, etwas zu sagen oder sich zu erinnern. Hier bedeutet es: Ich sage ihr nicht das Wort, das sie sucht.", "example": "Als er nicht weiterwusste, half ich ihm nicht beim Antworten.", "is_phrase": false, "pos": "Verb"}, "herumsprang": {"def": "sich schnell und lebhaft an verschiedenen Stellen bewegen, oft aus Freude oder Energie. Das bedeutet, dass jemand nicht stillsteht, sondern sich springend hin und her bewegt.", "example": "Die Kinder sprangen im Garten herum, weil sie so glücklich waren.", "is_phrase": false, "pos": "Verb"}, "himmel": {"def": "Der Bereich über der Erde, den man sieht, wenn man nach oben schaut. Hier ist gemeint, dass die Wolken sich öffnen und verschwinden.", "example": "Nach dem Regen riss der Himmel auf und es wurde wieder sonnig.", "is_phrase": false, "pos": "Substantiv"}, "hinten": {"def": "Von der Rückseite einer Person oder Sache. Man sieht nicht das Gesicht, sondern den Rücken.", "example": "Die Frau ging vor mir und ich konnte sie nur von hinten sehen.", "is_phrase": false, "pos": "Adverb"}, "hitze": {"def": "Sehr warme oder heiße Temperatur, die unangenehm ist und körperliche Beschwerden verursachen kann. Wenn es sehr heiß ist, kann man sich schlecht fühlen.", "example": "Bei der starken Hitze im Sommer trinke ich viel Wasser.", "is_phrase": false, "pos": "Substantiv"}, "hole": {"def": "Man atmet langsam und stark ein, um sich zu beruhigen oder Mut zu fassen. Das macht man oft vor schwierigen Gesprächen oder in stressigen Situationen.", "example": "Vor der Prüfung holte sie tief Luft und ging dann ins Klassenzimmer.", "is_phrase": true, "pos": "Redewendung"}, "hund": {"def": "Ein Tier mit vier Beinen, das oft als Haustier bei Menschen lebt. Hunde sind treue Begleiter und werden gern als Geschenk gegeben.", "example": "Meine Familie hat mir einen kleinen Hund zum Geburtstag geschenkt.", "is_phrase": false, "pos": "Substantiv"}, "hängen": {"def": "sich an etwas befinden und durch die Schwerkraft nach unten ziehen, aber von etwas gehalten werden. Die Armreifen sind um die Handgelenke und bewegen sich dort frei.", "example": "An der Wand hängt ein großes Bild von meiner Familie.", "is_phrase": false, "pos": "Verb"}, "häusern": {"def": "Gebäude, in denen Menschen wohnen. Ein Haus hat Wände, ein Dach und schützt vor Wetter.", "example": "Bei dem starken Regen gingen alle schnell in ihre Häuser.", "is_phrase": false, "pos": "Substantiv"}, "höre": {"def": "Mit den Ohren wahrnehmen, einen Ton oder ein Geräusch bemerken. Man nimmt akustische Signale auf.", "example": "Plötzlich höre ich Schritte im Flur und weiß, dass jemand nach Hause kommt.", "is_phrase": false, "pos": "Verb"}, "hören": {"def": "Mit den Ohren wahrnehmen, dass es einen Ton oder ein Geräusch gibt. Man bemerkt akustisch etwas aus der Umgebung.", "example": "Draußen kann ich die Vögel singen hören.", "is_phrase": false, "pos": "Verb"}, "irgendwann": {"def": "zu einem nicht genau bestimmten Zeitpunkt; nach einer gewissen Zeit, ohne dass man den genauen Moment nennt", "example": "Irgendwann am Nachmittag rief meine Schwester an.", "is_phrase": false, "pos": "Adverb"}, "kam": {"def": "Vergangenheitsform von 'kommen'. Bedeutet: sich von einem Ort zu einem anderen Ort bewegen, ankommen.", "example": "Meine Schwester kam gestern aus Berlin zurück.", "is_phrase": false, "pos": "Verb"}, "kaum": {"def": "bedeutet 'fast gar nicht' oder 'nur sehr wenig'. Man benutzt es, wenn etwas sehr schwer ist oder fast nicht möglich ist.", "example": "Nach dem Unfall konnte sie sich kaum an den Hergang erinnern.", "is_phrase": false, "pos": "Adverb"}, "klar": {"def": "verstanden, in Ordnung, geklärt. Man benutzt es, wenn eine Situation oder Sache für alle Beteiligten eindeutig und verständlich ist.", "example": "Nach unserem Gespräch war alles klar und wir konnten mit der Arbeit beginnen.", "is_phrase": false, "pos": "Adjektiv"}, "klares": {"def": "deutlich und scharf in der Erinnerung; ein Bild oder eine Erinnerung, die man gut und genau sehen kann", "example": "Von meinem Urlaub habe ich nur wenige klare Erinnerungen, aber den Sonnenuntergang am Strand sehe ich noch ganz deutlich vor mir.", "is_phrase": false, "pos": "Adjektiv"}, "kleine": {"def": "Jung, minderjährig, noch nicht erwachsen. Hier bezieht sich das auf Kinder, die noch nicht geschlechtsreif sind.", "example": "Der Mann wurde verhaftet, weil er kleine Kinder belästigt hatte.", "is_phrase": false, "pos": "Adjektiv"}, "kleines": {"def": "Von geringer Größe oder unbedeutend. Hier bedeutet es: ein Wort, das zu kurz oder zu einfach ist, um etwas Wichtiges oder Komplexes auszudrücken.", "example": "Seine große Liebe passt nicht in das kleine Wort 'mögen'.", "is_phrase": false, "pos": "Adjektiv"}, "klingt": {"def": "einen bestimmten Eindruck machen oder wirken, besonders wenn man etwas hört. Man verwendet es, wenn etwas einen speziellen Effekt hat oder eine bestimmte Wirkung erzeugt.", "example": "Seine Entschuldigung klingt nicht ehrlich.", "is_phrase": false, "pos": "Verb"}, "kofferraum": {"def": "Der Raum hinten im Auto, wo man Gepäck und andere Sachen transportiert. Man kann ihn mit einer Klappe öffnen und schließen.", "example": "Sie packte ihre Koffer in den Kofferraum und fuhr zum Flughafen.", "is_phrase": false, "pos": "Substantiv"}, "konnte": {"def": "Vergangenheitsform von 'können'. Drückt aus, dass jemand etwas nicht schaffen oder nicht machen kann, weil es nicht möglich ist.", "example": "Sie konnte die schwere Kiste nicht alleine tragen.", "is_phrase": false, "pos": "Verb"}, "kopf": {"def": "Der obere Teil des Körpers, wo sich das Gehirn befindet und wo man denkt und Geräusche hört. Hier wachsen auch die Haare.", "example": "Nach dem lauten Konzert hatte sie Schmerzen im Kopf.", "is_phrase": false, "pos": "Substantiv"}, "kribbeln": {"def": "Ein leichtes, prickelndes Gefühl haben, wie wenn viele kleine Nadeln die Haut berühren. Das passiert oft, wenn man aufgeregt ist oder wenn ein Körperteil eingeschlafen war.", "example": "Nach dem langen Sitzen kribbeln meine Beine, weil sie eingeschlafen sind.", "is_phrase": false, "pos": "Verb"}, "lacht": {"def": "Ein Geräusch machen, wenn man etwas lustig findet oder sich freut. Man öffnet den Mund und macht dabei helle Töne.", "example": "Das Kind lacht über den lustigen Clown im Zirkus.", "is_phrase": false, "pos": "Verb"}, "lasse": {"def": "Wenn man jemanden warten lässt, dann antwortet man nicht sofort oder kommt nicht pünktlich. Man macht absichtlich nichts, obwohl die andere Person eine Reaktion erwartet.", "example": "Der Chef ließ mich eine Stunde warten, bevor er mich empfing.", "is_phrase": true, "pos": "Redewendung"}, "lauter": {"def": "Mit mehr Lautstärke, so dass man es stärker hört. Das Geräusch wird intensiver und störender.", "example": "Die Musik im Nachbarhaus wurde immer lauter, bis ich die Fenster schließen musste.", "is_phrase": false, "pos": "Adjektiv"}, "leder": {"def": "Ein starkes Material, das aus der Haut von Tieren gemacht wird. Man benutzt es oft für Möbel, Schuhe oder Taschen.", "example": "Die Handtasche aus schwarzem Leder war sehr teuer.", "is_phrase": false, "pos": "Substantiv"}, "leid": {"def": "Wenn man sagt 'jemand tut mir leid', dann hat man Mitleid mit dieser Person. Man fühlt sich traurig, weil es der anderen Person nicht gut geht.", "example": "Mein Nachbar ist krank und sehr einsam - er tut mir wirklich leid.", "is_phrase": true, "pos": "Redewendung"}, "leute": {"def": "Menschen im Allgemeinen; Personen, die in einem bestimmten Gebiet wohnen oder sich dort aufhalten. Das Wort wird hier für die Bewohner eines Ortes verwendet.", "example": "Bei dem starken Regen gingen die Leute schnell in die Geschäfte.", "is_phrase": false, "pos": "Substantiv"}, "lippen": {"def": "Die beiden weichen, roten Teile am Mund, mit denen man spricht und küsst. Sie sind am Rand des Mundes und man kann sie mit Lippenstift färben.", "example": "Sie drückte ihre Lippen zusammen, bevor sie antwortete.", "is_phrase": false, "pos": "Substantiv"}, "locken": {"def": "Haare, die sich natürlich in runde oder wellige Form drehen. Sie sind nicht glatt, sondern haben eine gebogene Form.", "example": "Das kleine Mädchen hat blonde Locken, die sehr weich sind.", "is_phrase": false, "pos": "Substantiv"}, "luft": {"def": "Wenn man tief atmet, um sich zu beruhigen oder Mut zu fassen, bevor man etwas Schwieriges sagt oder tut. Man macht das, wenn man nervös ist oder sich auf etwas Wichtiges vorbereitet.", "example": "Vor dem Vorstellungsgespräch holte sie tief Luft und klopfte dann an die Tür.", "is_phrase": true, "pos": "Redewendung"}, "lustig": {"def": "komisch oder witzig; etwas, was andere zum Lachen bringt oder amüsant finden", "example": "Die Kinder fanden es lustig, wie der Hund hinter seinem eigenen Schwanz herjagte.", "is_phrase": false, "pos": "Adjektiv"}, "lächelt": {"def": "Den Mund leicht nach oben ziehen, um freundlich und nett zu wirken. Man macht das, wenn man jemanden sympathisch finden möchte oder höflich sein will.", "example": "Die Verkäuferin lächelt immer sehr freundlich, wenn Kunden in den Laden kommen.", "is_phrase": false, "pos": "Verb"}, "mache": {"def": "etwas tun oder ausführen. Hier bedeutet es: bestimmte Aktivitäten oder Handlungen durchführen.", "example": "Wenn ich Sport mache, denke ich an nichts anderes.", "is_phrase": false, "pos": "Verb"}, "machst": {"def": "Du tust diese Dinge oder führst diese Handlungen aus. Hier bedeutet es: du verhältst dich so oder du handelst auf diese Weise.", "example": "Er macht immer solche Witze, auch wenn sie andere verletzen.", "is_phrase": false, "pos": "Verb"}, "mal": {"def": "Verstärkt eine Verneinung und bedeutet 'nicht einmal' oder 'auch nur'. Zeigt, dass etwas Kleines oder Selbstverständliches nicht getan wurde.", "example": "Er hat mir nicht mal gedankt, obwohl ich ihm geholfen habe.", "is_phrase": false, "pos": "Partikel"}, "mitgebracht": {"def": "Etwas von einem anderen Ort zu jemandem bringen oder transportieren. Der Vater hat etwas geholt und dann zu seinem Kind gebracht.", "example": "Die Mutter hat mir Blumen aus dem Garten mitgebracht.", "is_phrase": false, "pos": "Verb"}, "mittag": {"def": "Die Zeit um 12 Uhr, wenn die Sonne am höchsten steht. Es ist die Mitte des Tages.", "example": "Um Mittag machen viele Menschen eine Pause und essen zu Mittag.", "is_phrase": false, "pos": "Substantiv"}, "moment": {"def": "Ein sehr kurzer Zeitpunkt, ein Augenblick. Es ist die Zeit, in der etwas Bestimmtes passiert oder sich etwas zeigt.", "example": "In diesem Moment klingelte das Telefon und sie erschrak.", "is_phrase": false, "pos": "Substantiv"}, "morgen": {"def": "Die erste Hälfte des Tages, die Zeit zwischen dem Aufwachen und dem Mittag. Hier bedeutet es einen bestimmten Morgen in der Vergangenheit.", "example": "An dem Morgen nach dem Fest waren alle sehr müde.", "is_phrase": false, "pos": "Substantiv"}, "mutter": {"def": "Die Frau, die ein Kind geboren hat und es großzieht. Sie ist der weibliche Elternteil einer Person.", "example": "Meine Mutter kocht jeden Sonntag ein großes Familienessen.", "is_phrase": false, "pos": "Substantiv"}, "mädchen": {"def": "Ein weibliches Kind oder eine junge Frau. In diesem Kontext geht es um einen Vorwurf, dass jemand Kinder auf unangemessene Weise berührt.", "example": "Der Mann wurde verdächtigt, Mädchen in der Schule belästigt zu haben.", "is_phrase": false, "pos": "Substantiv"}, "mühe": {"def": "Bedeutet: sich anstrengen und sein Bestes versuchen. Man will eine Aufgabe gut machen oder sich gut verhalten.", "example": "In der neuen Schule gebe ich mir richtig Mühe, damit ich gute Noten bekomme.", "is_phrase": true, "pos": "Redewendung"}, "müsste": {"def": "drückt aus, dass etwas logisch oder normal wäre, dass man es erwarten würde", "example": "Wenn du krank bist, müsstest du eigentlich zum Arzt gehen.", "is_phrase": false, "pos": "Verb"}, "nein": {"def": "Ein Wort, mit dem man eine Aussage oder Behauptung verneint oder ablehnt. Man sagt damit, dass etwas nicht stimmt oder nicht wahr ist.", "example": "Nein, ich habe meine Hausaufgaben noch nicht gemacht.", "is_phrase": false, "pos": "Partikel"}, "nervt": {"def": "Jemanden stören oder ärgern, indem man immer wieder das Gleiche sagt oder verlangt. Die Person wird dadurch unruhig und genervt.", "example": "Mein kleiner Bruder nervt mich ständig, weil er immer mein Handy haben will.", "is_phrase": false, "pos": "Verb"}, "niemanden": {"def": "Kein einziger Mensch, null Personen. Man verwendet es, wenn man sagen will, dass man an gar keine Person denkt.", "example": "Auf der Party kannte ich niemanden und fühlte mich sehr allein.", "is_phrase": false, "pos": "Pronomen"}, "ohren": {"def": "Die beiden Körperteile am Kopf, mit denen man hört. Durch die Ohren kommen Geräusche in den Kopf.", "example": "Die laute Musik dringt durch seine Ohren und macht ihm Kopfschmerzen.", "is_phrase": false, "pos": "Substantiv"}, "ozzy": {"def": "Ein Name für ein Haustier, wahrscheinlich einen Hund. Das Tier springt herum, wird auf den Arm genommen und leckt Gesichter ab.", "example": "Mein Hund Max springt jeden Morgen fröhlich durch den Garten.", "is_phrase": false, "pos": "Substantiv"}, "paar": {"def": "Eine kleine Anzahl von etwas, nicht sehr viele. Man verwendet es, wenn man nicht genau sagen will oder kann, wie viele es sind.", "example": "Ich brauche noch ein paar Minuten, dann bin ich fertig.", "is_phrase": true, "pos": "Phrase"}, "packen": {"def": "Das Einräumen von Gegenständen in Koffer, Taschen oder Kartons, um sie zu transportieren oder wegzuräumen. Man macht das vor einer Reise oder einem Umzug.", "example": "Nach dem Packen waren alle Koffer voll und bereit für den Urlaub.", "is_phrase": false, "pos": "Substantiv"}, "passiert": {"def": "etwas geschieht oder findet statt. Man verwendet es für Ereignisse oder Situationen, die eintreten.", "example": "Gestern ist ein Unfall auf der Straße passiert.", "is_phrase": false, "pos": "Verb"}, "passt": {"def": "Hier bedeutet es: etwas ist zu groß oder zu komplex, um in etwas anderem Platz zu haben. Es wird in übertragenem Sinne verwendet, wenn etwas nicht hineingehört oder nicht hineinpasst.", "example": "Meine Gefühle passen nicht in diesen kurzen Brief.", "is_phrase": false, "pos": "Verb"}, "piepen": {"def": "Ein hohes, kurzes Geräusch machen, wie es kleine Vögel oder elektronische Geräte von sich geben. Das Geräusch ist meist schrill und wiederholt sich oft.", "example": "Der Rauchmelder piept alle paar Sekunden, weil die Batterie leer ist.", "is_phrase": false, "pos": "Verb"}, "plötzlich": {"def": "ohne Warnung, von einem Moment zum anderen, unerwartet schnell. Es bedeutet, dass etwas sehr schnell und ohne Vorbereitung passiert.", "example": "Mitten im Gespräch wurde er plötzlich ganz still und schaute nachdenklich aus dem Fenster.", "is_phrase": false, "pos": "Adverb"}, "rechtzeitig": {"def": "Früh genug, damit man noch etwas verhindern oder schaffen kann. Zum richtigen Zeitpunkt, bevor es zu spät ist.", "example": "Der Arzt kam rechtzeitig, um dem Patienten zu helfen.", "is_phrase": false, "pos": "Adverb"}, "reisebüro": {"def": "Ein Geschäft oder Büro, wo Menschen Reisen buchen und planen können. Dort arbeiten Angestellte, die bei der Organisation von Urlaubsreisen helfen.", "example": "Im Reisebüro kann man Flüge, Hotels und ganze Urlaubsreisen buchen.", "is_phrase": false, "pos": "Substantiv"}, "richtig": {"def": "wahr; so, wie es wirklich ist oder war. Man verwendet es, wenn man fragt oder bestätigt, ob etwas stimmt.", "example": "Ist es richtig, dass du morgen nach Berlin fährst?", "is_phrase": false, "pos": "Adjektiv"}, "richtung": {"def": "Der Bereich oder die Seite, wo etwas ist oder wo etwas herkommt. Man schaut dorthin, wo man jemanden oder etwas erwartet.", "example": "Er wartete am Bahnhof und schaute die ganze Zeit in die Richtung, aus der der Zug kommen sollte.", "is_phrase": false, "pos": "Substantiv"}, "riesigen": {"def": "Sehr große Augen, die besonders auffallen. Das Wort wird oft verwendet, um Augen zu beschreiben, die durch Emotion, Überraschung oder natürliche Größe sehr groß wirken.", "example": "Das kleine Mädchen schaute mich mit riesigen, erstaunten Augen an, als es das Geschenk sah.", "is_phrase": false, "pos": "Adjektiv"}, "rot": {"def": "Die Farbe von Blut oder reifen Tomaten. Hier beschreibt es die Farbe des Lippenstifts.", "example": "Sie trägt heute einen roten Pullover.", "is_phrase": false, "pos": "Adjektiv"}, "rutscht": {"def": "sich schnell und glatt bewegen, ohne Widerstand durch etwas hindurchgehen. Hier: Das Geräusch dringt leicht und schnell durch die Ohren ins Innere des Kopfes.", "example": "Die Musik rutscht sanft in meine Gedanken und beruhigt mich.", "is_phrase": false, "pos": "Verb"}, "sachen": {"def": "Aktivitäten oder Handlungen, die man nicht genau benennen will oder kann, oft weil sie unangenehm, peinlich oder problematisch sind. Man verwendet das Wort, um nicht direkt über etwas sprechen zu müssen.", "example": "Nach dem Streit wollte er nicht über diese Sachen reden, die zwischen ihnen passiert waren.", "is_phrase": false, "pos": "Substantiv"}, "sage": {"def": "Mit Worten ausdrücken, was man denkt oder fühlt. Sprechen und anderen Menschen etwas mitteilen.", "example": "Er sagt mir jeden Tag, dass er mich liebt.", "is_phrase": false, "pos": "Verb"}, "sah": {"def": "Vergangenheitsform von 'sehen'. Man benutzt die Augen, um etwas zu bemerken oder zu beobachten.", "example": "Sie sah ihren Freund im Park spazieren gehen.", "is_phrase": false, "pos": "Verb"}, "scheint": {"def": "Licht kommt von der Sonne durch das Fenster in einen Raum hinein. Das Sonnenlicht macht den Raum heller.", "example": "Am Morgen scheint die Sonne durch mein Schlafzimmerfenster und weckt mich auf.", "is_phrase": false, "pos": "Verb"}, "schlafanzug": {"def": "Bequeme Kleidung, die man normalerweise zum Schlafen trägt. Besteht meist aus einer langen Hose und einem Oberteil aus weichem Stoff.", "example": "Nach dem Duschen zog er seinen warmen Schlafanzug an und ging ins Bett.", "is_phrase": false, "pos": "Substantiv"}, "schlecht": {"def": "Ein unangenehmes Gefühl haben, weil man etwas Falsches getan oder gedacht hat. Man hat ein schlechtes Gewissen.", "example": "Nach dem Streit mit ihrer Freundin fühlte sie sich schlecht und wollte sich entschuldigen.", "is_phrase": false, "pos": "Adjektiv"}, "schließlich": {"def": "Nach einer Zeit des Wartens oder Zögerns; am Ende, nachdem man überlegt oder gezögert hat.", "example": "Er stand lange vor der Tür und klopfte schließlich doch an.", "is_phrase": false, "pos": "Adverb"}, "schlug": {"def": "Mit Kraft schließen oder zumachen. Man drückt oder stößt etwas fest zu.", "example": "Sie schlug die Tür hinter sich zu und ging weg.", "is_phrase": false, "pos": "Verb"}, "schwindelig": {"def": "Man fühlt sich nicht stabil und hat das Gefühl, dass sich alles dreht. Das passiert oft, wenn es sehr heiß ist oder man krank ist.", "example": "Nach dem langen Spaziergang in der Sonne wurde ihm schwindelig.", "is_phrase": false, "pos": "Adjektiv"}, "schützen": {"def": "etwas tun, damit einem nichts Schlechtes passiert; sich vor Gefahr oder unangenehmen Dingen sicher machen", "example": "Bei Regen schützen wir uns mit einem Regenschirm vor dem Wasser.", "is_phrase": false, "pos": "Verb"}, "sehe": {"def": "Mit den Augen wahrnehmen, etwas visuell erfassen. Hier bedeutet es: beobachten oder betrachten, was gerade passiert oder wie etwas aussieht.", "example": "Vom Fenster aus sehe ich die Kinder auf dem Spielplatz.", "is_phrase": false, "pos": "Verb"}, "sesseln": {"def": "Ein bequemer Stuhl mit Armlehnen und oft weicher Polsterung, in dem man sich zurücklehnen und entspannen kann.", "example": "Nach der Arbeit setze ich mich gerne in meinen weichen Sessel und lese ein Buch.", "is_phrase": false, "pos": "Substantiv"}, "sitze": {"def": "Eine Position haben, bei der man auf einem Stuhl oder einer anderen Sitzgelegenheit ist. Man befindet sich an einem bestimmten Ort und hat dort Platz genommen.", "example": "Ich sitze im Wartezimmer und warte auf meinen Termin beim Arzt.", "is_phrase": false, "pos": "Verb"}, "sitzen": {"def": "Den Körper auf einem Stuhl, Sessel oder einer anderen Sitzgelegenheit ruhen lassen. Man befindet sich in einer Position, bei der das Gewicht auf dem Gesäß liegt.", "example": "Die Studenten sitzen im Hörsaal und hören dem Professor zu.", "is_phrase": false, "pos": "Verb"}, "sofort": {"def": "bedeutet: im ersten Moment, direkt am Anfang, ohne Zeit zu verlieren. Es drückt aus, dass etwas sehr schnell oder gleich nach dem ersten Kontakt passiert ist.", "example": "Als sie das Baby sah, wollte sie es sofort in die Arme nehmen.", "is_phrase": false, "pos": "Adverb"}, "sonne": {"def": "Der helle Stern am Himmel, der der Erde Licht und Wärme gibt. Man sieht die Sonne am Tag, wenn keine Wolken da sind.", "example": "Am Morgen geht die Sonne auf und macht den Tag hell.", "is_phrase": false, "pos": "Substantiv"}, "stand": {"def": "Sich an einem Ort befinden und dabei aufrecht auf den Füßen sein. Man bewegt sich nicht und bleibt an der gleichen Stelle.", "example": "Die Frau stand vor dem Geschäft und wartete auf ihre Freundin.", "is_phrase": false, "pos": "Verb"}, "stehen": {"def": "Die Haare gehen in verschiedene Richtungen weg vom Kopf, sie sind nicht glatt oder ordentlich frisiert.", "example": "Nach dem Schlafen stehen mir die Haare wild vom Kopf.", "is_phrase": false, "pos": "Verb"}, "stenzer": {"def": "Ein Nachname einer Person. Hier ist es der Familienname der Therapeutin.", "example": "Herr Müller ist mein Lehrer und Frau Schmidt arbeitet in der Bibliothek.", "is_phrase": false, "pos": "Substantiv"}, "stieg": {"def": "Sich in ein Fahrzeug hineinbewegen, um mitzufahren. Man geht in das Auto hinein und setzt sich hin.", "example": "Sie stieg in den Bus und suchte sich einen freien Platz.", "is_phrase": false, "pos": "Verb"}, "tag": {"def": "Ein bestimmter Tag in der Vergangenheit, an den man sich erinnert. Oft ein wichtiger oder besonderer Tag, der im Gedächtnis geblieben ist.", "example": "An diesem Tag habe ich meinen ersten Job bekommen - ich werde ihn nie vergessen.", "is_phrase": false, "pos": "Substantiv"}, "taschen": {"def": "Behälter aus Stoff, Leder oder anderen Materialien, in die man Sachen hineinpacken kann. Man kann sie tragen oder transportieren.", "example": "Ich packe meine Kleider in zwei große Taschen für die Reise.", "is_phrase": false, "pos": "Substantiv"}, "tat": {"def": "Diese Phrase bedeutet: etwas verursacht emotionalen Schmerz oder macht traurig. Man benutzt sie, wenn Gefühle oder Situationen seelisch wehtun.", "example": "Als sie mir sagte, dass sie wegzieht, tat es richtig weh.", "is_phrase": true, "pos": "Redewendung"}, "tauchte": {"def": "Bedeutet: jemand kam nicht oder zeigte sich nicht, obwohl man es erwartet hat. Man wartet auf eine Person, aber sie kommt einfach nicht.", "example": "Wir hatten uns um 15 Uhr verabredet, aber mein Freund tauchte einfach nicht auf.", "is_phrase": true, "pos": "Redewendung"}, "therapeutin": {"def": "Eine Frau, die Menschen mit psychischen Problemen oder Krankheiten hilft. Sie führt Gespräche mit Patienten, um ihre seelischen Schwierigkeiten zu behandeln.", "example": "Nach dem schweren Unfall ging Maria zu einer Therapeutin, um über ihre Ängste zu sprechen.", "is_phrase": false, "pos": "Substantiv"}, "tief": {"def": "Man atmet langsam und stark ein, um sich zu beruhigen oder Mut zu sammeln. Man macht das oft vor schwierigen Gesprächen oder in stressigen Situationen.", "example": "Vor der Prüfung holte sie tief Luft und ging dann in den Raum.", "is_phrase": true, "pos": "Redewendung"}, "tour": {"def": "Eine Reise von Ort zu Ort machen, um dort Konzerte zu spielen. Musiker reisen so zu verschiedenen Städten und treten vor Publikum auf.", "example": "Die berühmte Sängerin geht nächsten Monat mit ihrer neuen Show auf Tour durch ganz Europa.", "is_phrase": true, "pos": "Redewendung"}, "trotzdem": {"def": "bedeutet: obwohl etwas anderes dagegen spricht oder eine andere Situation da ist. Man macht etwas, auch wenn es nicht logisch oder passend erscheint.", "example": "Es regnete stark, trotzdem ging sie ohne Regenschirm spazieren.", "is_phrase": false, "pos": "Adverb"}, "trug": {"def": "Kleidung oder Schuhe am Körper haben. Man zieht etwas an und hat es dann an.", "example": "Sie trug ein rotes Kleid zur Party.", "is_phrase": false, "pos": "Verb"}, "trägt": {"def": "Sie hat etwas an ihrem Körper, sie ist damit angezogen. Das bedeutet, sie hat diese Kleidung auf ihrer Haut.", "example": "Heute trägt er ein blaues Hemd und eine schwarze Hose.", "is_phrase": false, "pos": "Verb"}, "tut": {"def": "Wenn man sagt 'jemand tut mir leid', dann fühlt man Mitleid mit dieser Person. Man findet die Situation der Person traurig oder bedauernswert.", "example": "Der alte Mann sitzt jeden Tag allein auf der Bank - er tut mir wirklich leid.", "is_phrase": true, "pos": "Redewendung"}, "ungefähr": {"def": "bedeutet, dass eine Zahl nicht ganz genau ist, sondern nur etwa so viel. Man verwendet es, wenn man schätzt oder eine runde Zahl nennt.", "example": "Das Konzert dauert ungefähr zwei Stunden.", "is_phrase": false, "pos": "Adverb"}, "unserem": {"def": "Possessivpronomen in der 1. Person Plural Dativ maskulin/neutrum. Es zeigt, dass das Haus der Person gehört, die spricht, und anderen zusammen.", "example": "Die Nachbarn schauten oft zu unserem Garten hinüber.", "is_phrase": false, "pos": "Pronomen"}, "unterlagen": {"def": "Dokumente und Papiere, die man für die Arbeit oder für wichtige Angelegenheiten braucht. Das können Verträge, Notizen, Briefe oder andere schriftliche Informationen sein.", "example": "Der Anwalt sortierte seine Unterlagen vor dem wichtigen Termin.", "is_phrase": false, "pos": "Substantiv"}, "vater": {"def": "Der Mann, der das Kind gezeugt hat und normalerweise in der Familie lebt. In diesem Text ist der Vater aber weggegangen und hat die Familie verlassen.", "example": "Seit mein Vater uns verlassen hat, leben wir nur noch mit meiner Mutter zusammen.", "is_phrase": false, "pos": "Substantiv"}, "verlassen": {"def": "Seine Familie für immer weggehen und nicht mehr zurückkommen. Man lässt die anderen allein und kümmert sich nicht mehr um sie.", "example": "Nach der Scheidung hat die Mutter ihre Kinder verlassen und ist in eine andere Stadt gezogen.", "is_phrase": false, "pos": "Verb"}, "versprochen": {"def": "Jemandem sein Wort geben, dass man etwas tun wird. Man sagt zu einer Person, dass man sicher etwas machen wird.", "example": "Ich habe dir versprochen, pünktlich zu sein, deshalb bin ich früh losgegangen.", "is_phrase": false, "pos": "Verb"}, "vielleicht": {"def": "Drückt Unsicherheit oder Zweifel aus. Man ist sich nicht sicher, ob etwas wahr ist oder stimmt.", "example": "Ich weiß nicht genau, ob ich Zeit habe – vielleicht kann ich doch kommen.", "is_phrase": false, "pos": "Adverb"}, "vollgepackt": {"def": "Sehr voll mit vielen Sachen. Wenn etwas vollgepackt ist, ist kein Platz mehr frei.", "example": "Der Koffer war vollgepackt mit Kleidung für die ganze Familie.", "is_phrase": false, "pos": "Adjektiv"}, "vorgarten": {"def": "Ein kleiner Garten vor einem Haus, zwischen dem Haus und der Straße. Dort können Pflanzen wachsen oder Tiere spielen.", "example": "Die Katze liegt gern im Vorgarten in der Sonne.", "is_phrase": false, "pos": "Substantiv"}, "warst": {"def": "2. Person Singular von 'sein' in der Vergangenheit. Man verwendet es, wenn man zu einer Person über etwas spricht, was früher war.", "example": "Gestern warst du noch so fröhlich, aber heute bist du traurig.", "is_phrase": false, "pos": "Verb"}, "warten": {"def": "Jemanden warten lassen bedeutet: eine Person absichtlich nicht sofort antworten oder nicht schnell handeln, obwohl sie eine Antwort oder Reaktion erwartet. Man lässt die Person in Ungewissheit.", "example": "Der Chef hat mich nach dem Vorstellungsgespräch drei Wochen warten lassen, bevor er mir die Stelle angeboten hat.", "is_phrase": true, "pos": "Redewendung"}, "wartet": {"def": "Eine Person bleibt an einem Ort oder in einer Situation und hofft, dass etwas Bestimmtes passiert. Man wartet auf eine Reaktion, eine Person oder ein Ereignis.", "example": "Der Patient wartet schon seit einer Stunde auf den Arzt.", "is_phrase": false, "pos": "Verb"}, "warum": {"def": "Ein Fragewort, das man benutzt, wenn man den Grund für etwas wissen möchte. Man fragt damit nach der Ursache oder dem Motiv für eine Handlung oder Situation.", "example": "Warum gehst du schon so früh nach Hause?", "is_phrase": false, "pos": "Adverb"}, "was": {"def": "Ein Fragewort, mit dem man nach Dingen, Sachverhalten oder Inhalten fragt. Man verwendet es, wenn man wissen möchte, welche Sache oder welcher Inhalt gemeint ist.", "example": "Was hast du gestern gemacht?", "is_phrase": false, "pos": "Pronomen"}, "weh": {"def": "Es tut weh bedeutet: Man fühlt sich traurig oder verletzt, obwohl nichts Körperliches passiert ist. Man hat emotionalen Schmerz.", "example": "Als sie ihm sagte, dass sie ihn nicht mehr liebt, tat es richtig weh.", "is_phrase": true, "pos": "Redewendung"}, "weile": {"def": "Eine ganze Weile bedeutet: eine ziemlich lange Zeit. Man sagt das, wenn etwas länger dauert als normal oder erwartet.", "example": "Ich habe eine ganze Weile auf den Bus gewartet, fast zwanzig Minuten.", "is_phrase": true, "pos": "Redewendung"}, "weit": {"def": "Bedeutet, dass etwas aus großer Entfernung kommt oder an einem entfernten Ort passiert. Man hört oder sieht etwas, aber es ist sehr weit von einem entfernt.", "example": "Weit weg hörte sie die Musik vom Nachbarhaus.", "is_phrase": true, "pos": "Redewendung"}, "weiß": {"def": "haben Informationen oder Kenntnisse über etwas; sich an etwas erinnern oder über etwas Bescheid haben", "example": "Ich weiß seine Telefonnummer nicht auswendig.", "is_phrase": false, "pos": "Verb"}, "wen": {"def": "Fragewort für eine Person im Akkusativ. Man benutzt es, wenn man fragt, welche Person das Objekt einer Handlung ist.", "example": "Wen rufst du an? - Ich rufe meine Mutter an.", "is_phrase": false, "pos": "Pronomen"}, "wild": {"def": "unordentlich und durcheinander, nicht gekämmt oder frisiert", "example": "Nach dem Schlafen waren seine Haare ganz wild und standen in alle Richtungen.", "is_phrase": false, "pos": "Adjektiv"}, "wirklich": {"def": "Betont, dass etwas tatsächlich so ist und nicht anders. Man verwendet es, um zu zeigen, dass man etwas ernst meint oder um zu überzeugen.", "example": "Ich bin wirklich müde und möchte jetzt schlafen gehen.", "is_phrase": false, "pos": "Adverb"}, "woanders": {"def": "An einem anderen Ort; nicht hier, sondern irgendwo anders. Drückt den Wunsch aus, von dem aktuellen Ort wegzugehen.", "example": "Das Meeting war so langweilig, dass ich am liebsten woanders gewesen wäre.", "is_phrase": false, "pos": "Adverb"}, "wochen": {"def": "Ein Zeitraum von sieben Tagen. Mehrere Wochen bedeutet mehrere solche Zeiträume hintereinander.", "example": "Nach drei Wochen Urlaub kam sie wieder zur Arbeit zurück.", "is_phrase": false, "pos": "Substantiv"}, "wollte": {"def": "Drückt aus, dass jemand etwas versuchen wollte oder die Absicht hatte, etwas zu tun. Oft wird damit gezeigt, dass die Handlung schwierig war oder nicht geklappt hat.", "example": "Sie wollte sich an den Namen erinnern, aber es gelang ihr nicht.", "is_phrase": false, "pos": "Verb"}, "wort": {"def": "Ein Begriff oder Ausdruck, mit dem man etwas benennt oder beschreibt. Hier bedeutet es, dass etwas zu groß oder zu komplex ist, um es mit einem kurzen Begriff zu erfassen.", "example": "Seine tiefe Liebe zu ihr passt nicht in das einfache Wort 'mögen'.", "is_phrase": false, "pos": "Substantiv"}, "wusste": {"def": "Vergangenheitsform von 'wissen'. Es bedeutet: eine Information haben, etwas sicher sein oder verstehen.", "example": "Sie wusste schon am Morgen, dass es regnen würde.", "is_phrase": false, "pos": "Verb"}, "wäre": {"def": "Konjunktiv von 'sein', wird für Wünsche oder irreale Situationen verwendet. Drückt aus, dass etwas nicht real ist, aber gewünscht wird.", "example": "Ich wünschte, das Wetter wäre heute schöner.", "is_phrase": false, "pos": "Verb"}, "wünschte": {"def": "Konjunktiv II von 'wünschen' - drückt einen irrealen Wunsch oder eine höfliche Bitte aus. Die Person möchte, dass etwas anders wäre, als es in Wirklichkeit ist.", "example": "Ich wünschte, ich hätte mehr Zeit für meine Familie.", "is_phrase": false, "pos": "Verb"}, "würde": {"def": "Drückt aus, dass etwas möglich ist oder wahrscheinlich passiert. Man benutzt es für höfliche Aussagen oder wenn man nicht sicher ist.", "example": "Sie würde gerne mitkommen, aber sie hat keine Zeit.", "is_phrase": false, "pos": "Hilfsverb"}, "wütend": {"def": "Sehr ärgerlich und böse sein. Man fühlt sich so, wenn etwas passiert ist, was einen sehr stört oder verletzt.", "example": "Nach dem Streit mit seinem besten Freund war Tim den ganzen Tag wütend.", "is_phrase": false, "pos": "Adjektiv"}, "zehn": {"def": "Die Zahl 10. Hier gibt eine Person als Antwort auf eine Frage nur diese Zahl an.", "example": "Auf die Frage nach der Anzahl der Gäste antwortete Maria nur: \"Zehn.\"", "is_phrase": false, "pos": "Zahlwort"}, "zeit": {"def": "Die ganze Zeit bedeutet: während der ganzen Dauer, ohne Pause, immer. Man benutzt es, wenn etwas kontinuierlich passiert ist.", "example": "Er hat die ganze Zeit geredet und uns nicht zugehört.", "is_phrase": true, "pos": "Redewendung"}, "zimmer": {"def": "Ein Raum in einer Wohnung oder einem Haus, in dem man sich aufhält, schläft oder arbeitet. Es ist ein geschlossener Bereich mit Wänden, oft mit Fenstern und einer Tür.", "example": "Maria ging in ihr Zimmer und machte die Tür zu.", "is_phrase": false, "pos": "Substantiv"}, "zurück": {"def": "wieder an den Ort kommen, wo man vorher war; wieder da sein, nachdem man weg war", "example": "Meine Schwester ist für ein Jahr ins Ausland gegangen, aber nächsten Monat ist sie wieder zurück.", "is_phrase": false, "pos": "Adverb"}, "über": {"def": "Das Wort zeigt an, dass man Informationen zu einem bestimmten Thema oder einer Person geben soll. Es bedeutet hier 'von' oder 'zu dem Thema'.", "example": "Der Lehrer fragte die Schüler über ihre Hobbys.", "is_phrase": false, "pos": "Präposition"}, "überhaupt": {"def": "betont, dass man etwas gar nicht will oder dass etwas null ist. Es macht die Verneinung sehr stark.", "example": "Nach dem schlechten Film wollte ich überhaupt nicht mehr ins Kino gehen.", "is_phrase": false, "pos": "Adverb"}};

function render() {
  const tb = document.getElementById('tb');
  const raw = "NICHT W\u00dcTEND\nJetzt sitze ich hier bei meiner Therapeutin Frau Stenzer. Sie hat braune Locken, die ihr wild vom Kopf stehen. Ihre Augen sind gelb-gr\u00fcn. Sie tr\u00e4gt etwas, das aussieht wie ein Schlafanzug. An ihren Handgelenken h\u00e4ngen ungef\u00e4hr 3000 Armreifen. Ihre Lippen hat sie rot geschminkt.\nWir sitzen auf braunen Sesseln aus Leder. Wenn sich einer von uns bewegt, klingt es wie ein Furz.\nSie l\u00e4chelt wie eine gute Fee und sagt \u201eErz\u00e4hl mir etwas \u00fcber dich, Daniel.\u201c\nIch will \u00fcberhaupt nichts erz\u00e4hlen und vor allem woanders sein. Ich bin nur hier, damit meine Mutter mich nicht weiter nervt.\nFrau Stenzer guckt mich mit ihren riesigen Augen an.\nIch frage sie: \u201eWas bezahlt meine Mutter Ihnen eigentlich?\u201c Denn sie m\u00fcsste mir etwas erz\u00e4hlen f\u00fcr das Geld.\nFrau Stenzer lacht. Ich wei\u00df nicht, was so lustig ist.\nDann fragt sie pl\u00f6tzlich ganz ernst; \u201eWarum bist du so w\u00fctend, Daniel?\u201c\n\u201eIch bin nicht w\u00fctend\u201c. sage ich. Nein, ich bin wirklich nicht w\u00fctend.\nSie sagt: \u201eAber du machst diese Sachen.\u201c Das klingt, als ob ich kleine M\u00e4dchen anfasse. \u201eWas macht dich so w\u00fctend?\u201c\nEs ist die falsche Frage. Ich bin nicht dabei, wenn ich \u201ediese Sachen\u201c mache.\nFrau Stenzer wartet auf meine Antwort und ich lasse sie warten. Ich sehe zu, wie drau\u00dfen der Himmel aufrei\u00dft und die Sonne in das Zimmer scheint Dann h\u00f6re ich weit weg etwas piepen.\nIrgendwann sagt Frau Stenzer: \u201eDaniel, so kommen wir nicht weiter.\u201c Sie tut mir leid.\nDas Piepen rutscht durch meine Ohren in meinen Kopf und wird dort lauter. Meine Fingerspitzen kribbeln. Ich hasse diese Frage. Ich bin nicht \u201ew\u00fctend\u201c \u2013 oder vielleicht doch. Es passt nicht in ein so kleines Wort.\nFrau Stenzer fragt: \u201eAn wen denkst du, wenn du w\u00fctend bist?\u201c Schon wieder die falsche Frage. Ich denke nicht, wenn es passiert. Mit einer Explosion im Kopf kann man gar nicht denken. Aber ich habe meiner Mutter versprochen, mir M\u00fche zu geben. Ich hole tief Luft und sage schlie\u00dflich: \u201eIch denke an niemanden.\u201c\nSie fragt: \u201eDein Vater hat euch verlassen, ist das richtig?\u201c\nAber sie wei\u00df doch, dass es richtig ist. Das hat ihr meine Mutter bestimmt erz\u00e4hlt. Warum fragen alle nach meinem Vater? Ja. er ist weg. Aber er konnte nicht anders. Er konnte nicht bleiben.\nIch denke, dass ich auch vielleicht gerne gehen w\u00fcrde. Aber ich f\u00fchle mich schlecht, weil ich so etwas denke.\nFrau Stenzer bl\u00e4ttert in ihren Unterlagen. \u201eDa warst du ...\u201c Ich helfe ihr nicht. \u201eZehn\u201c, sagt sie schlie\u00dflich. Sie sieht mich an, als ob damit alles klar ist.\nIch erkl\u00e4re: \u201eIch kann mich kaum daran erinnern.\u201c Aber ich wei\u00df noch ganz genau, was alles an diesem Tag passiert ist.\nEs war sehr hei\u00df. Die Leute blieben in ihren H\u00e4usern, um sich vor der Sonne zu sch\u00fctzen. Mein Vater trug trotzdem seine Cowboystiefel. Er hat sein altes Auto vollgepackt mit Taschen und seinen Gitarren. Es sah aus, als ob er mit seiner Band auf Tour geht. Ich w\u00fcnschte mir; dass es so w\u00e4re. Dann w\u00fcrde er nach ein paar Wochen wieder zur\u00fcck sein.\nEine ganze Weile stand er an seinem Auto und sah zu unserem Haus. Meine Mutter war nicht da, sie war im Reiseb\u00fcro und hat gearbeitet. Es war Mittag und ich dachte, dass sie bald mit ihrem Fahrrad kommt. Ich habe die ganze Zeit in die Richtung geguckt, aus der sie immer kam. Ich habe gehofft, dass sie rechtzeitig kommt, um meinen Vater aufzuhalten. Aber sie tauchte einfach nicht auf. Mir war ganz schwindelig vor Hitze.\nIrgendwann war mein Vater fertig mit Packen. Er schlug den Kofferraum zu. Ich kann das Ger\u00e4usch noch h\u00f6ren. Es war ein endg\u00fcltiges, beschissenes Ger\u00e4usch. Ich wollte ihn bitten zu bleiben. Aber ich habe die ganze Zeit geguckt, wo meine Mutter bleibt. Dabei habe ich gar nichts gesagt, ich habe ihn nicht mal angeguckt.\nDann war er weg. Ich wollte mich erinnern, wie mein Vater in das Auto stieg. Ich wollte mich erinnern, wie sein Gesicht in diesem Moment aussah. Aber ich habe nur ein einziges klares Bild von ihm diesem Tag: Ich sehe ihn nur von hinten. An sein Gesicht kann ich mich nicht erinnern. \nIch wei\u00df noch, dass Ozzy im Vorgarten herumsprang. Mein Vater hat ihn mir an dem Morgen mitgebracht. Er stand in meinem Zimmer mit Ozzy auf dem Arm. Er hat ihn mir in das Bett gesetzt, Ozzy hat mir das Gesicht abgeleckt. Dabei hat er auf meine Decke gepinkelt. Ich habe ihn sofort geliebt, gleichzeitig tat es weh. Denn ich wusste, dass dieser Hund ein Geschenk zum Abschied war.\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t]+$/.test(tok)) { html += tok; return; }
    if (/^[\n\r]+$/.test(tok)) { html += '<br>'; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'')
                   .toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" data-orig="' + tok + '" onclick="show(event,\'' + key + '\',this)">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

function show(e, k, el) {
  const d = DICT[k]; if (!d) return;

  // Aktives Wort hervorheben
  if (activeEl) activeEl.classList.remove('active');
  activeEl = el || e.currentTarget;
  activeEl.classList.add('active', 'seen');

  // Originalschreibweise aus data-orig holen
  const orig = activeEl.getAttribute('data-orig') || k;

  // Panel befüllen
  document.getElementById('pWord').textContent = orig;
  document.getElementById('pPos').textContent  = d.pos || '';
  document.getElementById('pDef').textContent  = d.def || '';

  const pEx = document.getElementById('pEx');
  if (d.example) {
    pEx.textContent = '\u201e' + d.example + '\u201c';
    pEx.style.display = 'block';
  } else {
    pEx.style.display = 'none';
  }

  const pBadge = document.getElementById('pBadge');
  pBadge.style.display = d.is_phrase ? 'inline-block' : 'none';

  document.getElementById('panelEmpty').style.display   = 'none';
  document.getElementById('panelContent').classList.add('visible');

  // Tracking
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(ex) {}
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
