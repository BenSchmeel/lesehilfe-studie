e, "pos": "Verb"}, "verschmiert": {"def": "Nicht mehr scharf und klar, sondern unscharf geworden, weil die Farbe oder das Material an den Rändern verläuft oder verwischt ist. Es sieht nicht mehr ordentlich und präzise aus.", "example": "Die Schrift auf dem alten Schild ist verschmiert und schwer zu lesen.", "is_phrase": false, "pos": "Adjektiv"}, "versprochen": {"def": "Jemandem sein Wort geben, dass man etwas tun wird. Man sagt zu einer anderen Person, dass man sicher etwas machen wird.", "example": "Meine Mutter hat mir versprochen, dass wir am Wochenende ins Kino gehen.", "is_phrase": false, "pos": "Verb"}, "versteht": {"def": "Etwas nicht begreifen oder nicht wissen, was etwas bedeutet. Man kann eine Sache, eine Situation oder eine Person nicht verstehen.", "example": "Er versteht die Aufgabe nicht und fragt die Lehrerin um Hilfe.", "is_phrase": false, "pos": "Verb"}, "versucht": {"def": "sich Mühe geben, etwas zu machen oder zu erreichen. Man möchte etwas schaffen, aber es ist nicht sicher, ob es klappt.", "example": "Sie hat versucht, das schwere Wort zu verstehen, aber es war zu kompliziert.", "is_phrase": false, "pos": "Verb"}, "viech": {"def": "Ein Tier, meist liebevoll oder scherzhaft gemeint. Man benutzt das Wort oft, wenn man über ein Haustier spricht, das man gern hat.", "example": "Unser Kater ist ein süßes kleines Viech, auch wenn er manchmal die Vorhänge zerkratzt.", "is_phrase": false, "pos": "Substantiv"}, "vielleicht": {"def": "Drückt aus, dass etwas möglich ist, aber nicht sicher. Man ist sich nicht ganz sicher, ob etwas wirklich passiert oder stimmt.", "example": "Ich komme vielleicht morgen zu Besuch, wenn ich Zeit habe.", "is_phrase": false, "pos": "Adverb"}, "vorgarten": {"def": "Ein kleiner Garten vor einem Haus, zwischen dem Haus und der Straße. Dort können Pflanzen, Blumen oder Rasen sein.", "example": "Die Familie hat schöne Rosen in ihren Vorgarten gepflanzt.", "is_phrase": false, "pos": "Substantiv"}, "vorstellte": {"def": "sich etwas in Gedanken sehr genau ausmalen oder vorstellen. Man denkt intensiv daran, wie etwas sein könnte oder aussehen würde.", "example": "Sie stellte sich vor, wie schön ihr neues Zuhause werden würde.", "is_phrase": false, "pos": "Verb"}, "warst": {"def": "Die Form von 'sein' in der Vergangenheit für 'du'. Man benutzt es, um zu sagen, wo oder wie jemand früher war.", "example": "Gestern warst du sehr müde nach der Arbeit.", "is_phrase": false, "pos": "Verb"}, "wartet": {"def": "Eine Zeit lang an einem Ort bleiben und nichts Bestimmtes tun. Man bleibt ruhig sitzen oder stehen, bis etwas passiert oder jemand kommt.", "example": "Der Patient wartet im Behandlungszimmer auf den Arzt.", "is_phrase": false, "pos": "Verb"}, "warum": {"def": "Ein Wort, mit dem man nach dem Grund oder der Ursache für etwas fragt. Man verwendet es, wenn man wissen möchte, weshalb etwas passiert ist oder weshalb jemand etwas macht.", "example": "Warum kommst du heute so spät nach Hause?", "is_phrase": false, "pos": "Fragewort"}, "was": {"def": "Ein Wort, das für eine Sache oder Information steht, die man nicht genau bestimmt. Man benutzt es in Fragen oder wenn man etwas Unbestimmtes meint.", "example": "Kannst du mir sagen, was du gestern gemacht hast?", "is_phrase": false, "pos": "Pronomen"}, "weggefahren": {"def": "Mit einem Fahrzeug von einem Ort entfernt fahren und diesen Ort verlassen. Das Gegenteil von ankommen oder stehenbleiben.", "example": "Der Bus ist pünktlich weggefahren, obwohl noch Leute an der Haltestelle standen.", "is_phrase": false, "pos": "Verb"}, "wegwischen": {"def": "etwas mit einem Tuch oder der Hand entfernen, indem man darüber wischt. Man macht eine wischende Bewegung, um etwas zu beseitigen.", "example": "Sie wischte die Tränen aus ihrem Gesicht weg.", "is_phrase": false, "pos": "Verb"}, "weh": {"def": "Diese Phrase bedeutet: Man fühlt sich traurig oder hat emotionale Schmerzen. Man benutzt sie, wenn etwas das Herz schwer macht oder man seelisch leidet.", "example": "Als sie erfuhr, dass ihr bester Freund wegzieht, tat es ihr weh, weil sie ihn sehr vermissen würde.", "is_phrase": true, "pos": "Redewendung"}, "weile": {"def": "Eine ganze Weile bedeutet: eine ziemlich lange Zeit. Man sagt das, wenn etwas länger dauert als normal oder erwartet.", "example": "Ich habe eine ganze Weile auf den Bus gewartet, fast zwanzig Minuten.", "is_phrase": true, "pos": "Redewendung"}, "weit": {"def": "sehr stark oder sehr viel; mehr als normal oder üblich", "example": "Die Tür stand weit offen, obwohl es kalt war.", "is_phrase": false, "pos": "Adverb"}, "weiß": {"def": "Informationen oder Fakten im Kopf haben; etwas gelernt haben und sich daran erinnern können.", "example": "Maria weiß die Telefonnummer ihrer Freundin auswendig.", "is_phrase": false, "pos": "Verb"}, "wen": {"def": "Fragewort für eine Person im Akkusativ. Man fragt damit nach einer Person, die das Objekt einer Handlung ist.", "example": "Wen rufst du heute Abend an?", "is_phrase": false, "pos": "Pronomen"}, "wild": {"def": "unordentlich und ohne Kontrolle, in alle Richtungen durcheinander", "example": "Nach dem Sturm hingen die Äste wild in alle Richtungen.", "is_phrase": false, "pos": "Adjektiv"}, "winzige": {"def": "Sehr, sehr klein. So klein, dass man es kaum sehen kann.", "example": "Die winzigen Ameisen liefen über den Tisch.", "is_phrase": false, "pos": "Adjektiv"}, "wippen": {"def": "sich schnell und rhythmisch auf und ab bewegen, wie bei einer schaukelnden Bewegung. Die Locken bewegen sich lebhaft, wenn die Person spricht.", "example": "Ihre langen Haare wippen beim Gehen im Takt ihrer Schritte.", "is_phrase": false, "pos": "Verb"}, "wippt": {"def": "Den Fuß schnell und rhythmisch auf und ab bewegen, meist weil man nervös ist oder ungeduldig wartet.", "example": "Er wippt nervös mit dem Fuß, während er auf das Ergebnis wartet.", "is_phrase": false, "pos": "Verb"}, "wirklich": {"def": "Betont, dass etwas tatsächlich so ist oder nicht so ist. Wird verwendet, um eine Aussage zu verstärken.", "example": "Ich bin wirklich müde und möchte nach Hause gehen.", "is_phrase": false, "pos": "Adverb"}, "woanders": {"def": "An einem anderen Ort, nicht hier. Man verwendet es, wenn man sich wünscht, an einem anderen Platz zu sein.", "example": "Nach dem Streit wollte sie nur noch woanders sein und verließ das Zimmer.", "is_phrase": false, "pos": "Adverb"}, "wochen": {"def": "Ein Zeitraum von sieben Tagen. Mehrere Wochen bedeutet einen längeren Zeitraum von mehreren mal sieben Tagen.", "example": "Meine Schwester ist für drei Wochen in den Urlaub gefahren.", "is_phrase": false, "pos": "Substantiv"}, "wollte": {"def": "Eine Form von 'wollen' in der Vergangenheit. Es bedeutet, dass man in der Vergangenheit den Wunsch oder die Absicht hatte, etwas zu tun.", "example": "Sie wollte ihren Freund anrufen, aber ihr Handy war leer.", "is_phrase": false, "pos": "Verb"}, "wort": {"def": "Ein Begriff oder Ausdruck, der verwendet wird, um etwas zu beschreiben oder zu benennen. Hier geht es darum, dass ein kleiner Begriff nicht ausreicht, um ein großes oder komplexes Gefühl richtig auszudrücken.", "example": "Das Wort 'Liebe' ist zu klein für alles, was ich für dich empfinde.", "is_phrase": false, "pos": "Substantiv"}, "worte": {"def": "Das, was jemand sagt oder spricht. Hier sind es die Sätze, die die Person mit den roten Lippen ausspricht.", "example": "Seine freundlichen Worte haben mich sehr getröstet.", "is_phrase": false, "pos": "Substantiv"}, "wusste": {"def": "Ein Gefühl oder eine Ahnung haben, dass etwas wahr ist, ohne es genau erklären zu können. Man spürt etwas tief im Inneren, obwohl man keine klaren Beweise hat.", "example": "Sie wusste sofort, dass mit ihrem Freund etwas nicht stimmte, auch wenn er nichts gesagt hatte.", "is_phrase": false, "pos": "Verb"}, "während": {"def": "Zeigt an, dass zwei Dinge zur gleichen Zeit passieren. Es verbindet zwei Sätze, die gleichzeitig stattfinden.", "example": "Ich koche das Essen, während mein Mann den Tisch deckt.", "is_phrase": false, "pos": "Konjunktion"}, "wär": {"def": "Kurze Form von 'wäre' im Konjunktiv. Man benutzt es, wenn man über etwas spricht, das nicht wirklich ist oder nur möglich ist.", "example": "Er tut so, als wär er krank, aber ich glaube ihm nicht.", "is_phrase": false, "pos": "Verb"}, "wäre": {"def": "Eine Form von 'sein' im Konjunktiv, die verwendet wird, um etwas Irreales, Hypothetisches oder Vergleichendes auszudrücken. Man benutzt es oft in Vergleichen mit 'als' oder in irrealen Situationen.", "example": "Sie schaute mich an, als wäre ich ein Geist.", "is_phrase": false, "pos": "Verb"}, "wünsche": {"def": "Dinge, die man sich sehr stark herbei sehnt oder die man gerne hätte. In Märchen erfüllen gute Feen oft drei Wünsche von Menschen.", "example": "Als Kind träumte sie davon, dass eine Fee kommt und ihre größten Wünsche wahr macht.", "is_phrase": false, "pos": "Substantiv"}, "würde": {"def": "Drückt aus, dass etwas nicht real ist, sondern nur eine Möglichkeit, ein Wunsch oder eine Vorstellung. Man benutzt es für Situationen, die nicht wirklich passieren oder passiert sind.", "example": "Ich würde gerne nach Italien reisen, aber ich habe kein Geld dafür.", "is_phrase": false, "pos": "Hilfsverb"}, "wütend": {"def": "Sehr ärgerlich und böse sein, oft weil man sich ungerecht behandelt fühlt. Man ist dann schlecht gelaunt und reagiert vielleicht aggressiv.", "example": "Nach dem Streit mit seinem Chef war er den ganzen Tag wütend und sprach kaum ein Wort.", "is_phrase": false, "pos": "Adjektiv"}, "zappeln": {"def": "Jemanden in einer unangenehmen oder unsicheren Situation lassen, ohne zu helfen. Die Person muss warten und weiß nicht, was passiert.", "example": "Nach dem Vorstellungsgespräch ließ die Firma den Bewerber drei Wochen zappeln, bevor sie ihm absagte.", "is_phrase": true, "pos": "Redewendung"}, "zehn": {"def": "Die Zahl 10, die hier als kurze Antwort auf eine Frage gesagt wird. Die Person gibt nur diese Zahl als Information und denkt, dass der andere versteht, was gemeint ist.", "example": "Auf die Frage 'Wie viele Gäste kommen?' antwortete sie nur: 'Zehn.'", "is_phrase": false, "pos": "Zahlwort"}, "zeit": {"def": "Die ganze Zeit bedeutet: während der ganzen Dauer, ohne Unterbrechung. Man macht etwas kontinuierlich von Anfang bis Ende.", "example": "Er hat die ganze Zeit am Telefon geredet und mir nicht zugehört.", "is_phrase": true, "pos": "Redewendung"}, "zimmer": {"def": "Ein Raum in einer Wohnung oder einem Haus, in dem man sich aufhält, schläft oder arbeitet. Es ist ein abgeschlossener Bereich mit Wänden, oft mit Fenstern und einer Tür.", "example": "Mein Zimmer ist klein, aber gemütlich eingerichtet.", "is_phrase": false, "pos": "Substantiv"}, "zurück": {"def": "wieder an den Ort kommen, wo man vorher war; von einer Reise oder einem Aufenthalt heimkehren", "example": "Nach dem Urlaub in Italien bin ich gestern zurück nach Hause gekommen.", "is_phrase": false, "pos": "Adverb"}, "zusammengekniffen": {"def": "Die Augen fest schließen und dabei die Augenlider stark zusammendrücken. Man macht das oft, wenn man sich sehr konzentriert oder etwas sehr stark hofft.", "example": "Sie kniff die Augen zusammen und wünschte sich, dass der Test gut gelaufen war.", "is_phrase": false, "pos": "Verb"}, "zusammenzureißen": {"def": "Diese Phrase bedeutet: sich selbst kontrollieren und diszipliniert verhalten. Man lernt, seine Gefühle und sein Verhalten unter Kontrolle zu bringen, auch wenn es schwierig ist.", "example": "Nach dem Streit musste er sich zusammenreißen und ruhig bleiben.", "is_phrase": true, "pos": "Redewendung"}, "zweiten": {"def": "bedeutet hier: ein anderer, ein zusätzlicher. Es gibt also noch einen anderen dunkelbraunen Sessel im Raum.", "example": "Im Wohnzimmer stehen zwei Sofas - ich setze mich auf das zweite Sofa.", "is_phrase": false, "pos": "Adjektiv"}, "zähnen": {"def": "Die harten, weißen Teile im Mund, mit denen man kaut und beißt. Sie sind bei jedem Menschen anders geformt.", "example": "Der alte Mann hatte gelbe Zähne vom vielen Rauchen.", "is_phrase": false, "pos": "Substantiv"}, "über": {"def": "zeigt an, wo sich etwas befindet: oberhalb von etwas oder direkt darüber in der Luft", "example": "Über den Dächern der Stadt flogen viele Vögel.", "is_phrase": false, "pos": "Präposition"}, "überhaupt": {"def": "Verstärkt eine Verneinung und bedeutet 'gar nicht' oder 'ganz und gar nicht'. Es macht deutlich, dass etwas komplett ausgeschlossen wird.", "example": "Ich habe überhaupt keine Lust auf diese Party.", "is_phrase": false, "pos": "Adverb"}, "überschüssige": {"def": "zu viel vorhanden; mehr als nötig oder gewünscht", "example": "Nach dem Malen blieb überschüssige Farbe im Pinsel, die er abwischte.", "is_phrase": false, "pos": "Adjektiv"}};

function render() {
  const tb = document.getElementById('tb');
  const raw = "NICHT W\u00dcTEND\n\u201eErz\u00e4hl mir ein bisschen von dir, Daniel.\u201c\nDie Worte kommen aus einem Mund mit gl\u00e4nzend roten Lippen. An den R\u00e4ndern ist das Rot ein bisschen verschmiert. Am liebsten w\u00fcrde ich ein Taschentuch nehmen und das \u00fcbersch\u00fcssige Rot wegwischen.\nDie Lippen geh\u00f6ren Frau Stenzer, die mir in einem dunkelbraunen Sessel gegen\u00fcbersitzt und mich anl\u00e4chelt wie eine gute Fee, die mir gleich drei W\u00fcnsche erf\u00fcllen wird. Sie hat dunkelbraune Locken, die ihr wild um den Kopf flirren und die wippen, wenn sie redet, und ihre riesigen Augen sind gelbgr\u00fcn und irgendwie zu weit offen. Sie tr\u00e4gt einen schlafanzugartigen Overall und an ihren Handgelenken klimpern ungef\u00e4hr dreitausend Armreifen.\nIch sitze in einem zweiten dunkelbraunen Sessel. Die Sessel sind aus Leder. Wenn einer von uns sich bewegt, macht es Furzger\u00e4usche.\n\u201eErz\u00e4hl mir, was immer du m\u00f6chtest\u201c sagt Frau Stenzer.\nIch m\u00f6chte \u00fcberhaupt nichts erz\u00e4hlen und ich m\u00f6chte vor allem woanders sein als hier. Ich bin ja nur hier, damit meine Mutter mich nicht weiter damit nervt. Damit ich lerne, mich \u201ezusammenzurei\u00dfen\u201c.\nFrau Stenzers Riesenaugen gucken mich immer noch an.\n\u201eWas bezahlt meine Mutter Ihnen eigentlich?\u201c, frage ich sie. Eigentlich m\u00fcsste sie mir was erz\u00e4hlen f\u00fcr das Geld, finde ich.\nFrau Stenzer macht den Mund auf und lacht mit gro\u00dfen, schiefen Z\u00e4hnen. Ich wei\u00df nicht, was so lustig ist.\n\u201eWarum bist du so w\u00fctend, Daniel?\u00ab\u201c fragt sie, pl\u00f6tzlich so ernst, als w\u00e4re ich unheilbar krank oder so.\n\u201eIch bin nicht w\u00fctend\u201c, sage ich. Bin ich wirklich nicht.\n\u201eAber du machst diese ... Sachen\u201c, sagt ihr roter Mund.\nDas klingt, als w\u00e4r ich einer, der kleine M\u00e4dchen anfasst.\n\u201eWas macht dich in diesen Situationen so w\u00fctend?\u201c\nEs ist die falsche Frage. Ich bin nicht dabei, wenn ich \u201ediese Sachen\u201c mache.\nFrau Stenzer wartet, w\u00e4hrend drau\u00dfen der Himmel aufrei\u00dft und sich ein Sonnenstrahl ins Zimmer schiebt wie ein Laserstrahl. Staubk\u00f6rner versammeln sich um ihn wie winzige Insekten. In die staubige Stille h\u00e4ngt sich ein Piepen. Es kommt von weit her.\n\u201eDaniel\u201c, sagt Frau Stenzer irgendwann.\nSie tut mir irgendwie leid. Sie klingt so frustriert. Sie ist eine Ente mit offenem Schnabel, die auf ein St\u00fcck trockenes Brot hofft. \u201eSo kommen wir nicht weiter.\u201c\nDas Piepen rutscht aus dem Raum durch meine Ohren in meinen Kopf und wird dort lauter. Frau Stenzer wippt mit dem rechten Fu\u00df. Meine Fingerspitzen kribbeln. Ich hasse diese Frage. Ich bin nicht \u201ew\u00fctend\u201c. Oder vielleicht doch. Es f\u00fchlt sich nicht an wie etwas, das man in ein so kleines Wort quetschen kann.\n\u201eAn wen denkst du, wenn du w\u00fctend bist?\u201c, fragt Frau Stenzer. Schon wieder die falsche Frage. Sie versteht es nicht.\nIch denke nicht, wenn es passiert. Mit einer Explosion im Kopf kann man gar nicht denken.\nJetzt denke ich an meine Mutter und daran, wie sie mich angesehen hat, als sie an meinem Bett sa\u00df. Ich hole tief Luft.\nIch habe versprochen, mir M\u00fche zu geben.\n\u201eAn niemanden\u201c, sage ich schlie\u00dflich.\n\u201eDein Vater hat euch verlassen, ist das richtig?\u201c\nSie wei\u00df doch genau, dass es richtig ist. Das hat ihr meine Mutter doch garantiert alles erz\u00e4hlt. Was haben immer alle mit meinem Vater? Ich meine, ja, er ist weg. Er ist abgehauen. Aber er konnte nicht anders. Er konnte nicht bleiben. Ist eben so gewesen. Wenn ich k\u00f6nnte, w\u00fcrde ich vielleicht auch gehen, denke ich und f\u00fchle mich schlecht f\u00fcr diesen Gedanken.\n\u201eDa warst du .... \u201e Frau Stenzer bl\u00e4ttert in ihren Unterlagen. Ich lasse sie zappeln. \u201eZehn\u201c, sagt sie schlie\u00dflich triumphierend und sieht mich an, als w\u00e4re damit alles klar.\n\u201eIch kann mich kaum daran erinnern\u201c, sage ich.\nIch wei\u00df noch jede Einzelheit dieses Tages.\nEs war so hei\u00df, dass es \u00fcber dem Asphalt flirrte, und die Leute blieben in ihren H\u00e4usern, um sich vor der Sonne zu sch\u00fctzen. Mein Vater trug trotzdem seine Cowboystiefel. Er\nlud Taschen und seine Gitarren in den Kofferraum seines alten Saabs. Ich wei\u00df noch, dass ich dachte, dass er aussieht, als w\u00fcrde er mit seiner Band auf Tour gehen. Ich dachte, wenn ich mir das nur klar genug vorstellte, w\u00e4re es auch so. Dann w\u00fcrde er uns abends aus dem Hotel anrufen und nach ein paar Wochen wieder zur\u00fcck sein.\nEine ganze Weile stand er an seinem Auto und sah zu unserem Haus. Meine Mutter war nicht da, sie war im Reiseb\u00fcro und hat gearbeitet. Es war Mittagszeit und ich dachte, dass sie jeden Moment mit ihrem Fahrrad die Stra\u00dfe heruntergefahren kommen m\u00fcsste. Ich habe die ganze Zeit in die Richtung geguckt, aus der sie immer kam, ich musste gegen die Sonne gucken. Ich habe meine Augen zusammengekniffen und gehofft, dass sie noch rechtzeitig kommt, um meinen Vater aufzuhalten, aber sie tauchte einfach nicht auf. Mir war ganz schwindelig vor Hitze.\nIrgendwann war mein Vater fertig mit Packen und schlug den Kofferraum zu. Ich kann das Ger\u00e4usch noch h\u00f6ren. Ein endg\u00fcltiges, beschissenes Ger\u00e4usch. Ich wollte etwas sagen, ich wollte ihn bitten, dass er bleibt, aber ich habe die ganze Zeit geguckt, wo meine Mutter bleibt, und habe gar nichts gesagt. Ich habe ihn nicht mal angeguckt, weil ich ja die Stra\u00dfe im Auge behalten musste. In den Monaten, nachdem er weg war, habe ich abends im Bett gelegen und immer versucht, mir das Bild meines Vaters in den Kopf zu rufen, wie er in sein Auto stieg. Ich dachte, ich m\u00fcsste mich unbedingt an diesen Moment erinnern, in dem er eingestiegen und weggefahren ist. Und an sein Gesicht dabei. Aber das einzige klare Bild, das ich von ihm von dem Tag habe, ist sein R\u00fccken mit dem schwarzen Shirt, auf dem in Rot Metallica steht, sein arsch- loser Jeanshintern und seine blonden Haare, die immer aussahen, als h\u00e4tten er und Jon Bon Jovi denselben Friseur. An sein Gesicht kann ich mich nicht mehr erinnern.\nIch wei\u00df noch, dass Ozzy im Vorgarten herumsprang und nach Insekten schnappte. Mein Vater hatte ihn mir an dem Morgen mitgebracht. Er stand in meinem Zimmer, Ozzy auf dem Arm. Er hat ihn mir ins Bett gesetzt und Ozzy hat mir das Gesicht abgeleckt und dabei vor Aufregung auf meine Decke gepinkelt, und ich habe ihn auf der Stelle geliebt und es tat vom ersten Moment an weh, weil irgendwas in mir wusste, dass dieses  seltsame pinkelnde Viech ein Abschiedsgeschenk war.\n";
  const tokens = raw.trim().split(/([ \t\n\r]+|[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+)/u);
  let html = '';
  tokens.forEach(tok => {
    if (!tok) return;
    if (/^[ \t]+$/.test(tok)) { html += tok; return; }
    if (/^[\n\r]+$/.test(tok)) { html += '<br>'; return; }
    if (/^[.,!?;:\u201e\u201c\u00bb\u00ab\/\(\)\[\]\-\u2013\u2014]+$/.test(tok)) { html += tok; return; }
    const key = tok.replace(/[^a-zA-Z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df'-]/gu,'')
                   .toLowerCase().replace(/^[-']+|[-']+$/g,'');
    if (key && DICT[key]) {
      const cls = 'w' + (DICT[key].is_phrase ? ' phrase' : '');
      html += '<span class="' + cls + '" data-orig="' + tok + '" onclick="show(event,\'' + key + '\',this)">' + tok + '</span>';
    } else {
      html += tok;
    }
  });
  tb.innerHTML = html;
}

function show(e, k, el) {
  const d = DICT[k]; if (!d) return;

  // Aktives Wort hervorheben
  if (activeEl) activeEl.classList.remove('active');
  activeEl = el || e.currentTarget;
  activeEl.classList.add('active', 'seen');

  // Originalschreibweise aus data-orig holen
  const orig = activeEl.getAttribute('data-orig') || k;

  // Panel befüllen
  document.getElementById('pWord').textContent = orig;
  document.getElementById('pPos').textContent  = d.pos || '';
  document.getElementById('pDef').textContent  = d.def || '';

  const pEx = document.getElementById('pEx');
  if (d.example) {
    pEx.textContent = '\u201e' + d.example + '\u201c';
    pEx.style.display = 'block';
  } else {
    pEx.style.display = 'none';
  }

  const pBadge = document.getElementById('pBadge');
  pBadge.style.display = d.is_phrase ? 'inline-block' : 'none';

  document.getElementById('panelEmpty').style.display   = 'none';
  document.getElementById('panelContent').classList.add('visible');

  // Tracking
  counts[k] = (counts[k]||0)+1;
  log.push({w:k,t:new Date().toISOString(),n:counts[k]});
  pushToSoSci();
}

function pushToSoSci() {
  const payload = {...META,counts,total:log.length,unique:Object.keys(counts).length,log};
  window.parent.postMessage({type:'LOOKUP_DATA',payload},'*');
  try {
    const f = window.parent.document.getElementById('v_LOOKUPS');
    if (f) f.value = JSON.stringify(payload);
  } catch(ex) {}
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
