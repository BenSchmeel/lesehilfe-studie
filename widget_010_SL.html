<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesehilfe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap');
  :root{
    --paper:#faf8f4;--ink:#1a1814;--ink-soft:#4a4540;
    --accent:#8b5e3c;--accent-light:#f0e6d8;
    --panel-bg:#2c2420;--panel-text:#f5f0e8;
    --border:#d4ccc0;--seen-color:#d4b896;
    --panel-width:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink)}

  /* ── Layout: Text links, Panel rechts ── */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1060px;
    margin:0 auto;
    padding:24px 16px 60px;
    gap:20px;
  }
  .main{flex:1;min-width:0;}

  /* ── Erklärungsleiste rechts ── */
  .panel{
    width:var(--panel-width);
    flex-shrink:0;
    position:sticky;
    top:20px;
    background:var(--panel-bg);
    border-radius:8px;
    padding:18px 16px;
    color:var(--panel-text);
    font-size:.88rem;
    line-height:1.65;
    min-height:180px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    transition:opacity .2s;
  }
  .panel-empty{
    opacity:.45;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.82rem;
    color:#9e8a78;
    min-height:120px;
  }
  .panel-content{display:none;}
  .panel-content.visible{display:block;}
  .p-badge{
    display:inline-block;font-size:.7rem;background:#5a3e2b;color:#d4a96a;
    border-radius:3px;padding:1px 7px;margin-bottom:8px;letter-spacing:.04em;
  }
  .p-word{
    font-family:'Lora',serif;font-weight:600;font-size:1.05rem;
    color:#f0d9b8;display:block;margin-bottom:3px;
  }
  .p-pos{
    font-size:.72rem;color:#9e8a78;text-transform:uppercase;
    letter-spacing:.06em;display:block;margin-bottom:8px;
  }
  .p-def{color:#d4c9be;display:block;}
  .p-ex{
    margin-top:10px;font-style:italic;font-size:.82rem;color:#8a7a6e;
    border-top:1px solid rgba(255,255,255,.08);padding-top:9px;display:block;
  }

  /* ── Hinweis oben ── */
  .hint{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:16px;
    padding:9px 14px;background:var(--accent-light);
    border-radius:4px;border-left:3px solid var(--accent);
  }

  /* ── Textbox ── */
  .text-box{
    background:white;border:1px solid var(--border);border-radius:4px;
    padding:32px 36px;line-height:2.05;font-family:'Lora',serif;
    font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.04);
  }

  /* ── Anklickbare Wörter ── */
  .w{
    cursor:pointer;border-bottom:1px dotted var(--accent);
    border-radius:2px;padding:0 1px;transition:background .15s;display:inline;
  }
  .w:hover{background:var(--accent-light);}
  .w.seen{background:var(--accent-light);border-bottom-color:var(--seen-color);color:var(--accent);}
  .w.active{background:var(--accent);color:white;border-bottom-color:transparent;}
  .w.phrase{border-bottom:2px dashed #b07d50;}
  .w.phrase.seen{border-bottom-color:#c9956a;}
  .w.phrase.active{background:var(--accent);color:white;}

  /* ── Legende ── */
  .legend{
    margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-size:.76rem;color:var(--ink-soft);
  }
  .leg-item{display:flex;align-items:center;gap:5px;}

  @media(max-width:700px){
    .layout{flex-direction:column;}
    .panel{width:100%;position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Linke Spalte: Text -->
  <div class="main">
    <div class="hint">
      Klicken Sie auf ein <u style="text-decoration-style:dotted">unterstrichenes Wort</u> – die Erklärung erscheint rechts.
      &nbsp;<span style="border-bottom:2px dashed #b07d50;padding:0 2px">Gestrichelt</span> = Redewendung.
    </div>
    <div class="text-box" id="tb"></div>
    <div class="legend">
      <span class="leg-item"><span style="border-bottom:1px dotted #8b5e3c;padding:0 3px">Wort</span>&nbsp;erklärtes Wort</span>
      <span class="leg-item"><span style="border-bottom:2px dashed #b07d50;padding:0 3px">Phrase</span>&nbsp;Redewendung</span>
      <span class="leg-item"><span style="background:#f0e6d8;border-radius:2px;padding:0 3px">farbig</span>&nbsp;bereits nachgeschlagen</span>
    </div>
  </div>

  <!-- Rechte Spalte: Erklärungsleiste -->
  <div class="panel" id="panel">
    <div class="panel-empty" id="panelEmpty">
      ← Klicken Sie auf ein unterstrichenes Wort
    </div>
    <div class="panel-content" id="panelContent">
      <span class="p-badge" id="pBadge" style="display:none">Redewendung</span>
      <span class="p-word" id="pWord"></span>
      <span class="p-pos"  id="pPos"></span>
      <span class="p-def"  id="pDef"></span>
      <span class="p-ex"   id="pEx" style="display:none"></span>
    </div>
  </div>

</div>
<script>
const DICT = {"abends": {"def": "Am Ende des Tages, wenn es dunkel wird oder schon dunkel ist. Diese Zeit ist normalerweise zwischen 18 und 22 Uhr.", "example": "Wir essen abends meist um sieben Uhr zu Abend.", "is_phrase": false, "pos": "Adverb"}, "abgehauen": {"def": "weggegangen sein, verschwunden sein, einen Ort heimlich oder schnell verlassen haben. Man sagt das, wenn jemand plötzlich weg ist.", "example": "Die Kinder sind vom Spielplatz abgehauen, als es zu regnen begann.", "is_phrase": false, "pos": "Verb"}, "abgeleckt": {"def": "Mit der Zunge über das Gesicht einer Person fahren, um Zuneigung zu zeigen. Das machen besonders Hunde, wenn sie ihre Menschen begrüßen oder ihnen ihre Liebe zeigen wollen.", "example": "Der kleine Welpe sprang auf das Kind zu und leckte ihm fröhlich die Wangen ab.", "is_phrase": false, "pos": "Verb"}, "abschiedsgeschenk": {"def": "Ein Geschenk, das jemand gibt, bevor er weggeht oder sich für immer verabschiedet. Es ist oft das letzte Zeichen der Liebe oder Fürsorge von dieser Person.", "example": "Die Großmutter gab ihrer Enkelin noch eine selbstgestrickte Mütze als Abschiedsgeschenk, bevor sie ins Pflegeheim zog.", "is_phrase": false, "pos": "Substantiv"}, "alten": {"def": "nicht neu, schon viele Jahre benutzt und deshalb nicht mehr modern", "example": "Mein alter Computer ist sehr langsam und macht oft Probleme.", "is_phrase": false, "pos": "Adjektiv"}, "anfasst": {"def": "Kinder oder andere Personen auf eine sexuelle Art berühren, was verboten und sehr schlimm ist. Das Wort wird oft verwendet, wenn man über sexuelle Übergriffe spricht.", "example": "Der Mann wurde verhaftet, weil er Kinder angefasst hatte.", "is_phrase": false, "pos": "Verb"}, "angeguckt": {"def": "Den Blick auf jemanden richten und ihn ansehen. Es ist die umgangssprachliche Form von 'anschauen' oder 'ansehen'.", "example": "Sie hat mich den ganzen Abend nicht angeguckt, obwohl wir am selben Tisch saßen.", "is_phrase": false, "pos": "Verb"}, "angesehen": {"def": "Den Blick auf jemanden richten und ihn betrachten. Es beschreibt, wie jemand mit seinen Augen zu einer anderen Person schaut.", "example": "Der Vater sah sein krankes Kind liebevoll an.", "is_phrase": false, "pos": "Verb"}, "anlächelt": {"def": "jemanden freundlich und warm anschauen und dabei lächeln. Es zeigt, dass die Person nett und hilfsbereit ist.", "example": "Der Arzt anlächelte das Kind beruhigend, bevor er es untersuchte.", "is_phrase": false, "pos": "Verb"}, "anrufen": {"def": "Mit dem Telefon Kontakt zu jemandem aufnehmen und mit dieser Person sprechen.", "example": "Ich rufe meine Mutter jeden Sonntag an, um zu hören, wie es ihr geht.", "is_phrase": false, "pos": "Verb"}, "arm": {"def": "Der Körperteil zwischen Schulter und Hand. Man kann damit Dinge halten oder tragen.", "example": "Das Baby schlief ruhig in den Armen seiner Mutter.", "is_phrase": false, "pos": "Substantiv"}, "armreifen": {"def": "Schmuckstücke aus Metall, die man um das Handgelenk trägt. Sie sind meist rund und haben keine Verschlüsse, sondern werden über die Hand geschoben.", "example": "Meine Großmutter sammelt goldene Armreifen und trägt immer mehrere gleichzeitig.", "is_phrase": false, "pos": "Substantiv"}, "arsch": {"def": "Ein umgangssprachliches Wort, das bedeutet, dass jemand sehr wenig Gesäß hat oder einen flachen Po hat.", "example": "In der engen Jeans sah man, dass er ziemlich arschlos war.", "is_phrase": false, "pos": "Adjektiv"}, "asphalt": {"def": "Ein schwarzes, hartes Material, das man auf Straßen und Wege legt. Es wird sehr heiß in der Sonne.", "example": "Die Kinder können nicht barfuß über den heißen Asphalt laufen.", "is_phrase": false, "pos": "Substantiv"}, "aufregung": {"def": "Ein starkes Gefühl von Freude und Nervosität, wenn etwas Besonderes oder Unerwartetes passiert. Man ist dann sehr lebendig und kann sich manchmal nicht gut kontrollieren.", "example": "Der kleine Hund zitterte vor Aufregung, als sein Besitzer nach Hause kam.", "is_phrase": false, "pos": "Substantiv"}, "aufreißt": {"def": "Wenn der Himmel aufreißt, dann teilen sich plötzlich die Wolken und die Sonne scheint durch. Das passiert oft nach einem Sturm oder bei schlechtem Wetter.", "example": "Nach dem starken Regen riss der Himmel auf und wir konnten endlich wieder die Sonne sehen.", "is_phrase": false, "pos": "Verb"}, "aufzuhalten": {"def": "jemanden davon abhalten, etwas zu tun; jemanden stoppen, bevor er eine Handlung macht", "example": "Die Polizei konnte den Mann aufhalten, bevor er das Gebäude verließ.", "is_phrase": false, "pos": "Verb"}, "auge": {"def": "Etwas aufmerksam beobachten und kontrollieren. Man passt gut auf, damit nichts Schlechtes passiert.", "example": "Der Vater behält seine kleine Tochter auf dem Spielplatz im Auge.", "is_phrase": true, "pos": "Redewendung"}, "augen": {"def": "Die beiden runden Körperteile im Gesicht, mit denen man sehen kann. Sie zeigen oft Gefühle und Gedanken einer Person.", "example": "Der kleine Junge hatte große blaue Augen und schaute neugierig um sich.", "is_phrase": false, "pos": "Substantiv"}, "aussahen": {"def": "Ein Aussehen oder eine Erscheinung haben. Das Verb beschreibt, wie jemand oder etwas wirkt oder erscheint.", "example": "Seine Haare aussahen immer sehr gepflegt und modern.", "is_phrase": false, "pos": "Verb"}, "aussieht": {"def": "Man benutzt diese Phrase, um zu beschreiben, wie jemand wirkt oder erscheint. Es bedeutet, dass die Person einen bestimmten Eindruck macht oder so scheint, als ob etwas Bestimmtes wahr wäre.", "example": "Sie sieht aus, als hätte sie die ganze Nacht nicht geschlafen.", "is_phrase": true, "pos": "Redewendung"}, "auto": {"def": "Ein Fahrzeug mit vier Rädern, das Menschen von einem Ort zum anderen bringt. Man fährt damit auf Straßen und kann mehrere Personen mitnehmen.", "example": "Meine Mutter parkt ihr Auto immer vor dem Supermarkt.", "is_phrase": false, "pos": "Substantiv"}, "band": {"def": "Eine Gruppe von Musikern, die zusammen Musik macht und oft Konzerte gibt. Die Band besteht meist aus mehreren Personen mit verschiedenen Instrumenten.", "example": "Die Band hat gestern Abend in der Stadthalle gespielt.", "is_phrase": false, "pos": "Substantiv"}, "behalten": {"def": "Etwas aufmerksam beobachten und kontrollieren. Man achtet darauf, dass nichts Gefährliches oder Wichtiges passiert.", "example": "Beim Kochen muss ich das Essen im Auge behalten, damit es nicht anbrennt.", "is_phrase": true, "pos": "Redewendung"}, "beschissenes": {"def": "sehr schlecht, unangenehm oder störend (umgangssprachlich, derb). Das Wort drückt starken Ärger oder Abneigung aus.", "example": "Das war ein beschissener Tag - alles ist schiefgegangen.", "is_phrase": false, "pos": "Adjektiv"}, "bett": {"def": "Ein Möbelstück zum Schlafen mit einer Matratze, auf dem man liegt und ruht. Man benutzt es normalerweise nachts zum Schlafen oder wenn man krank ist.", "example": "Das Kind lag krank im Bett und die Mutter brachte ihm eine warme Suppe.", "is_phrase": false, "pos": "Substantiv"}, "bewegt": {"def": "Seine Position ändern oder seinen Körper in eine andere Lage bringen. Zum Beispiel aufstehen, sich umdrehen oder die Arme heben.", "example": "Als sie sich im Bett bewegt hat, ist sie aufgewacht.", "is_phrase": false, "pos": "Verb"}, "bezahlt": {"def": "Geld geben für eine Arbeit oder Leistung. Man gibt einer Person Geld, weil sie etwas für einen macht.", "example": "Der Chef bezahlt seinen Angestellten jeden Monat 2000 Euro.", "is_phrase": false, "pos": "Verb"}, "bild": {"def": "Eine Erinnerung oder Vorstellung von einer Person oder Situation, die man in seinen Gedanken sieht. Es ist wie ein Foto im Kopf, auch wenn man kein echtes Foto hat.", "example": "Nach dem Umzug hatte sie noch lange das Bild ihres alten Zimmers im Kopf.", "is_phrase": false, "pos": "Substantiv"}, "bisschen": {"def": "Ein wenig, etwas, nicht viel. Man benutzt es, wenn man sagen will, dass etwas in kleiner Menge da ist.", "example": "Kannst du mir ein bisschen beim Kochen helfen?", "is_phrase": false, "pos": "Adverb"}, "bitten": {"def": "Jemanden höflich fragen oder darum bitten, etwas zu tun. Man möchte, dass die andere Person etwas Bestimmtes macht.", "example": "Sie bat ihren Bruder, ihr bei den Hausaufgaben zu helfen.", "is_phrase": false, "pos": "Verb"}, "bleiben": {"def": "an einem Ort nicht weggehen, dort sein und nicht verlassen", "example": "Nach dem Streit wollte sie nicht zu Hause bleiben.", "is_phrase": false, "pos": "Verb"}, "bleibt": {"def": "Das bedeutet: wo ist jemand, warum kommt er nicht. Man fragt sich, wo eine Person ist, die man erwartet hat.", "example": "Wir warten schon eine Stunde auf Tom - wo bleibt er denn nur?", "is_phrase": true, "pos": "Redewendung"}, "blieben": {"def": "sich an einem Ort aufhalten und nicht weggehen. Man geht nicht raus oder verlässt den Platz nicht.", "example": "Wegen des Regens blieben wir den ganzen Tag zu Hause.", "is_phrase": false, "pos": "Verb"}, "blonden": {"def": "Eine Haarfarbe, die hell und gelblich ist. Menschen mit blonden Haaren haben natürlich helle Haare oder haben sie gefärbt.", "example": "Meine Schwester hat blonde Haare wie ihr Vater, aber ich habe dunkle Haare wie unsere Mutter.", "is_phrase": false, "pos": "Adjektiv"}, "blättert": {"def": "Die Seiten von Papieren oder einem Buch umdrehen, um etwas zu suchen oder zu lesen. Man bewegt die Blätter mit den Fingern.", "example": "Der Student blättert in seinem Notizbuch, um die richtige Seite zu finden.", "is_phrase": false, "pos": "Verb"}, "bon": {"def": "Jon Bon Jovi ist ein bekannter amerikanischer Rockmusiker und Sänger. Er ist der Frontmann der Band Bon Jovi und war besonders in den 1980er und 1990er Jahren sehr erfolgreich.", "example": "Mein Vater hört immer noch gerne die alten Songs von Jon Bon Jovi aus seiner Jugendzeit.", "is_phrase": true, "pos": "Eigenname"}, "brot": {"def": "Ein Nahrungsmittel aus Mehl, Wasser und anderen Zutaten, das gebacken wird. Menschen essen es oft als Grundnahrungsmittel.", "example": "Die Vögel im Park freuen sich, wenn Besucher ihnen kleine Stücke Brot geben.", "is_phrase": false, "pos": "Substantiv"}, "cowboystiefel": {"def": "Hohe Lederstiefel, die ursprünglich von Cowboys in Amerika getragen wurden. Sie haben meist einen kleinen Absatz und reichen bis zur Wade.", "example": "Er zog seine Cowboystiefel an, bevor er auf das Pferdefest ging.", "is_phrase": false, "pos": "Substantiv"}, "dachte": {"def": "Präteritum von 'denken': eine Meinung oder Vermutung haben; glauben, dass etwas so ist oder war", "example": "Sie dachte, dass der Zug um 10 Uhr abfährt, aber er kam erst um 11 Uhr.", "is_phrase": false, "pos": "Verb"}, "daniel": {"def": "Ein männlicher Vorname. In diesem Text ist Daniel der Name einer Person, mit der andere sprechen.", "example": "Mein Bruder heißt Daniel und geht in die achte Klasse.", "is_phrase": false, "pos": "Eigenname"}, "decke": {"def": "Ein großes Stück Stoff, mit dem man sich im Bett zudeckt, um warm zu bleiben. Man legt sie über den Körper, wenn man schläft.", "example": "Als mir kalt wurde, zog ich mir die warme Decke über die Schultern.", "is_phrase": false, "pos": "Substantiv"}, "denke": {"def": "Mit dem Kopf arbeiten, um etwas zu verstehen oder sich etwas vorzustellen. Auch: seine Gedanken auf etwas richten oder eine Meinung haben.", "example": "Ich denke oft an meine Kindheit zurück.", "is_phrase": false, "pos": "Verb"}, "denken": {"def": "Mit dem Kopf arbeiten und Gedanken haben. Wenn man starke Kopfschmerzen oder Probleme hat, kann man sich nicht konzentrieren.", "example": "Nach dem lauten Konzert konnte ich nicht mehr klar denken.", "is_phrase": false, "pos": "Verb"}, "denkst": {"def": "Mit dem Kopf an eine bestimmte Person erinnern oder sich vorstellen. Hier bedeutet es: welche Person kommt dir in den Sinn, wenn du wütend bist.", "example": "Wenn ich traurig bin, denke ich immer an meine Oma.", "is_phrase": false, "pos": "Verb"}, "denselben": {"def": "Das gleiche wie eine andere Person oder Sache. Wird verwendet, wenn zwei oder mehr Personen exakt die gleiche Sache haben oder benutzen.", "example": "Meine Schwester und ich haben denselben Lieblingssong - wir hören beide gerne 'Bohemian Rhapsody'.", "is_phrase": false, "pos": "Pronomen"}, "draußen": {"def": "außerhalb des Hauses oder Gebäudes, im Freien. Das Gegenteil von 'drinnen'.", "example": "Es regnet draußen, deshalb bleiben wir im Haus.", "is_phrase": false, "pos": "Adverb"}, "drei": {"def": "Die Zahl 3. Hier wird auf das Märchen angespielt, wo gute Feen normalerweise drei Wünsche erfüllen.", "example": "In vielen Märchen darf sich der Held drei Dinge wünschen, wenn er einer Fee begegnet.", "is_phrase": false, "pos": "Zahlwort"}, "dreitausend": {"def": "Hier wird die Zahl übertrieben verwendet, um zu zeigen, dass die Person sehr viele Armreifen trägt. Es sind nicht wirklich dreitausend, sondern einfach ungewöhnlich viele.", "example": "Er hat dreitausend Bücher in seinem Zimmer - überall liegen welche herum.", "is_phrase": false, "pos": "Zahlwort"}, "dunkelbraune": {"def": "Eine sehr dunkle Farbe zwischen Braun und fast Schwarz. Diese Farbe sieht man oft bei Haaren oder Augen.", "example": "Mein Bruder hat dunkelbraune Haare, die fast schwarz aussehen.", "is_phrase": false, "pos": "Adjektiv"}, "dunkelbraunen": {"def": "Eine Farbe, die sehr dunkel und braun ist. Man verwendet es, um die Farbe von Möbeln, Haaren oder anderen Dingen zu beschreiben.", "example": "Der dunkelbraune Tisch passt gut zu den hellen Wänden im Wohnzimmer.", "is_phrase": false, "pos": "Adjektiv"}, "eben": {"def": "Drückt aus, dass etwas halt so war und man es akzeptieren muss. Zeigt eine resignierte oder sachliche Haltung zu einer Situation.", "example": "Der Zug war eben verspätet, da konnte man nichts machen.", "is_phrase": false, "pos": "Modalpartikel"}, "eigentlich": {"def": "Wird verwendet, um eine Frage zu stellen oder etwas zu sagen, was man schon lange wissen oder sagen wollte. Drückt aus, dass man neugierig ist oder dass etwas logisch oder normal sein sollte.", "example": "Was machst du eigentlich den ganzen Tag zu Hause?", "is_phrase": false, "pos": "Adverb"}, "einfach": {"def": "Verstärkt die Aussage und drückt Enttäuschung oder Frustration aus. Bedeutet hier: gar nicht, überhaupt nicht.", "example": "Er hat versprochen zu helfen, aber er kam einfach nicht.", "is_phrase": false, "pos": "Adverb"}, "eingestiegen": {"def": "in ein Fahrzeug (Auto, Bus, Zug) hineingehen oder hineinsteigen, um mitzufahren", "example": "Der Bus hielt an der Haltestelle und viele Fahrgäste sind eingestiegen.", "is_phrase": false, "pos": "Verb"}, "einzelheit": {"def": "Ein kleines Detail oder eine kleine Sache, die zu einem größeren Ereignis gehört. Alle kleinen Teile einer Erinnerung oder Situation.", "example": "Sie konnte sich an jede Einzelheit ihrer Hochzeit erinnern - das Kleid, die Blumen, die Musik.", "is_phrase": false, "pos": "Substantiv"}, "einzige": {"def": "Das alleinige, das eine und nicht mehr. Wird verwendet, um zu betonen, dass es nur diese eine Sache gibt und sonst nichts.", "example": "Das einzige Problem bei der Prüfung war die schwere letzte Aufgabe.", "is_phrase": false, "pos": "Adjektiv"}, "endgültiges": {"def": "völlig, komplett - verstärkt hier die negative Bewertung des Geräuschs. Das Geräusch ist nicht nur schlecht, sondern auf eine endgültige, nicht mehr zu ändernde Weise schrecklich.", "example": "Das war ein endgültiges Versagen - nichts konnte mehr repariert werden.", "is_phrase": false, "pos": "Adjektiv"}, "ente": {"def": "Ein Wasservogel mit flachem Schnabel und Schwimmhäuten an den Füßen. Enten leben oft an Seen oder Flüssen und fressen gerne Brot.", "example": "Im Park fütterte das Kind die Enten am Teich mit Brotkrümeln.", "is_phrase": false, "pos": "Substantiv"}, "erfüllen": {"def": "Jemandem etwas geben, was er sich wünscht. Die Person bekommt das, was sie haben möchte.", "example": "Zum Geburtstag erfüllte ihm seine Mutter seinen größten Wunsch nach einem neuen Fahrrad.", "is_phrase": false, "pos": "Verb"}, "erinnern": {"def": "Wenn man sich an etwas erinnern kann, dann denkt man wieder an etwas aus der Vergangenheit. Man hat es nicht vergessen und kann es wieder in den Kopf holen.", "example": "Ich kann mich noch gut an meinen ersten Schultag erinnern.", "is_phrase": true, "pos": "Redewendung"}, "ernst": {"def": "sehr ruhig und ohne zu lächeln sprechen, weil die Situation wichtig oder schwierig ist. Man zeigt dadurch, dass man sich Sorgen macht oder dass etwas nicht in Ordnung ist.", "example": "Als der Arzt die Diagnose erklärte, wurde sein Gesicht ganz ernst.", "is_phrase": false, "pos": "Adjektiv"}, "ersten": {"def": "Diese Phrase bedeutet: sofort, gleich am Anfang, ohne Verzögerung. Man verwendet sie, wenn etwas direkt beginnt, sobald eine Situation startet.", "example": "Vom ersten Moment an wusste sie, dass dieser Job perfekt für sie war.", "is_phrase": true, "pos": "Redewendung"}, "erzähl": {"def": "Imperativ von 'erzählen': eine Aufforderung an jemanden, etwas zu berichten oder eine Geschichte zu sagen. Man bittet die andere Person, von sich oder einem Erlebnis zu sprechen.", "example": "Erzähl mir doch, wie dein erster Arbeitstag war!", "is_phrase": false, "pos": "Verb"}, "erzählen": {"def": "Jemandem etwas mit Worten mitteilen oder eine Geschichte sagen. Man gibt Informationen weiter oder berichtet über etwas.", "example": "Die Großmutter erzählt den Kindern jeden Abend ein Märchen.", "is_phrase": false, "pos": "Verb"}, "erzählt": {"def": "jemandem Informationen oder Geschichten mit Worten mitteilen. Hier bedeutet es: die Mutter hat der Person alle wichtigen Dinge gesagt.", "example": "Mein Bruder hat mir erzählt, was gestern in der Schule passiert ist.", "is_phrase": false, "pos": "Verb"}, "explosion": {"def": "Ein sehr starker, plötzlicher Schmerz im Kopf, der wie ein Knall oder eine Detonation empfunden wird. Gemeint sind meist sehr heftige Kopfschmerzen oder ein Gefühl, als würde der Kopf platzen.", "example": "Nach dem langen Arbeitstag hatte sie eine richtige Explosion im Kopf und konnte sich nicht mehr konzentrieren.", "is_phrase": false, "pos": "Substantiv"}, "fahrrad": {"def": "Ein Fahrzeug mit zwei Rädern, das man mit den Beinen antreibt. Man sitzt darauf und tritt in die Pedale, um sich fortzubewegen.", "example": "Mein Bruder fährt jeden Tag mit dem Fahrrad zur Arbeit.", "is_phrase": false, "pos": "Substantiv"}, "falsche": {"def": "nicht richtig oder nicht passend für die Situation. Eine Frage, die nicht hilft oder die man in diesem Moment nicht stellen sollte.", "example": "Der Arzt stellte die falsche Frage und machte den Patienten noch nervöser.", "is_phrase": false, "pos": "Adjektiv"}, "fee": {"def": "Eine Fee ist eine magische Gestalt aus Märchen, die Menschen helfen kann und oft Wünsche erfüllt. Hier wird eine freundliche Frau mit einer guten Fee verglichen, weil sie hilfsbereit und freundlich wirkt.", "example": "Die Lehrerin war wie eine gute Fee für die Schüler und half ihnen immer bei ihren Problemen.", "is_phrase": false, "pos": "Substantiv"}, "fertig": {"def": "Eine Tätigkeit ist beendet oder abgeschlossen. Man hat alles gemacht, was nötig war.", "example": "Als sie fertig mit Kochen war, rief sie alle zum Essen.", "is_phrase": true, "pos": "Redewendung"}, "finde": {"def": "Diese Phrase drückt die persönliche Meinung oder Einschätzung des Sprechers aus. Man sagt es am Ende eines Satzes, um zu zeigen, dass das die eigene Ansicht ist.", "example": "Der Film war ziemlich langweilig, finde ich.", "is_phrase": true, "pos": "Redewendung"}, "fingerspitzen": {"def": "Die äußersten Enden der Finger, wo man besonders gut fühlen kann. Dort ist die Haut sehr empfindlich.", "example": "Ich taste mit den Fingerspitzen vorsichtig die raue Oberfläche ab.", "is_phrase": false, "pos": "Substantiv"}, "flirren": {"def": "sich schnell und unruhig hin und her bewegen, wie wenn etwas im Wind tanzt oder zittert", "example": "Ihre blonden Haare flirren in der warmen Sommerluft.", "is_phrase": false, "pos": "Verb"}, "flirrte": {"def": "Wenn die Luft bei großer Hitze zittert und man dadurch alles unscharf und bewegend sieht. Das passiert, wenn es sehr heiß ist und warme Luft nach oben steigt.", "example": "Bei 40 Grad flimmerte es über der Straße, sodass die Autos in der Ferne wie Wellen aussahen.", "is_phrase": false, "pos": "Verb"}, "frage": {"def": "Eine Frage ist etwas, was man fragt, um eine Antwort zu bekommen. Das Verb 'fragen' bedeutet, dass man von jemandem wissen möchte.", "example": "Ich stelle dir eine wichtige Frage: Kommst du morgen mit ins Kino?", "is_phrase": false, "pos": "Substantiv / Verb"}, "fragt": {"def": "Eine Person stellt eine Frage und möchte eine Antwort bekommen. Das Wort wird in Dialogen verwendet, um zu zeigen, wer spricht.", "example": "\"Wie geht es dir heute?\", fragt die Lehrerin ihre Schülerin.", "is_phrase": false, "pos": "Verb"}, "frau": {"def": "Höfliche Anrede für eine erwachsene weibliche Person, die vor dem Nachnamen verwendet wird. Man sagt das zu Frauen, die man nicht persönlich kennt oder zu denen man respektvoll sein möchte.", "example": "Frau Schmidt arbeitet in unserem Büro und ist sehr freundlich.", "is_phrase": false, "pos": "Substantiv"}, "friseur": {"def": "Eine Person, die beruflich Haare schneidet und frisiert. Hier wird scherzhaft gesagt, dass beide Personen den gleichen Haarschnitt haben.", "example": "Die beiden Brüder haben immer die gleiche Frisur - sie gehen wohl zum selben Friseur.", "is_phrase": false, "pos": "Substantiv"}, "frustriert": {"def": "Wenn jemand frustriert ist, fühlt er sich enttäuscht und unzufrieden, weil etwas nicht so läuft, wie er es sich wünscht. Die Person ist ärgerlich, weil sie ihre Ziele nicht erreichen kann.", "example": "Nach dem dritten gescheiterten Versuch war er völlig frustriert und wollte aufgeben.", "is_phrase": false, "pos": "Adjektiv"}, "furzgeräusche": {"def": "Geräusche, die entstehen, wenn Luft aus dem Körper kommt und die wie Pupsen klingen. Hier sind es wahrscheinlich Geräusche von Kleidung, Möbeln oder anderen Gegenständen, die zufällig so klingen.", "example": "Das alte Ledersofa macht immer Furzgeräusche, wenn man sich darauf setzt.", "is_phrase": false, "pos": "Substantiv"}, "fuß": {"def": "Das Körperteil am Ende des Beins, mit dem man geht und steht. Mit dem Fuß kann man auch wippen, das heißt ihn rhythmisch auf und ab bewegen.", "example": "Der Mann bewegte seinen linken Fuß ungeduldig unter dem Tisch hin und her.", "is_phrase": false, "pos": "Substantiv"}, "fühle": {"def": "Wenn man sich schlecht fühlt, hat man ein schlechtes Gewissen oder ist traurig über etwas. Man ist nicht zufrieden mit sich selbst oder einer Situation.", "example": "Nach dem Streit mit meiner Freundin fühle ich mich schlecht und möchte mich entschuldigen.", "is_phrase": true, "pos": "Redewendung"}, "fühlt": {"def": "Diese Phrase bedeutet: einen bestimmten Eindruck haben oder eine bestimmte Wirkung haben. Man benutzt sie, wenn man beschreibt, wie etwas auf einen wirkt oder welchen Eindruck etwas macht.", "example": "Die neue Wohnung fühlt sich sofort wie ein Zuhause an.", "is_phrase": true, "pos": "Redewendung"}, "für": {"def": "zeigt den Grund oder Anlass für etwas an; bedeutet 'wegen' oder 'aufgrund von'", "example": "Ich entschuldige mich für meinen Fehler.", "is_phrase": false, "pos": "Präposition"}, "ganz": {"def": "verstärkt ein Adjektiv und bedeutet 'sehr' oder 'ziemlich'. Es macht das Gefühl oder den Zustand stärker.", "example": "Nach dem langen Lauf war ich ganz müde.", "is_phrase": false, "pos": "Adverb"}, "ganze": {"def": "Bedeutet hier: sehr lange, die komplette Zeit ohne Pause. Es macht die Zeitangabe stärker und zeigt, dass etwas während der gesamten Dauer passiert ist.", "example": "Er hat den ganzen Tag im Garten gearbeitet und ist jetzt sehr müde.", "is_phrase": false, "pos": "Adjektiv"}, "gar": {"def": "Verstärkt eine Verneinung und bedeutet 'überhaupt nicht' oder 'absolut nicht'. Macht deutlich, dass etwas komplett unmöglich ist oder völlig fehlt.", "example": "Nach dem Unfall konnte er gar nicht mehr laufen.", "is_phrase": false, "pos": "Adverb"}, "garantiert": {"def": "Drückt aus, dass man sich ganz sicher ist, dass etwas passiert ist oder passieren wird. Man hat keinen Zweifel daran.", "example": "Er kommt garantiert zu spät, er ist immer unpünktlich.", "is_phrase": false, "pos": "Adverb"}, "gearbeitet": {"def": "Eine Tätigkeit machen, um Geld zu verdienen. Man ist an seinem Arbeitsplatz und macht seine beruflichen Aufgaben.", "example": "Gestern hat mein Vater bis 18 Uhr im Büro gearbeitet.", "is_phrase": false, "pos": "Verb"}, "gedanken": {"def": "Eine Idee oder Vorstellung, die man im Kopf hat. Hier ist es eine Idee, die der Person unangenehm ist und ein schlechtes Gefühl macht.", "example": "Sie hatte den Gedanken, ihre Arbeit zu kündigen, aber sie wusste nicht, ob das richtig wäre.", "is_phrase": false, "pos": "Substantiv"}, "gegenübersitzt": {"def": "jemandem gegenüber sitzen; so sitzen, dass man einer anderen Person direkt ins Gesicht schauen kann", "example": "Der Arzt sitzt mir gegenüber und erklärt die Untersuchungsergebnisse.", "is_phrase": false, "pos": "Verb"}, "geguckt": {"def": "Das ist die Vergangenheitsform von 'gucken'. Es bedeutet: mit den Augen schauen oder blicken, oft in eine bestimmte Richtung oder nach etwas suchen.", "example": "Sie hat aus dem Fenster geguckt, um zu sehen, wer vor der Tür steht.", "is_phrase": false, "pos": "Verb"}, "gehofft": {"def": "sich wünschen, dass etwas Bestimmtes passiert oder eintritt. Man denkt positiv daran, dass etwas gut wird.", "example": "Sie hat gehofft, dass das Wetter am Wochenende schön wird.", "is_phrase": false, "pos": "Verb"}, "gehören": {"def": "jemandem sein, das Eigentum von jemandem sein. Man sagt, wem etwas gehört.", "example": "Das Auto gehört meinem Bruder, nicht mir.", "is_phrase": false, "pos": "Verb"}, "gelbgrün": {"def": "Eine Farbe, die zwischen gelb und grün liegt. Die Augen haben sowohl gelbe als auch grüne Anteile.", "example": "Der Frosch hatte gelbgrüne Haut, die in der Sonne schimmerte.", "is_phrase": false, "pos": "Adjektiv"}, "geld": {"def": "Münzen und Scheine, die man als Bezahlung für etwas gibt oder bekommt. Hier meint die Person: Weil ich bezahlt habe, soll sie mir auch etwas dafür geben.", "example": "Für das Geld, das ich für das Konzert bezahlt habe, erwarte ich eine gute Show.", "is_phrase": false, "pos": "Substantiv"}, "gelegen": {"def": "Das ist die Vergangenheitsform von 'liegen'. Es bedeutet, dass jemand in horizontaler Position war, zum Beispiel im Bett oder auf dem Sofa.", "example": "Nach dem schweren Tag habe ich eine Stunde auf dem Sofa gelegen und mich ausgeruht.", "is_phrase": false, "pos": "Verb"}, "geliebt": {"def": "Sofort starke positive Gefühle für jemanden oder etwas bekommen. Man fühlt sich emotional sehr verbunden, obwohl man sich gerade erst kennengelernt hat.", "example": "Als sie den kleinen Welpen im Tierheim sah, hat sie ihn sofort geliebt und wollte ihn mit nach Hause nehmen.", "is_phrase": false, "pos": "Verb"}, "genau": {"def": "betont, dass jemand etwas sicher und ohne Zweifel weiß. Es macht deutlich, dass die Person die Information bereits hat.", "example": "Maria weiß genau, wann der Zug kommt, sie hat extra nachgeschaut.", "is_phrase": false, "pos": "Adverb"}, "genug": {"def": "In ausreichendem Maß; so stark oder deutlich, dass es für einen bestimmten Zweck reicht. Wird hier verwendet, um den Grad der Klarheit zu beschreiben.", "example": "Wenn du die Aufgabe genau genug erklärst, wird sie jeder verstehen.", "is_phrase": false, "pos": "Adverb"}, "gepinkelt": {"def": "Urin lassen; das machen, was Tiere und Menschen tun, wenn sie auf die Toilette müssen. Hier hat der Hund aus Aufregung nicht kontrollieren können, wann und wo er sein Geschäft macht.", "example": "Der kleine Welpe hat vor Freude auf den Teppich gepinkelt, als sein Besitzer nach Hause kam.", "is_phrase": false, "pos": "Verb"}, "geräusch": {"def": "Ein Ton oder Laut, den man hört. Es kann laut oder leise sein und von verschiedenen Dingen kommen.", "example": "Das Geräusch der Autobremsen war sehr laut.", "is_phrase": false, "pos": "Substantiv"}, "gesagt": {"def": "Das ist die Vergangenheitsform von 'sagen'. Es bedeutet: Wörter sprechen oder etwas mit dem Mund ausdrücken.", "example": "Er hat mir gesagt, dass er morgen nicht kommen kann.", "is_phrase": false, "pos": "Verb"}, "gesetzt": {"def": "Jemanden oder etwas vorsichtig an einen bestimmten Platz bringen und dort hinlegen oder hinstellen. Hier bedeutet es, dass der Hund auf das Bett gelegt wurde.", "example": "Die Mutter hat das kranke Kind ins warme Bett gesetzt.", "is_phrase": false, "pos": "Verb"}, "gesicht": {"def": "Der vordere Teil vom Kopf eines Menschen oder Tieres, wo die Augen, die Nase und der Mund sind.", "example": "Der Hund leckte dem Kind das Gesicht ab und machte es ganz nass.", "is_phrase": false, "pos": "Substantiv"}, "gewesen": {"def": "Das ist die Vergangenheitsform von 'sein'. Man benutzt es mit 'ist' zusammen, um zu sagen, dass etwas in der Vergangenheit so war.", "example": "Das Wetter ist heute schlecht gewesen.", "is_phrase": false, "pos": "Verb"}, "gitarren": {"def": "Musikinstrumente mit Saiten, die man mit den Fingern spielt. Man hält sie in den Armen und macht Musik damit.", "example": "Die Musikerin packte ihre beiden Gitarren nach dem Konzert zusammen.", "is_phrase": false, "pos": "Substantiv"}, "gleich": {"def": "bedeutet hier: sofort, in diesem Moment, ohne zu warten", "example": "Der Arzt kommt gleich zu Ihnen ins Wartezimmer.", "is_phrase": false, "pos": "Adverb"}, "glänzend": {"def": "sehr hell und mit einem schönen Schein, der das Licht reflektiert. Das macht etwas besonders attraktiv und auffällig.", "example": "Sie trug glänzenden Lippenstift, der ihre Lippen sehr schön aussehen ließ.", "is_phrase": false, "pos": "Adjektiv"}, "großen": {"def": "Hier bedeutet es: sehr auffällig und deutlich sichtbar. Die Zähne fallen stark auf, weil sie beim Lachen gut zu sehen sind.", "example": "Der Mann hatte große, weiße Zähne und lächelte freundlich.", "is_phrase": false, "pos": "Adjektiv"}, "gucken": {"def": "Mit den Augen schauen oder blicken. Man verwendet dieses Wort oft in der gesprochenen Sprache statt 'schauen' oder 'sehen'.", "example": "Die Kinder gucken aus dem Fenster und beobachten die Vögel im Garten.", "is_phrase": false, "pos": "Verb"}, "gute": {"def": "Eine gute Fee ist eine Märchenfigur, die Menschen hilft und ihre Wünsche erfüllt. Man verwendet diesen Ausdruck, wenn jemand sehr hilfsbereit ist und einem bei Problemen helfen kann.", "example": "Meine Nachbarin ist wie eine gute Fee - sie hilft mir immer, wenn ich Probleme habe.", "is_phrase": true, "pos": "Redewendung"}, "haare": {"def": "Die dünnen Fäden, die auf dem Kopf wachsen. Hier wird beschrieben, wie die Frisur einer Person aussieht.", "example": "Seine braunen Haare waren so lang, dass sie ihm bis auf die Schultern fielen.", "is_phrase": false, "pos": "Substantiv"}, "habe": {"def": "Das Wort wird zusammen mit anderen Verben verwendet, um die Vergangenheit auszudrücken. Es zeigt, dass etwas bereits passiert ist oder abgeschlossen wurde.", "example": "Ich habe heute früh ein Buch gelesen.", "is_phrase": false, "pos": "Hilfsverb"}, "handgelenken": {"def": "Der Teil des Körpers zwischen der Hand und dem Unterarm. Dort trägt man oft Uhren oder Schmuck wie Armbänder.", "example": "Am Handgelenk trug sie eine goldene Uhr und mehrere bunte Bänder.", "is_phrase": false, "pos": "Substantiv"}, "hasse": {"def": "Ein sehr starkes negatives Gefühl gegen etwas haben. Man mag etwas überhaupt nicht und ärgert sich darüber.", "example": "Sie hasst es, wenn Leute zu spät kommen.", "is_phrase": false, "pos": "Verb"}, "haus": {"def": "Ein Gebäude, in dem Menschen wohnen. Es hat Zimmer, Türen und Fenster und ist der Ort, wo eine Familie oder Person zu Hause ist.", "example": "Das neue Haus hat einen großen Garten und vier Zimmer.", "is_phrase": false, "pos": "Substantiv"}, "heiß": {"def": "Eine sehr hohe Temperatur haben, die unangenehm oder schwer zu ertragen ist. Wenn es heiß ist, schwitzt man und sucht Schatten oder kühle Orte.", "example": "Im Sommer wird es oft so heiß, dass man viel Wasser trinken muss.", "is_phrase": false, "pos": "Adjektiv"}, "herumsprang": {"def": "sich schnell und lebhaft an verschiedenen Stellen hin und her bewegen. Das Tier macht viele kleine Sprünge in unterschiedliche Richtungen.", "example": "Der kleine Hund sprang im Park herum und wollte mit anderen Hunden spielen.", "is_phrase": false, "pos": "Verb"}, "heruntergefahren": {"def": "Mit dem Fahrrad eine Straße entlang nach unten fahren, von oben kommend. Das Wort beschreibt eine Bewegung mit dem Fahrrad in Richtung des Sprechers.", "example": "Jeden Morgen sehe ich die Kinder mit ihren Schulrädern den Berg heruntergefahren kommen.", "is_phrase": false, "pos": "Verb"}, "himmel": {"def": "Wenn der Himmel aufreißt, dann teilen sich plötzlich die dunklen Wolken und die Sonne scheint durch. Das passiert oft nach einem Gewitter oder Regen.", "example": "Nach dem starken Regen riss der Himmel auf und wir konnten endlich wieder die Sonne sehen.", "is_phrase": true, "pos": "Redewendung"}, "hitze": {"def": "Sehr warme oder heiße Temperatur, die unangenehm ist. Kann dazu führen, dass man sich schlecht fühlt oder Probleme bekommt.", "example": "Bei der großen Hitze im Sommer trinke ich sehr viel Wasser.", "is_phrase": false, "pos": "Substantiv"}, "hofft": {"def": "Wenn man auf etwas hofft, dann wünscht man sich sehr, dass etwas Bestimmtes passiert. Man wartet darauf und glaubt, dass es möglich ist.", "example": "Der kranke Mann hofft auf eine schnelle Heilung.", "is_phrase": true, "pos": "Redewendung"}, "hole": {"def": "Wenn man tief Luft holt, atmet man bewusst langsam und kräftig ein. Das macht man oft, um sich zu beruhigen oder um Kraft für etwas zu sammeln.", "example": "Vor der wichtigen Prüfung holte sie tief Luft und ging dann ins Klassenzimmer.", "is_phrase": true, "pos": "Redewendung"}, "hotel": {"def": "Ein Gebäude mit vielen Zimmern, in dem Reisende gegen Bezahlung übernachten können. Man bekommt dort ein Zimmer mit Bett und meist auch ein Badezimmer.", "example": "Wir haben für unseren Urlaub ein schönes Hotel am Meer gebucht.", "is_phrase": false, "pos": "Substantiv"}, "hängt": {"def": "Ein Geräusch beginnt plötzlich und unterbricht die Ruhe. Das Piepen kommt in die stille Atmosphäre hinein.", "example": "In die Ruhe der Nacht hängt sich das Klingeln des Telefons.", "is_phrase": true, "pos": "Verb"}, "hätten": {"def": "Konjunktiv II von 'haben' - wird hier benutzt, um eine Vermutung oder einen Vergleich auszudrücken. Es bedeutet: so wie wenn sie beide zum gleichen Friseur gehen würden.", "example": "Seine Kleidung war so teuer, als hätte er im Lotto gewonnen.", "is_phrase": false, "pos": "Verb"}, "häusern": {"def": "Gebäude, in denen Menschen wohnen. Das sind zum Beispiel Einfamilienhäuser, Wohnungen in Mehrfamilienhäusern oder andere Wohngebäude.", "example": "Bei dem starken Regen gingen alle schnell in ihre Häuser.", "is_phrase": false, "pos": "Substantiv"}, "hören": {"def": "Mit den Ohren wahrnehmen, was um einen herum passiert. Man bekommt Töne oder Geräusche mit.", "example": "Draußen kann ich die Vögel singen hören.", "is_phrase": false, "pos": "Verb"}, "ins": {"def": "Eine Verschmelzung von 'in' und 'das'. Zeigt eine Bewegung oder Richtung in einen Raum oder Bereich hinein.", "example": "Die Katze springt ins Wohnzimmer und versteckt sich unter dem Sofa.", "is_phrase": false, "pos": "Präposition + Artikel"}, "insekten": {"def": "Kleine Tiere mit sechs Beinen, wie Käfer, Fliegen oder Ameisen. Sie sind meist sehr klein und können oft fliegen oder krabbeln.", "example": "Im Sommer fliegen viele Insekten um die Lampe herum.", "is_phrase": false, "pos": "Substantiv"}, "irgendwann": {"def": "zu einem nicht genau bestimmten Zeitpunkt; nach einer gewissen Zeit", "example": "Irgendwann klingelte das Telefon und unterbrach unser Gespräch.", "is_phrase": false, "pos": "Adverb"}, "irgendwas": {"def": "Ein unbestimmtes Gefühl oder eine Ahnung, die man nicht genau erklären kann. Man spürt etwas, aber weiß nicht genau was es ist.", "example": "Irgendwas sagte mir, dass mit meinem Freund etwas nicht stimmte, obwohl er normal wirkte.", "is_phrase": false, "pos": "Pronomen"}, "irgendwie": {"def": "Drückt aus, dass man etwas nicht genau beschreiben oder erklären kann. Man hat ein Gefühl oder einen Eindruck, aber kann es nicht präzise sagen.", "example": "Das Essen schmeckt irgendwie seltsam, aber ich weiß nicht warum.", "is_phrase": false, "pos": "Adverb"}, "jeanshintern": {"def": "Der Po einer Person, wie er in einer Jeans aussieht. Das Wort beschreibt die Form des Hinterns, wenn jemand eine Jeans trägt.", "example": "In der engen Jeans sah man deutlich ihren Jeanshintern.", "is_phrase": false, "pos": "Substantiv"}, "jon": {"def": "Jon ist ein männlicher Vorname. Hier wird auf Jon Bon Jovi Bezug genommen, einen bekannten amerikanischen Rockmusiker.", "example": "Mein Freund Jon spielt Gitarre in einer Band.", "is_phrase": false, "pos": "Eigenname"}, "jovi": {"def": "Jon Bon Jovi ist ein berühmter amerikanischer Rockmusiker und Sänger. Er ist bekannt für seine lange, blonde Frisur aus den 1980er und 1990er Jahren.", "example": "Mein Bruder trägt seine Haare lang und wellig wie Jon Bon Jovi früher.", "is_phrase": false, "pos": "Eigenname"}, "kam": {"def": "Vergangenheitsform von 'kommen': sich von einem Ort zu einem anderen Ort bewegen. Hier bedeutet es, dass eine Person regelmäßig aus einer bestimmten Richtung angekommen ist.", "example": "Der Bus kam jeden Tag um 8 Uhr von der Hauptstraße.", "is_phrase": false, "pos": "Verb"}, "kaum": {"def": "fast gar nicht; nur sehr wenig oder schwer. Man verwendet es, wenn etwas fast unmöglich ist oder nur sehr schwach vorhanden ist.", "example": "Nach dem Unfall konnte sie kaum noch laufen.", "is_phrase": false, "pos": "Adverb"}, "klar": {"def": "verständlich, deutlich, so dass man es gut verstehen kann. Wenn etwas klar ist, gibt es keine Fragen oder Probleme mehr.", "example": "Nach der Erklärung war mir endlich klar, wie die Aufgabe funktioniert.", "is_phrase": false, "pos": "Adjektiv"}, "klare": {"def": "deutlich und scharf in der Erinnerung; gut sichtbar und nicht verschwommen oder ungenau", "example": "Nach dem Unfall hatte sie nur noch ein klares Bild von dem roten Auto im Kopf.", "is_phrase": false, "pos": "Adjektiv"}, "kleine": {"def": "Jung, noch nicht erwachsen. Hier bezieht sich 'kleine Mädchen' auf Kinder, die besonders schutzbedürftig sind.", "example": "Der Lehrer arbeitet gern mit kleinen Kindern im Kindergarten.", "is_phrase": false, "pos": "Adjektiv"}, "kleines": {"def": "bedeutet hier: kurz, mit wenig Buchstaben oder Silben. Das Wort hat nicht genug Platz, um ein großes oder komplexes Gefühl auszudrücken.", "example": "Das kleine Wort 'Liebe' kann nicht alles beschreiben, was ich für dich empfinde.", "is_phrase": false, "pos": "Adjektiv"}, "klimpern": {"def": "Ein helles, metallisches Geräusch machen, wenn mehrere kleine Gegenstände aus Metall aneinander stoßen oder sich bewegen.", "example": "Die Münzen in seiner Hosentasche klimpern, als er die Treppe hinaufgeht.", "is_phrase": false, "pos": "Verb"}, "klingt": {"def": "einen bestimmten Eindruck machen, wenn man etwas hört; so wirken, als ob etwas so ist", "example": "Deine Stimme klingt müde - hast du schlecht geschlafen?", "is_phrase": false, "pos": "Verb"}, "kofferraum": {"def": "Der Raum hinten im Auto, wo man Gepäck, Einkäufe oder andere Gegenstände transportiert. Man kann ihn öffnen und schließen.", "example": "Wir haben alle Koffer für den Urlaub in den Kofferraum gelegt.", "is_phrase": false, "pos": "Substantiv"}, "konnte": {"def": "Vergangenheitsform von 'können'. Drückt aus, dass jemand etwas nicht machen kann, weil es unmöglich ist oder weil andere Dinge ihn daran hindern.", "example": "Sie konnte nicht schlafen, weil die Nachbarn zu laut waren.", "is_phrase": false, "pos": "Verb"}, "kopf": {"def": "Der obere Teil des Körpers, wo das Gehirn ist und wo man denkt und fühlt. Hier werden Gedanken, Gefühle und Sinneseindrücke verarbeitet.", "example": "Nach dem lauten Konzert hatte sie Schmerzen im Kopf und konnte sich nicht konzentrieren.", "is_phrase": false, "pos": "Substantiv"}, "krank": {"def": "Wenn jemand krank ist, hat er eine Krankheit und fühlt sich nicht gut. Man geht zum Arzt, wenn man krank ist.", "example": "Lisa ist heute krank und kann nicht zur Schule gehen.", "is_phrase": false, "pos": "Adjektiv"}, "kribbeln": {"def": "Ein leichtes, prickelndes Gefühl auf der Haut haben, wie kleine Nadeln oder elektrische Impulse. Das passiert oft, wenn man aufgeregt ist oder wenn die Hand eingeschlafen war.", "example": "Nach dem langen Sitzen kribbeln meine Beine, weil sie eingeschlafen sind.", "is_phrase": false, "pos": "Verb"}, "könnte": {"def": "Konjunktiv II von 'können' - drückt aus, dass etwas möglich wäre, aber nicht sicher ist oder nicht passiert. Wird oft in irrealen Situationen verwendet.", "example": "Wenn ich mehr Zeit hätte, könnte ich dir helfen.", "is_phrase": false, "pos": "Verb"}, "lacht": {"def": "Ein Geräusch machen, wenn man fröhlich ist oder etwas lustig findet. Dabei öffnet man den Mund und macht Geräusche wie 'ha ha ha'.", "example": "Das Kind lacht laut, weil der Clown so komisch aussieht.", "is_phrase": false, "pos": "Verb"}, "laserstrahl": {"def": "Ein sehr dünner, gerader und heller Lichtstrahl, der wie eine scharfe Linie aussieht. Hier wird das Wort als Vergleich benutzt, um zu zeigen, dass der Sonnenstrahl sehr scharf und direkt ins Zimmer fällt.", "example": "Das Licht der Taschenlampe war so fokussiert, dass es wie ein Laserstrahl durch die Dunkelheit schnitt.", "is_phrase": false, "pos": "Substantiv"}, "lasse": {"def": "Jemanden warten lassen und dabei nichts tun, obwohl man helfen könnte. Die Person ist nervös und unsicher, weil sie nicht weiß, was passiert.", "example": "Der Chef lässt die Bewerber zappeln und sagt ihnen erst nach einer Woche, ob sie den Job bekommen.", "is_phrase": true, "pos": "Redewendung"}, "lauter": {"def": "Das Geräusch wird stärker und man hört es besser. Es ist das Gegenteil von leiser.", "example": "Die Musik wurde immer lauter, bis ich mir die Ohren zuhalten musste.", "is_phrase": false, "pos": "Adjektiv"}, "leder": {"def": "Ein Material, das aus der Haut von Tieren gemacht wird. Man verwendet es für Schuhe, Taschen, Möbel und Kleidung.", "example": "Meine neue Jacke ist aus echtem Leder und sehr warm.", "is_phrase": false, "pos": "Substantiv"}, "leid": {"def": "Wenn man sagt, dass einem jemand leidtut, dann hat man Mitleid mit dieser Person. Man fühlt sich traurig, weil es der anderen Person schlecht geht oder sie Probleme hat.", "example": "Der alte Mann tut mir leid, weil er ganz allein lebt.", "is_phrase": true, "pos": "Redewendung"}, "lerne": {"def": "Sich eine neue Fähigkeit oder ein neues Verhalten aneignen. Hier bedeutet es: durch Übung die Fähigkeit entwickeln, sich zu beherrschen.", "example": "Nach dem Streit will sie lernen, ruhiger zu reagieren.", "is_phrase": false, "pos": "Verb"}, "leute": {"def": "Menschen im Allgemeinen, Personen. Das Wort wird oft verwendet, wenn man über mehrere Menschen spricht, ohne sie genau zu benennen.", "example": "Viele Leute gehen am Wochenende in den Park spazieren.", "is_phrase": false, "pos": "Substantiv"}, "liebsten": {"def": "Bedeutet: mehr als alles andere möchten, der größte Wunsch sein. Man benutzt es, um zu sagen, was man von allen Möglichkeiten bevorzugt.", "example": "Am liebsten würde ich den ganzen Tag im Bett bleiben und lesen.", "is_phrase": true, "pos": "Redewendung"}, "lippen": {"def": "Die beiden weichen Teile um den Mund herum. Sie können verschiedene Farben haben, zum Beispiel durch Lippenstift.", "example": "Sie trug roten Lippenstift auf ihren Lippen.", "is_phrase": false, "pos": "Substantiv"}, "locken": {"def": "Haare, die sich von Natur aus drehen und rund wachsen, nicht gerade. Sie haben eine spiralförmige Form.", "example": "Das kleine Mädchen hat blonde Locken, die sehr schön aussehen.", "is_phrase": false, "pos": "Substantiv"}, "loser": {"def": "Beschreibt eine Jeans, die sehr locker sitzt und am Hintern nicht eng anliegt. Die Hose hängt herunter und formt den Körper nicht.", "example": "Seine lose sitzende Jeans war viel zu groß für ihn.", "is_phrase": false, "pos": "Adjektiv"}, "lud": {"def": "etwas in ein Auto, einen Container oder einen anderen Ort hineinbringen und dort verstauen. Es ist die Vergangenheitsform von 'laden'.", "example": "Sie lud ihre Koffer in das Taxi und fuhr zum Flughafen.", "is_phrase": false, "pos": "Verb"}, "luft": {"def": "Diese Phrase bedeutet: man atmet bewusst tief ein, meist um sich zu beruhigen oder um Kraft zu sammeln. Man macht das oft, wenn man nervös ist oder sich auf etwas Schwieriges vorbereitet.", "example": "Vor dem wichtigen Gespräch mit dem Chef holte sie tief Luft und ging dann ins Büro.", "is_phrase": true, "pos": "Redewendung"}, "lustig": {"def": "komisch oder zum Lachen, oft auch seltsam oder merkwürdig. Man verwendet es, wenn man nicht versteht, warum andere Menschen lachen oder sich freuen.", "example": "Es ist lustig, dass er immer zu spät kommt, aber nie eine Entschuldigung hat.", "is_phrase": false, "pos": "Adjektiv"}, "mache": {"def": "etwas tun oder ausführen. Hier bedeutet es: bestimmte Aktivitäten oder Handlungen durchführen.", "example": "Wenn ich Hausaufgaben mache, denke ich oft an andere Dinge.", "is_phrase": false, "pos": "Verb"}, "machst": {"def": "Du tust etwas oder führst eine Handlung aus. Es ist die 2. Person Singular von dem Verb 'machen'.", "example": "Du machst deine Hausaufgaben jeden Tag nach der Schule.", "is_phrase": false, "pos": "Verb"}, "mal": {"def": "verstärkt eine Verneinung und bedeutet 'nicht einmal' oder 'überhaupt nicht'. Es macht deutlich, dass etwas wirklich gar nicht passiert ist.", "example": "Sie hat mir nicht mal geantwortet, obwohl ich dreimal geschrieben habe.", "is_phrase": false, "pos": "Partikel"}, "metallica": {"def": "Eine sehr bekannte amerikanische Metal-Band, die in den 1980er und 1990er Jahren sehr populär war. Viele Menschen tragen T-Shirts mit dem Namen dieser Band.", "example": "Mein Bruder ist ein großer Fan von Metallica und hat mehrere ihrer CDs.", "is_phrase": false, "pos": "Eigenname"}, "mitgebracht": {"def": "Etwas von einem anderen Ort holen und zu jemandem bringen. Der Vater war woanders und hat etwas geholt, um es seinem Kind zu geben.", "example": "Meine Mutter hat mir aus der Stadt ein neues Buch mitgebracht.", "is_phrase": false, "pos": "Verb"}, "mittagszeit": {"def": "Die Zeit um die Mitte des Tages, normalerweise zwischen 11 und 14 Uhr. In dieser Zeit essen viele Menschen ihr Mittagessen.", "example": "Zur Mittagszeit sind die Restaurants immer sehr voll.", "is_phrase": false, "pos": "Substantiv"}, "moment": {"def": "Ein sehr kurzer Zeitpunkt oder Augenblick. Man benutzt das Wort, wenn etwas genau zu einer bestimmten Zeit passiert oder passieren wird.", "example": "In dem Moment, als der Regen anfing, rannten alle Menschen unter die Dächer.", "is_phrase": false, "pos": "Substantiv"}, "monaten": {"def": "Ein Zeitraum von mehreren Monaten. Hier bedeutet es die Zeit nach dem Weggang des Vaters.", "example": "In den ersten Monaten nach dem Umzug war alles noch sehr fremd für mich.", "is_phrase": false, "pos": "Substantiv"}, "morgen": {"def": "Der erste Teil des Tages, die Zeit zwischen dem Aufwachen und dem Mittag. Hier ist ein bestimmter Morgen in der Vergangenheit gemeint.", "example": "An jenem Morgen war das Wetter besonders schön.", "is_phrase": false, "pos": "Substantiv"}, "mund": {"def": "Der Körperteil im Gesicht, mit dem man spricht, isst und küsst. Er besteht aus den Lippen und der Öffnung dazwischen.", "example": "Sie öffnete den Mund, um etwas zu sagen.", "is_phrase": false, "pos": "Substantiv"}, "musste": {"def": "Vergangenheitsform von müssen - zeigt an, dass etwas nötig war oder man keine andere Wahl hatte. Man war gezwungen, etwas zu tun.", "example": "Sie musste früh aufstehen, weil der Zug schon um 6 Uhr fuhr.", "is_phrase": false, "pos": "Verb"}, "mutter": {"def": "Die Frau, die ein Kind geboren hat und es großzieht. Sie ist ein Elternteil und kümmert sich um ihr Kind.", "example": "Meine Mutter kocht jeden Sonntag ein großes Familienessen für uns alle.", "is_phrase": false, "pos": "Substantiv"}, "mädchen": {"def": "Weibliche Kinder oder Jugendliche, die noch nicht erwachsen sind. In diesem Kontext geht es um den Vorwurf, dass jemand Kinder auf eine schlechte Art berührt.", "example": "Die Eltern passen gut auf ihre kleinen Mädchen auf, damit ihnen nichts passiert.", "is_phrase": false, "pos": "Substantiv"}, "möchte": {"def": "Drückt einen Wunsch oder eine Präferenz aus, oft höflicher als 'wollen'. Zeigt, was man gern hätte oder tun würde.", "example": "Ich möchte heute früh nach Hause gehen, weil ich müde bin.", "is_phrase": false, "pos": "Verb"}, "möchtest": {"def": "Du willst etwas gern tun oder haben. Es ist die höfliche Form von 'wollen' in der 2. Person Singular.", "example": "Was möchtest du heute zum Abendessen essen?", "is_phrase": false, "pos": "Verb"}, "mühe": {"def": "Das bedeutet: sich anstrengen und sein Bestes versuchen. Man will etwas gut machen und gibt nicht so schnell auf.", "example": "Bei der schweren Prüfung werde ich mir richtig Mühe geben und viel lernen.", "is_phrase": true, "pos": "Redewendung"}, "müsste": {"def": "Konjunktiv II von 'müssen' - drückt aus, dass etwas logisch richtig oder normal wäre, oder zeigt eine höfliche Vermutung. Wird auch für Wünsche oder Ratschläge verwendet.", "example": "Du müsstest eigentlich schon zu Hause sein, wenn der Zug pünktlich war.", "is_phrase": false, "pos": "Verb"}, "nachdem": {"def": "Drückt aus, dass etwas zu einem Zeitpunkt nach einem anderen Ereignis passiert ist. Bedeutet 'nach der Zeit, als' oder 'seit'.", "example": "Nachdem ich das Studium beendet hatte, zog ich in eine andere Stadt.", "is_phrase": false, "pos": "Konjunktion"}, "nehmen": {"def": "etwas in die Hand greifen und benutzen. Man will einen Gegenstand verwenden, um etwas damit zu machen.", "example": "Ich nehme einen Stift und schreibe einen Brief.", "is_phrase": false, "pos": "Verb"}, "nervt": {"def": "Jemanden immer wieder stören oder ärgern, bis die Person genervt ist. Man macht etwas, was die andere Person nicht will, und hört nicht damit auf.", "example": "Mein kleiner Bruder nervt mich jeden Tag, weil er immer meine Sachen nimmt.", "is_phrase": false, "pos": "Verb"}, "niemanden": {"def": "Akkusativ von 'niemand' - bedeutet 'keine Person'. Man benutzt es als Antwort auf Fragen wie 'An wen denkst du?' oder 'Wen liebst du?'", "example": "Wen willst du heute besuchen? - Niemanden, ich bleibe zu Hause.", "is_phrase": false, "pos": "Pronomen"}, "offen": {"def": "Wenn Augen weit offen sind, bedeutet das, dass die Augenlider sehr weit auseinander stehen und die Augen dadurch groß und auffällig wirken. Das kann ein Zeichen für Überraschung, Neugier oder lebhafte Aufmerksamkeit sein.", "example": "Das kleine Mädchen schaute mit weit offenen Augen auf das bunte Feuerwerk am Himmel.", "is_phrase": false, "pos": "Adjektiv"}, "offenem": {"def": "Der Schnabel ist nicht geschlossen, sondern aufgemacht. Die Ente hat den Mund offen, weil sie Hunger hat und auf Futter wartet.", "example": "Der hungrige Hund saß mit offenem Maul vor seinem leeren Napf.", "is_phrase": false, "pos": "Adjektiv"}, "ohren": {"def": "Die beiden Körperteile am Kopf, mit denen man hört. Geräusche gehen durch die Ohren in den Kopf.", "example": "Die Musik war so laut, dass sie mir in den Ohren wehgetan hat.", "is_phrase": false, "pos": "Substantiv"}, "overall": {"def": "Ein einteiliges Kleidungsstück, das Oberteil und Hose zusammen verbindet. Man trägt es oft bei der Arbeit oder als bequeme Kleidung.", "example": "Der Mechaniker zog seinen blauen Overall an, bevor er das Auto reparierte.", "is_phrase": false, "pos": "Substantiv"}, "ozzy": {"def": "Ozzy ist hier der Name eines Hundes. Es ist ein Tiername, den Menschen ihren Haustieren geben.", "example": "Mein Hund Max bellt immer, wenn jemand an der Tür klingelt.", "is_phrase": false, "pos": "Eigenname"}, "paar": {"def": "Ein paar bedeutet eine kleine Anzahl von etwas, nicht sehr viele. Man verwendet es, wenn man nicht genau sagen will oder kann, wie viele es sind.", "example": "Ich brauche noch ein paar Minuten, dann bin ich fertig.", "is_phrase": true, "pos": "Phrase"}, "packen": {"def": "Das Einräumen von Sachen in Koffer, Taschen oder andere Behälter, um sie zu transportieren oder zu verstauen. Man macht das meist vor einer Reise oder einem Umzug.", "example": "Nach dem Packen waren alle Koffer voll und bereit für die Urlaubsreise.", "is_phrase": false, "pos": "Substantiv"}, "passiert": {"def": "geschehen, stattfinden; wenn etwas passiert, dann ereignet es sich oder findet statt", "example": "Was ist denn gestern passiert? Du siehst so müde aus.", "is_phrase": false, "pos": "Verb"}, "piepen": {"def": "Ein hoher, dünner Ton oder Geräusch, das oft von kleinen Geräten oder Tieren kommt. Hier beschreibt es wahrscheinlich ein störendes, durchdringendes Geräusch in der Stille.", "example": "Das Piepen des Rauchmelders störte die ganze Nacht.", "is_phrase": false, "pos": "Substantiv"}, "pinkelnde": {"def": "Das Adjektiv beschreibt ein Tier, das gerade uriniert hat oder oft uriniert. Es wird hier verwendet, um den Hund liebevoll zu charakterisieren.", "example": "Der kleine pinkelnde Welpe war so aufgeregt, dass er nicht aufhören konnte.", "is_phrase": false, "pos": "Adjektiv"}, "plötzlich": {"def": "Von einem Moment auf den anderen, ohne Warnung oder Vorbereitung. Es passiert sehr schnell und unerwartet.", "example": "Sie war gerade noch fröhlich, aber plötzlich wurde sie ganz traurig.", "is_phrase": false, "pos": "Adverb"}, "quetschen": {"def": "etwas Großes oder Komplexes mit Gewalt in etwas Kleines hineinpressen, obwohl es eigentlich nicht hineinpasst", "example": "Man kann nicht alle seine Gefühle in einen kurzen Brief quetschen.", "is_phrase": false, "pos": "Verb"}, "raum": {"def": "Ein Bereich oder Ort um eine Person herum, aus dem Geräusche oder andere Eindrücke kommen. Hier ist gemeint: die Umgebung, aus der das Piepen kommt.", "example": "Die Musik kam aus dem ganzen Raum und umhüllte mich völlig.", "is_phrase": false, "pos": "Substantiv"}, "rechten": {"def": "auf der rechten Seite des Körpers befindlich; das Gegenteil von links", "example": "Er hob die rechte Hand zum Gruß.", "is_phrase": false, "pos": "Adjektiv"}, "rechtzeitig": {"def": "Zur richtigen Zeit, bevor es zu spät ist. So, dass man noch etwas verhindern oder erreichen kann.", "example": "Der Arzt kam rechtzeitig ins Krankenhaus und konnte dem Patienten noch helfen.", "is_phrase": false, "pos": "Adverb"}, "redet": {"def": "Das bedeutet: sprechen oder sich unterhalten. Wenn jemand redet, macht er Worte mit dem Mund.", "example": "Wenn Maria redet, hören alle zu, weil sie eine schöne Stimme hat.", "is_phrase": false, "pos": "Verb"}, "reisebüro": {"def": "Ein Geschäft, wo Menschen Reisen buchen und kaufen können. Dort arbeiten Angestellte, die bei der Planung von Urlaubsreisen helfen.", "example": "Wir gehen ins Reisebüro, um unseren Sommerurlaub zu buchen.", "is_phrase": false, "pos": "Substantiv"}, "richtig": {"def": "wahr; so, wie es wirklich ist; nicht falsch oder gelogen", "example": "Ist es richtig, dass du morgen nach Berlin fährst?", "is_phrase": false, "pos": "Adjektiv"}, "richtung": {"def": "Der Bereich oder die Seite, wo sich etwas befindet oder woher etwas kommt. Man schaut in eine Richtung, um etwas zu sehen oder zu finden.", "example": "Er schaute in die Richtung des Bahnhofs, um zu sehen, ob der Zug schon kommt.", "is_phrase": false, "pos": "Substantiv"}, "riesenaugen": {"def": "sehr große Augen, die besonders auffallen. Das Wort wird oft verwendet, wenn jemand große, weit geöffnete Augen hat, die einen anstarren.", "example": "Das kleine Mädchen schaute mich mit ihren Riesenaugen neugierig an.", "is_phrase": false, "pos": "Substantiv"}, "riesigen": {"def": "sehr groß, auffallend groß. Hier beschreibt es Augen, die besonders groß und ausdrucksvoll sind.", "example": "Das kleine Mädchen schaute mich mit riesigen, neugierigen Augen an.", "is_phrase": false, "pos": "Adjektiv"}, "rot": {"def": "Die rote Farbe als Substanz, zum Beispiel rote Farbe oder roter Lippenstift. Man kann diese rote Substanz sehen, berühren oder wegwischen.", "example": "Das Rot ihrer Lippen war so intensiv, dass es auf dem Glas einen Abdruck hinterließ.", "is_phrase": false, "pos": "Substantiv"}, "roten": {"def": "Die Farbe von Blut oder reifen Tomaten. Hier beschreibt es die Farbe des Lippenstifts.", "example": "Sie trug einen roten Pullover zur Party.", "is_phrase": false, "pos": "Adjektiv"}, "roter": {"def": "Die Farbe rot, hier verwendet um die Lippen einer Person zu beschreiben. Rote Lippen sind ein Zeichen von Schönheit oder können durch Lippenstift entstehen.", "example": "Die Frau trug roten Lippenstift und sah sehr elegant aus.", "is_phrase": false, "pos": "Adjektiv"}, "rufen": {"def": "Etwas bewusst in sein Gedächtnis holen und sich daran erinnern. Man denkt gezielt an etwas aus der Vergangenheit und stellt es sich vor.", "example": "Nach dem Umzug rief sie sich oft die schönen Momente in ihrer alten Heimat ins Gedächtnis.", "is_phrase": true, "pos": "Redewendung"}, "rutscht": {"def": "sich langsam und unbemerkt von einem Ort zu einem anderen bewegen. Das Geräusch bewegt sich hier sanft und unmerklich durch die Ohren in den Kopf.", "example": "Die Musik rutschte leise durch das offene Fenster in mein Zimmer.", "is_phrase": false, "pos": "Verb"}, "rändern": {"def": "Die äußeren Teile oder Kanten von etwas, dort wo es aufhört oder begrenzt ist. Bei einem Bild oder einer gemalten Fläche sind das die Stellen am Ende, nicht in der Mitte.", "example": "Die Blätter werden an den Rändern braun, wenn der Herbst kommt.", "is_phrase": false, "pos": "Substantiv"}, "rücken": {"def": "Der hintere Teil des Oberkörpers eines Menschen, von den Schultern bis zur Taille. Man sieht den Rücken, wenn eine Person von einem wegschaut oder weggeht.", "example": "Als Maria wegging, sah ich nur noch ihren Rücken in der blauen Jacke.", "is_phrase": false, "pos": "Substantiv"}, "saabs": {"def": "Saab ist eine schwedische Automarke. In diesem Text ist damit das Auto dieser Marke gemeint.", "example": "Mein Onkel fährt schon seit zwanzig Jahren einen Saab.", "is_phrase": false, "pos": "Substantiv"}, "sachen": {"def": "Dinge oder Angelegenheiten, die man nicht genau benennen will oder kann. Oft verwendet, wenn etwas unangenehm, peinlich oder schwer zu erklären ist.", "example": "Nach dem Streit wollte sie nicht über diese Sachen sprechen.", "is_phrase": false, "pos": "Substantiv"}, "sage": {"def": "Ein Wort, das man benutzt, wenn man zeigen will, dass jemand etwas spricht oder antwortet. Man verwendet es oft in Geschichten, um zu zeigen, wer gerade redet.", "example": "\"Das weiß ich nicht\", sage ich zu meiner Mutter.", "is_phrase": false, "pos": "Verb"}, "sah": {"def": "Mit den Augen in Richtung von etwas blicken. Man schaut zu einem Ort oder einer Person hin.", "example": "Vom Balkon aus sah sie zu dem Park, wo die Kinder spielten.", "is_phrase": true, "pos": "Redewendung"}, "saß": {"def": "Vergangenheitsform von 'sitzen'. Bedeutet: eine Person war auf einem Stuhl oder an einem Ort und blieb dort für eine Zeit.", "example": "Der Vater saß neben dem kranken Kind und las ihm eine Geschichte vor.", "is_phrase": false, "pos": "Verb"}, "schiebt": {"def": "sich langsam und vorsichtig an einen Ort bewegen oder in einen Raum hineinkommen. Hier wird beschrieben, wie das Sonnenlicht allmählich durch das Fenster ins Zimmer kommt.", "example": "Der Nebel schiebt sich langsam über den See.", "is_phrase": false, "pos": "Verb"}, "schiefen": {"def": "Nicht gerade, sondern krumm oder unregelmäßig geformt. Die Zähne stehen nicht richtig in einer Reihe.", "example": "Der alte Mann hatte schiefe Zähne und ging deshalb selten zum Zahnarzt.", "is_phrase": false, "pos": "Adjektiv"}, "schlafanzugartigen": {"def": "Das bedeutet: wie ein Schlafanzug aussehend oder ähnlich wie ein Schlafanzug. Der Overall sieht bequem und locker aus, so wie Kleidung zum Schlafen.", "example": "Er trug eine schlafanzugartige Hose aus weichem Stoff zur Arbeit.", "is_phrase": false, "pos": "Adjektiv"}, "schlecht": {"def": "Ein unangenehmes Gefühl haben, weil man etwas Falsches gedacht oder getan hat. Man hat ein schlechtes Gewissen.", "example": "Nach dem Streit fühlte sie sich schlecht, weil sie so gemein zu ihrer Schwester war.", "is_phrase": false, "pos": "Adjektiv"}, "schließlich": {"def": "Nach einer längeren Zeit oder nach langem Überlegen. Zeigt an, dass etwas nicht sofort passiert, sondern erst am Ende.", "example": "Nach langem Schweigen antwortete er schließlich auf meine Frage.", "is_phrase": false, "pos": "Adverb"}, "schlug": {"def": "Den Kofferraum mit Kraft schließen, sodass er richtig zugeht. Man macht eine schnelle Bewegung nach unten oder drückt fest zu.", "example": "Nach dem Einkaufen legte sie alle Taschen ins Auto und schlug den Kofferraum zu.", "is_phrase": false, "pos": "Verb"}, "schnabel": {"def": "Der harte, spitze Mund von Vögeln, mit dem sie Futter aufnehmen können. Enten haben einen flachen, breiten Schnabel.", "example": "Der Vogel pickte mit seinem gelben Schnabel die Körner vom Boden auf.", "is_phrase": false, "pos": "Substantiv"}, "schnappte": {"def": "Versuchen, etwas schnell mit dem Maul zu fangen. Ein Tier öffnet und schließt das Maul schnell, um etwas zu bekommen.", "example": "Der Hund schnappte nach dem Ball, den ich ihm zuwarf.", "is_phrase": false, "pos": "Verb"}, "schwarzen": {"def": "Eine Farbe, die dunkel ist wie die Nacht. Das Gegenteil von weiß.", "example": "Er trägt heute eine schwarze Jacke und schwarze Schuhe.", "is_phrase": false, "pos": "Adjektiv"}, "schwindelig": {"def": "Man fühlt sich unsicher und alles dreht sich im Kopf. Das passiert oft bei großer Hitze, Müdigkeit oder Krankheit.", "example": "Nach dem langen Lauf in der Sonne wurde mir schwindelig und ich musste mich hinsetzen.", "is_phrase": false, "pos": "Adjektiv"}, "schützen": {"def": "Etwas tun, damit man sicher ist und keinen Schaden bekommt. Man sorgt dafür, dass etwas Gefährliches oder Unangenehmes einem nicht wehtut.", "example": "Bei dem Sturm schützten wir uns unter einem großen Baum vor dem Regen.", "is_phrase": false, "pos": "Verb"}, "seltsame": {"def": "ungewöhnlich und merkwürdig, nicht so wie man es normalerweise erwartet. Hier beschreibt es ein Tier, das sich komisch verhält und dadurch besonders auffällt.", "example": "Der seltsame Hund bellte nie, sondern machte nur leise Geräusche wie eine Katze.", "is_phrase": false, "pos": "Adjektiv"}, "sessel": {"def": "Ein bequemer Stuhl mit Armlehnen und weicher Polsterung, in dem man sich entspannen kann. Man findet Sessel oft im Wohnzimmer oder in gemütlichen Räumen.", "example": "Nach einem langen Arbeitstag setzte sich Maria in ihren weichen Sessel und las ein Buch.", "is_phrase": false, "pos": "Substantiv"}, "shirt": {"def": "Ein Oberteil aus dünnem Stoff, das man auf der Haut trägt. Es hat meist kurze Ärmel und oft ist etwas darauf gedruckt.", "example": "Er trug ein weißes Shirt mit dem Logo seiner Lieblingsband.", "is_phrase": false, "pos": "Substantiv"}, "situationen": {"def": "Bestimmte Momente oder Umstände, in denen etwas Bestimmtes passiert oder in denen man sich befindet. Hier sind es wahrscheinlich schwierige oder problematische Momente, die Wut auslösen.", "example": "In stressigen Situationen am Arbeitsplatz reagiert er oft sehr gereizt.", "is_phrase": false, "pos": "Substantiv"}, "sitze": {"def": "Eine Position haben, bei der man auf einem Stuhl oder Sessel ist. Der Körper ruht auf dem Möbelstück.", "example": "Meine Oma sitzt gerne in ihrem bequemen Sessel und liest Bücher.", "is_phrase": false, "pos": "Verb"}, "sonne": {"def": "Der helle, warme Stern am Himmel, der uns Licht und Wärme gibt. Man kann nicht direkt in die Sonne schauen, weil das Licht zu hell ist.", "example": "Im Sommer scheint die Sonne so stark, dass man einen Hut braucht.", "is_phrase": false, "pos": "Substantiv"}, "sonnenstrahl": {"def": "Ein Lichtstrahl, der von der Sonne kommt und durch eine Öffnung (wie ein Fenster) in einen Raum fällt. Das Licht ist hell und klar sichtbar.", "example": "Als die Wolken weggingen, fiel ein heller Sonnenstrahl durch das Fenster auf den Tisch.", "is_phrase": false, "pos": "Substantiv"}, "stand": {"def": "Eine Person befindet sich aufrecht an einem Ort und bleibt dort für eine Zeit. Die Person sitzt oder liegt nicht, sondern ist auf den Füßen.", "example": "Meine Schwester stand lange vor dem Spiegel und kämmte sich die Haare.", "is_phrase": false, "pos": "Verb"}, "staubige": {"def": "Diese Art von Stille wirkt alt, vergessen und unberührt, als wäre lange Zeit nichts passiert. Es beschreibt eine sehr ruhige Atmosphäre, die schwer und träge in der Luft liegt.", "example": "Nach Stunden im verlassenen Dachboden durchbrach plötzlich das Klingeln des Telefons die staubige Stille.", "is_phrase": false, "pos": "Adjektiv"}, "staubkörner": {"def": "Sehr kleine Teilchen von Staub, die in der Luft schweben oder sich auf Oberflächen sammeln. Man kann sie oft nur im Sonnenlicht gut sehen.", "example": "Im Sonnenschein sah man die Staubkörner tanzen, die durch das offene Fenster hereinflogen.", "is_phrase": false, "pos": "Substantiv"}, "steht": {"def": "geschrieben ist, zu lesen ist. Wenn Text oder ein Wort irgendwo steht, bedeutet das, dass man es dort lesen kann.", "example": "Auf dem Schild steht 'Eingang verboten'.", "is_phrase": false, "pos": "Verb"}, "stelle": {"def": "Sofort, genau in diesem Moment, ohne zu warten oder zu zögern.", "example": "Als sie den kleinen Welpen sah, wollte sie ihn auf der Stelle adoptieren.", "is_phrase": true, "pos": "Redewendung"}, "stenzer": {"def": "Stenzer ist hier ein Nachname einer Frau. Es ist der Familienname einer Person, die in dem Text als Frau Stenzer bezeichnet wird.", "example": "Herr Müller und Frau Schmidt arbeiten in derselben Firma.", "is_phrase": false, "pos": "Substantiv"}, "stenzers": {"def": "Das ist der Nachname einer Person. Stenzers ist der Familienname von einer Frau.", "example": "Herr Müller und Frau Stenzers arbeiten im gleichen Büro.", "is_phrase": false, "pos": "Eigenname"}, "stieg": {"def": "sich in ein Fahrzeug hineinbewegen, um mitzufahren. Man geht in das Auto hinein und setzt sich hin.", "example": "Jeden Morgen stieg sie in den Bus zur Arbeit.", "is_phrase": false, "pos": "Verb"}, "stille": {"def": "Ein Zustand ohne Geräusche oder Lärm, in dem es sehr ruhig ist. Hier wird die Stille als etwas beschrieben, das man spüren oder fast berühren kann.", "example": "Nach dem Konzert lag eine tiefe Stille über dem Saal.", "is_phrase": false, "pos": "Substantiv"}, "straße": {"def": "Ein Weg in der Stadt oder auf dem Land, auf dem Autos, Fahrräder und Menschen fahren oder gehen können. Sie ist meist geteert oder gepflastert.", "example": "Die Kinder spielen nicht auf der Straße, weil dort viele Autos fahren.", "is_phrase": false, "pos": "Substantiv"}, "stück": {"def": "Ein Teil von etwas Größerem; eine bestimmte Menge von etwas. Hier bedeutet es: ein kleiner Teil von einem Brot.", "example": "Der Hund bekam ein Stück Fleisch als Belohnung.", "is_phrase": false, "pos": "Substantiv"}, "tag": {"def": "Ein bestimmter Tag in der Vergangenheit, an dem etwas Besonderes oder Wichtiges passiert ist. Man erinnert sich an diesen Tag und meint einen ganz speziellen Zeitpunkt.", "example": "An dem Tag, als wir uns kennengelernt haben, hat es geregnet.", "is_phrase": false, "pos": "Substantiv"}, "tages": {"def": "Ein bestimmter Tag in der Vergangenheit, an dem etwas Wichtiges oder Besonderes passiert ist. Der Sprecher erinnert sich genau an alle Details von diesem Tag.", "example": "Sie kann sich noch an jeden Moment dieses besonderen Tages erinnern, als sie ihren Mann kennengelernt hat.", "is_phrase": false, "pos": "Substantiv"}, "taschen": {"def": "Behälter aus Stoff, Leder oder anderen Materialien, in denen man Dinge transportieren oder aufbewahren kann. Hier sind verschiedene Arten von Taschen gemeint, wie Reisetaschen oder andere Gepäckstücke.", "example": "Vor der Reise packte sie ihre Taschen mit Kleidung und wichtigen Sachen.", "is_phrase": false, "pos": "Substantiv"}, "taschentuch": {"def": "Ein kleines Stück weiches Papier oder Stoff, mit dem man sich die Nase putzt oder etwas abwischt. Man kann es auch benutzen, um Flecken oder Farbe wegzumachen.", "example": "Sie nahm ein Taschentuch und wischte die Tränen aus ihrem Gesicht.", "is_phrase": false, "pos": "Substantiv"}, "tat": {"def": "etwas verursacht emotionalen Schmerz oder macht traurig. Man spürt seelisches Leid, auch wenn körperlich nichts passiert ist.", "example": "Es tat weh zu sehen, wie ihre beste Freundin wegzog.", "is_phrase": false, "pos": "Verb"}, "tauchte": {"def": "Auftauchen bedeutet plötzlich erscheinen oder ankommen. Wenn jemand nicht auftaucht, kommt er nicht zu einem bestimmten Ort oder Termin.", "example": "Er wartete eine Stunde am Bahnhof, aber sein Freund tauchte nicht auf.", "is_phrase": true, "pos": "Redewendung"}, "tief": {"def": "Diese Phrase bedeutet: sehr langsam und stark einatmen. Man macht das, um sich zu beruhigen oder sich zu konzentrieren.", "example": "Vor der Prüfung holte sie tief Luft und ging dann ins Klassenzimmer.", "is_phrase": true, "pos": "Redewendung"}, "tour": {"def": "Eine Reise von Musikern, bei der sie in verschiedenen Städten Konzerte geben. Die Band fährt oder fliegt von Ort zu Ort und spielt ihre Musik vor Publikum.", "example": "Die berühmte Rockband geht nächsten Monat auf Tour durch Europa und spielt in zehn verschiedenen Städten.", "is_phrase": true, "pos": "Redewendung"}, "triumphierend": {"def": "Mit einem Gefühl des Sieges und der Überlegenheit. Man zeigt damit, dass man sich als Gewinner fühlt oder etwas Wichtiges erreicht hat.", "example": "Der Schüler grinste triumphierend, als er seine Note von 1,0 bekam.", "is_phrase": false, "pos": "Adverb"}, "trockenes": {"def": "Brot, das nicht mehr frisch ist und wenig Wasser enthält. Es ist hart geworden, weil es alt ist.", "example": "Das trockene Brot vom letzten Tag schmeckt nicht mehr so gut.", "is_phrase": false, "pos": "Adjektiv"}, "trotzdem": {"def": "Obwohl etwas anderes dagegen spricht oder eine andere Situation besteht. Es zeigt einen Gegensatz zu dem, was man erwarten würde.", "example": "Es regnete stark, trotzdem gingen wir spazieren.", "is_phrase": false, "pos": "Adverb"}, "trug": {"def": "Kleidung oder Schuhe am Körper haben. Man hat etwas angezogen und es ist an seinem Körper.", "example": "Sie trug ein rotes Kleid zur Party.", "is_phrase": false, "pos": "Verb"}, "trägt": {"def": "Kleidung am Körper haben. Man hat ein Kleidungsstück angezogen.", "example": "Heute trägt er ein blaues Hemd und eine schwarze Hose.", "is_phrase": false, "pos": "Verb"}, "tut": {"def": "Diese Phrase bedeutet, dass man Mitleid mit einer Person hat. Man findet, dass die Person in einer schwierigen oder traurigen Situation ist.", "example": "Der alte Mann sitzt jeden Tag allein auf der Bank - er tut mir wirklich leid.", "is_phrase": true, "pos": "Redewendung"}, "unbedingt": {"def": "Das Wort drückt aus, dass etwas sehr wichtig ist und auf jeden Fall gemacht werden muss. Es zeigt, dass keine andere Möglichkeit in Frage kommt.", "example": "Sie wollte unbedingt rechtzeitig am Bahnhof sein, um sich von ihm zu verabschieden.", "is_phrase": false, "pos": "Adverb"}, "ungefähr": {"def": "bedeutet, dass eine Zahl nicht genau ist, sondern nur eine Schätzung. Man verwendet es, wenn man die genaue Anzahl nicht weiß oder nicht wichtig ist.", "example": "In der Stadt leben ungefähr 50.000 Menschen.", "is_phrase": false, "pos": "Adverb"}, "unheilbar": {"def": "So krank, dass man nicht mehr gesund werden kann. Wenn eine Krankheit unheilbar ist, können die Ärzte sie nicht heilen.", "example": "Der Arzt sagte ihm, dass seine Krankheit unheilbar ist und er nur noch wenige Monate zu leben hat.", "is_phrase": false, "pos": "Adjektiv"}, "unserem": {"def": "Das ist die Form von 'unser' im Dativ. Es bedeutet: gehört zu uns, ist von uns.", "example": "Die Kinder spielen in unserem Garten.", "is_phrase": false, "pos": "Pronomen"}, "unterlagen": {"def": "Dokumente und Papiere, die man für die Arbeit oder für einen bestimmten Zweck braucht. Das können zum Beispiel Briefe, Formulare, Notizen oder andere wichtige Schriftstücke sein.", "example": "Der Anwalt sammelt alle Unterlagen für den Gerichtstermin.", "is_phrase": false, "pos": "Substantiv"}, "vater": {"def": "Der Mann, der das Kind gezeugt hat und normalerweise in der Familie lebt. Er ist zusammen mit der Mutter für die Erziehung der Kinder verantwortlich.", "example": "Mein Vater arbeitet als Lehrer und hilft mir jeden Abend bei den Hausaufgaben.", "is_phrase": false, "pos": "Substantiv"}, "vaters": {"def": "Der männliche Elternteil einer Person. Ein Mann, der Kinder hat.", "example": "Mein Vater arbeitet in einem Büro und kommt jeden Abend nach Hause.", "is_phrase": false, "pos": "Substantiv"}, "verlassen": {"def": "Jemanden verlassen bedeutet, dass man weggeht und nicht mehr bei dieser Person bleibt. Man beendet die Beziehung oder das Zusammenleben mit jemandem.", "example": "Nach zehn Jahren Ehe hat sie ihren Mann verlassen und ist in eine andere Stadt gezogen.", "is_phrase": false, "pos": "Verb"}, "versammeln": {"def": "sich an einem Ort zusammenfinden und dort bleiben. Die Staubkörner kommen zusammen und bleiben in der Nähe einer Person oder Sache.", "example": "Im Sonnenlicht versammeln sich kleine Fliegen um die süßen Früchte.", "is_phrase": fals
